   ============================================================ */
:root {
  --bg-0: #eef3fc;
  --bg-1: #e3ecf9;
  --glass: rgba(255, 255, 255, 0.62);
  --glass-border: rgba(88, 110, 170, 0.14);
  --glass-border-hover: rgba(88, 110, 170, 0.30);
  --text-1: #1b2747;
  --text-2: #48577c;
  --text-3: #8b96b4;
  --accent: #4a7dff;
  --accent-2: #8b5bff;
  --accent-grad: linear-gradient(135deg, #4a7dff 0%, #8b5bff 100%);
  --radius: 18px;
  --radius-sm: 12px;
  --sans: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  --mono: 'SF Mono', Consolas, 'Courier New', monospace;
  --shadow: 0 10px 34px rgba(58, 82, 148, 0.13);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; overflow-y: scroll; scrollbar-gutter: stable; }
body {
  font-family: var(--sans); color: var(--text-1); line-height: 1.6; overflow-x: hidden;
  background:
    radial-gradient(1100px 700px at 88% -12%, rgba(140, 120, 255, 0.16), transparent 60%),
    radial-gradient(900px 620px at -8% 18%, rgba(80, 140, 255, 0.15), transparent 55%),
    radial-gradient(800px 560px at 50% 115%, rgba(70, 190, 210, 0.12), transparent 55%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
  min-height: 100vh;
}
.orb { position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none; }
.orb-1 { width: 520px; height: 520px; background: #b9a6ff; top: -160px; right: -120px; opacity: 0.30; animation: drift 19s ease-in-out infinite; }
.orb-2 { width: 440px; height: 440px; background: #9cc0ff; top: 42%; left: -200px; opacity: 0.28; animation: drift 24s ease-in-out infinite reverse; }
.orb-3 { width: 380px; height: 380px; background: #93e2ea; bottom: -140px; right: 20%; opacity: 0.26; animation: drift 27s ease-in-out infinite; }
@keyframes drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(42px, -28px) scale(1.07); }
  66% { transform: translate(-30px, 24px) scale(0.94); }
}
.glass {
  background: var(--glass);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.65);
}
/* ---- 导航 ---- */
.navbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 255, 255, 0.62);
  backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
  border-bottom: 1px solid rgba(88, 110, 170, 0.12);
}
.nav-inner { max-width: 1180px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 30px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; cursor: pointer; user-select: none; }
.logo-badge {
  width: 40px; height: 40px; border-radius: 10px; overflow: hidden; flex-shrink: 0;
  background: rgba(255, 255, 255, 0.7);
  filter: drop-shadow(0 2px 6px rgba(58, 82, 148, 0.18));
}
.logo-badge img { width: 100%; height: 100%; object-fit: contain; display: block; }
.nav-links { display: flex; gap: 4px; flex: 1; }
.nav-link {
  padding: 7px 14px; border-radius: 999px; font-size: 13.5px; color: var(--text-2);
  cursor: pointer; transition: all 0.2s; border: none; background: none; font-family: inherit;
}
.nav-link:hover { color: var(--text-1); background: rgba(88, 110, 170, 0.08); }
.nav-link.active { color: #fff; background: var(--accent-grad); box-shadow: 0 4px 14px rgba(90, 100, 255, 0.35); }
/* 语言切换：始终钉在导航右上角（窄屏 nav-links 隐藏时也生效） */
.container { max-width: 900px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
/* ---- 页头 ---- */
.page-head { text-align: center; padding: 64px 0 14px; }
.page-head .badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
  font-size: 12px; font-weight: 600; color: var(--accent);
  background: rgba(255, 255, 255, 0.75); border: 1px solid rgba(88, 110, 170, 0.18);
  box-shadow: 0 3px 12px rgba(58, 82, 148, 0.08);
}
.page-head .badge .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(74, 125, 255, 0.4); } 50% { box-shadow: 0 0 0 7px rgba(74, 125, 255, 0); } }
.page-title { font-size: 34px; font-weight: 800; margin: 18px 0 8px; }
.page-title .grad { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.page-sub { font-size: 14px; color: var(--text-3); }
/* ---- 更新列表 ---- */
.updates { padding: 36px 0 80px; }
.update-list { display: flex; flex-direction: column; gap: 12px; min-height: 60vh; }
.update-item { display: flex; gap: 16px; padding: 18px 22px; transition: all 0.25s; }
.update-item:hover { transform: translateX(4px); border-color: var(--glass-border-hover); }
.update-item .u-date {
  flex-shrink: 0; width: 78px; text-align: center; align-self: flex-start;
  font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--text-2);
  padding: 7px 0; border-radius: 9px; background: rgba(255, 255, 255, 0.7);
  border: 1px solid rgba(88, 110, 170, 0.16);
}
.update-item .u-body { flex: 1; min-width: 0; }
.update-item .u-top { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 4px; }
.update-item .u-title { font-size: 14px; font-weight: 700; }
.update-item .u-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.7; }
.utag { padding: 2.5px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
.utag.new { color: #4a7dff; background: rgba(74, 125, 255, 0.12); border: 1px solid rgba(74, 125, 255, 0.3); }
.utag.fix { color: #0ea678; background: rgba(14, 166, 120, 0.10); border: 1px solid rgba(14, 166, 120, 0.28); }
.utag.bank { color: #8b5bff; background: rgba(139, 91, 255, 0.10); border: 1px solid rgba(139, 91, 255, 0.28); }
.utag.opt { color: #0891b2; background: rgba(8, 145, 178, 0.10); border: 1px solid rgba(8, 145, 178, 0.28); }
.utag.origin { color: #8b5bff; background: rgba(139, 91, 255, 0.14); border: 1px solid rgba(139, 91, 255, 0.4); }
/* 置顶初心条目 */
.update-item.origin {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(74, 125, 255, 0.07));
  border: 1px solid rgba(74, 125, 255, 0.35);
  box-shadow: 0 8px 30px rgba(74, 125, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.8);
}
.update-item.origin:hover { border-color: rgba(74, 125, 255, 0.6); }
.pin-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2.5px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
  color: #fff; background: var(--accent-grad);
  box-shadow: 0 3px 10px rgba(90, 100, 255, 0.35);
}
.pin-badge::before { content: '▲'; font-size: 8px; }
/* ---- 条目详情入口 ---- */
.update-item { cursor: pointer; }
.u-more {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
  font-size: 12px; font-weight: 600; color: var(--accent); font-family: var(--mono);
}
.u-more .arr { transition: transform 0.2s; }
.update-item:hover .u-more .arr { transform: translateX(4px); }
/* ---- 详情弹窗 ---- */
.modal-mask {
  position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
  background: rgba(30, 42, 72, 0.42); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 20px;
}
.modal-mask.show { display: flex; animation: fadeIn 0.22s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 100%; max-width: 700px; max-height: 84vh; overflow-y: auto; padding: 26px 30px;
  background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  border: 1px solid rgba(88, 110, 170, 0.2); border-radius: 20px;
  box-shadow: 0 24px 80px rgba(40, 60, 110, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  animation: fadeUp 0.28s ease;
}
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.modal-title { font-size: 18px; font-weight: 800; line-height: 1.4; }
.modal-close {
  width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; cursor: pointer;
  background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(88, 110, 170, 0.2); color: var(--text-2);
  font-size: 12px; display: grid; place-items: center;
  box-shadow: 0 2px 10px rgba(58, 82, 148, 0.1); transition: all 0.28s;
}
.modal-close:hover {
  background: var(--accent-grad); color: #fff; border-color: transparent;
  transform: rotate(90deg); box-shadow: 0 5px 18px rgba(90, 100, 255, 0.45);
}
.modal-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--text-3); }
.modal-meta .m-date { font-family: var(--mono); font-weight: 700; color: var(--text-2); }
.m-section { margin-top: 18px; }
.m-section h4 {
  font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.08em;
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}
.m-section h4::before { content: ''; width: 4px; height: 13px; border-radius: 2px; background: var(--accent-grad); }
.m-overview { font-size: 13px; color: var(--text-2); line-height: 1.8; }
.m-overview.thinking {
  padding: 13px 16px; border-radius: 12px; background: rgba(74, 125, 255, 0.05);
  border-left: 3px solid var(--accent); color: var(--text-2);
}
.m-points { list-style: none; }
.m-points li {
  position: relative; padding-left: 18px; font-size: 13px; color: var(--text-2);
  line-height: 1.75; margin-bottom: 9px;
}
.m-points li::before {
  content: '▸'; position: absolute; left: 0; top: 0; color: var(--accent); font-size: 11px;
}
.m-points li b { color: var(--text-1); font-weight: 600; }
.m-stats { display: flex; gap: 12px; flex-wrap: wrap; }
.m-stat {
  flex: 1; min-width: 100px; text-align: center; padding: 12px 10px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.75); border: 1px solid rgba(88, 110, 170, 0.14);
}
.m-stat .v { font-size: 20px; font-weight: 800; font-family: var(--mono); background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.m-stat .l { font-size: 11px; color: var(--text-3); margin-top: 2px; }
/* 数据速览悬停提示：带 data-tip 的卡片显示深色气泡 */
.m-stat { position: relative; }
.m-stat.has-tip .l { border-bottom: 1px dotted var(--text-3); }
.m-stat[data-tip]::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: rgba(27, 39, 71, 0.94); color: #fff; font-size: 11px; line-height: 1.6;
  padding: 6px 12px; border-radius: 8px; white-space: nowrap;
  box-shadow: 0 6px 18px rgba(40, 60, 110, 0.28);
  opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 5;
}
.m-stat[data-tip]:hover::after { opacity: 1; }
.modal-foot { display: flex; justify-content: flex-end; margin-top: 20px; }

.modal-foot .btn-ok:hover { transform: translateY(-1px); box-shadow: 0 7px 28px rgba(90, 100, 255, 0.52); }

.pg-btn:hover:not(:disabled):not(.on) { color: var(--text-1); border-color: rgba(74, 125, 255, 0.45); background: #fff; }
.pg-btn.on { color: #fff; background: var(--accent-grad); border-color: transparent; box-shadow: 0 4px 14px rgba(90, 100, 255, 0.35); }
.pg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.pg-btn .arr { font-family: var(--mono); }
/* ---- 返回按钮 ---- */
.back-btn { display: flex; justify-content: center; padding: 8px 0 0; }
.back-btn .btn {

.back-btn .btn:hover { color: var(--text-1); border-color: rgba(88, 110, 170, 0.4); background: #fff; }

::-webkit-scrollbar-track { background: transparent; }
/* ---- 动画 ---- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .update-item .u-date { width: auto; text-align: left; display: inline-block; align-self: flex-start; padding: 4px 12px; }
}

{date:"2026-09-03",tag:"new",tagText:"新功能",title:"管理後台即時監控：使用者動態與系統日誌一覽",desc:"管理後台上線即時使用者動態與系統日誌——所有管理員可即時查看學員的註冊/登入/答題動態，以及後端異常、判題錯誤、失敗登入等系統日誌；主管理員還可查看全部管理員的操作動態，責任可追溯。",overview:"平台進入團隊化營運後，管理員需要一套「看得見」的監控台。本次在管理後台新增三塊即時面板：使用者動態記錄每位學員的註冊、登入、登出、答題對錯、摸底與練習開啟，方便快速還原「某個同學到底卡在哪」；系統日誌記錄後端異常、SQL 判題錯誤、失敗登入與限流事件，管理員排查後可把問題連同上下文直接回饋給開發者；管理員動態（僅主管理員可見）記錄每位管理員的登入、註冊、重置/回退密碼、刪除帳號、內推碼管理等操作——誰在什麼時候做了什麼一目了然，方便定位與追責。三塊面板約每 6 秒自動重新整理。",thinking:"團隊化營運的後台不能只做管理動作，還要能「看見」正在發生什麼：學員卡在哪、系統報了什麼錯、哪位管理員做了什麼。即時動態解決「現在發生了什麼」，日誌留痕解決「是誰做的、什麼時候做的」——排查與追責都有了一條清晰的線索。",points:["<b>使用者動態 · 全員可見</b>：學員註冊/登入/答題/摸底即時滾動，快速定位需要關注的問題學員。","<b>系統日誌 · 全員可見</b>：異常、判題錯誤、失敗登入與限流一目了然，便於把問題回饋給開發者。","<b>管理員動態 · 主管理員專屬</b>：登入、註冊與後台操作全程留痕，定位與追責有據可依。"],stats:[["3 類","即時面板","使用者動態 · 系統日誌 · 管理員動態"],["6 秒","自動重新整理","無需手動重新整理"],["全員 / 主管理員","可見範圍","使用者與日誌全員可見 · 管理員動態僅主管理員"]]},
{date:"2026-08-10",tag:"opt",tagText:"優化",title:"開啟頁面更穩了：消除捲軸閃現與頁面抖動",desc:"系統性修復開啟頁面時的抖動問題——預留捲軸槽位、穩定非同步載入佔位高度、消除 JS 強制同步佈局，開啟/切換頁面不再左右跳、上下閃。",overview:"開啟頁面或切換模組時，頁面偶爾會整體抖動一下。排查後定位到三類根因：一是頁面高度變化導致垂直捲軸出現/消失，可用寬度隨之改變，置中內容整體水平位移（即「捲軸閃現」）；二是題目列表、更新動態等非同步載入內容沒有預留佔位高度，資料就緒瞬間頁面突然變高；三是部分 JS 在 DOM 寫入後立刻讀取佈局尺寸（如 CodeMirror 初始化、級聯分類面板定位），造成強制同步佈局。本次修復：全站頁面預留捲軸槽位（scrollbar-gutter），捲軸出現/消失時內容不再位移；練習列表與題目詳情、更新動態容器增加佔位高度，非同步載入不再「塌陷-彈開」；CodeMirror 初始化改為先讀尺寸再隱藏、級聯面板先定位再填充，消除強制同步佈局；同時預載入圖示字體，避免圖示就緒瞬間文字位移。知識圖譜的入場動畫保留不變。",thinking:"頁面抖動的觀感比載入慢更傷體驗——它讓使用者覺得頁面「不穩」。這次沒有去調動畫、減內容，而是把三類結構性根因一次修掉：捲軸槽位、載入佔位高度、讀寫分離。改動不大，但開啟、切換、返回的每一步都變得安靜了。",points:["<b>捲軸不再「閃現」</b>：全站預留捲軸槽位，頁面變高/變矮時內容不再水平跳動，切換「自適應進階 / 自主練習 / 錯題集」全程穩定。","<b>非同步載入有佔位</b>：練習列表、題目詳情、更新動態容器設定最小高度，「載入中 → 內容就緒」不再整頁彈跳。","<b>消滅強制同步佈局</b>：CodeMirror 先讀尺寸再隱藏、級聯分類面板先定位再填充，DOM 讀寫分離，減少逐幀重排。","<b>字體提前就緒</b>：預載入 Font Awesome 圖示字體，按鈕與導覽文字不再因圖示字體就緒而微移。"],stats:[["0 跳動","捲軸出現/消失","頁面不再水平位移"],["320px","練習區最小佔位高度","載入/列表/詳情切換不塌陷"],["3 類","結構性根因修復","捲軸閃現 · 佈局偏移 · 強制同步佈局"]]},
{date:"2026-08-06",tag:"new",tagText:"新功能",title:"GitHub 一鍵登入上線",desc:"登入頁新增 GitHub 圖示——點擊授權即可免註冊登入，帳號與學習進度自動綁定；未註冊 GitHub 的同學仍可用使用者名稱密碼註冊登入，兩種方式互不影響。",overview:"此前平台只有帳號密碼一種登入方式：新同學要先想使用者名稱、設密碼、走完註冊流程，才能開始練習。現在登入頁新增 GitHub 一鍵登入：點擊 GitHub 圖示 → GitHub 授權頁確認 → 自動回到平台並登入成功，學習畫像與進度隨帳號自動綁定。用 GitHub 登入的同學，同一帳號反覆登入會重用同一份學習資料；如果 GitHub 使用者名稱與平台已有帳號重名，平台自動加上 _gh 後綴，互不干擾。已經習慣密碼登入的同學一切照舊。",thinking:"登入是使用者的第一道門檻，門檻越低，開始學習的阻力越小。GitHub 是同學最熟悉的帳號之一——與其讓新同學花一分鐘註冊，不如讓他們點一下圖示就進來。實作上採用標準的 OAuth2 授權碼流程：回呼位址嚴格校驗、工作階段防重放，把「便捷」建立在「可控」之上。",points:["<b>一鍵授權</b>：點擊 GitHub 圖示 → 授權 → 自動回跳登入，全程無表單、無註冊流程。","<b>進度連續</b>：同一 GitHub 帳號反覆登入重用同一學習資料，做過的題、點亮的圖譜都不丟。","<b>互不干擾</b>：GitHub 使用者名稱與平台帳號重名時自動加 _gh 後綴；密碼登入完全不受影響。","<b>安全可控</b>：授權流程帶防偽造校驗與重放防護；GitHub 帳號預設不可用密碼登入，兩條登入通道獨立。"],stats:[["1 鍵","GitHub 授權登入","免註冊免輸密碼"],["1 個","帳號綁定","學習進度自動同步"],["_gh","重名自動後綴","兩種登入互不干擾"]]},
{date:"2026-08-06",tag:"opt",tagText:"優化",title:"高並發加固：限流按人計數，全班同練互不擠占",desc:"全站限流改為「按人計數」——每位管理員、每位學員擁有獨立額度，多人經同一入口同時登入、答題不再誤觸發「操作過於頻繁」；正式服務升級為 waitress 多執行緒啟動，課堂多人同登不癱瘓。",overview:"平台通過 ngrok/區域網路單一入口對外提供服務時，所有請求在伺服器看來都來自同一個 IP。此前限流按 IP 計數，等於全班共用同一個額度：8 人先後登入、30 道題連續提交，就把額度打滿，之後的操作全部被拒——管理員連續刪除使用者時也會撞上同樣的「操作過於頻繁」。本次把限流改為按人計數：管理員按工作階段身分、學員按登入工作階段分別計數，每人擁有獨立額度，互不擠占；正式啟動從開發伺服器切換為 waitress 生產級服務（多執行緒 + 高連線上限），課堂多人同時湧入時伺服器不再是瓶頸，管理後台自動重新整理頻率同步降低，請求量減半。",thinking:"限流是保險絲，不是電線：它防的是「有人惡意刷爆」，不該把全班正常上課誤傷成「行為可疑」。修復的方向不是加大額度，而是把計數單位從 IP（在單一入口部署下等於全平台）改回「人」——每個管理員、每個學員各有一根保險絲，誰的電路過載斷誰的，互不影響。同時把承載能力本身（waitress 多執行緒）提上來，讓保險絲只在真正該斷的時候斷。",points:["<b>按人計數</b>：管理員按工作階段身分、學員按登入工作階段獨立限流，全班/全組共用入口互不擠占。","<b>管理後台更寬鬆</b>：刪除、重置密碼等操作每人獨立額度，批次處理不再誤報「操作過於頻繁」。","<b>生產級啟動</b>：預設 waitress 多執行緒服務 + 高連線上限，多人同時登入不癱瘓，區域網路可直連。"],stats:[["每人獨立","限流按人計數","管理員 · 學員互不擠占"],["waitress","生產級多執行緒服務","課堂同登不癱瘓"],["30s","後台自動重新整理間隔","請求量減半"]]},
{date:"2026-08-05",tag:"opt",tagText:"優化",title:"管理後台安全升級：一人一鑰，權限各歸其位",desc:"管理後台鑑權全面升級——每位管理員登入後獲得專屬會話憑證，不再共用同一把「萬能鑰匙」；更換密鑰、刪除管理員、管理內推碼等敏感操作只認主管理員本人。",overview:"管理後台的安全模型從「一把鑰匙人人共用」升級為「一人一鑰」：過去所有管理員登入後拿到的是同一把統一密鑰，任一位管理員都能憑它執行最高權限操作，像公司裡人人握著同一把大門鑰匙。現在每次登入都會單獨簽發專屬會話憑證，與本人身份綁定，無法冒充他人；更換統一密鑰、刪除管理員帳號、管理內推碼這些敏感操作，只認主管理員本人；管理員的密碼一旦被重設或回退，該帳號的舊會話立即作廢，必須重新登入。",thinking:"安全升級的出發點是「最小權限」：不該讓每一位管理員都握著最高權限的鑰匙。會話與身份綁定之後，後台的每一次敏感操作都能追溯到具體的人；改密即失效則把帳號洩漏的破壞窗口壓到最小。安全不是一次性的補丁，而是會持續演進的地基。",points:["<b>一人一鑰</b>：每次登入單獨簽發專屬會話憑證，與身份綁定，不再共用統一密鑰，無法冒充他人。","<b>權限歸位</b>：更換密鑰、刪除管理員、管理內推碼只認主管理員本人，普通管理員無權執行。","<b>改密即失效</b>：管理員密碼被重設或回退後，舊會話立即作廢，需重新登入才能繼續。"],stats:[["1 人 1 鑰","專屬會話憑證","不再共用統一密鑰"],["僅主管理員","敏感操作權限","換密鑰 · 刪管理員 · 內推碼"],["立即失效","改密後舊會話","重新登入才能繼續"]]},
{date:"2026-08-05",tag:"opt",tagText:"優化",title:"錯題集翻頁：每頁 5 題，找回錯題不再大海撈針",desc:"錯題集支援翻頁瀏覽——每頁 5 道錯題，底部上一頁/下一頁自由翻頁；從詳情頁返回時停留在原頁碼，翻頁不迷路。",overview:"錯題越攢越多，一屏放不下，想找回某道題只能從頭翻。這次把錯題集改為翻頁模式：每頁 5 道錯題，底部「上一頁 / 第 x / y 頁 / 下一頁」控制項自由翻頁，目前頁碼一目了然；翻到第一頁或最後一頁時按鈕自動停用，頁碼越界自動糾正；從錯題詳情頁返回列表時停留在原頁碼——看完這道題，再回去還是原來的位置。",thinking:"錯題集是複習的主戰場，題一多，「找題」就成了負擔。翻頁是最樸素也最熟悉的分頁方式：每頁 5 題剛好一屏放下，頁碼明確、位置可控；「返回保持頁碼」這個細節，讓「點進去查看解析、退出來繼續翻」的複習路徑不被中斷。",points:["<b>每頁 5 題</b>：錯題按作答時間分頁，每頁 5 道，一屏清爽。","<b>翻頁控制項</b>：上一頁 / 下一頁 + 頁碼顯示，首末頁按鈕自動停用，頁碼越界自動鉗制。","<b>返回保頁碼</b>：從詳情頁返回列表停留原頁，不再重新翻找。"],stats:[["5","每頁錯題數","按作答時間排序"],["x / y","頁碼即時顯示","首末頁按鈕自動停用"],["1 處","返回保持頁碼","詳情頁返回不丟位置"]]},
{date:"2026-08-05",tag:"new",tagText:"新功能",title:"自適應進階：知識圖譜點亮系統",desc:"自適應刷題全面升級——系統按分類逐葉出題（每葉 5 題：3 選擇 + 2 填空），連續答對 3 題即可點亮該知識點；29 個知識點 + 7 大分類 + 根節點逐級點亮，多輪累積逐級點亮，直至圖譜全亮。",overview:"自適應進階是平台的核心玩法，這次把「猜你需要什麼題」變成了「看得見的知識圖譜點亮」：系統從第一個分類開始，一個知識點一個知識點地出題——每個知識點連續 5 題（3 道選擇 + 2 道填空，選擇先行）；連續答對 3 題（每題間隔不超過 2 分鐘）就能點亮該知識點並跳過剩餘題目，5 題全對同樣點亮；同時累計答對 10 道同類題（自主練習、真題測試也算）也會點亮。點亮的知識點永久保留——29 個知識點全部點亮後，7 大分類逐個點亮，最終點亮整棵圖譜。一輪最多 145 題，刷完回到圖譜界面重新開始。",thinking:"以前的推薦引擎像黑盒——用戶不知道系統為什麼推這道題。點亮圖譜把「自適應」變成了看得見的成長：每個知識點都是圖譜上的一盞燈，連對三題燈就亮了。點亮規則刻意設計得寬容——連續答對（不是總正確率）、間隔不超 2 分鐘（防掛機）、累計答對也計（認可多方式練習），讓不同學習習慣的人都能點亮屬於自己的圖譜。",points:["<b>雙循環出題</b>：分類 → 知識點逐級推進，每個知識點連續 5 題（3 選擇 + 2 填空，選擇先行）。","<b>三種點亮方式</b>：連對 3 題（間隔 ≤2 分鐘）點亮並跳題 / 5 題全對點亮 / 累計答對 10 道點亮。","<b>進度可視化</b>：知識點內顯示 x/10 進度，分類顯示 x/y 點亮數，根節點顯示 x/7。","<b>一輪閉環</b>：一輪至多 145 題，刷完保留點亮狀態回到圖譜，重新開始新一輪。"],stats:[["29","知識點圖譜","點亮後逐級點亮 7 大分類"],["5","每知識點連續出題","3 選擇 + 2 填空"],["145","一輪最多題目","刷完重新開始新一輪"]]},
{date:"2026-08-04",tag:"new",tagText:"新功能",title:"全站 6 語言上線",desc:"右上角語言按鈕升級為下拉選單，支援簡體中文、繁體中文、English、日本語、हिन्दी、Português 六種語言一鍵切換；全站頁面文案與更新動態內容全部翻譯。",overview:"平台面向全球用戶：右上角新增語言下拉選單，六種語言自由切換，偏好自動記憶；所有頁面的文案、按鈕、提示，以及「了解我們」的全部更新動態內容都已完整翻譯——切換語言即可看到對應語言的完整內容。",thinking:"語言是產品的邊界。過去只有中英雙語，現在擴展到六種語言，覆蓋更廣的用戶群體——不只是翻譯文案，而是把整個產品（含動態內容）都變成可切換的。",points:["<b>六語下拉</b>：右上角「語言」下拉選單，六種語言一鍵切換，偏好自動記憶。","<b>全站翻譯</b>：七個頁面全部文案、按鈕、提示完整翻譯。","<b>動態也翻譯</b>：了解我們的每一條更新動態都有六語言版本。"],stats:[["6","語言支持","簡中 · 繁中 · English · 日本語 · हिन्दी · Português"],["7","頁面全量翻譯"],["14","條動態六語版本"]]},
{date:"2026-08-04",tag:"opt",tagText:"優化",title:"官方知識圖譜分類體系上線",desc:"做題頁分類全面對齊官方設計：7 大分類 × 29 個子標籤，題幹直接顯示子標籤名，全庫題目難度按官方星級統一校準（1 星簡單 / 2 星中等 / 3 星困難）。",overview:"分類是題庫的地基。這次把做題頁的分類篩選與題目標籤整體對齊到團隊設計的官方知識圖譜：7 大分類（增刪改、表定義、函數、表連接、約束、子查詢、查詢）下掛 29 個子標籤；題幹上的分類標籤從內部代號改為官方子標籤名（如「內連接」「窗口函數」），一眼看懂題目考什麼；同時全庫難度按官方星級口徑統一，篩選與排序從此有了一致的標尺。",thinking:"分類標籤是用戶讀題庫的第一層索引。之前題幹上顯示的是內部代號，用戶認不出；這次按團隊設計的官方圖譜統一——層級可下鑽、標籤可讀、難度有標尺。分類體系的穩定，是後續個性化推薦與學習統計能說清楚「你在學什麼」的前提。",points:["<b>官方 29 子標籤</b>：7 大分類下掛 29 個子標籤（內連接、窗口函數、標量子查詢……），篩選逐級下鑽。","<b>題幹顯示子標籤</b>：每道題卡上的分類標籤顯示官方子標籤名，不再出現技術代號。","<b>星級難度統一</b>：1 星 = 簡單、2 星 = 中等、3 星 = 困難，全庫 457+ 題難度按標籤星級重新校準。"],stats:[["7","大分類","DML · DDL · 函數 · 表連接 · 約束 · 子查詢 · SELECT"],["29","官方子標籤"],["457+","題目難度按星級校準","1 星簡單 / 2 星中等 / 3 星困難"]]},
{date:"2026-08-04",tag:"new",tagText:"新功能",title:"忘記密碼？團隊協助找回",desc:"密碼忘了不再需要重新註冊——聯繫團隊管理員即可重置，新密碼立即生效；每次重置自動留檔，支援逐次回退防誤操作。",overview:"以前忘記密碼只能重新註冊，帳號與學習記錄一併丟失。現在平台支援團隊協助找回：聯繫管理員驗證身份後即可重置密碼，新密碼立即生效，帳號與學習數據原樣保留；每次重置都會自動保留舊密碼留檔，可逐次回退，避免誤操作造成損失。",thinking:"密碼忘了最怕的是「帳號從此找不回來」。找回密碼的本質是「有人能證明你是你」——我們把這件事交給團隊管理員：驗證身份後協助重置，重置過程留檔可回退，讓找回既順暢又可逆。",points:["<b>忘記密碼可找回</b>：聯繫團隊管理員即可重置，新密碼立即生效，無需重新註冊、數據不丟失。","<b>留檔可回退</b>：重置前舊密碼自動留檔，最多可回退 3 次，誤操作也能復原。","<b>管理員雙重驗證</b>：找回操作需管理員帳號密碼 + 統一密鑰雙重校驗，密碼只能交給可信的人。"],stats:[["1 步","聯繫管理員重置","驗證身份後新密碼立即生效"],["3 次","回退保護上限","每次重置自動留檔，可逐次回退"],["2 重","管理員操作驗證","帳號密碼 + 統一密鑰"]]},
{date:"2026-08-04",tag:"new",tagText:"新功能",title:"真實 SQL 判題引擎上線",desc:"填空題不再比對文本——答案放進真實資料庫執行，與標準答案的結果集逐行比對；答錯時給出「表不存在」「語法錯誤」等具體提示。",overview:"此前填空題用字串相似度判題，同一語句的不同合法寫法可能被誤判。新引擎在記憶體資料庫中真實重建題目環境（表結構 + 資料），把用戶 SQL 與標準答案各執行一遍，比較結果集：列順序、行順序、COUNT(*) 與 COUNT(非空列) 等語義等價寫法都能正確判對；執行出錯時直接提示「表不存在」「列不存在」「語法錯誤」等具體原因，讓用戶知道錯在哪裡。",thinking:"判題的底線是「你的答案真的能跑出那個結果」。文本比對再聰明也只是近似，我們把判題推進到真實執行——結果集一致才算對。這個改動讓填空題從「背答案」變成「真驗證」，也讓錯誤提示成為學習反饋的一部分。",points:["<b>結果集比對</b>：判題依據是「實際跑出來的結果」，不是文本相似度——等價寫法不再誤判。","<b>真實執行環境</b>：每題按題目自帶的表結構與資料在記憶體庫中重建環境，與真實資料庫行為一致。","<b>錯誤即反饋</b>：語法錯誤、表/列不存在等執行錯誤直接提示給用戶，答錯也能學到東西。","<b>唯讀安全</b>：僅允許單條 SELECT / WITH 等唯讀語句，防止寫入類語句破壞判題環境。"],stats:[["2ms","單題判題耗時"],["3 類","常見錯誤提示","表不存在 · 列不存在 · 語法錯誤"],["多例","等價寫法測試"]]},
{date:"2026-08-04",tag:"new",tagText:"新功能",title:"全站中英雙語上線",desc:"入口網站、了解我們、登入註冊、做題前端全面支援中英切換，右上角一鍵切換，偏好自動記憶。",overview:"平台面向更大範圍用戶，四個頁面全部接入雙語：頁面文案、輸入框佔位符、表單驗證提示、密碼強度、操作反饋統一走翻譯體系；右上角語言按鈕一鍵切換，偏好儲存後下次自動生效；更新動態等長內容也提供完整英文版。",thinking:"好的產品要讓更多人無障礙使用。語言不只是翻譯文案，而是把整個互動鏈路（提示、回饋、內容）都變成可切換的——為此我們統一了一套輕量翻譯機制，新增頁面自動接入。",points:["<b>全域覆蓋</b>：頁面文案、佔位符、驗證提示、toast 回饋全部雙語。","<b>一鍵切換</b>：右上角語言按鈕，偏好本地記憶，切換即時生效。","<b>內容雙語</b>：更新動態、功能說明等長內容同步提供英文版。"],stats:[["4+","頁面接入雙語","入口網站 · 了解我們 · 登入註冊 · 做題前端"],["300+","翻譯詞條"],["1 鍵","即時切換"]]},
{date:"2026-08-04",tag:"new",tagText:"新功能",title:"團隊管理後台上線",desc:"團隊協作功能上線：管理後台、管理員帳號體系、同事在線狀態、用戶密碼管理（重置 + 回退）；登入與敏感操作採用雙重驗證保護。",overview:"平台進入團隊化營運：管理員可透過團隊邀請註冊專屬帳號；登入管理後台需帳號密碼與統一金鑰雙重驗證；管理員面板支援查看同事的最後上線時間、管理平台用戶密碼（重置與最多三次回退，防誤操作）。團隊邀請方式與安全金鑰等敏感資訊不在此公開。",thinking:"團隊協作的前提是安全與可控。登入雙重驗證、密碼回退這些設計，都是為了讓「有人能管」這件事本身安全、可逆、不易誤傷。",points:["<b>雙重驗證</b>：管理後台登入需管理員帳號密碼 + 統一金鑰雙重校驗，防帳號洩漏。","<b>同事在線</b>：管理員面板即時展示其他管理員的最後上線時間。","<b>密碼管理</b>：支援重置平台用戶密碼，並保留最多 3 次回退，防誤操作。","<b>記錄隔離</b>：密碼歷史按帳號類型獨立管理，互不干擾。"],stats:[["2 重","登入驗證","管理員帳號密碼 + 統一金鑰"],["3 次","密碼回退上限","每次重置自動留檔，可逐級回退"],["即時","同事在線同步"]]},
{date:"2026-08-04",tag:"opt",tagText:"優化",title:"安全加固：登入保護升級",desc:"未登入用戶無法查看題目內容與答案，需登入後開始練習；失效會話自動清理並引導重新登入。",overview:"平台內容保護升級：題目列表、題目詳情、答案與解析均要求登入後存取，遊客僅能瀏覽入口網站、了解我們與登入註冊頁面，保障題庫與學習資料安全。",thinking:"題庫是平台的核心資產，學習資料屬於用戶自己。登入保護是基礎門檻，後續會持續完善權限體系。",points:["<b>內容保護</b>：題目、答案、解析相關介面全部登入校驗。","<b>會話守衛</b>：會話失效自動清理本地狀態並引導重新登入，避免誤操作。"],stats:[["100%","題目介面登入保護"],["自動","失效會話清理","會話失效自動清除本地狀態並引導重新登入"]]},
{date:"2026-08-03",tag:"new",tagText:"新功能",title:"玻璃擬態入口網站體系上線",desc:"全新入口網站首頁 + 登入註冊頁上線，全站統一淺色玻璃擬態風格，路徑改為「入口網站 → 登入 → 做題」三級流轉。",overview:"參照 DeepSeek / Codex 等大廠前端風格，為平台打造了完整的對外入口網站：品牌入口網站首頁、了解我們動態頁、玻璃擬態登入註冊頁，並將做題前端同步改版為同一設計語言。",thinking:"產品要有門面：用戶第一眼看到的頁面決定了第一印象。我們專門花了一輪打磨對外入口網站——統一的視覺語言讓「入口網站、登入、做題」看起來像一個完整的產品，而不是三個拼湊的頁面。同時明確產品邊界：摸底小測不是我們的特色，砍掉它，把資源聚焦到自適應引擎這條主線上。",points:["<b>入口網站首頁</b>：左右分欄佈局，左側品牌文案與數據背書，右側「進入平台 / 了解我們」雙入口卡片；全站統一淺色玻璃擬態（磨砂卡片 + 漂浮光球 + 藍紫漸變）。","<b>登入註冊頁</b>：登入/註冊選項卡，整合隨機用戶名、隨機安全密碼、密碼強度檢測等工具；圖示全部換用 Lucide 線性 SVG，無卡通 emoji。","<b>做題頁改版</b>：白底介面升級為玻璃擬態，導航、卡片、按鈕全量統一；摸底小測功能正式下線，聚焦自適應進階、自主練習、真題測試、錯題集四大模組。","<b>品牌化</b>：接入 NIDUS 品牌 logo（透明底處理），頁尾文案去除技術棧資訊。"],stats:[["3","級頁面體系","入口網站 → 登入 → 做題 三級流轉"],["4","個頁面改版"],["0","CDN 依賴"]]},
{date:"2026-08-03",tag:"new",tagText:"新功能",title:"自訂級聯分類篩選器",desc:"題庫分類篩選升級為懸停級聯面板——滑鼠滑過大分類即顯示子分類，自由切換不鎖定，選中後可一鍵清除。",overview:"把分類篩選從傳統的下拉框升級為「懸停級聯」互動：滑鼠滑過大分類立即預覽其下的子分類，可自由跨分類切換，不再有舊版選中後無法靈活更換的問題。",thinking:"最初的下拉框是平鋪列表，想換分類得先切回「全部」再重選，誤操作率高、路徑也長。我們的核心思路是把「選完再改」變成「先看後定」——讓篩選像逛選單一樣輕鬆，滑過即預覽、離開不鎖定，選中後還能一鍵反悔。篩選不該是負擔，而應是探索題庫的入口。",points:["<b>互動方式</b>：滑鼠懸停即彈出子分類面板，移開片刻後面板自動收起；選中的篩選會以「✕ 標籤」形式掛在篩選欄右側，點擊即可一鍵清除。","<b>不鎖定原則</b>：面板只是「預覽層」，從選定到反悔都是一次連續動作——看到哪層到哪層，隨時可以換，不再強制先切回「全部」。","<b>一致性</b>：題型、難度、分類三組篩選統一樣式與高度，視覺上是一套控件。"],stats:[["6 條","新增樣式規則"],["5 個","互動狀態","懸停 · 展開 · 收起 · 選中 · 清除"],["200ms","面板收起延遲"]]},
{date:"2026-08-02",tag:"fix",tagText:"修復",title:"層級分類篩選 + 難度篩選修復",desc:"難度篩選改為全量題目統一生效（含靜態選擇題）；分類篩選升級為知識圖譜層級結構，支持逐級下鑽。",overview:"兩個篩選問題修復：難度篩選此前只作用於部分題目，另一些題完全不響應；分類下拉框則是平鋪列表，無法體現知識點間的從屬關係。",thinking:"篩選的本質是「幫用戶把題庫讀薄」。平鋪的 29 個標籤無法傳達知識點之間的關係，而知識圖譜本身就是現成的層級字典——我們讓它直接驅動篩選：選「多表連接」就是連同它的內連接、左連接、自連接一起看。難度篩選的修復則是原則問題：規則要麼對所有題生效，要麼就別叫規則。",points:["<b>難度篩選統一生效</b>：把難度過濾從「後端局部過濾」改為「前端全量統一過濾」，無論題目來自哪個題庫，篩選結果一視同仁。","<b>分類層級化</b>：篩選選項直接複用知識圖譜的層級關係——選大分類自動覆蓋其全部子知識點，選具體子節點則只匹配該點。","<b>靜態題映射</b>：靜態選擇題也建立了到知識節點的映射，保證它們和動態題一樣參與層級篩選。"],stats:[["29 個","標籤接入層級"],["58 道","靜態題納入過濾"],["2 個","篩選問題修復","難度篩選不生效 · 分類無法逐級下鑽"]]},
{date:"2026-08-02",tag:"bank",tagText:"題庫擴充",title:"牛客 182 題標準答案全部生成",desc:"用大模型逐題生成答案並在真實數據庫執行驗證、自動重試修正。題庫總量增至 507 題，上線 50 道筆試真題。",overview:"牛客採集的 182 道題全部缺少標準答案。我們搭了一條「生成-驗證-修復」流水線：大模型逐題寫答案 → 放進數據庫真實執行 → 結果不對就讓模型重試，最終 182/182 全部通過執行驗證。",thinking:"182 道題沒有參考答案，等於有卷子沒答案。人工逐題手寫量大且容易出錯，我們的思路是「讓機器做裁判」：大模型負責生成、數據庫負責驗證，不合格就重來。踩過的坑（改類型把列名也改了、方言差異、路徑兼容）本身就是一次很好的實踐——題庫質量的底線應該是「每條答案可執行、可複現」，而不是「有人看過」。",points:["<b>機器可驗證</b>：每道題的答案必須能在數據庫裡執行成功並產出結果，而不是「看起來合理」——用執行結果代替人工抽檢。","<b>自動修復閉環</b>：首輪生成後分批修復：類型轉換誤傷列名、MySQL 方言缺少關鍵字、建表語句分散在多文件等，都是「答了但跑不通」的典型案例。","<b>分軌入庫</b>：入門 / 必知必會 / 熱題進入自主練習（增至 457 題）；大廠筆試真題單獨成冊（50 題），練習與測試分開。"],stats:[["182/182","答案驗證通過"],["457","自主練習總量"],["50","筆試真題"]]},
{date:"2026-07-31",tag:"opt",tagText:"優化",title:"知識圖譜重構上線",desc:"圖譜升級為 37 節點三層結構（根 → 7 大分類 → 29 子節點），學習路徑一目了然，推薦權重重排。",overview:"知識圖譜重構為清晰的三層結構：一個根節點、7 大分類（增刪改、表定義、函數、連接、約束、子查詢、查詢）、29 個子知識點。圖譜同時驅動解鎖規則與推薦權重，學習路徑收斂成一張可讀的地圖。",thinking:"舊圖譜和題目關聯鬆散，用戶看不清「該學什麼、學到哪了」。這次重構的核心是收斂：把學習路徑收成一張 37 節點的地圖，7 大分類打底、知識點掛在其下；同時把推薦邏輯和地圖對齊——按掌握度配權重、按答對率卡進度。過程中暴露的解鎖斷鏈是最大收穫：自適應系統最怕的是一環扣不上，用戶就永遠到不了下一環。",points:["<b>權重重排</b>：做對過的題大幅降低推送優先級；沒做過的題優先推送；答錯過的題 ×1.5 加權強化練習。","<b>60% 鞏固規則</b>：當前知識點的答對率不足 60% 時強制停留練習，達標才推下一個知識點，保證基礎不虛。","<b>解鎖鏈修復</b>：發現舊邏輯下「答對選擇題永遠解鎖不了填空題」的斷鏈問題——改為首次答對進階選擇題即解鎖全部填空題並立即推送一道。"],stats:[["37","節點總數","根節點 → 7 大分類 → 29 子知識點"],["29","知識標籤"],["60%","掌握閾值","答對率低於 60% 強制停留鞏固"]]},
{date:"2026-07-30",tag:"fix",tagText:"修復",title:"LeetCode 310 題標準答案更新",desc:"批量更新標準答案，295 題通過真實執行生成預期輸出；為 MySQL 方言新增翻譯層，移除 15 道不兼容題。",overview:"310 道題有標準答案但沒有可運行的預期輸出，判題機無法工作。我們讓答案在數據庫裡真實執行生成輸出表格，並為此解決了 MySQL 與 SQLite 的方言差異；3 道答案本身有誤的題做了人工修正。",thinking:"判題機的底線是「你的答案真的能跑出那個結果」。我們把 310 道題的答案全部放進數據庫執行了一遍，跑不通就查原因：方言差異寫翻譯層，答案本身錯了就人工修，實在跑不了的 15 道果斷移除。題量是可以再補的，但「判錯」會直接擊穿用戶信任——數據質量優先於數量。",points:["<b>真實執行出預期</b>：判題對比的是「實際跑出來的結果」，而不是手寫的參考表——295 題成功生成。","<b>方言翻譯層</b>：MySQL 特有語法（枚舉類型、日期格式化、字段類型差異等）在移植時做了逐項適配。","<b>果斷裁剪</b>：15 道涉及正則、函數定義等無法在 SQLite 運行的功能，直接移除——判題準確比題量數字更重要。"],stats:[["295","題驗證通過"],["15","題果斷移除","正則/自定義函數等 SQLite 無法運行的題型"],["3","題人工修正"]]},
{date:"2026-07-28",tag:"new",tagText:"新功能",title:"深度模式上線",desc:"選擇題答對後自動推送同知識點填空題，舉一反三，形成「概念記憶 → 實戰驗證」的學習閉環。",overview:"深度模式上線：選擇題答對後自動推送同一知識點的填空題——概念題是預習，填空題才是實戰，趁熱打鐵。",thinking:"選擇題能檢驗「認不認識」，填空題才能檢驗「會不會寫」——只刷選擇題容易產生「我懂了」的錯覺。深度模式的思路是概念題答對立刻上實戰題，趁熱打鐵形成閉環，把「看懂」真正變成「會寫」。",points:["<b>深度模式</b>：答對選擇題後自動推送同一知識點的填空題——概念題是預習，填空題才是實戰，趁熱打鐵。","<b>解鎖規則</b>：首次答對基礎題解鎖全部選擇題；首次答對進階題直接解鎖全部填空題並立即推送一道；答錯則留在當前知識點鞏固。"],stats:[["1","個核心功能"],["4","條解鎖規則","基礎題答對解鎖選擇題 → 進階題答對解鎖填空題"],["×1.5","答錯強化權重"]]},
{date:"2026-07-25",tag:"opt",tagText:"優化",title:"題庫導入與標籤難度同步",desc:"58 道靜態選擇題解析入庫；全庫 371 道題統一難度與知識標籤口徑，修正 272 道題數據問題。",overview:"題庫來自多個渠道（採集、表格、手工頁面），格式五花八門。這次做了一次系統性對齊：統一 371 道題的難度與知識標籤口徑，並順手修復了標籤分隔符不一致、編碼亂碼等數據質量問題。",thinking:"題庫是產品的根基，而多來源匯集的數據最怕口徑不一——同一個知識點有的題叫「窗口函數」有的叫「排名函數」，篩選就會漏題。這次對齊的收益不在表面：難度、標籤、編碼這些看不見的數據口徑統一後，篩選、推薦、統計才能建立在可信的基礎上。地基修好了，上面才能蓋樓。",points:["<b>靜態題入庫</b>：58 道基礎/進階選擇題（含建表、選項、預期輸出）完整解析導入，補上填空之外的題型拼圖。","<b>口徑統一</b>：全庫 371 道題的難度與知識標籤與標準表逐一对齊，篩選和星級顯示從此口徑一致。","<b>數據淨化</b>：批量修復 272 道題的標籤分隔符不一致，並解決編碼亂碼導致的星級讀取失敗。"],stats:[["58","題靜態導入"],["371","題同步對齊"],["272","題數據修復","標籤分隔符不一致 · 編碼亂碼"]]}

{date:"2026-09-03",tag:"new",tagText:"नई सुविधा",title:"लाइव गतिविधि में किसी उपयोगकर्ता पर लॉक करें",desc:"उपयोगकर्ता गतिविधि और एडमिन गतिविधि में लॉक-फ़िल्टर जोड़ा गया — उपयोगकर्ता नाम दर्ज करके लॉक करें, या फ़ीड में किसी नाम पर क्लिक करें; लाइव सूची अब केवल उसी व्यक्ति की गतिविधियाँ दिखाती है, जिससे किसी एक शिक्षार्थी की समस्या खोजना या किसी एक एडमिन की कार्रवाई देखना तेज़ हो जाता है।",overview:"किसी एक शिक्षार्थी की समस्या की जाँच के लिए पहले पूरी स्क्रीन की गतिविधियों में बार-बार खोजना पड़ता था; मुख्य एडमिन को भी यह देखने के लिए कि किसी सहकर्मी ने क्या किया, रिकॉर्ड्स में खुद छानना पड़ता था। अब दोनों लाइव कार्ड 'लॉक' का समर्थन करते हैं: इनपुट बॉक्स में उपयोगकर्ता नाम डालकर लॉक करें, या फ़ीड की किसी पंक्ति में नाम पर क्लिक करें — सूची तुरंत केवल उसी व्यक्ति की गतिविधियाँ दिखाती है; हर 6 सेकंड का ऑटो-रिफ़्रेश भी केवल यही फ़ोकस दृश्य दिखाता रहता है। 'लॉक हटाएँ' पर क्लिक करते ही पूरी गतिविधि पर वापस आ जाते हैं, दोबारा लॉगिन की ज़रूरत नहीं।",thinking:"समस्या निवारण का सार है फ़ोकस: एक व्यक्ति चुनें और देखें कि उन्होंने क्या किया। पूरी सूची में खोजने के बजाय एडमिन खुद अपना लक्ष्य तय करें — इनपुट या नाम पर क्लिक दोनों से लॉक होता है, लॉक के दौरान लाइव रिफ़्रेश बना रहता है और एक क्लिक में छोड़ा जा सकता है।",points:["<b>दो तरीके से लॉक</b>: उपयोगकर्ता नाम दर्ज कर 'लॉक' दबाएँ, या फ़ीड में किसी नाम पर क्लिक करें।","<b>लॉक में भी लाइव</b>: हर 6 सेकंड का ऑटो-रिफ़्रेश केवल उसी व्यक्ति की नई गतिविधियाँ दिखाता रहता है।","<b>एक क्लिक हटाएँ</b>: 'लॉक हटाएँ' से पूरी सूची पर वापसी, बिना दोबारा लॉगिन।"],stats:[["2","लॉक-योग्य सूचियाँ","उपयोगकर्ता गतिविधि · एडमिन गतिविधि"],["2","लॉक तरीके","नाम टाइप करें · नाम पर क्लिक करें"],["1","क्लिक में हटाएँ","कभी भी पूरी सूची पर वापसी"]]},
{date:"2026-09-03",tag:"new",tagText:"नई सुविधा",title:"एडमिन कंसोल लाइव मॉनिटरिंग: उपयोगकर्ता गतिविधि और सिस्टम लॉग",desc:"एडमिन कंसोल में रियल-टाइम उपयोगकर्ता गतिविधि और सिस्टम लॉग आ गए — सभी एडमिन शिक्षार्थियों के पंजीकरण, लॉगिन और उत्तर देख सकते हैं, साथ ही बैकएंड त्रुटियाँ, SQL निर्णय समस्याएँ और असफल लॉगिन जैसे सिस्टम लॉग भी; मुख्य एडमिन सभी एडमिन की गतिविधियाँ भी देख सकता है, जिससे जवाबदेही स्पष्ट रहती है।",overview:"टीम संचालन शुरू होने के बाद एडमिन को एक 'दिखने वाला' मॉनिटरिंग डैशबोर्ड चाहिए। एडमिन कंसोल में तीन लाइव पैनल जोड़े गए: उपयोगकर्ता गतिविधि हर शिक्षार्थी के पंजीकरण, लॉगिन, लॉगआउट, सही/गलत उत्तर, निदान और अभ्यास शुरू होने को रिकॉर्ड करती है; सिस्टम लॉग बैकएंड अपवाद, SQL निर्णय त्रुटियाँ, असफल लॉगिन और रेट-लिमिट घटनाएँ रिकॉर्ड करता है, जिन्हें एडमिन जाँच के बाद डेवलपर को भेज सकते हैं; एडमिन गतिविधि (केवल मुख्य एडमिन को दिखती है) हर एडमिन के लॉगिन, पंजीकरण, पासवर्ड रीसेट/रोलबैक, खाता हटाने और रेफ़रल कोड प्रबंधन को रिकॉर्ड करती है — किसने कब क्या किया, एक नज़र में साफ़। तीनों पैनल लगभग हर 6 सेकंड में अपडेट होते हैं।",thinking:"टीम-संचालित कंसोल केवल प्रबंधन कार्रवाइयाँ नहीं करता, उसे 'अभी क्या हो रहा है' भी दिखना चाहिए: शिक्षार्थी कहाँ अटका, सिस्टम ने क्या गलती बताई, किस एडमिन ने क्या किया। लाइव फ़ीड 'अभी क्या हो रहा है' और लॉग 'किसने कब किया' का उत्तर देते हैं — जाँच और जवाबदेही दोनों के लिए स्पष्ट सुराग।",points:["<b>उपयोगकर्ता गतिविधि · सभी एडमिन</b>: पंजीकरण, लॉगिन, उत्तर और निदान रियल-टाइम में, समस्या वाले शिक्षार्थी तुरंत दिखते हैं।","<b>सिस्टम लॉग · सभी एडमिन</b>: त्रुटियाँ, निर्णय समस्याएँ, असफल लॉगिन और रेट सीमाएँ एक नज़र में — डेवलपर को रिपोर्ट करना आसान।","<b>एडमिन गतिविधि · केवल मुख्य एडमिन</b>: लॉगिन, पंजीकरण और कंसोल क्रियाएँ रिकॉर्ड होती हैं, जवाबदेही का आधार मिलता है।"],stats:[["3","लाइव पैनल","उपयोगकर्ता गतिविधि · सिस्टम लॉग · एडमिन गतिविधि"],["6 सेकंड","ऑटो-रिफ़्रेश","मैन्युअल रिफ़्रेश की ज़रूरत नहीं"],["सभी / मुख्य एडमिन","दृश्यता","उपयोगकर्ता व लॉग सभी को · एडमिन लॉग केवल मुख्य एडमिन को"]]},
{date:"2026-08-10",tag:"opt",tagText:"सुधार",title:"पेज खोलना अब स्थिर: स्क्रॉलबार झिलमिलाहट और झटके खत्म",desc:"पेज खोलते समय होने वाले झटकों का व्यवस्थित समाधान — स्क्रॉलबार गटर आरक्षित, एसिंक लोडिंग के लिए प्लेसहोल्डर ऊँचाई, और JS द्वारा फ़ोर्स्ड सिंक्रोनस लेआउट खत्म। पेज स्विच करने पर सामग्री अब बगल में नहीं उछलती।",overview:"पेज खोलते या मॉड्यूल बदलते समय कभी-कभी पूरा पेज हिल जाता था। जाँच में तीन मुख्य कारण मिले: पहला, पेज की ऊँचाई बदलने से वर्टिकल स्क्रॉलबार आता/जाता है, उपलब्ध चौड़ाई बदल जाती है और केंद्रित सामग्री क्षैतिज रूप से खिसक जाती है (स्क्रॉलबार झिलमिलाहट); दूसरा, प्रश्न सूची और अपडेट फ़ीड जैसी एसिंक लोड सामग्री के लिए प्लेसहोल्डर ऊँचाई नहीं थी, इसलिए डेटा आते ही पेज अचानक लंबा हो जाता था; तीसरा, कुछ JS DOM लिखने के तुरंत बाद लेआउट आकार पढ़ता था (CodeMirror इनिशियलाइज़ेशन, कैस्केड कैटेगरी पैनल पोज़िशनिंग), जिससे फ़ोर्स्ड सिंक्रोनस लेआउट बनता था। इस फिक्स में: सभी पेजों पर स्क्रॉलबार गटर आरक्षित किया गया ताकि स्क्रॉलबार आने/जाने पर सामग्री न खिसके; प्रश्न सूची, प्रश्न विवरण और अपडेट कंटेनर को न्यूनतम ऊँचाई दी गई ताकि लोडिंग के दौरान पेज सिकुड़े-फूले नहीं; CodeMirror छिपाने से पहले आकार पढ़ता है और कैस्केड पैनल पहले पोज़िशन करता है, जिससे फ़ोर्स्ड सिंक्रोनस लेआउट खत्म हुआ; आइकन फ़ॉन्ट प्रीलोड किए गए ताकि आइकन आने पर टेक्स्ट न खिसके। नॉलेज ग्राफ़ का एंट्रेंस एनिमेशन यथावत रखा गया।",thinking:"धीमी लोडिंग से ज़्यादा बुरा झटका है — यह पेज को अस्थिर महसूस कराता है। इस बार हमने एनिमेशन बदलने या कंटेंट घटाने के बजाय तीनों संरचनात्मक कारण एक साथ ठीक किए: स्क्रॉलबार गटर, लोडिंग प्लेसहोल्डर ऊँचाई, और रीड-राइट अलगाव। बदलाव छोटे हैं, लेकिन खोलना, स्विच करना और वापस जाना — हर कदम अब शांत है।",points:["<b>स्क्रॉलबार झिलमिलाहट खत्म</b>: सभी पेजों पर स्क्रॉलबार गटर आरक्षित है, पेज की ऊँचाई बदलने पर भी सामग्री क्षैतिज रूप से नहीं उछलती।","<b>एसिंक लोडिंग में प्लेसहोल्डर</b>: प्रश्न सूची, प्रश्न विवरण और अपडेट फ़ीड को न्यूनतम ऊँचाई मिली, लोड हो रहा है से तैयार के बीच पेज नहीं उछलता।","<b>फ़ोर्स्ड सिंक्रोनस लेआउट खत्म</b>: CodeMirror छिपाने से पहले आकार पढ़ता है, कैस्केड पैनल पहले पोज़िशन करता है — DOM रीड-राइट अलग, हर फ्रेम की रीफ्लो कम।","<b>फ़ॉन्ट पहले तैयार</b>: Font Awesome आइकन फ़ॉन्ट प्रीलोड किए गए, बटन और नेविगेशन टेक्स्ट आइकन आने पर नहीं खिसकता।"],stats:[["0 झटका","स्क्रॉलबार आना/जाना","सामग्री क्षैतिज नहीं खिसकती"],["320px","प्रैक्टिस क्षेत्र न्यूनतम ऊँचाई","लोड/सूची/विवरण में सिकुड़न नहीं"],["3","संरचनात्मक कारण ठीक","स्क्रॉलबार झिलमिलाहट · लेआउट शिफ्ट · फ़ोर्स्ड सिंक लेआउट"]]},
{date:"2026-08-06",tag:"new",tagText:"नई सुविधा",title:"GitHub वन-क्लिक लॉगिन लॉन्च",desc:"लॉगिन पेज पर GitHub आइकन जोड़ा गया——क्लिक करके अधिकृत करें, बिना रजिस्ट्रेशन के लॉगिन करें, खाता और सीखने की प्रगति स्वचालित रूप से जुड़ जाती है; जिनके पास GitHub नहीं है, वे अब भी यूज़रनेम-पासवर्ड से रजिस्टर और लॉगिन कर सकते हैं, दोनों तरीके एक-दूसरे को प्रभावित नहीं करते।",overview:"पहले प्लेटफ़ॉर्म पर केवल यूज़रनेम-पासवर्ड लॉगिन था: नए यूज़र को यूज़रनेम सोचना, पासवर्ड सेट करना और रजिस्ट्रेशन प्रक्रिया पूरी करनी पड़ती थी, तब जाकर अभ्यास शुरू हो पाता था। अब लॉगिन पेज पर GitHub वन-क्लिक लॉगिन जोड़ा गया है: GitHub आइकन पर क्लिक करें → GitHub अधिकरण पेज पर पुष्टि करें → स्वचालित रूप से प्लेटफ़ॉर्म पर वापस आकर लॉगिन सफल होता है। सीखने की प्रोफ़ाइल और प्रगति खाते से स्वचालित रूप से जुड़ जाती है। GitHub से लॉगिन करने वालों के लिए, एक ही खाते से बार-बार लॉगिन करने पर वही सीखने का डेटा दोबारा उपयोग होता है; अगर GitHub यूज़रनेम प्लेटफ़ॉर्म के मौजूदा खाते से मेल खाता है, तो प्लेटफ़ॉर्म स्वचालित रूप से _gh सफ़िक्स जोड़ देता है, कोई टकराव नहीं। जो लोग पासवर्ड लॉगिन के आदी हैं, उनके लिए सब कुछ पहले जैसा ही है।",thinking:"लॉगिन उपयोगकर्ता की पहली सीढ़ी है—सीढ़ी जितनी कम, सीखना शुरू करने में उतनी ही कम बाधा। GitHub उपयोगकर्ताओं के सबसे परिचित खातों में से एक है—नए उपयोगकर्ता को एक मिनट रजिस्टर कराने से बेहतर है कि वे एक क्लिक में अंदर आ जाएँ। कार्यान्वयन में मानक OAuth2 अधिकरण कोड फ्लो का उपयोग किया गया: कॉलबैक URL की सख्त जाँच, सत्र में रिप्ले सुरक्षा—'सुविधा' को 'नियंत्रण' पर आधारित बनाया गया।",points:["<b>वन-क्लिक अधिकरण</b>: GitHub आइकन पर क्लिक करें → अधिकृत करें → स्वचालित रूप से वापस लॉगिन, पूरी प्रक्रिया में कोई फ़ॉर्म या रजिस्ट्रेशन नहीं।","<b>प्रगति निरंतर</b>: एक ही GitHub खाते से बार-बार लॉगिन करने पर समान सीखने का डेटा दोबारा उपयोग होता है; हल किए गए प्रश्न और जलाए गए मानचित्र कुछ भी नहीं खोते।","<b>कोई टकराव नहीं</b>: GitHub यूज़रनेम प्लेटफ़ॉर्म खाते से मेल खाने पर स्वचालित रूप से _gh सफ़िक्स जुड़ता है; पासवर्ड लॉगिन पूरी तरह अप्रभावित रहता है।","<b>सुरक्षित और नियंत्रित</b>: अधिकरण प्रक्रिया में नकली-रोकथाम जाँच और रिप्ले सुरक्षा है; GitHub खाते के लिए डिफ़ॉल्ट रूप से पासवर्ड लॉगिन अक्षम है, दोनों लॉगिन मार्ग स्वतंत्र हैं।"],stats:[["1 क्लिक","GitHub अधिकरण लॉगिन","बिना रजिस्ट्रेशन, बिना पासवर्ड"],["1 खाता","खाता बंधन","सीखने की प्रगति स्वचालित सिंक"],["_gh","नाम टकराव पर सफ़िक्स","दोनों लॉगिन अप्रभावित"]]},
{date:"2026-08-06",tag:"opt",tagText:"अनुकूलन",title:"उच्च समवर्ती सुदृढ़ीकरण: दर सीमा प्रति व्यक्ति गिनती, पूरी कक्षा एक साथ अभ्यास करे बिना एक-दूसरे को प्रभावित किए",desc:"पूरी साइट की दर सीमा को 'प्रति व्यक्ति गिनती' में बदल दिया गया है—प्रत्येक व्यवस्थापक और प्रत्येक छात्र की अपनी अलग सीमा है, कई लोग एक ही प्रवेश बिंदु से एक साथ लॉगिन करें या उत्तर दें तो 'बहुत अधिक संचालन' गलती से ट्रिगर नहीं होता; उत्पादन सेवा को waitress मल्टीथ्रेडिंग में अपग्रेड किया गया है, कक्षा में कई लोग एक साथ लॉगिन करें तो सर्वर डाउन नहीं होता।",overview:"जब प्लेटफ़ॉर्म ngrok/लोकल नेटवर्क के एकल प्रवेश बिंदु से बाहरी सेवा प्रदान करता है, तो सर्वर को सभी अनुरोध एक ही IP से आते दिखते हैं। पहले दर सीमा IP द्वारा गिनी जाती थी, जिसका मतलब था कि पूरी कक्षा एक ही सीमा साझा करती थी: 8 लोग क्रमिक रूप से लॉगिन करें और 30 प्रश्न लगातार जमा करें, तो सीमा खत्म हो जाती थी, और बाद के सभी संचालन अस्वीकार कर दिए जाते थे—व्यवस्थापक द्वारा लगातार उपयोगकर्ता हटाने पर भी वही 'बहुत अधिक संचालन' होता था। इस बार दर सीमा को प्रति व्यक्ति गिनती में बदला गया है: व्यवस्थापकों के लिए सत्र पहचान के अनुसार, छात्रों के लिए लॉगिन सत्र के अनुसार अलग-अलग गिनती, प्रत्येक की अपनी स्वतंत्र सीमा होती है, एक-दूसरे को प्रभावित नहीं करते; उत्पादन शुरू करना विकास सर्वर से waitress उत्पादन-स्तरीय सेवा (मल्टीथ्रेडिंग + उच्च कनेक्शन सीमा) में बदल दिया गया है, कक्षा में कई लोग एक साथ आते हैं तो सर्वर अब बाधा नहीं बनता, प्रशासन बैकएंड की स्वचालित रीफ़्रेश दर भी कम हो जाती है, अनुरोध मात्रा आधी हो जाती है।",thinking:"दर सीमा एक फ्यूज़ है, तार नहीं: यह 'किसी के द्वारा दुर्भावनापूर्ण रूप से धोखा देने' से बचाती है, और पूरी कक्षा के सामान्य पाठ को 'संदिग्ध व्यवहार' के रूप में गलत नहीं ठहराना चाहिए। मरम्मत की दिशा सीमा बढ़ाना नहीं है, बल्कि गिनती की इकाई को IP (एकल प्रवेश बिंदु तैनाती में यह पूरे प्लेटफ़ॉर्म के बराबर है) से 'व्यक्ति' में बदलना है—प्रत्येक व्यवस्थापक और प्रत्येक छात्र के पास अपना फ्यूज़ होता है, जिसकी सर्किट ओवरलोड होती है वही कटता है, बाकी पर कोई प्रभाव नहीं पड़ता। साथ ही क्षमता (waitress मल्टीथ्रेडिंग) को बढ़ाया गया है ताकि फ्यूज़ केवल तभी कटे जब वास्तव में कटने की आवश्यकता हो।",points:["<b>प्रति व्यक्ति गिनती</b>: व्यवस्थापक सत्र पहचान के अनुसार, छात्र लॉगिन सत्र के अनुसार स्वतंत्र रूप से दर सीमित करते हैं, पूरी कक्षा/समूह एक ही प्रवेश बिंदु साझा करते हैं, एक-दूसरे को प्रभावित नहीं करते।","<b>प्रशासन बैकएंड अधिक उदार</b>: हटाना, पासवर्ड रीसेट जैसे कार्यों के लिए प्रत्येक व्यक्ति की स्वतंत्र सीमा होती है, बैच प्रोसेसिंग में 'बहुत अधिक संचालन' की गलत रिपोर्ट नहीं होती।","<b>उत्पादन-स्तरीय शुरुआत</b>: डिफ़ॉल्ट waitress मल्टीथ्रेडिंग सेवा + उच्च कनेक्शन सीमा, कई लोग एक साथ लॉगिन करें तो डाउन नहीं होता, लोकल नेटवर्क से सीधे कनेक्शन संभव।"],stats:[["प्रत्येक व्यक्ति स्वतंत्र","दर सीमा प्रति व्यक्ति गिनती","व्यवस्थापक · छात्र एक-दूसरे को प्रभावित नहीं करते"],["waitress","उत्पादन-स्तरीय मल्टीथ्रेडिंग सेवा","कक्षा में एक साथ लॉगिन करने पर डाउन नहीं होता"],["30 सेकंड","बैकएंड स्वचालित रीफ़्रेश अंतराल","अनुरोध मात्रा आधी"]]},
{date:"2026-08-05",tag:"opt",tagText:"अनुकूलन",title:"एडमिन पैनल सुरक्षा अपग्रेड: एक व्यक्ति, एक चाबी, अधिकार स्पष्ट",desc:"एडमिन पैनल प्रमाणीकरण में पूर्ण अपग्रेड—हर एडमिन लॉगिन के बाद एक विशेष सत्र प्रमाणपत्र प्राप्त करेगा, अब साझा 'मास्टर कुंजी' नहीं रहेगी; कुंजी बदलना, एडमिन हटाना, रेफरल कोड प्रबंधित करना जैसे संवेदनशील कार्य केवल मुख्य एडमिन ही कर सकेंगे।",overview:"एडमिन पैनल की सुरक्षा मॉडल 'एक चाबी सबके लिए' से 'एक व्यक्ति एक चाबी' में अपग्रेड हुआ है: पहले सभी एडमिन लॉगिन के बाद समान साझा कुंजी प्राप्त करते थे, और कोई भी एडमिन उससे उच्चतम अधिकार वाले कार्य कर सकता था, जैसे कंपनी में सभी के पास एक ही दरवाजे की चाबी हो। अब हर लॉगिन पर अलग से विशेष सत्र प्रमाणपत्र जारी होता है, जो व्यक्ति की पहचान से जुड़ा होता है, किसी और की नकल नहीं हो सकती; साझा कुंजी बदलना, एडमिन खाता हटाना, रेफरल कोड प्रबंधित करना जैसे संवेदनशील कार्य केवल मुख्य एडमिन ही कर सकते हैं; एडमिन का पासवर्ड रीसेट या रोलबैक होने पर, उस खाते के पुराने सत्र तुरंत अमान्य हो जाते हैं, फिर से लॉगिन करना आवश्यक है।",thinking:"सुरक्षा अपग्रेड का आधार 'न्यूनतम अधिकार' है: हर एडमिन को उच्चतम अधिकार की चाबी नहीं दी जानी चाहिए। सत्र को पहचान से जोड़ने के बाद, प्रशासनिक कार्यों की हर संवेदनशील गतिविधि का पता लगाया जा सकता है; पासवर्ड बदलने पर तुरंत अमान्य होने से खाता लीक का नुकसान कम होता है। सुरक्षा एकमुश्त पैच नहीं, बल्कि निरंतर विकसित होने वाली नींव है।",points:["<b>एक व्यक्ति एक चाबी</b>: हर लॉगिन पर अलग से विशेष सत्र प्रमाणपत्र जारी होता है, पहचान से जुड़ा होता है, साझा कुंजी नहीं रहती, किसी और की नकल संभव नहीं।","<b>अधिकार स्पष्ट</b>: कुंजी बदलना, एडमिन हटाना, रेफरल कोड प्रबंधित करना केवल मुख्य एडमिन कर सकते हैं, सामान्य एडमिन के पास अधिकार नहीं।","<b>पासवर्ड बदलने पर तुरंत अमान्य</b>: एडमिन का पासवर्ड रीसेट या रोलबैक होने पर, पुराने सत्र तुरंत अमान्य हो जाते हैं, जारी रखने के लिए फिर से लॉगिन आवश्यक है।"],stats:[["1 व्यक्ति 1 चाबी","विशेष सत्र प्रमाणपत्र","साझा कुंजी समाप्त"],["केवल मुख्य एडमिन","संवेदनशील कार्य अधिकार","कुंजी बदलें · एडमिन हटाएं · रेफरल कोड"],["तुरंत अमान्य","पासवर्ड बदलने के बाद पुराना सत्र","फिर से लॉगिन आवश्यक"]]},
{date:"2026-08-05",tag:"opt",tagText:"अनुकूलन",title:"गलतियों के संग्रह में पेज पलटना: हर पेज पर 5 प्रश्न, खोजना अब आसान",desc:"गलतियों के संग्रह में पेज पलटकर देखें——हर पेज पर 5 गलत प्रश्न, नीचे पिछला/अगला बटन से स्वतंत्र रूप से पलटें; विवरण पृष्ठ से लौटने पर उसी पेज पर रहें, भटकना नहीं पड़ेगा।",overview:"गलत प्रश्न जमा होते गए, एक स्क्रीन में नहीं समाते, किसी प्रश्न को ढूंढने के लिए शुरू से देखना पड़ता था। इस बार गलतियों के संग्रह को पेज पलटने वाले मोड में बदला: हर पेज पर 5 गलत प्रश्न, नीचे \"पिछला / x / y पेज / अगला\" नियंत्रण से स्वतंत्र रूप से पलटें, वर्तमान पेज संख्या स्पष्ट दिखती है; पहले या आखिरी पेज पर पहुंचने पर बटन स्वतः निष्क्रिय हो जाते हैं, पेज संख्या सीमा से बाहर होने पर स्वतः सुधार होता है; विवरण पृष्ठ से लौटने पर पेज संख्या वही रहती है—प्रश्न देखने के बाद भी उसी स्थान पर लौटेंगे।",thinking:"गलतियों का संग्रह पुनरावृत्ति का मुख्य क्षेत्र है, प्रश्न बढ़ने पर \"प्रश्न ढूंढना\" बोझ बन जाता है। पेज पलटना सबसे सरल और परिचित तरीका है: हर पेज पर 5 प्रश्न एक स्क्रीन में आ जाते हैं, पेज संख्या स्पष्ट, स्थिति नियंत्रित; \"लौटने पर पेज संरक्षित\" यह विवरण, \"प्रश्न में जाकर समाधान देखें, बाहर आकर पलटते रहें\" की पुनरावृत्ति प्रक्रिया को बाधित नहीं होने देता।",points:["<b>हर पेज पर 5 प्रश्न</b>：गलत प्रश्न उत्तर देने के समय के अनुसार विभाजित, हर पेज पर 5, स्क्रीन साफ।","<b>पेज पलटने का नियंत्रण</b>：पिछला/अगला + पेज संख्या प्रदर्शन, पहले और आखिरी पेज पर बटन स्वतः निष्क्रिय, पेज संख्या सीमा से बाहर होने पर स्वतः सीमित।","<b>लौटने पर पेज संरक्षित</b>：विवरण पृष्ठ से लौटने पर उसी पेज पर रहते हैं, दोबारा खोजना नहीं पड़ता।"],stats:[["5","हर पेज पर गलत प्रश्नों की संख्या","उत्तर देने के समय के अनुसार क्रमबद्ध"],["x / y","पेज संख्या तुरंत दिखती है","पहले और आखिरी पेज पर बटन स्वतः निष्क्रिय"],["1 स्थान","लौटने पर पेज संरक्षित","विवरण पृष्ठ से लौटने पर स्थिति नहीं खोती"]]},
{date:"2026-08-05",tag:"new",tagText:"नई सुविधा",title:"अनुकूली उन्नति: ज्ञान ग्राफ प्रदीप्ति प्रणाली",desc:"अनुकूली अभ्यास का पूर्ण उन्नयन——प्रणाली श्रेणी के अनुसार क्रमिक रूप से प्रश्न देती है (प्रत्येक पत्ती पर 5 प्रश्न: 3 विकल्प + 2 रिक्त स्थान), लगातार 3 सही उत्तर पर वह ज्ञान बिंदु प्रदीप्त होता है; 29 ज्ञान बिंदु + 7 बड़ी श्रेणियाँ + मूल नोड क्रमशः प्रदीप्त, कई दौरों के संचय से ग्राफ पूर्ण प्रदीप्त होता है।",overview:"अनुकूली उन्नति प्लेटफ़ॉर्म का मुख्य गेमप्ले है, इस बार 'आपको किन प्रश्नों की आवश्यकता है, इसका अनुमान' को 'दृश्य ज्ञान ग्राफ प्रदीप्ति' में बदल दिया गया है: प्रणाली पहली श्रेणी से शुरू करके, एक-एक ज्ञान बिंदु पर प्रश्न देती है——प्रत्येक ज्ञान बिंदु पर लगातार 5 प्रश्न (3 विकल्प + 2 रिक्त स्थान, पहले विकल्प); लगातार 3 सही उत्तर (प्रत्येक प्रश्न के बीच अंतराल 2 मिनट से अधिक नहीं) पर वह ज्ञान बिंदु प्रदीप्त होता है और शेष प्रश्न छोड़ दिए जाते हैं, 5 प्रश्न पूर्णतः सही होने पर भी प्रदीप्त; साथ ही समान प्रकार के कुल 10 प्रश्न सही करने (स्व-अभ्यास, मॉक टेस्ट भी शामिल) पर भी प्रदीप्त होता है। प्रदीप्त ज्ञान बिंदु स्थायी रूप से सुरक्षित——29 ज्ञान बिंदु पूर्णतः प्रदीप्त होने के बाद, 7 बड़ी श्रेणियाँ क्रमशः प्रदीप्त, अंततः पूरा ग्राफ प्रदीप्त। एक दौर में अधिकतम 145 प्रश्न, पूरा करने पर ग्राफ इंटरफ़ेस पर वापस आकर पुनः आरंभ।",thinking:"पहले का सिफ़ारिश इंजन ब्लैक बॉक्स जैसा था——उपयोगकर्ता को पता नहीं होता था कि सिस्टम यह प्रश्न क्यों सुझा रहा है। प्रदीप्त ग्राफ ने 'अनुकूली' को दृश्य विकास में बदल दिया: प्रत्येक ज्ञान बिंदु ग्राफ पर एक दीपक है, लगातार तीन प्रश्न सही करने पर दीपक जलता है। प्रदीप्त नियम जानबूझकर उदार बनाए गए——लगातार सही (कुल शुद्धता नहीं), अंतराल 2 मिनट से अधिक नहीं (निष्क्रिय रोकथाम), संचयी सही भी गिना जाता (विभिन्न अभ्यास विधियों की मान्यता), ताकि भिन्न सीखने की आदतों वाले हर व्यक्ति अपना ग्राफ प्रदीप्त कर सकें।",points:["<b>दोहरा लूप प्रश्न-निर्धारण</b>: श्रेणी → ज्ञान बिंदु क्रमिक प्रगति, प्रत्येक ज्ञान बिंदु पर लगातार 5 प्रश्न (3 विकल्प + 2 रिक्त स्थान, पहले विकल्प)।","<b>तीन प्रदीप्ति विधियाँ</b>: लगातार 3 सही (अंतराल ≤2 मिनट) पर प्रदीप्त एवं प्रश्न छोड़ें / 5 प्रश्न पूर्णतः सही पर प्रदीप्त / संचयी 10 सही पर प्रदीप्त।","<b>प्रगति दृश्यीकरण</b>: ज्ञान बिंदु में x/10 प्रगति प्रदर्शन, श्रेणी में x/y प्रदीप्त संख्या, मूल नोड में x/7 प्रदर्शन।","<b>एक दौर चक्र</b>: एक दौर में अधिकतम 145 प्रश्न, पूर्ण होने पर प्रदीप्त स्थिति सुरक्षित रख ग्राफ पर वापस, नया दौर पुनः आरंभ।"],stats:[["29","ज्ञान बिंदु ग्राफ","प्रदीप्ति के बाद 7 बड़ी श्रेणियाँ क्रमशः प्रदीप्त"],["5","प्रति ज्ञान बिंदु लगातार प्रश्न","3 विकल्प + 2 रिक्त स्थान"],["145","एक दौर में अधिकतम प्रश्न","पूर्ण कर पुनः नया दौर आरंभ"]]},
{date:"2026-08-04",tag:"new",tagText:"नई सुविधा",title:"पूरी साइट पर 6 भाषाएं लॉन्च",desc:"ऊपरी दाएँ कोने का भाषा बटन अब ड्रॉपडाउन है—简体中文, 繁體中文, English, 日本語, हिन्दी और Português—एक क्लिक में बदलें, हर पेज और अपडेट अनुवादित।",overview:"प्लेटफ़ॉर्म अब वैश्विक उपयोगकर्ताओं के लिए: ऊपरी दाएँ कोने में भाषा ड्रॉपडाउन 6 भाषाओं के साथ, प्राथमिकताएँ स्वतः याद रहती हैं; सभी पेजों के टेक्स्ट, बटन, संकेत और 'हमारे बारे में' की सभी अपडेट प्रविष्टियाँ पूरी तरह अनुवादित हैं—भाषा बदलते ही संबंधित भाषा की पूरी सामग्री देखें।",thinking:"भाषा उत्पाद की सीमा है। पहले चीनी-अंग्रेज़ी द्विभाषी थे; अब 6 भाषाओं तक विस्तार, व्यापक उपयोगकर्ता आधार को कवर करता है—केवल टेक्स्ट अनुवाद नहीं, बल्कि पूरे उत्पाद (गतिशील सामग्री सहित) को बदलने योग्य बनाना।",points:["<b>6-भाषा ड्रॉपडाउन</b>: ऊपरी दाएँ कोने का 'भाषा' मेनू, एक क्लिक में 6 भाषाएं, प्राथमिकता स्वतः याद।","<b>पूरी साइट अनुवाद</b>: 7 पेजों के सभी टेक्स्ट, बटन, संकेत पूर्ण अनुवादित।","<b>अपडेट भी अनुवादित</b>: 'हमारे बारे में' की प्रत्येक अपडेट प्रविष्टि 6 भाषाओं में।"],stats:[["6","भाषा समर्थन","简体中文 · 繁體中文 · English · 日本語 · हिन्दी · Português"],["7","पृष्ठ पूर्ण अनुवाद"],["14","अपडेट 6 भाषाओं में"]]},
{date:"2026-08-04",tag:"opt",tagText:"अनुकूलन",title:"आधिकारिक ज्ञान ग्राफ़ वर्गीकरण प्रणाली लॉन्च",desc:"अभ्यास पृष्ठ वर्गीकरण पूरी तरह से आधिकारिक डिज़ाइन के अनुरूप: 7 श्रेणियाँ × 29 उप-टैग, प्रश्न विवरण में सीधे उप-टैग नाम दिखाए जाते हैं, पूरे बैंक की कठिनाई आधिकारिक स्टार रेटिंग के अनुसार समायोजित (1 स्टार आसान / 2 स्टार मध्यम / 3 स्टार कठिन)।",overview:"वर्गीकरण प्रश्न बैंक की नींव है। इस बार, अभ्यास पृष्ठ के वर्गीकरण फ़िल्टर और प्रश्न टैग को टीम द्वारा डिज़ाइन किए गए आधिकारिक ज्ञान ग्राफ़ के साथ संरेखित किया गया है: 7 श्रेणियाँ (इन्सर्ट/अपडेट/डिलीट, टेबल परिभाषा, फ़ंक्शन, टेबल जॉइन, कंस्ट्रेंट, सबक्वेरी, क्वेरी) के अंतर्गत 29 उप-टैग हैं; प्रश्न विवरण पर वर्गीकरण टैग आंतरिक कोड से आधिकारिक उप-टैग नाम (जैसे \"इनर जॉइन\", \"विंडो फ़ंक्शन\") में बदल दिए गए हैं, जिससे एक नज़र में समझ आ जाता है कि प्रश्न क्या पूछता है; साथ ही, पूरे बैंक की कठिनाई को आधिकारिक स्टार रेटिंग के अनुसार एकीकृत किया गया है, और फ़िल्टरिंग और सॉर्टिंग के लिए अब एक समान पैमाना है।",thinking:"वर्गीकरण टैग उपयोगकर्ता के लिए प्रश्न बैंक की पहली परत है। पहले प्रश्न विवरण पर आंतरिक कोड दिखाए जाते थे, जिन्हें उपयोगकर्ता पहचान नहीं पाते थे; इस बार आधिकारिक ग्राफ़ के अनुसार एकीकृत किया गया है—पदानुक्रम में ड्रिल-डाउन, टैग पठनीय, कठिनाई का पैमाना। वर्गीकरण प्रणाली की स्थिरता, आगे के व्यक्तिगत अनुशंसा और सीखने के आँकड़ों के लिए यह स्पष्ट करने का आधार है कि \"आप क्या सीख रहे हैं\"।",points:["<b>आधिकारिक 29 उप-टैग</b>: 7 श्रेणियों के अंतर्गत 29 उप-टैग (इनर जॉइन, विंडो फ़ंक्शन, स्केलर सबक्वेरी...), फ़िल्टर में क्रमिक रूप से ड्रिल-डाउन।","<b>प्रश्न विवरण में उप-टैग प्रदर्शन</b>: प्रत्येक प्रश्न कार्ड पर वर्गीकरण टैग आधिकारिक उप-टैग नाम दिखाता है, कोई तकनीकी कोड नहीं।","<b>स्टार कठिनाई एकीकरण</b>: 1 स्टार = आसान, 2 स्टार = मध्यम, 3 स्टार = कठिन, पूरे बैंक के 457+ प्रश्नों की कठिनाई को टैग स्टार के अनुसार पुनः समायोजित किया गया।"],stats:[["7","श्रेणियाँ","DML · DDL · फ़ंक्शन · टेबल जॉइन · कंस्ट्रेंट · सबक्वेरी · SELECT"],["29","आधिकारिक उप-टैग"],["457+","प्रश्न कठिनाई स्टार रेटिंग के अनुसार","1 स्टार आसान / 2 स्टार मध्यम / 3 स्टार कठिन"]]},
{date:"2026-08-04",tag:"new",tagText:"नई सुविधा",title:"पासवर्ड भूल गए? टीम के साथ पुनर्प्राप्त करें",desc:"पासवर्ड भूलने पर पुनः पंजीकरण की आवश्यकता नहीं—टीम व्यवस्थापक से संपर्क करें और रीसेट करें, नया पासवर्ड तुरंत प्रभावी होगा; प्रत्येक रीसेट स्वतः संग्रहीत होता है, गलत संचालन से बचाव के लिए चरणबद्ध रोलबैक समर्थित है।",overview:"पहले पासवर्ड भूलने पर केवल पुनः पंजीकरण ही विकल्प था, जिससे खाता और सीखने का रिकॉर्ड खो जाता था। अब प्लेटफ़ॉर्म टीम सहायता से पुनर्प्राप्ति का समर्थन करता है: व्यवस्थापक से संपर्क करें, पहचान सत्यापित करें, पासवर्ड रीसेट करें, नया पासवर्ड तुरंत प्रभावी, खाता और सीखने का डेटा यथावत रहता है; प्रत्येक रीसेट में पुराना पासवर्ड स्वतः संग्रहीत होता है, चरणबद्ध रोलबैक संभव है।",thinking:"पासवर्ड भूलने पर सबसे बड़ा डर 'खाता वापस न मिल पाना' होता है। पासवर्ड पुनर्प्राप्ति का सार है 'कोई व्यक्ति साबित कर सके कि आप आप हैं'—इसे हम टीम व्यवस्थापक को सौंपते हैं: पहचान सत्यापित करने के बाद रीसेट में मदद, प्रक्रिया संग्रहीत और रोलबैक योग्य, जिससे पुनर्प्राप्ति सुचारू और प्रतिवर्ती हो।",points:["<b>भूला पासवर्ड पुनर्प्राप्त करें</b>: टीम व्यवस्थापक से संपर्क करें, रीसेट करें, नया पासवर्ड तुरंत प्रभावी, पुनः पंजीकरण या डेटा हानि नहीं।","<b>संग्रहीत और रोलबैक</b>: रीसेट से पहले पुराना पासवर्ड स्वतः संग्रहीत, अधिकतम 3 बार रोलबैक, गलत संचालन भी बहाल किया जा सकता है।","<b>व्यवस्थापक दोहरी पुष्टि</b>: पुनर्प्राप्ति के लिए व्यवस्थापक खाता पासवर्ड + साझा कुंजी की दोहरी पुष्टि आवश्यक, पासवर्ड केवल विश्वसनीय व्यक्ति को देना चाहिए।"],stats:[["1 कदम","व्यवस्थापक से संपर्क कर रीसेट","पहचान सत्यापन के बाद नया पासवर्ड तुरंत प्रभावी"],["3 बार","रोलबैक सुरक्षा की सीमा","प्रत्येक रीसेट स्वतः संग्रहीत, क्रमिक रोलबैक"],["2 गुना","व्यवस्थापक संचालन पुष्टि","खाता पासवर्ड + साझा कुंजी"]]},
{date:"2026-08-04",tag:"new",tagText:"नई सुविधा",title:"वास्तविक SQL मूल्यांकन इंजन लॉन्च",desc:"रिक्त स्थान वाले प्रश्नों में अब टेक्स्ट तुलना नहीं होती—उत्तर को वास्तविक डेटाबेस में निष्पादित किया जाता है, परिणाम सेट की मानक उत्तर से पंक्ति-दर-पंक्ति तुलना की जाती है; गलत होने पर 'तालिका मौजूद नहीं', 'वाक्यविन्यास त्रुटि' जैसे विशिष्ट संकेत दिए जाते हैं।",overview:"पहले रिक्त स्थान वाले प्रश्नों में स्ट्रिंग समानता से मूल्यांकन होता था, समान कथन के विभिन्न वैध रूपों को गलत माना जा सकता था। नया इंजन मेमोरी डेटाबेस में प्रश्न के वातावरण (तालिका संरचना + डेटा) को वास्तव में पुनर्निर्मित करता है, उपयोगकर्ता के SQL और मानक उत्तर को प्रत्येक निष्पादित करता है, और परिणाम सेट की तुलना करता है: स्तंभ क्रम, पंक्ति क्रम, COUNT(*) और COUNT(गैर-शून्य स्तंभ) जैसे शब्दार्थ रूप से समकक्ष लेखन सही ढंग से मिलान किए जाते हैं; निष्पादन त्रुटि पर सीधे 'तालिका मौजूद नहीं', 'स्तंभ मौजूद नहीं', 'वाक्यविन्यास त्रुटि' जैसे विशिष्ट कारण दिखाए जाते हैं।",thinking:"मूल्यांकन की न्यूनतम सीमा है 'आपका उत्तर वास्तव में वह परिणाम दे सकता है'। टेक्स्ट तुलना कितनी भी चतुर हो, वह अनुमानित ही होती है; हमने मूल्यांकन को वास्तविक निष्पादन तक आगे बढ़ाया—परिणाम सेट मेल खाने पर ही सही। इस बदलाव ने रिक्त स्थान प्रश्नों को 'उत्तर रटना' से 'वास्तविक सत्यापन' में बदल दिया, और त्रुटि संदेश सीखने के फीडबैक का हिस्सा बन गए।",points:["<b>परिणाम सेट तुलना</b>: मूल्यांकन आधार 'वास्तव में निष्पादित परिणाम' है, टेक्स्ट समानता नहीं—समकक्ष लेखन गलत नहीं माना जाता।","<b>वास्तविक निष्पादन वातावरण</b>: प्रत्येक प्रश्न के लिए तालिका संरचना और डेटा को मेमोरी डेटाबेस में पुनर्निर्मित किया जाता है, वास्तविक डेटाबेस व्यवहार के अनुरूप।","<b>त्रुटि ही फीडबैक</b>: वाक्यविन्यास त्रुटि, तालिका/स्तंभ मौजूद नहीं जैसी निष्पादन त्रुटियाँ सीधे उपयोगकर्ता को दिखाई जाती हैं, गलती से भी सीखा जा सकता है।","<b>केवल पठनीय सुरक्षित</b>: केवल एकल SELECT / WITH जैसे केवल पठनीय कथनों की अनुमति, लेखन कथनों से मूल्यांकन वातावरण को नुकसान नहीं पहुँचता।"],stats:[["2ms","प्रति प्रश्न मूल्यांकन समय"],["3 प्रकार","सामान्य त्रुटि संकेत","तालिका मौजूद नहीं · स्तंभ मौजूद नहीं · वाक्यविन्यास त्रुटि"],["अनेक","समकक्ष लेखन परीक्षण"]]},
{date:"2026-08-04",tag:"new",tagText:"नई सुविधा",title:"पूरी साइट पर हिंदी-अंग्रेज़ी द्विभाषी लॉन्च",desc:"पोर्टल, हमारे बारे में, लॉगिन/पंजीकरण, अभ्यास फ्रंटएंड—सभी हिंदी/अंग्रेज़ी स्विचिंग का समर्थन करते हैं, ऊपरी दाएँ कोने में एक-क्लिक स्विच, प्राथमिकताएँ स्वतः याद रहती हैं।",overview:"प्लेटफ़ॉर्म व्यापक उपयोगकर्ता आधार को लक्षित करता है, चारों पृष्ठ द्विभाषी समर्थन के साथ: पृष्ठ टेक्स्ट, इनपुट प्लेसहोल्डर, फ़ॉर्म सत्यापन संदेश, पासवर्ड ताकत, संचालन फ़ीडबैक—सभी अनुवाद प्रणाली के माध्यम से जाते हैं; ऊपरी दाएँ कोने में भाषा बटन एक-क्लिक स्विच, प्राथमिकता सहेजी जाती है और अगली बार स्वतः प्रभावी होती है; लंबी सामग्री जैसे अपडेट भी पूर्ण अंग्रेज़ी संस्करण प्रदान करते हैं।",thinking:"एक अच्छा उत्पाद अधिक लोगों को बिना बाधा के उपयोग करने देता है। भाषा केवल टेक्स्ट का अनुवाद नहीं है, बल्कि पूरी इंटरैक्शन श्रृंखला (संकेत, फ़ीडबैक, सामग्री) को स्विच करने योग्य बनाना है—इसके लिए हमने एक हल्की अनुवाद प्रणाली को एकीकृत किया, जिससे नए पृष्ठ स्वतः जुड़ जाते हैं।",points:["<b>वैश्विक कवरेज</b>: पृष्ठ टेक्स्ट, प्लेसहोल्डर, सत्यापन संदेश, टोस्ट फ़ीडबैक सभी द्विभाषी।","<b>एक-क्लिक स्विच</b>: ऊपरी दाएँ कोने में भाषा बटन, प्राथमिकता स्थानीय रूप से सहेजी जाती है, स्विच तुरंत प्रभावी।","<b>सामग्री द्विभाषी</b>: अपडेट और फ़ीचर विवरण जैसी लंबी सामग्री का अंग्रेज़ी संस्करण भी उपलब्ध।"],stats:[["4+","पृष्ठ द्विभाषी","पोर्टल · हमारे बारे में · लॉगिन/पंजीकरण · अभ्यास फ्रंटएंड"],["300+","अनुवाद प्रविष्टियाँ"],["1 क्लिक","तुरंत स्विच"]]},
{date:"2026-08-04",tag:"new",tagText:"नई सुविधा",title:"टीम प्रबंधन बैकएंड लॉन्च हुआ",desc:"टीम सहयोग सुविधाएँ लॉन्च हुईं: प्रबंधन बैकएंड, व्यवस्थापक खाता प्रणाली, सहकर्मी ऑनलाइन स्थिति, उपयोगकर्ता पासवर्ड प्रबंधन (रीसेट + रोलबैक); लॉगिन और संवेदनशील ऑपरेशन के लिए दो-कारक सत्यापन सुरक्षा।",overview:"प्लेटफ़ॉर्म टीम-आधारित संचालन में प्रवेश कर गया है: व्यवस्थापक टीम आमंत्रण के माध्यम से समर्पित खाता पंजीकृत कर सकते हैं; बैकएंड में लॉगिन के लिए खाता पासवर्ड और एकीकृत कुंजी के साथ दो-कारक सत्यापन आवश्यक है; व्यवस्थापक पैनल सहकर्मियों के अंतिम ऑनलाइन समय को देखने, प्लेटफ़ॉर्म उपयोगकर्ता पासवर्ड प्रबंधित करने (रीसेट और गलती से होने वाले ऑपरेशन को रोकने के लिए अधिकतम तीन रोलबैक) का समर्थन करता है। टीम आमंत्रण विधि और सुरक्षा कुंजी जैसी संवेदनशील जानकारी यहाँ सार्वजनिक नहीं की गई है।",thinking:"टीम सहयोग का आधार सुरक्षा और नियंत्रण है। लॉगिन के दो-कारक सत्यापन, पासवर्ड रोलबैक जैसे डिज़ाइन, सब कुछ सुरक्षित, प्रतिवर्ती और कम गलती-प्रवण बनाने के लिए हैं, ताकि 'कोई प्रबंधन कर सके' खुद सुरक्षित हो।",points:["<b>दो-कारक सत्यापन</b>: बैकएंड लॉगिन के लिए व्यवस्थापक खाता पासवर्ड + एकीकृत कुंजी की दो-कारक जांच आवश्यक है, जो खाता लीक को रोकती है।","<b>सहकर्मी ऑनलाइन</b>: व्यवस्थापक पैनल अन्य व्यवस्थापकों के अंतिम ऑनलाइन समय को वास्तविक समय में दिखाता है।","<b>पासवर्ड प्रबंधन</b>: प्लेटफ़ॉर्म उपयोगकर्ता पासवर्ड रीसेट करने और गलती से होने वाले ऑपरेशन को रोकने के लिए अधिकतम 3 रोलबैक बनाए रखने का समर्थन करता है।","<b>रिकॉर्ड अलगाव</b>: पासवर्ड इतिहास खाता प्रकार के अनुसार स्वतंत्र रूप से प्रबंधित किया जाता है, एक दूसरे के साथ हस्तक्षेप नहीं करता।"],stats:[["2 重","लॉगिन सत्यापन","व्यवस्थापक खाता पासवर्ड + एकीकृत कुंजी"],["3 次","पासवर्ड रोलबैक सीमा","हर रीसेट पर स्वचालित रूप से रिकॉर्ड किया जाता है, चरणबद्ध रोलबैक संभव"],["रीयल-टाइम","सहकर्मी ऑनलाइन सिंक"]]},
{date:"2026-08-04",tag:"opt",tagText:"अनुकूलन",title:"सुरक्षा सुदृढ़ीकरण: लॉगिन सुरक्षा उन्नयन",desc:"बिना लॉगिन किए उपयोगकर्ता प्रश्न सामग्री और उत्तर नहीं देख सकते; अभ्यास के लिए लॉगिन आवश्यक है; अमान्य सत्र स्वचालित रूप से साफ़ होता है और पुनः लॉगिन के लिए मार्गदर्शन करता है।",overview:"प्लेटफ़ॉर्म सामग्री सुरक्षा उन्नत: प्रश्न सूची, प्रश्न विवरण, उत्तर और स्पष्टीकरण सभी लॉगिन के बाद एक्सेस किए जा सकते हैं; पोर्टल, हमारे बारे में, लॉगिन/पंजीकरण पृष्ठ केवल अतिथियों के लिए देखने योग्य हैं, प्रश्न बैंक और सीखने के डेटा की सुरक्षा सुनिश्चित करता है।",thinking:"प्रश्न बैंक प्लेटफ़ॉर्म की मुख्य संपत्ति है, और सीखने का डेटा उपयोगकर्ता का अपना है। लॉगिन सुरक्षा एक बुनियादी सीमा है; हम भविष्य में अनुमति प्रणाली में सुधार जारी रखेंगे।",points:["<b>सामग्री सुरक्षा</b>: प्रश्न, उत्तर, स्पष्टीकरण से संबंधित सभी API लॉगिन सत्यापन के अधीन हैं।","<b>सत्र गार्ड</b>: सत्र अमान्य होने पर स्थानीय स्थिति स्वचालित रूप से साफ़ की जाती है और पुनः लॉगिन के लिए मार्गदर्शन किया जाता है, जिससे गलत संचालन से बचा जा सके।"],stats:[["100%","प्रश्न API लॉगिन सुरक्षा"],["स्वचालित","अमान्य सत्र सफाई","सत्र अमान्य होने पर स्थानीय स्थिति स्वतः साफ़ कर पुनः लॉगिन कराए"]]},
{date:"2026-08-03",tag:"new",tagText:"नई सुविधा",title:"ग्लासमॉर्फिज्म पोर्टल सिस्टम लॉन्च हुआ",desc:"नया पोर्टल होमपेज + लॉगिन/पंजीकरण पेज लॉन्च हुआ, पूरी साइट पर एकीकृत हल्का ग्लासमॉर्फिज्म शैली, मार्ग बदलकर 'पोर्टल → लॉगिन → अभ्यास' त्रि-स्तरीय प्रवाह किया गया।",overview:"DeepSeek / Codex जैसी बड़ी कंपनियों की फ्रंटएंड शैली को संदर्भित करते हुए, प्लेटफ़ॉर्म के लिए एक संपूर्ण बाहरी पोर्टल बनाया गया है: ब्रांड पोर्टल होमपेज, हमारे बारे में डायनामिक पेज, ग्लासमॉर्फिज्म लॉगिन/पंजीकरण पेज, और अभ्यास फ्रंटएंड को भी एक ही डिज़ाइन भाषा के साथ फिर से डिज़ाइन किया गया है।",thinking:"उत्पाद का एक चेहरा होना चाहिए: उपयोगकर्ता जो पहला पृष्ठ देखता है वह पहली छाप निर्धारित करता है। हमने बाहरी पोर्टल को निखारने के लिए एक दौर समर्पित किया - एकीकृत दृश्य भाषा 'पोर्टल, लॉगिन, अभ्यास' को एक पूर्ण उत्पाद की तरह दिखाती है, न कि तीन असंबद्ध पृष्ठों की तरह। साथ ही उत्पाद सीमाएँ स्पष्ट कीं: बुनियादी मूल्यांकन परीक्षण हमारी विशेषता नहीं है, इसे हटा दिया, और संसाधनों को अनुकूली इंजन मुख्य लाइन पर केंद्रित किया।",points:["<b>पोर्टल होमपेज</b>: बाएँ-दाएँ कॉलम लेआउट, बाएँ में ब्रांड कॉपी और डेटा, दाएँ में 'प्लेटफ़ॉर्म में प्रवेश करें / हमारे बारे में' दोहरे प्रवेश कार्ड; पूरी साइट पर एकीकृत हल्का ग्लासमॉर्फिज्म (फ्रॉस्टेड कार्ड + तैरते प्रकाश गोले + नीला-बैंगनी ग्रेडिएंट)।","<b>लॉगिन/पंजीकरण पेज</b>: लॉगिन/पंजीकरण टैब, यादृच्छिक उपयोगकर्ता नाम, यादृच्छिक सुरक्षित पासवर्ड, पासवर्ड शक्ति जांच जैसे उपकरण एकीकृत; सभी आइकन Lucide रैखिक SVG में बदल दिए गए, कोई कार्टून emoji नहीं।","<b>अभ्यास पेज पुनः डिज़ाइन</b>: सफेद पृष्ठभूमि इंटरफ़ेस को ग्लासमॉर्फिज्म में अपग्रेड किया गया, नेविगेशन, कार्ड, बटन पूरी तरह से एकीकृत; बुनियादी मूल्यांकन परीक्षण सुविधा आधिकारिक रूप से बंद की गई, जिसमें अनुकूली उन्नति, स्व-अभ्यास, वास्तविक प्रश्न परीक्षण, गलत प्रश्न संग्रह चार मुख्य मॉड्यूल पर ध्यान केंद्रित किया गया।","<b>ब्रांडिंग</b>: NIDUS ब्रांड लोगो (पारदर्शी पृष्ठभूमि) एकीकृत, फुटर टेक्स्ट से तकनीकी स्टैक जानकारी हटाई गई।"],stats:[["3","पृष्ठ प्रणाली स्तर","पोर्टल → लॉगिन → अभ्यास त्रि-स्तरीय प्रवाह"],["4","पृष्ठ पुनः डिज़ाइन"],["0","CDN निर्भरता"]]},
{date:"2026-08-03",tag:"new",tagText:"नई सुविधा",title:"कस्टम कैस्केडिंग श्रेणी फ़िल्टर",desc:"प्रश्न बैंक श्रेणी फ़िल्टर को होवर कैस्केड पैनल में अपग्रेड किया गया – माउस को बड़ी श्रेणी पर ले जाते ही उप-श्रेणियाँ दिखाई देती हैं, स्वतंत्र रूप से स्विच करें, लॉक नहीं करता, चयन के बाद एक क्लिक से साफ़ करें।",overview:"श्रेणी फ़िल्टर को पारंपरिक ड्रॉपडाउन से 'होवर कैस्केड' इंटरैक्शन में अपग्रेड किया गया है: माउस को बड़ी श्रेणी पर ले जाते ही उसकी उप-श्रेणियाँ तुरंत दिखती हैं, आप स्वतंत्र रूप से श्रेणियों के बीच स्विच कर सकते हैं, और पुराने संस्करण की तरह चयन के बाद लचीले ढंग से बदलने में कोई समस्या नहीं है।",thinking:"पहले ड्रॉपडाउन बॉक्स एक सपाट सूची था, श्रेणी बदलने के लिए पहले 'सभी' पर लौटना पड़ता था, फिर पुनः चयन करना पड़ता था, जिससे गलती की संभावना अधिक और रास्ता लंबा था। हमारा मुख्य दृष्टिकोण है 'चयन करके बदलना' को 'पहले देखें, फिर तय करें' में बदलना – फ़िल्टर को मेनू देखने जितना आसान बनाएं, होवर करते ही पूर्वावलोकन, दूर जाने पर लॉक न हो, और चयन के बाद एक क्लिक से पलटा जा सके। फ़िल्टर बोझ नहीं, बल्कि प्रश्न बैंक की खोज का प्रवेश द्वार होना चाहिए।",points:["<b>इंटरैक्शन विधि</b>: माउस होवर करते ही उप-श्रेणी पैनल पॉप अप होता है, थोड़ी देर बाद स्वतः बंद हो जाता है; चयनित फ़िल्टर '✕ टैग' के रूप में फ़िल्टर बार के दाईं ओर प्रदर्शित होता है, क्लिक करते ही एक क्लिक में साफ़ हो जाता है।","<b>गैर-लॉक सिद्धांत</b>: पैनल केवल 'पूर्वावलोकन परत' है, चयन से पलटने तक एक सतत क्रिया है – जहाँ तक देखें, वहीं तक जा सकते हैं, किसी भी समय बदल सकते हैं, पहले 'सभी' पर लौटना अनिवार्य नहीं है।","<b>एकरूपता</b>: प्रश्न प्रकार, कठिनाई, श्रेणी तीनों फ़िल्टर की शैली और ऊँचाई समान है, दृश्य रूप से एक ही नियंत्रण सेट है।"],stats:[["6","नई शैली नियम"],["5","इंटरैक्शन स्थितियाँ","होवर · विस्तार · संक्षेपण · चयन · साफ़"],["200ms","पैनल बंद होने में विलंब"]]},
{date:"2026-08-02",tag:"fix",tagText:"सुधार",title:"श्रेणी पदानुक्रम फ़िल्टर + कठिनाई फ़िल्टर सुधार",desc:"कठिनाई फ़िल्टर अब सभी प्रश्नों पर समान रूप से लागू (स्थिर बहुविकल्पीय प्रश्नों सहित); श्रेणी फ़िल्टर ज्ञान ग्राफ पदानुक्रम संरचना में अपग्रेड, ड्रिल-डाउन समर्थन।",overview:"दो फ़िल्टर समस्याएँ ठीक की गईं: कठिनाई फ़िल्टर पहले केवल कुछ प्रश्नों पर लागू होता था, अन्य पूरी तरह से अनुत्तरदायी; श्रेणी ड्रॉपडाउन फ्लैट सूची थी, ज्ञान बिंदुओं के बीच संबंध नहीं दर्शाती।",thinking:"फ़िल्टर का सार है 'उपयोगकर्ता को प्रश्न बैंक पढ़ने में मदद करना'। फ्लैट 29 टैग ज्ञान बिंदुओं के बीच संबंध नहीं बता सकते, जबकि ज्ञान ग्राफ स्वयं तैयार पदानुक्रम शब्दकोश है - हम इसे सीधे फ़िल्टर चलाने देते हैं: 'मल्टी-टेबल जॉइन' चुनने का मतलब है इसके साथ इनर जॉइन, लेफ्ट जॉइन, सेल्फ जॉइन भी देखना। कठिनाई फ़िल्टर का सुधार सिद्धांत का मामला है: नियम या तो सभी प्रश्नों पर लागू होते हैं, या नियम नहीं कहलाते।",points:["<b>कठिनाई फ़िल्टर समान रूप से लागू</b>: कठिनाई फ़िल्टर को 'बैकएंड आंशिक फ़िल्टर' से 'फ्रंटएंड पूर्ण समान फ़िल्टर' में बदला। चाहे प्रश्न किसी भी बैंक से हों, फ़िल्टर परिणाम समान।","<b>श्रेणी पदानुक्रम</b>: फ़िल्टर विकल्प सीधे ज्ञान ग्राफ के पदानुक्रम संबंधों का उपयोग करते हैं - बड़ी श्रेणी चुनने पर स्वतः उसके सभी उप-ज्ञान बिंदु शामिल होते हैं, विशिष्ट उप-नोड चुनने पर केवल वही मेल खाता है।","<b>स्थिर प्रश्न मैपिंग</b>: स्थिर बहुविकल्पीय प्रश्नों के लिए भी ज्ञान नोड मैपिंग स्थापित की गई, ताकि वे गतिशील प्रश्नों की तरह पदानुक्रम फ़िल्टर में भाग लें।"],stats:[["29","टैग पदानुक्रम से जुड़े"],["58","स्थिर प्रश्न फ़िल्टर में शामिल"],["2","फ़िल्टर समस्याएं ठीक","कठिनाई फ़िल्टर अप्रभावी · श्रेणी ड्रिल-डाउन असंभव"]]},
{date:"2026-08-02",tag:"bank",tagText:"प्रश्न संग्रह विस्तार",title:"牛客 182 प्रश्नों के मानक उत्तर सभी उत्पन्न",desc:"बड़े मॉडल द्वारा प्रश्न-दर-प्रश्न उत्तर उत्पन्न और वास्तविक डेटाबेस में निष्पादन सत्यापन, स्वचालित पुनर्प्रयास सुधार। प्रश्न बैंक कुल 507 प्रश्न, 50 लिखित परीक्षा वास्तविक प्रश्न ऑनलाइन।",overview:"牛客 से संग्रहित 182 प्रश्नों में सभी में मानक उत्तर का अभाव था। हमने 'जनरेट-सत्यापित-सुधार' पाइपलाइन बनाई: बड़ा मॉडल प्रश्न-दर-प्रश्न उत्तर लिखता है → डेटाबेस में वास्तविक निष्पादन → यदि परिणाम गलत है तो मॉडल पुनः प्रयास करता है, अंततः 182/182 सभी निष्पादन सत्यापन पास।",thinking:"182 प्रश्नों में उत्तर नहीं होना, यानी परीक्षा है पर उत्तर नहीं। मैन्युअल लिखना बड़ा और त्रुटिपूर्ण, हमारा दृष्टिकोण 'मशीन को न्यायाधीश बनाना' है: बड़ा मॉडल जनरेट करता है, डेटाबेस सत्यापित करता है, असफल होने पर फिर से। जो गड्ढे मिले (प्रकार बदलने से कॉलम नाम भी बदला, बोली अंतर, पथ संगतता) स्वयं अच्छा अभ्यास है - प्रश्न बैंक की गुणवत्ता की न्यूनतम सीमा 'हर उत्तर निष्पादन योग्य और पुनरुत्पादक' होनी चाहिए, न कि 'किसी ने देखा'।",points:["<b>मशीन सत्यापन योग्य</b>: प्रत्येक उत्तर डेटाबेस में सफलतापूर्वक निष्पादित होकर परिणाम देना चाहिए, न कि 'उचित लगता है' - निष्पादन परिणाम से मैन्युअल निरीक्षण बदला।","<b>स्वचालित सुधार चक्र</b>: पहले दौर के बाद बैचों में सुधार: प्रकार रूपांतरण से कॉलम नाम क्षति, MySQL बोली में कीवर्ड की कमी, तालिका निर्माण कथन कई फ़ाइलों में फैले - ये 'उत्तर दिया पर चला नहीं' के विशिष्ट मामले।","<b>अलग-अलग ट्रैक</b>: प्रवेश/आवश्यक/लोकप्रिय प्रश्न स्वायत्त अभ्यास में (457 तक); बड़ी कंपनी लिखित परीक्षा मूल प्रश्न अलग पुस्तक (50), अभ्यास और परीक्षण अलग।"],stats:[["182/182","उत्तर सत्यापन पास"],["457","स्वायत्त अभ्यास कुल"],["50","लिखित परीक्षा मूल प्रश्न"]]},
{date:"2026-07-31",tag:"opt",tagText:"अनुकूलन",title:"ज्ञान ग्राफ पुनर्निर्माण लॉन्च",desc:"ग्राफ को 37 नोड्स तीन-स्तरीय संरचना (रूट → 7 मुख्य श्रेणियां → 29 उप-नोड) में अपग्रेड, सीखने का पथ एक नज़र में, अनुशंसा भार पुनर्व्यवस्थित।",overview:"ज्ञान ग्राफ को स्पष्ट तीन-स्तरीय संरचना में पुनर्निर्मित: एक रूट नोड, 7 मुख्य श्रेणियां (इन्सर्ट/अपडेट/डिलीट, टेबल परिभाषा, फ़ंक्शन, जॉइन, बाधाएं, उपक्वेरी, क्वेरी), 29 उप-ज्ञान बिंदु। ग्राफ अनलॉक नियम और अनुशंसा भार दोनों को चलाता है, सीखने का पथ पठनीय मानचित्र में बदल जाता है।",thinking:"पुराना ग्राफ और प्रश्नों के बीच संबंध ढीला था, उपयोगकर्ता यह नहीं देख पाते 'क्या सीखना है, कितना सीखा'। इस पुनर्निर्माण का मूल है संकुचन: सीखने के पथ को 37 नोड्स के मानचित्र में बदलना, 7 मुख्य श्रेणियां आधार, ज्ञान बिंदु उनके नीचे; साथ ही अनुशंसा तर्क को मानचित्र के साथ संरेखित करें - महारत के अनुसार भार, सही-उत्तर दर के अनुसार प्रगति। प्रक्रिया में खुला अनलॉक विच्छेद सबसे बड़ी उपलब्धि: अनुकूली प्रणाली सबसे अधिक डरती है कि एक लिंक फिट न हो, उपयोगकर्ता कभी अगले चरण तक नहीं पहुंचता।",points:["<b>भार पुनर्व्यवस्थित</b>: सही उत्तर वाले प्रश्नों की पुश प्राथमिकता काफी कम करें; अनुत्तरित प्रश्नों को पहले पुश करें; गलत उत्तर वाले प्रश्नों पर ×1.5 भारित अभ्यास सुदृढ़ करें।","<b>60% समेकन नियम</b>: वर्तमान ज्ञान बिंदु की सही-उत्तर दर 60% से कम होने पर रुककर अभ्यास करें, मानक पूरा होने पर ही अगला बिंदु पुश करें, आधार मजबूत।","<b>अनलॉक श्रृंखला सुधार</b>: पुराने तर्क में 'बहुविकल्पीय सही होने पर रिक्त स्थान कभी अनलॉक नहीं होते' की समस्या मिली - पहली बार उन्नत बहुविकल्पीय सही होने पर सभी रिक्त स्थान अनलॉक करें और तुरंत एक प्रश्न पुश करें।"],stats:[["37","कुल नोड","रूट → 7 मुख्य श्रेणियां → 29 उप-ज्ञान बिंदु"],["29","ज्ञान टैग"],["60%","महारत सीमा","सही-उत्तर दर 60% से कम पर अनिवार्य अभ्यास"]]},
{date:"2026-07-30",tag:"fix",tagText:"सुधार",title:"LeetCode 310 प्रश्नों के मानक उत्तर अद्यतन",desc:"थोक में मानक उत्तर अपडेट, 295 प्रश्न वास्तविक निष्पादन द्वारा अपेक्षित आउटपुट उत्पन्न; MySQL बोली के लिए अनुवाद परत जोड़ी, 15 असंगत प्रश्न हटाए।",overview:"310 प्रश्नों में मानक उत्तर थे पर व्यवहार्य अपेक्षित आउटपुट नहीं, जज मशीन काम नहीं कर सकती। हमने उत्तरों को डेटाबेस में वास्तविक निष्पादित कर आउटपुट तालिका उत्पन्न की, और MySQL व SQLite के बोली अंतर को हल किया; 3 प्रश्न जिनके उत्तर स्वयं गलत थे, मैन्युअल सुधार किए।",thinking:"जज मशीन की न्यूनतम शर्त है 'आपका उत्तर वास्तव में वह परिणाम निकाल सके'। हमने 310 उत्तरों को डेटाबेस में चलाया, जो नहीं चले तो कारण ढूंढे: बोली अंतर के लिए अनुवाद परत लिखी, उत्तर गलत तो मैन्युअल सुधार, जो बिल्कुल नहीं चले 15 को तुरंत हटाया। प्रश्न संख्या बाद में बढ़ाई जा सकती है, पर 'गलत मूल्यांकन' उपयोगकर्ता के विश्वास को सीधे तोड़ता है - डेटा गुणवत्ता मात्रा से पहले।",points:["<b>वास्तविक निष्पादन से अपेक्षित</b>: मूल्यांकन 'वास्तव में चलाए गए परिणाम' से तुलना करता है, हाथ से लिखी संदर्भ तालिका से नहीं - 295 प्रश्न सफलतापूर्वक उत्पन्न।","<b>बोली अनुवाद परत</b>: MySQL विशेष सिंटैक्स (enum प्रकार, दिनांक प्रारूप, फ़ील्ड प्रकार अंतर आदि) को पोर्ट करते समय प्रत्येक आइटम के लिए अनुकूलित।","<b>तुरंत कटौती</b>: 15 प्रश्न जिनमें रेगेक्स, फ़ंक्शन परिभाषा आदि SQLite में नहीं चल सकते, सीधे हटाए - मूल्यांकन सटीकता प्रश्न संख्या से अधिक महत्वपूर्ण।"],stats:[["295","प्रश्न सत्यापन पास"],["15","प्रश्न तुरंत हटाए","रेगेक्स/कस्टम फ़ंक्शन जैसे SQLite में नहीं चलने वाले प्रकार"],["3","प्रश्न मैन्युअल सुधार"]]},
{date:"2026-07-28",tag:"new",tagText:"नई सुविधा",title:"डीप मोड लॉन्च",desc:"बहुविकल्पीय प्रश्न सही होने पर स्वतः ही उसी ज्ञान बिंदु के रिक्त स्थान भरने वाले प्रश्न भेजे जाते हैं, जिससे सीखने का चक्र पूरा होता है: \"अवधारणा स्मृति → व्यावहारिक सत्यापन\"।",overview:"डीप मोड लॉन्च: बहुविकल्पीय प्रश्न सही होने पर स्वतः ही उसी ज्ञान बिंदु के रिक्त स्थान भरने वाले प्रश्न भेजे जाते हैं — अवधारणा प्रश्न पूर्वाभ्यास हैं, रिक्त स्थान भरना वास्तविक अभ्यास, गर्म लोहे पर चोट करें।",thinking:"बहुविकल्पीय प्रश्न जाँचते हैं कि आप \"पहचानते हैं या नहीं\", जबकि रिक्त स्थान वाले प्रश्न जाँचते हैं कि आप \"लिख सकते हैं या नहीं\" — केवल बहुविकल्पीय प्रश्न हल करने से \"मैं समझ गया\" का भ्रम हो सकता है। डीप मोड का विचार है कि अवधारणा प्रश्न सही होते ही व्यावहारिक प्रश्न पर जाएँ, गर्म लोहे पर चोट करके चक्र पूरा करें, \"समझने\" को वास्तव में \"लिखने\" में बदलें।",points:["<b>डीप मोड</b>: बहुविकल्पीय प्रश्न सही होने पर स्वतः ही उसी ज्ञान बिंदु के रिक्त स्थान भरने वाले प्रश्न भेजे जाते हैं — अवधारणा प्रश्न पूर्वाभ्यास हैं, रिक्त स्थान भरना वास्तविक अभ्यास, गर्म लोहे पर चोट करें।","<b>अनलॉक नियम</b>: पहली बार बुनियादी प्रश्न सही करने पर सभी बहुविकल्पीय प्रश्न अनलॉक होते हैं; पहली बार उन्नत प्रश्न सही करने पर सभी रिक्त स्थान वाले प्रश्न अनलॉक होते हैं और तुरंत एक प्रश्न भेजा जाता है; गलत उत्तर देने पर उसी ज्ञान बिंदु पर अभ्यास जारी रहता है।"],stats:[["1","मुख्य सुविधा"],["4","अनलॉक नियम","बुनियादी प्रश्न सही → बहुविकल्पीय अनलॉक; उन्नत प्रश्न सही → रिक्त स्थान अनलॉक"],["×1.5","गलत उत्तर सुदृढ़ीकरण भार"]]},
{date:"2026-07-25",tag:"opt",tagText:"अनुकूलन",title:"प्रश्न बैंक आयात और टैग/कठिनाई सिंक",desc:"58 स्थिर बहुविकल्पीय प्रश्न पार्स करके आयात किए गए; पूरे बैंक के 371 प्रश्नों की कठिनाई और ज्ञान टैग एकीकृत किए गए, 272 प्रश्नों के डेटा मुद्दे ठीक किए गए।",overview:"प्रश्न बैंक कई स्रोतों (स्क्रैपिंग, स्प्रेडशीट, मैनुअल पेज) से आता है, प्रारूप भिन्न हैं। इस बार हमने व्यवस्थित रूप से संरेखण किया: 371 प्रश्नों की कठिनाई और ज्ञान टैग को एकीकृत किया, और टैग विभाजक असंगति, एन्कोडिंग विकृति जैसी डेटा गुणवत्ता समस्याओं को भी ठीक किया।",thinking:"प्रश्न बैंक उत्पाद की नींव है, और कई स्रोतों से एकत्रित डेटा में असंगति का खतरा रहता है — एक ही ज्ञान बिंदु को कुछ प्रश्न \"विंडो फ़ंक्शन\" कहते हैं तो कुछ \"रैंकिंग फ़ंक्शन\", जिससे फ़िल्टर करने पर प्रश्न छूट सकते हैं। इस संरेखण का लाभ सतही नहीं है: कठिनाई, टैग, एन्कोडिंग जैसे अदृश्य डेटा मानकों के एकीकरण के बाद, फ़िल्टरिंग, अनुशंसा और सांख्यिकी विश्वसनीय आधार पर बनाई जा सकती हैं। नींव ठीक होने पर ही ऊपर मंज़िल बनाई जा सकती है।",points:["<b>स्थिर प्रश्न आयात</b>: 58 मूल/उन्नत बहुविकल्पीय प्रश्न (तालिका निर्माण, विकल्प, अपेक्षित आउटपुट सहित) पूरी तरह से पार्स करके आयात किए गए, जिससे रिक्त स्थान के अलावा अन्य प्रश्न प्रकार पूरे हुए।","<b>मानक संरेखण</b>: सभी 371 प्रश्नों की कठिनाई और ज्ञान टैग को मानक तालिका से एक-एक करके संरेखित किया गया, फ़िल्टरिंग और स्टार प्रदर्शन अब सुसंगत हैं।","<b>डेटा सफाई</b>: 272 प्रश्नों के टैग विभाजक असंगतता को बैच में ठीक किया गया, और एन्कोडिंग विकृति के कारण स्टार रीडिंग विफलता को हल किया गया।"],stats:[["58","प्रश्न स्थिर आयात"],["371","प्रश्न संरेखित"],["272","प्रश्न डेटा मरम्मत","टैग विभाजक असंगतता · एन्कोडिंग विकृति"]]}
