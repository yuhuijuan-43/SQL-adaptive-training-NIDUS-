{date:"2026-09-03",tag:"new",tagText:"Novo recurso",title:"Trave em qualquer usuário nas atividades ao vivo",desc:"Atividade de Usuários e Atividade de Administradores agora têm filtro de bloqueio — digite um nome de usuário para travar ou clique em um nome dentro do feed; a lista ao vivo passa a mostrar somente as ações dessa pessoa, tornando mais rápido rastrear o problema de um aluno ou auditar um administrador.",overview:"Ao investigar um único aluno, antes era preciso procurar repetidamente no feed inteiro; quando o administrador principal queria saber exatamente o que um colega tinha feito, também tinha que filtrar tudo manualmente. Agora os dois feeds ao vivo suportam bloqueio: digite o nome de usuário e clique em Bloquear, ou clique em um nome em qualquer linha — a lista mostra imediatamente só as ações dessa pessoa, e a atualização automática a cada 6 segundos continua mostrando apenas essa visão focada, sem interromper a investigação. Clique em Desbloquear para voltar ao feed completo, sem novo login.",thinking:"Diagnóstico é questão de foco: escolha uma pessoa e veja o que ela fez. Em vez de procurar no feed inteiro, deixe o administrador definir o alvo — digitando o nome ou clicando em um nome na lista — mantendo a atualização ao vivo durante o bloqueio e liberando com um clique.",points:["<b>Dois modos de bloquear</b>: digite o nome de usuário e clique em Bloquear, ou clique em um nome no feed para focar nesse usuário na hora.","<b>Ao vivo mesmo travado</b>: a atualização automática de 6 segundos continua mostrando apenas os novos eventos daquele usuário, sem interromper a investigação.","<b>Desbloqueio com um clique</b>: clique em Desbloquear para restaurar a visão completa — sem novo login."],stats:[["2","tipos de feed podem travar","Atividade de Usuários · Atividade de Administradores"],["2","modos de travar","digitar o nome · clicar no nome"],["1","clique para desbloquear","volta ao feed completo"]]},
{date:"2026-09-03",tag:"new",tagText:"Novo recurso",title:"Monitoramento ao vivo no console: atividade de usuários e logs do sistema",desc:"O console administrativo agora transmite em tempo real a atividade de usuários e os logs do sistema — todos os administradores podem acompanhar registros, logins e respostas dos alunos, além de erros de backend, problemas de julgamento SQL e logins falhos; o administrador principal também vê as ações de todos os administradores, com trilha clara de responsabilidade.",overview:"Com a operação em equipe, os administradores precisam de um painel que mostre o que está acontecendo. Foram adicionados três painéis ao vivo ao console: Atividade de Usuários registra cadastro, login, logout, respostas certas/erradas, diagnósticos e início de prática de cada aluno, facilitando reconstruir onde o aluno travou; Logs do Sistema registra exceções de backend, erros do julgador SQL, logins falhos e limites de taxa, que os administradores podem encaminhar aos desenvolvedores com contexto; Atividade de Administradores (visível apenas ao administrador principal) registra logins, cadastros, redefinições/rollbacks de senha, exclusões de contas e mudanças de códigos de indicação — quem fez o quê e quando fica claro em um relance. Os três painéis atualizam automaticamente a cada ~6 segundos.",thinking:"Um console de operação em equipe precisa fazer mais do que executar ações administrativas — ele precisa enxergar o que está acontecendo agora: onde um aluno travou, o que o sistema reportou e qual administrador fez o quê. Os feeds ao vivo respondem 'o que está acontecendo agora' e o registro responde 'quem fez e quando' — diagnóstico e responsabilização ganham uma trilha clara.",points:["<b>Atividade de usuários — todos os administradores</b>: cadastros, logins, respostas e diagnósticos em tempo real, fáceis de revisar para achar quem está com dificuldade.","<b>Logs do sistema — todos os administradores</b>: erros, problemas de julgamento, logins falhos e limites de taxa à vista, prontos para reportar aos desenvolvedores.","<b>Atividade de administradores — somente o principal</b>: logins, cadastros e ações do console são registrados, criando trilha de responsabilidade."],stats:[["3","painéis ao vivo","Atividade de Usuários · Logs do Sistema · Atividade de Administradores"],["6s","atualização automática","sem atualização manual"],["Todos / Principal","visibilidade","usuários e logs para todos · log de admins apenas para o principal"]]},
{date:"2026-08-10",tag:"opt",tagText:"Otimização",title:"Página mais estável: fim do piscar da barra de rolagem e do tremor",desc:"Correção sistemática do tremor ao abrir páginas — reserva do espaço da barra de rolagem, altura de reserva para carregamento assíncrono e fim do layout síncrono forçado por JS. Alternar páginas não pula mais para os lados.",overview:"Ao abrir a página ou alternar módulos, a página às vezes tremia. Três causas foram identificadas: primeiro, a mudança de altura fazia a barra de rolagem vertical aparecer e desaparecer, reduzindo a largura disponível e deslocando o conteúdo centralizado (piscar da barra); segundo, conteúdos carregados de forma assíncrona, como a lista de exercícios e o feed de atualizações, não tinham altura reservada, então a página crescia de repente quando os dados chegavam; terceiro, parte do JS lia dimensões de layout logo após escrever no DOM (inicialização do CodeMirror, posicionamento do painel de categorias), forçando layout síncrono. Nesta correção: todas as páginas reservam o espaço da barra de rolagem (scrollbar-gutter) para que o conteúdo não se desloque; lista de exercícios, detalhe da questão e feed de atualizações ganharam altura mínima; o CodeMirror lê o tamanho antes de ocultar e o painel de categorias posiciona antes de preencher, eliminando o layout síncrono forçado; os ícones de fonte são pré-carregados para o texto não se mover quando aparecem. A animação de entrada do mapa do conhecimento foi mantida.",thinking:"O tremor machuca mais do que o carregamento lento — faz a página parecer instável. Em vez de mexer em animações ou cortar conteúdo, removemos as três causas estruturais: reserva da barra de rolagem, altura de carregamento e separação leitura/escrita. Mudanças pequenas, mas abrir, alternar e voltar ficaram silenciosos.",points:["<b>Sem piscar da barra</b>: a reserva do espaço da barra de rolagem mantém o conteúdo estável quando a página cresce ou encolhe.","<b>Carregamento com reserva</b>: lista de exercícios, detalhe da questão e feed têm altura mínima — de carregando para pronto a página não pula.","<b>Sem layout síncrono forçado</b>: o CodeMirror lê o tamanho antes de ocultar e o painel posiciona antes de preencher — leitura e escrita separadas.","<b>Fontes prontas antes</b>: os ícones Font Awesome são pré-carregados e o texto dos botões e da navegação não se move."],stats:[["0 tremor","barra de rolagem","conteúdo sem deslocamento"],["320px","altura mínima da prática","sem colapso ao carregar ou alternar"],["3","causas estruturais","piscar da barra · layout shift · layout síncrono"]]},
{date:"2026-08-06",tag:"new",tagText:"Novo recurso",title:"Login com GitHub em um clique",desc:"A página de login ganhou um ícone do GitHub — clique para autorizar e faça login sem registro, com conta e progresso de aprendizado vinculados automaticamente; quem não tem GitHub ainda pode se registrar e entrar com usuário e senha, e os dois métodos não interferem entre si.",overview:"Antes, a plataforma só tinha login por usuário e senha: novos alunos precisavam criar um nome de usuário, definir uma senha e concluir o fluxo de registro antes de começar a praticar. Agora, a página de login ganhou o login com GitHub em um clique: clique no ícone do GitHub → confirme na página de autorização do GitHub → volte automaticamente para a plataforma com login concluído, e o perfil de aprendizado e o progresso são vinculados automaticamente à conta. Quem entra com GitHub, ao repetir o login com a mesma conta, reutiliza os mesmos dados de aprendizado; se o nome de usuário do GitHub coincidir com uma conta existente na plataforma, o sistema adiciona automaticamente o sufixo _gh, sem conflito. Quem já está acostumado com login por senha continua tudo como antes.",thinking:"O login é a primeira barreira do usuário; quanto mais baixa a barreira, menor a resistência para começar a aprender. O GitHub é uma das contas mais familiares aos alunos — em vez de fazer novos alunos gastarem um minuto se registrando, é melhor deixá-los entrar com um clique. Na implementação, usamos o fluxo padrão de código de autorização OAuth2: validação rigorosa da URL de callback, proteção contra replay na sessão, construindo a 'conveniência' sobre o 'controle'.",points:["<b>Autorização em um clique</b>: clique no ícone do GitHub → autorize → retorno automático para o login, sem formulários e sem processo de registro.","<b>Progresso contínuo</b>: ao repetir o login com a mesma conta GitHub, os mesmos dados de aprendizado são reutilizados; questões resolvidas e mapas desbloqueados não se perdem.","<b>Sem interferência</b>: quando o nome de usuário do GitHub coincide com uma conta da plataforma, o sufixo _gh é adicionado automaticamente; o login por senha não é afetado.","<b>Seguro e controlado</b>: o fluxo de autorização inclui validação antifalsificação e proteção contra replay; contas GitHub não permitem login por senha por padrão, e os dois canais de login são independentes."],stats:[["1 clique","Login com autorização GitHub","Sem registro, sem senha"],["1 conta","Vinculação de conta","Progresso sincronizado automaticamente"],["_gh","Sufixo automático para conflitos","Os dois logins não interferem"]]},
{date:"2026-08-06",tag:"opt",tagText:"Otimização",title:"Reforço de alta concorrência: limite de taxa por pessoa, a turma toda pratica junta sem interferência",desc:"O limite de taxa do site foi alterado para \"contagem por pessoa\" — cada administrador e cada aluno tem uma cota independente, e várias pessoas através da mesma entrada fazendo login e respondendo simultaneamente não disparam mais o \"operação muito frequente\"; o serviço em produção foi atualizado para inicialização multithread com waitress, e vários usuários simultâneos em sala de aula não travam.",overview:"Quando a plataforma fornece serviços externamente através de uma única entrada via ngrok/rede local, todos os requests parecem vir do mesmo IP para o servidor. Antes, o limite de taxa era contado por IP, significando que a turma toda compartilhava a mesma cota: 8 pessoas logando em sequência e 30 perguntas submetidas consecutivamente esgotavam a cota, e todas as operações seguintes eram rejeitadas — administradores excluindo usuários em sequência também enfrentavam o mesmo \"operação muito frequente\". Desta vez, o limite de taxa foi alterado para contar por pessoa: administradores por identidade de sessão e alunos por sessão de login, cada um com cota independente, sem interferência; a inicialização em produção mudou do servidor de desenvolvimento para o serviço de nível de produção waitress (multithread + alto limite de conexões), e não é mais o servidor o gargalo quando muitos alunos entram simultaneamente na sala de aula, a frequência de atualização automática do backend administrativo também é reduzida, e o volume de requisições cai pela metade.",thinking:"Limite de taxa é um fusível, não um fio: ele evita \"alguém estourar por malícia\", não deve prejudicar a aula normal da turma como \"comportamento suspeito\". A direção da correção não é aumentar a cota, mas mudar a unidade de contagem de IP (que em implantação de entrada única equivale à plataforma inteira) de volta para \"pessoa\" — cada administrador e cada aluno tem um fusível, e se o circuito de alguém sobrecarregar, só o dele queima, sem afetar os outros. Além disso, aumentamos a capacidade em si (waitress multithread) para que o fusível só queime quando realmente precisar.",points:["<b>Contagem por pessoa</b>: administradores por identidade de sessão e alunos por sessão de login têm limites independentes, e a turma/grupo todo compartilha a entrada sem interferência.","<b>Backend administrativo mais folgado</b>: operações como exclusão e redefinição de senha têm cota independente por pessoa, e o processamento em lote não reporta mais erroneamente \"operação muito frequente\".","<b>Inicialização de nível de produção</b>: serviço multithread waitress padrão + alto limite de conexões, vários usuários simultâneos não travam, e acesso direto pela rede local é possível."],stats:[["Cada um independente","Limite por pessoa","Administrador · Aluno sem interferência"],["waitress","Serviço multithread de produção","Sala de aula não trava"],["30s","Intervalo de atualização automática","Requisições pela metade"]]},
{date:"2026-08-05",tag:"opt",tagText:"Otimização",title:"Atualização de segurança do painel administrativo: uma chave por pessoa, permissões definidas",desc:"Atualização completa da autenticação do painel administrativo — cada administrador, após o login, recebe uma credencial de sessão exclusiva, não mais compartilhando a mesma \"chave mestra\"; operações sensíveis como troca de chave, exclusão de administradores e gerenciamento de códigos de indicação só podem ser realizadas pelo administrador principal.",overview:"O modelo de segurança do painel administrativo evoluiu de \"uma chave compartilhada por todos\" para \"uma chave por pessoa\": antes, todos os administradores recebiam a mesma chave unificada, e qualquer um deles podia executar operações de máxima permissão, como se todos tivessem a mesma chave da porta da empresa. Agora, a cada login, é emitida uma credencial de sessão exclusiva, vinculada à identidade do usuário, impossibilitando a personificação; operações sensíveis como troca de chave unificada, exclusão de conta de administrador e gerenciamento de códigos de indicação só são permitidas ao administrador principal; se a senha de um administrador for redefinida ou revertida, as sessões antigas dessa conta são imediatamente invalidadas, exigindo novo login.",thinking:"O ponto de partida da atualização de segurança é o \"menor privilégio\": não se deve dar a cada administrador a chave de máxima permissão. Com sessões vinculadas à identidade, cada ação sensível no painel pode ser rastreada até uma pessoa específica; a invalidação imediata após mudança de senha reduz ao mínimo a janela de dano de um vazamento de conta. Segurança não é um patch único, mas uma base em evolução contínua.",points:["<b>Uma chave por pessoa</b>: a cada login, é emitida uma credencial de sessão exclusiva, vinculada à identidade, sem chave compartilhada, impossibilitando a personificação.","<b>Permissões definidas</b>: troca de chave, exclusão de administradores e gerenciamento de códigos de indicação só podem ser feitos pelo administrador principal; administradores comuns não têm permissão.","<b>Mudança de senha invalida sessões</b>: depois que a senha do administrador é redefinida ou revertida, as sessões antigas são imediatamente invalidadas, sendo necessário fazer login novamente."],stats:[["1 pessoa 1 chave","Credencial de sessão exclusiva","Sem chave compartilhada"],["Somente administrador principal","Permissão para operações sensíveis","Trocar chave · Excluir admin · Código de indicação"],["Invalidação imediata","Sessão antiga após mudança de senha","Necessário novo login"]]},
{date:"2026-08-05",tag:"opt",tagText:"Otimização",title:"Paginação no caderno de erros: 5 questões por página, não precisa mais procurar agulha no palheiro",desc:"O caderno de erros agora suporta navegação por páginas — 5 questões por página, com botões de página anterior/próxima na parte inferior; ao voltar da página de detalhes, você permanece na mesma página, sem se perder.",overview:"Os erros vão se acumulando, uma tela não comporta tudo, e para achar uma questão é preciso voltar do início. Desta vez, mudamos o caderno de erros para o modo de paginação: 5 questões por página, com controles \"página anterior / x / y / próxima página\" na parte inferior, mostrando claramente a página atual; ao chegar na primeira ou última página, os botões são desabilitados automaticamente, e a numeração é corrigida automaticamente se sair do limite; ao voltar da página de detalhes para a lista, você permanece na mesma página — depois de ver a questão, você volta ao mesmo lugar.",thinking:"O caderno de erros é o campo de batalha da revisão; quando as questões aumentam, \"procurar\" vira um fardo. A paginação é a forma mais simples e familiar: 5 questões por página cabem bem na tela, com número de página claro e posição controlada; o detalhe \"manter a página ao voltar\" garante que o fluxo de revisão de \"clicar para ver a explicação e voltar para continuar\" não seja interrompido.",points:["<b>5 questões por página</b>：Os erros são divididos por data de resposta, 5 por página, tela limpa.","<b>Controles de paginação</b>：Página anterior / próxima + exibição do número da página, botões desabilitados automaticamente na primeira e última página, número da página limitado automaticamente.","<b>Página preservada ao voltar</b>：Ao voltar da página de detalhes, você permanece na mesma página, sem precisar procurar novamente."],stats:[["5","Questões por página","Ordenadas por data de resposta"],["x / y","Número da página exibido em tempo real","Botões da primeira e última página desabilitados automaticamente"],["1 local","Página preservada ao voltar","Não perde a posição ao voltar da página de detalhes"]]},
{date:"2026-08-05",tag:"new",tagText:"Novo recurso",title:"Avanço Adaptativo: Sistema de Iluminação do Gráfico de Conhecimento",desc:"A prática adaptativa foi totalmente atualizada——o sistema gera perguntas folha por folha, por categoria (5 perguntas por folha: 3 de múltipla escolha + 2 de preenchimento), acertando 3 seguidas, o ponto de conhecimento é iluminado; 29 pontos de conhecimento + 7 grandes categorias + nó raiz são iluminados passo a passo, acumulando rodadas até o gráfico ficar totalmente iluminado.",overview:"O avanço adaptativo é a mecânica central da plataforma, transformando o 'adivinhe quais perguntas você precisa' em 'iluminação visível do gráfico de conhecimento': o sistema começa pela primeira categoria, gerando perguntas ponto a ponto——cada ponto com 5 perguntas consecutivas (3 de múltipla escolha + 2 de preenchimento, múltipla escolha primeiro); acertando 3 consecutivas (com intervalo máximo de 2 minutos entre perguntas) ilumina o ponto e pula as restantes, acertar as 5 também ilumina; além disso, acumular 10 acertos em perguntas similares (incluindo prática autônoma e testes simulados) também ilumina. Pontos iluminados são salvos permanentemente——ao iluminar todos os 29 pontos de conhecimento, as 7 grandes categorias acendem uma a uma, culminando na iluminação completa do gráfico. Uma rodada tem no máximo 145 perguntas, ao concluir, retorna-se à interface do gráfico para reiniciar.",thinking:"O motor de recomendação anterior era uma caixa preta——os usuários não sabiam por que o sistema sugeria aquela pergunta. Iluminar o gráfico tornou o 'adaptativo' em um crescimento visível: cada ponto de conhecimento é uma lâmpada no gráfico, que acende com três acertos consecutivos. As regras de iluminação foram intencionalmente flexíveis——acertos consecutivos (não taxa geral de acerto), intervalo de até 2 minutos (evita inatividade), acertos acumulados também contabilizados (reconhecendo diversas formas de prática), permitindo que pessoas com diferentes hábitos de estudo possam iluminar seu próprio gráfico.",points:["<b>Loop duplo de geração de perguntas</b>: Categoria → Progressão ponto a ponto, cada ponto com 5 perguntas consecutivas (3 de múltipla escolha + 2 de preenchimento, múltipla escolha primeiro).","<b>Três modos de iluminação</b>: 3 acertos consecutivos (intervalo ≤2 min) iluminam e pulam perguntas / 5 acertos totais iluminam / 10 acertos acumulados iluminam.","<b>Progresso visualizado</b>: Dentro do ponto, progresso x/10; na categoria, x/y pontos iluminados; no nó raiz, x/7.","<b>Ciclo de uma rodada</b>: Até 145 perguntas por rodada, estado de iluminação mantido ao retornar ao gráfico, reiniciando uma nova rodada."],stats:[["29","Gráfico de pontos de conhecimento","Iluminação progressiva das 7 grandes categorias"],["5","Perguntas consecutivas por ponto","3 múltipla escolha + 2 preenchimento"],["145","Máximo de perguntas por rodada","Concluir e reiniciar nova rodada"]]},
{date:"2026-08-04",tag:"new",tagText:"Novo recurso",title:"Suporte completo a 6 idiomas lançado",desc:"O botão de idioma no canto superior direito agora é um menu suspenso com seis idiomas — 简体中文, 繁體中文, English, 日本語, हिन्दी e Português — alternância com um clique, com todas as páginas e atualizações traduzidas.",overview:"A plataforma agora atende um público global: um menu suspenso de idiomas no canto superior direito oferece seis idiomas com preferências lembradas automaticamente; todos os textos, botões e dicas das páginas, além de cada atualização na página 'Sobre nós', estão totalmente traduzidos — mude o idioma para ver o conteúdo completo naquele idioma.",thinking:"Idioma é a fronteira de um produto. Começamos com chinês e inglês; agora seis idiomas cobrem um público muito maior — não apenas traduzir textos, mas tornar todo o produto, incluindo conteúdo dinâmico, alternável.",points:["<b>Menu de 6 idiomas</b>: o menu 'Idioma' no canto superior direito alterna entre seis idiomas com um clique, com preferências lembradas.","<b>Tradução em todo o site</b>: todos os textos, botões e dicas das sete páginas estão totalmente traduzidos.","<b>Atualizações traduzidas</b>: cada atualização na página 'Sobre nós' está disponível nos seis idiomas."],stats:[["6","idiomas","简体中文 · 繁體中文 · English · 日本語 · हिन्दी · Português"],["7","páginas totalmente traduzidas"],["14","atualizações em 6 idiomas"]]},
{date:"2026-08-04",tag:"opt",tagText:"Otimização",title:"Sistema oficial de classificação de gráfico de conhecimento lançado",desc:"A classificação da página de exercícios está totalmente alinhada ao design oficial: 7 categorias × 29 subetiquetas, o nome da subetiqueta é exibido diretamente no enunciado, e a dificuldade de todas as questões é calibrada pela classificação oficial por estrelas (1 estrela fácil / 2 estrelas médio / 3 estrelas difícil).",overview:"Classificação é a base do banco de questões. Desta vez, alinhamos o filtro de classificação e as etiquetas das questões da página de exercícios com o gráfico de conhecimento oficial projetado pela equipe: 7 categorias (inserir, atualizar, excluir, definição de tabela, funções, junções de tabela, restrições, subconsultas, consultas) com 29 subetiquetas; as etiquetas de classificação no enunciado mudaram de códigos internos para nomes oficiais de subetiquetas (como \"JOIN interno\", \"funções de janela\"), facilitando entender o que a questão pergunta; também unificamos a dificuldade de todas as questões pela classificação oficial por estrelas, dando um padrão consistente para filtros e ordenação.",thinking:"As etiquetas de classificação são o primeiro índice para os usuários lerem o banco de questões. Antes, o enunciado exibia códigos internos que os usuários não reconheciam; agora unificamos pelo gráfico oficial da equipe—hierarquia perfurável, etiquetas legíveis, dificuldade padronizada. A estabilidade do sistema de classificação é o pré-requisito para recomendações personalizadas e estatísticas de aprendizado explicarem \"o que você está aprendendo\".",points:["<b>29 subetiquetas oficiais</b>: 7 categorias com 29 subetiquetas (JOIN interno, funções de janela, subconsulta escalar...), filtros perfuram nível a nível.","<b>Subetiquetas no enunciado</b>: Cada cartão de questão exibe o nome oficial da subetiqueta, sem códigos técnicos.","<b>Dificuldade por estrelas unificada</b>: 1 estrela = fácil, 2 estrelas = médio, 3 estrelas = difícil; as 457+ questões foram recalibradas pela dificuldade das etiquetas."],stats:[["7","categorias","DML · DDL · funções · junções de tabela · restrições · subconsultas · SELECT"],["29","subetiquetas oficiais"],["457+","questões com dificuldade calibrada por estrelas","1 estrela fácil / 2 estrelas médio / 3 estrelas difícil"]]},
{date:"2026-08-04",tag:"new",tagText:"Novo recurso",title:"Esqueceu a senha? Recuperação com ajuda da equipe",desc:"Não precisa mais se registrar novamente se esquecer a senha—basta contatar o administrador da equipe para redefinir, e a nova senha entra em vigor imediatamente; cada redefinição é registrada automaticamente, com suporte a reversão passo a passo para evitar erros.",overview:"Antigamente, esquecer a senha significava se registrar de novo, perdendo a conta e o histórico de aprendizado. Agora a plataforma oferece recuperação com ajuda da equipe: contate o administrador, verifique sua identidade e redefina a senha, que entra em vigor imediatamente, mantendo a conta e os dados de aprendizado intactos; cada redefinição registra automaticamente a senha antiga, permitindo reversão passo a passo para evitar perdas por engano.",thinking:"O maior medo ao esquecer a senha é 'nunca mais recuperar a conta'. A essência da recuperação é 'alguém pode provar que você é você'—delegamos isso ao administrador da equipe: ele verifica a identidade, ajuda a redefinir, e o processo é registrado e reversível, tornando a recuperação suave e segura.",points:["<b>Recuperação de senha esquecida</b>: Contate o administrador da equipe para redefinir, a nova senha entra em vigor imediatamente, sem necessidade de novo registro ou perda de dados.","<b>Registro e reversão</b>: A senha antiga é registrada automaticamente antes da redefinição, permitindo até 3 reversões para corrigir erros.","<b>Dupla verificação do administrador</b>: A recuperação requer a senha da conta do administrador + chave unificada, garantindo que a senha seja entregue apenas a pessoas confiáveis."],stats:[["1 passo","contatar administrador para redefinir","nova senha eficaz imediatamente após verificação de identidade"],["3 vezes","limite de proteção de reversão","cada redefinição é registrada automaticamente, reversível passo a passo"],["2 fatores","verificação da operação do administrador","senha da conta + chave unificada"]]},
{date:"2026-08-04",tag:"new",tagText:"Novo recurso",title:"Novo motor de avaliação SQL real lançado",desc:"As questões de preenchimento não comparam mais texto—a resposta é executada em um banco de dados real e comparada linha por linha com o resultado da resposta padrão; quando errado, são fornecidos avisos específicos como \"tabela não existe\" ou \"erro de sintaxe\".",overview:"Anteriormente, as questões de preenchimento usavam similaridade de strings para avaliar, o que podia julgar erroneamente diferentes formas válidas da mesma consulta. O novo motor reconstrói fielmente o ambiente da questão em um banco de dados em memória (estrutura de tabela + dados), executando tanto o SQL do usuário quanto a resposta padrão, comparando os conjuntos de resultados: ordem das colunas, ordem das linhas, COUNT(*) e COUNT(coluna não nula) e outras formas semanticamente equivalentes são corretamente aceitas; quando a execução falha, motivos específicos como \"tabela não existe\", \"coluna não existe\", \"erro de sintaxe\" são mostrados, permitindo que o usuário saiba onde errou.",thinking:"O mínimo para avaliar é \"seu código realmente produz aquele resultado\". Comparar texto é apenas uma aproximação, por mais inteligente que seja—avançamos para execução real: só é correto se o resultado bate. Essa mudança transforma as questões de preenchimento de \"decorar resposta\" para \"verificação real\", e os avisos de erro passam a fazer parte do aprendizado.",points:["<b>Comparação de resultados</b>: A avaliação é baseada no \"resultado real executado\", não na similaridade de texto—formas equivalentes não são mais julgadas erradas.","<b>Ambiente de execução real</b>: Cada questão reconstrói a estrutura da tabela e os dados em um banco em memória, comportando-se como um banco real.","<b>Erro é feedback</b>: Erros de execução como sintaxe, tabela/coluna inexistente são mostrados diretamente, permitindo aprender mesmo errando.","<b>Somente leitura e seguro</b>: Apenas consultas somente leitura como SELECT / WITH são permitidas, evitando que instruções de escrita danifiquem o ambiente."],stats:[["2ms","tempo de avaliação por questão"],["3 tipos","avisos de erro comuns","tabela não existe · coluna não existe · erro de sintaxe"],["vários","testes de formas equivalentes"]]},
{date:"2026-08-04",tag:"new",tagText:"Novo recurso",title:"Site inteiro bilíngue (português/inglês) lançado",desc:"Portal, Sobre Nós, Login/Registro, front-end de exercícios agora suportam alternância entre português e inglês, com um clique no canto superior direito e preferências lembradas automaticamente.",overview:"A plataforma visa um público mais amplo; as quatro páginas agora são bilíngues: textos de página, placeholders de entrada, mensagens de validação de formulário, força de senha, feedback de operações—tudo passa pelo sistema de tradução; o botão de idioma no canto superior direito alterna com um clique, e a preferência é salva e aplicada automaticamente na próxima vez; conteúdo longo como novidades também tem versão completa em inglês.",thinking:"Um bom produto deve ser acessível a mais pessoas. Idioma não é só traduzir textos, mas tornar toda a cadeia de interação (dicas, feedback, conteúdo) alternável—por isso unificamos um mecanismo de tradução leve, onde novas páginas são integradas automaticamente.",points:["<b>Cobertura global</b>: Textos de página, placeholders, mensagens de validação e toasts são todos bilíngues.","<b>Alternância com um clique</b>: Botão de idioma no canto superior direito, preferência salva localmente, alternância imediata.","<b>Conteúdo bilíngue</b>: Conteúdo longo como novidades e descrições de funcionalidades também tem versão em inglês."],stats:[["4+","páginas bilíngues","Portal · Sobre Nós · Login/Registro · front-end de exercícios"],["300+","entradas de tradução"],["1 clique","alternância imediata"]]},
{date:"2026-08-04",tag:"new",tagText:"Novo recurso",title:"Painel de Administração da Equipe Lançado",desc:"Recursos de colaboração em equipe lançados: painel de administração, sistema de contas de administrador, status online de colegas, gerenciamento de senha de usuário (redefinição + reversão); login e operações sensíveis protegidos por verificação dupla.",overview:"A plataforma entrou em operação de equipe: administradores podem registrar contas exclusivas através de convite da equipe; o login no painel de administração requer verificação dupla de senha de conta e chave unificada; o painel do administrador suporta visualizar o último horário online dos colegas, gerenciar senhas de usuários da plataforma (redefinição e até três reversões para evitar erros). Informações sensíveis, como método de convite da equipe e chave de segurança, não são divulgadas aqui.",thinking:"O pré-requisito para colaboração em equipe é segurança e controle. Projetos como verificação dupla de login e reversão de senha são para tornar o ato de 'alguém poder gerenciar' seguro, reversível e menos propenso a erros.",points:["<b>Verificação dupla</b>: O login no painel de administração requer senha de conta do administrador + chave unificada, evitando vazamento de conta.","<b>Colegas online</b>: O painel do administrador mostra em tempo real o último horário online de outros administradores.","<b>Gerenciamento de senha</b>: Suporta redefinição de senha de usuários da plataforma e mantém até 3 reversões para evitar erros.","<b>Isolamento de registros</b>: O histórico de senhas é gerenciado independentemente por tipo de conta, sem interferência."],stats:[["2 重","Verificação de login","Senha de conta do administrador + chave unificada"],["3 次","Limite de reversão de senha","Registro automático a cada redefinição, reversão passo a passo possível"],["Tempo real","Sincronização online de colegas"]]},
{date:"2026-08-04",tag:"opt",tagText:"Otimização",title:"Reforço de Segurança: Atualização da Proteção de Login",desc:"Usuários não logados não podem ver o conteúdo das questões e respostas; é necessário fazer login para começar a praticar; sessões expiradas são limpas automaticamente e o usuário é orientado a fazer login novamente.",overview:"Proteção de conteúdo da plataforma atualizada: lista de questões, detalhes das questões, respostas e explicações exigem login para acesso; visitantes podem apenas navegar pelo portal, página 'Sobre nós' e páginas de login/registro, garantindo a segurança do banco de questões e dos dados de aprendizado.",thinking:"O banco de questões é o ativo central da plataforma, e os dados de aprendizado pertencem aos usuários. A proteção de login é uma barreira básica; continuaremos a aprimorar o sistema de permissões no futuro.",points:["<b>Proteção de conteúdo</b>: Todas as APIs relacionadas a questões, respostas e explicações exigem verificação de login.","<b>Guarda de sessão</b>: Quando a sessão expira, o estado local é limpo automaticamente e o usuário é orientado a fazer login novamente, evitando erros."],stats:[["100%","Proteção de login das APIs de questões"],["Automático","Limpeza de sessão expirada","Limpeza automática do estado local quando a sessão expira e orientação para novo login"]]},
{date:"2026-08-03",tag:"new",tagText:"Novo recurso",title:"Sistema de Portal Glassmorphism Lançado",desc:"Novo portal homepage + página de login/registro lançados, com estilo glassmorphism claro unificado em todo o site, caminho alterado para fluxo de três níveis: 'Portal → Login → Prática'.",overview:"Referenciando estilos de front-end de grandes empresas como DeepSeek / Codex, construímos um portal externo completo para a plataforma: página inicial do portal de marca, página dinâmica 'Sobre nós', página de login/registro glassmorphism, e também redesenhamos o front-end de prática com a mesma linguagem de design.",thinking:"O produto precisa de uma fachada: a primeira página que o usuário vê determina a primeira impressão. Dedicamos uma rodada para polir o portal externo - uma linguagem visual unificada faz 'Portal, Login, Prática' parecerem um produto completo, não três páginas montadas. Também esclarecemos os limites do produto: o teste de nivelamento não é nossa característica, então o removemos e focamos recursos no motor adaptativo, que é a linha principal.",points:["<b>Portal homepage</b>: Layout de duas colunas, com texto da marca e dados à esquerda, e cartões de dupla entrada 'Entrar na plataforma / Sobre nós' à direita; estilo glassmorphism claro unificado em todo o site (cartão fosco + orbes de luz flutuantes + gradiente azul-violeta).","<b>Página de login/registro</b>: Abas de login/registro, integração de ferramentas como nome de usuário aleatório, senha segura aleatória, verificação de força de senha; todos os ícones substituídos por SVGs lineares da Lucide, sem emojis de desenho animado.","<b>Redesign da página de prática</b>: Interface de fundo branco atualizada para glassmorphism, com navegação, cartões e botões totalmente unificados; o recurso de teste de nivelamento foi oficialmente descontinuado, com foco nos quatro módulos principais: avanço adaptativo, prática independente, teste de questões reais e coleção de erros.","<b>Marca</b>: Integração do logotipo da marca NIDUS (com fundo transparente), remoção de informações de stack tecnológica do texto do rodapé."],stats:[["3","Níveis do sistema de páginas","Fluxo de três níveis: Portal → Login → Prática"],["4","Páginas redesenhadas"],["0","Dependências de CDN"]]},
{date:"2026-08-03",tag:"new",tagText:"Novo recurso",title:"Filtro de Categoria em Cascata Personalizado",desc:"O filtro de categoria do banco de questões foi atualizado para um painel em cascata de hover – ao passar o mouse sobre uma categoria principal, as subcategorias aparecem, com alternância livre sem bloqueio, e limpeza com um clique após a seleção.",overview:"Atualizamos o filtro de categoria de um dropdown tradicional para a interação 'cascata de hover': passar o mouse sobre uma categoria principal mostra imediatamente uma prévia de suas subcategorias, permitindo alternar livremente entre categorias, eliminando o problema da versão antiga em que não era possível trocar facilmente após a seleção.",thinking:"O dropdown inicial era uma lista plana; para mudar de categoria era necessário voltar para 'Todas' e selecionar novamente, com alta taxa de erro e caminho longo. Nossa abordagem central é transformar 'selecionar e depois mudar' em 'ver antes de decidir' – tornando o filtro tão fácil quanto navegar em um menu: passar o mouse para pré-visualizar, afastar sem bloquear, e poder desfazer com um clique após selecionar. O filtro não deve ser um fardo, mas uma porta de entrada para explorar o banco de questões.",points:["<b>Método de interação</b>: Ao passar o mouse, o painel de subcategorias aparece e, após um breve afastamento, ele se fecha automaticamente; o filtro selecionado é exibido como uma 'tag ✕' no lado direito da barra de filtros, com um clique para limpar.","<b>Princípio de não bloqueio</b>: O painel é apenas uma 'camada de pré-visualização'; desde a seleção até o desfazer, é uma ação contínua – veja o nível que quiser, mude quando quiser, sem forçar a volta para 'Todas' primeiro.","<b>Consistência</b>: Os três filtros (tipo de questão, dificuldade, categoria) têm o mesmo estilo e altura, formando visualmente um único conjunto de controles."],stats:[["6","Novas regras de estilo"],["5","Estados de interação","Hover · Expandir · Recolher · Selecionar · Limpar"],["200ms","Atraso para recolher o painel"]]},
{date:"2026-08-02",tag:"fix",tagText:"Correção",title:"Filtro de categorias hierárquico + Correção do filtro de dificuldade",desc:"O filtro de dificuldade agora se aplica uniformemente a todas as questões (incluindo questões de múltipla escolha estáticas); o filtro de categorias foi atualizado para uma estrutura hierárquica de grafo de conhecimento, com suporte a drill-down.",overview:"Dois problemas de filtro foram corrigidos: o filtro de dificuldade antes afetava apenas algumas questões, enquanto outras não respondiam; o menu suspenso de categorias era uma lista plana, incapaz de refletir as relações de subordinação entre os pontos de conhecimento.",thinking:"A essência do filtro é 'ajudar o usuário a reduzir o banco de questões'. Os 29 rótulos planos não transmitem as relações entre os pontos de conhecimento, enquanto o grafo de conhecimento é em si um dicionário hierárquico pronto - nós o usamos diretamente para conduzir o filtro: selecionar 'junção de múltiplas tabelas' é ver junto com suas junções internas, junções à esquerda e auto-junções. A correção do filtro de dificuldade é uma questão de princípio: ou a regra se aplica a todas as questões, ou não é chamada de regra.",points:["<b>Filtro de dificuldade unificado</b>: Alteramos o filtro de dificuldade de 'filtro parcial no backend' para 'filtro completo unificado no frontend', independentemente da origem das questões, os resultados são os mesmos.","<b>Categorias hierárquicas</b>: As opções de filtro reutilizam diretamente as relações hierárquicas do grafo de conhecimento - selecionar uma grande categoria automaticamente abrange todos os subpontos de conhecimento, selecionar um nó filho específico corresponde apenas a esse ponto.","<b>Mapeamento de questões estáticas</b>: As questões de múltipla escolha estáticas também foram mapeadas para nós de conhecimento, garantindo que participem do filtro hierárquico assim como as questões dinâmicas."],stats:[["29","rótulos conectados à hierarquia"],["58","questões estáticas incluídas no filtro"],["2","problemas de filtro corrigidos","Filtro de dificuldade inativo · Categorias sem drill-down"]]},
{date:"2026-08-02",tag:"bank",tagText:"Expansão do banco de questões",title:"Respostas padrão para todas as 182 questões do Niuke geradas",desc:"Usando modelo grande para gerar respostas questão por questão e validar executando em banco de dados real, com correção automática de tentativas. Total do banco de questões aumentou para 507, com 50 questões reais de exames escritos online.",overview:"As 182 questões coletadas do Niuke estavam todas sem respostas padrão. Construímos um pipeline de 'gerar-validar-corrigir': o modelo grande escreve respostas questão por questão → executa em banco de dados real → se o resultado estiver errado, o modelo tenta novamente, e no final 182/182 passaram na validação de execução.",thinking:"182 questões sem respostas de referência é como ter uma prova sem gabarito. Escrever manualmente é trabalhoso e propenso a erros. Nossa abordagem é 'deixar a máquina ser o juiz': o modelo grande gera, o banco de dados valida, e se não passar, recomeça. As armadilhas que encontramos (mudar tipo também mudou nome de coluna, diferenças de dialeto, compatibilidade de caminho) são boas práticas - o padrão de qualidade do banco de questões deve ser 'cada resposta executável e reproduzível', não 'alguém olhou'.",points:["<b>Verificável por máquina</b>: Cada resposta deve ser capaz de executar com sucesso no banco de dados e produzir resultados, não apenas 'parecer razoável' - usar resultados de execução em vez de inspeção manual por amostragem.","<b>Ciclo de correção automática</b>: Após a geração inicial, corrigimos em lotes: conversão de tipo danificou nomes de colunas, falta de palavras-chave no dialeto MySQL, comandos CREATE TABLE espalhados em vários arquivos são casos típicos de 'respondeu, mas não executa'.","<b>Trilhas separadas</b>: Questões de iniciante / conhecimento essencial / populares vão para prática autônoma (aumentado para 457); questões reais de exames escritos de grandes empresas em volume separado (50), prática e teste separados."],stats:[["182/182","respostas validadas"],["457","total de prática autônoma"],["50","questões de exames escritos"]]},
{date:"2026-07-31",tag:"opt",tagText:"Otimização",title:"Reconstrução do grafo de conhecimento lançada",desc:"Grafo atualizado para estrutura de três camadas com 37 nós (raiz → 7 categorias principais → 29 nós filhos), caminho de aprendizado claro, pesos de recomendação reordenados.",overview:"O grafo de conhecimento foi reconstruído em uma estrutura clara de três camadas: um nó raiz, 7 categorias principais (inserir/excluir/atualizar, definição de tabela, funções, junções, restrições, subconsultas, consultas) e 29 sub-pontos de conhecimento. O grafo também conduz regras de desbloqueio e pesos de recomendação, convergindo o caminho de aprendizado em um mapa legível.",thinking:"O grafo antigo tinha relação frouxa com as questões, os usuários não viam 'o que aprender, até onde aprenderam'. O núcleo desta reconstrução é a convergência: transformar o caminho de aprendizado em um mapa de 37 nós, com as 7 categorias principais na base e os pontos de conhecimento sob elas; também alinhamos a lógica de recomendação com o mapa - pesos por nível de domínio, progresso por taxa de acerto. As quebras de desbloqueio expostas no processo foram o maior ganho: o sistema adaptativo teme que um elo não se encaixe e o usuário nunca chegue ao próximo.",points:["<b>Pesos reordenados</b>: Reduzir drasticamente a prioridade de push para questões já acertadas; questões não feitas são priorizadas; questões erradas recebem peso ×1.5 para prática reforçada.","<b>Regra de consolidação de 60%</b>: Quando a taxa de acerto do ponto de conhecimento atual for inferior a 60%, força a permanência na prática; apenas quando atinge o padrão, o próximo ponto é empurrado, garantindo base sólida.","<b>Correção da cadeia de desbloqueio</b>: Descobrimos o problema de quebra na lógica antiga: 'acertar questões de múltipla escolha nunca desbloqueia questões de preenchimento' - mudamos para: ao acertar pela primeira vez uma questão avançada de múltipla escolha, todas as questões de preenchimento são desbloqueadas e uma é imediatamente empurrada."],stats:[["37","total de nós","Raiz → 7 categorias principais → 29 sub-pontos de conhecimento"],["29","rótulos de conhecimento"],["60%","limiar de domínio","Taxa de acerto abaixo de 60% força prática de consolidação"]]},
{date:"2026-07-30",tag:"fix",tagText:"Correção",title:"Atualização das respostas padrão para as 310 questões do LeetCode",desc:"Atualização em lote das respostas padrão, 295 questões geraram saída esperada por execução real; adicionada camada de tradução para o dialeto MySQL, removidas 15 questões incompatíveis.",overview:"As 310 questões tinham respostas padrão, mas sem saída esperada executável, o avaliador não funcionava. Fizemos as respostas executarem de verdade no banco de dados para gerar tabelas de saída, e para isso resolvemos as diferenças de dialeto entre MySQL e SQLite; 3 questões cujas respostas estavam erradas foram corrigidas manualmente.",thinking:"O limite do avaliador é 'sua resposta realmente consegue produzir aquele resultado'. Executamos todas as 310 respostas no banco de dados; se não rodava, investigávamos: diferenças de dialeto geraram uma camada de tradução, respostas erradas foram corrigidas manualmente, e as 15 que realmente não rodavam foram removidas decisivamente. A quantidade de questões pode ser aumentada depois, mas 'julgar errado' destrói diretamente a confiança do usuário - qualidade dos dados antes da quantidade.",points:["<b>Execução real para saída esperada</b>: O avaliador compara com 'o resultado realmente executado', não com uma tabela de referência manual - 295 questões geradas com sucesso.","<b>Camada de tradução de dialeto</b>: Sintaxe específica do MySQL (tipos enum, formatação de datas, diferenças de tipos de campo, etc.) foi adaptada item a item na portabilidade.","<b>Corte decisivo</b>: 15 questões envolvendo regex, definição de funções etc. que não podem ser executadas no SQLite foram removidas diretamente - precisão do avaliador é mais importante que números de questões."],stats:[["295","questões validadas"],["15","questões removidas decisivamente","Tipos como regex/funções personalizadas que não podem ser executados no SQLite"],["3","questões corrigidas manualmente"]]},
{date:"2026-07-28",tag:"new",tagText:"Novo recurso",title:"Modo Profundo lançado",desc:"Após responder corretamente a uma questão de múltipla escolha, uma questão de preenchimento de lacunas do mesmo ponto de conhecimento é automaticamente enviada, permitindo aplicar o conhecimento e formar um ciclo de aprendizado de \"memória de conceito → verificação prática\".",overview:"Modo Profundo lançado: após responder corretamente a uma questão de múltipla escolha, uma questão de preenchimento de lacunas do mesmo ponto de conhecimento é automaticamente enviada — questões conceituais são preparação, questões de preenchimento são prática real, aproveite o momento.",thinking:"Questões de múltipla escolha testam se você \"reconhece\", enquanto questões de preenchimento testam se você \"sabe escrever\" — resolver apenas questões de múltipla escolha pode criar a ilusão de \"eu entendi\". A ideia do Modo Profundo é que, assim que você acerta uma questão conceitual, você parte imediatamente para uma questão prática, aproveitando o momento para formar um ciclo, transformando \"entender\" em realmente \"saber escrever\".",points:["<b>Modo Profundo</b>: após responder corretamente a uma questão de múltipla escolha, uma questão de preenchimento de lacunas do mesmo ponto de conhecimento é automaticamente enviada — questões conceituais são preparação, questões de preenchimento são prática real, aproveite o momento.","<b>Regras de desbloqueio</b>: ao acertar pela primeira vez uma questão básica, todas as questões de múltipla escolha são desbloqueadas; ao acertar pela primeira vez uma questão avançada, todas as questões de preenchimento são desbloqueadas e uma é imediatamente enviada; se errar, permanece no ponto de conhecimento atual para reforço."],stats:[["1","recurso principal"],["4","regras de desbloqueio","Acertar questão básica desbloqueia múltipla escolha → Acertar questão avançada desbloqueia preenchimento"],["×1.5","peso de reforço para erros"]]},
{date:"2026-07-25",tag:"opt",tagText:"Otimização",title:"Importação do banco de questões e sincronização de tags/dificuldade",desc:"58 questões estáticas de múltipla escolha foram analisadas e importadas; 371 questões no total tiveram dificuldade e tags de conhecimento unificadas, corrigindo 272 questões com problemas de dados.",overview:"O banco de questões vem de várias fontes (raspagem, planilhas, páginas manuais), com formatos variados. Desta vez, fizemos um alinhamento sistemático: unificamos a dificuldade e as tags de conhecimento de 371 questões e corrigimos problemas de qualidade de dados, como separadores de tags inconsistentes e erros de codificação.",thinking:"O banco de questões é a base do produto, e dados agregados de várias fontes são propensos a inconsistências — o mesmo ponto de conhecimento pode ser chamado de \"função de janela\" em uma questão e \"função de classificação\" em outra, fazendo com que questões sejam perdidas na filtragem. O benefício deste alinhamento não é superficial: depois que padrões invisíveis de dados, como dificuldade, tags e codificação, são unificados, filtragem, recomendação e estatísticas podem ser construídas sobre uma base confiável. Com a fundação reparada, podemos construir o edifício acima.",points:["<b>Importação de questões estáticas</b>: 58 questões de múltipla escolha básicas/avançadas (incluindo criação de tabelas, opções, saída esperada) foram totalmente analisadas e importadas, completando o quebra-cabeça de tipos de questão além do preenchimento de lacunas.","<b>Unificação de critérios</b>: a dificuldade e as tags de conhecimento de todas as 371 questões foram alinhadas uma a uma com a tabela padrão, tornando os critérios de filtragem e exibição de estrelas consistentes.","<b>Limpeza de dados</b>: corrigimos em lote os separadores de tags inconsistentes em 272 questões e resolvemos a falha de leitura de estrelas devido a erros de codificação."],stats:[["58","questões importadas estaticamente"],["371","questões alinhadas"],["272","questões com dados corrigidos","separadores de tags inconsistentes · erros de codificação"]]}
],

{date:"2026-09-03",tag:"new",tagText:"新機能",title:"リアルタイム動向で特定ユーザーにロックオン",desc:"ユーザー動向と管理者動向に「ロック（絞り込み）」機能を追加。ユーザー名を入力してロックするか、一覧のユーザー名をクリックすると、そのユーザーの操作だけをリアルタイム表示。特定の学習者の問題追跡や、特定管理者の操作確認が速くなります。",overview:"特定の学習者の問題を調べる際、従来は全量の動向を画面いっぱいに探す必要がありました。主管理者がある管理者の操作を確認したい場合も同様です。今回、2つのリアルタイムカードに「ロック」を追加：入力欄にユーザー名を入れてロック、または動向内のユーザー名をクリックすると即座にそのユーザーの操作だけを表示。以後6秒ごとの自動更新もこの絞り込みビューを維持し、調査中も途切れません。「ロック解除」をクリックすれば全量表示に戻り、再ログインは不要です。",thinking:"トラブルシューティングは「焦点を絞る」こと：一人を選び、その人が何をしたかを確認する。全量の動向を探すより、入力欄または一覧の名前クリックで対象を自分で決め、ロック中もリアルタイム更新を保ち、解除は1クリックで戻せる設計にしました。",points:["<b>2つのロック方法</b>：ユーザー名を入力して「ロック」、または動向内のユーザー名をクリックして即座に絞り込み。","<b>ロック中もライブ</b>：6秒ごとの自動更新も、そのユーザーの新しい動向のみを表示し続けます。","<b>ワンクリック解除</b>：「ロック解除」で全量表示に戻り、再ログイン不要。"],stats:[["2","ロック対応","ユーザー動向 · 管理者動向"],["2","ロック方法","ユーザー名入力 · 名前クリック"],["1","解除操作","いつでも全量表示へ"]]},
{date:"2026-09-03",tag:"new",tagText:"新機能",title:"管理コンソールにリアルタイム監視：ユーザー動向とシステムログ",desc:"管理コンソールにリアルタイムのユーザー動向とシステムログが登場——全管理者が学習者の登録・ログイン・回答をリアルタイム確認でき、バックエンド例外・判題エラー・ログイン失敗などのシステムログも閲覧可能。主管理者は全管理者の操作動向も確認でき、責任追跡が可能に。",overview:"チーム運用が始まり、管理者には「見える」監視台が必要になりました。管理コンソールに3つのリアルタイムパネルを追加：ユーザー動向は学習者の登録・ログイン・ログアウト・回答の正誤・診断・練習開始を記録し、「どの学習者がどこで詰まっているか」を素早く把握；システムログはバックエンド例外、SQL判題エラー、ログイン失敗、レート制限を記録し、確認後に開発者へ文脈ごとフィードバック可能；管理者動向（主管理者のみ閲覧可）は各管理者のログイン・登録・パスワード変更・アカウント削除・紹介コード管理を記録し、誰がいつ何をしたかが一目瞭然です。3つのパネルは約6秒ごとに自動更新されます。",thinking:"チーム運用のコンソールは、管理操作を実行するだけでなく「今何が起きているか」を見えるようにする必要があります。学習者がどこで詰まったか、システムが何を報告したか、どの管理者が何をしたか。リアルタイム動向は「今起きていること」、ログは「誰がいつ行ったか」を答え、調査と責任追跡の両方に明確な糸口を提供します。",points:["<b>ユーザー動向・全管理者</b>：学習者の登録・ログイン・回答・診断がリアルタイムで流れ、問題のある学習者をすぐ見つけられます。","<b>システムログ・全管理者</b>：例外、判題エラー、ログイン失敗、レート制限を一覧でき、開発者へ報告しやすくなります。","<b>管理者動向・主管理者のみ</b>：ログイン、登録、コンソール操作がすべて記録され、責任の追跡が可能です。"],stats:[["3","リアルタイムパネル","ユーザー動向 · システムログ · 管理者動向"],["6秒","自動更新","手動更新不要"],["全管理者 / 主管理者","閲覧範囲","ユーザーとログは全管理者・管理者ログは主管理者のみ"]]},
{date:"2026-08-10",tag:"opt",tagText:"最適化",title:"ページ表示が安定：スクロールバーのちらつきと揺れを解消",desc:"ページ表示時の揺れを体系的に修正——スクロールバー領域の確保、非同期読み込みのプレースホルダー高さ、JSによる強制同期レイアウトの排除。ページ切り替えで左右に跳ねなくなります。",overview:"ページを開いたりモジュールを切り替えたりすると、まれに全体が揺れることがありました。原因は3つに絞り込めました。1つ目は、ページ高さの変化で縦スクロールバーが出現/消滅し、利用可能な幅が変わって中央寄せのコンテンツが水平にずれる（スクロールバーのちらつき）。2つ目は、問題リストや更新情報など非同期で読み込むコンテンツにプレースホルダー高さがなく、データ到着の瞬間にページが突然高くなる。3つ目は、一部のJSがDOM書き込み直後にレイアウト寸法を読む（CodeMirror初期化、カスケード分類パネルの位置決めなど）ことによる強制同期レイアウト。今回の修正：全ページでスクロールバー領域を確保（scrollbar-gutter）し、スクロールバーの表示/非表示でコンテンツがずれないように。練習リスト・問題詳細・更新情報コンテナにプレースホルダー高さを追加し、非同期読み込みでの「潰れる→跳ねる」を防止。CodeMirrorは隠す前に寸法を読み、カスケードパネルは先に位置決めしてから内容を埋めるようにし、強制同期レイアウトを排除。アイコンフォントもプリロードし、アイコン表示時のテキスト位置ずれを防止。知識グラフの登場アニメーションはそのまま維持します。",thinking:"読み込みの遅さよりも、揺れのほうが体験を損ないます。ページが「不安定」に感じられるからです。今回はアニメーションやコンテンツを削るのではなく、構造的な原因3つをまとめて修正しました：スクロールバー領域、読み込み時のプレースホルダー高さ、読み書きの分離。小さな変更ですが、開く・切り替える・戻る、すべての動作が静かになりました。",points:["<b>スクロールバーのちらつきを解消</b>：全ページでスクロールバー領域を確保し、ページが高くなったり低くなったりしてもコンテンツが水平に跳ねない。","<b>非同期読み込みにプレースホルダー</b>：練習リスト・問題詳細・更新情報に最小高さを設定し、「読み込み中→表示完了」でページ全体が跳ねない。","<b>強制同期レイアウトを排除</b>：CodeMirrorは隠す前に寸法を読み、カスケードパネルは先に位置決めしてから内容を埋める。DOMの読み書きを分離し、毎フレームの再レイアウトを削減。","<b>フォントを先に読み込み</b>：Font Awesomeアイコンフォントをプリロードし、ボタンやナビゲーションの文字がアイコン表示時にずれない。"],stats:[["0","スクロールバー出し入れで","コンテンツが水平にずれない"],["320px","練習エリアの最小高さ","読み込み/一覧/詳細切り替えで潰れない"],["3","構造的原因を修正","スクロールバーちらつき・レイアウトシフト・強制同期レイアウト"]]},
{date:"2026-08-06",tag:"new",tagText:"新機能",title:"GitHub ワンクリックログイン登場",desc:"ログインページに GitHub アイコンを追加——クリックして認可すれば、登録不要でログインでき、アカウントと学習進捗が自動で紐付きます。GitHub 未登録の方は、引き続きユーザー名とパスワードで登録・ログイン可能で、両方式は互いに影響しません。",overview:"これまでプラットフォームはユーザー名とパスワードのみのログイン方式でした。新規ユーザーはユーザー名を考え、パスワードを設定し、登録フローを完了してから練習を始める必要がありました。今回、ログインページに GitHub ワンクリックログインを追加：GitHub アイコンをクリック → GitHub 認可ページで確認 → 自動的にプラットフォームに戻りログイン成功。学習プロフィールと進捗はアカウントに自動で紐付きます。GitHub でログインする場合、同じアカウントで繰り返しログインすると同じ学習データが再利用されます。GitHub ユーザー名がプラットフォームの既存アカウントと重複する場合は、自動的に _gh サフィックスが付き、干渉しません。これまでパスワードログインに慣れているユーザーは、これまで通りそのまま利用できます。",thinking:"ログインはユーザーにとって最初のハードルであり、このハードルが低いほど学習を始める抵抗が減ります。GitHub はユーザーが最も慣れ親しんだアカウントの一つです。新規ユーザーに1分かけて登録させるよりも、アイコンをクリックしてすぐに入れるほうが良いと考えました。実装は標準の OAuth2 認可コードフローを採用：コールバック URL を厳格に検証し、セッションにリプレイ防止を施し、「便利さ」を「管理可能性」の上に構築しています。",points:["<b>ワンクリック認可</b>：GitHub アイコンをクリック → 認可 → 自動で戻ってログイン。フォーム入力も登録フローも一切なし。","<b>進捗が継続</b>：同じ GitHub アカウントで繰り返しログインしても同じ学習データを再利用。解いた問題や点灯したマップも失われません。","<b>互いに干渉なし</b>：GitHub ユーザー名がプラットフォームのアカウントと重複すると自動で _gh サフィックスが付与。パスワードログインは完全に影響を受けません。","<b>安全で管理可能</b>：認可フローには偽造防止検証とリプレイ防止を実装。GitHub アカウントはデフォルトでパスワードログイン不可、2つのログイン経路は独立しています。"],stats:[["1 クリック","GitHub 認可ログイン","登録もパスワードも不要"],["1 つ","アカウント紐付け","学習進捗を自動同期"],["_gh","重複時自動サフィックス","2つのログインは干渉なし"]]},
{date:"2026-08-06",tag:"opt",tagText:"最適化",title:"高並列処理の強化：レート制限をユーザー単位に変更し、クラス全体で同時に練習しても互いに影響しない",desc:"サイト全体のレート制限を「ユーザー単位」に変更——各管理者、各受講者が独立した割り当てを持ち、複数人が同じ入口から同時にログイン・回答しても「操作が多すぎます」を誤って発動しません。本番サービスはwaitressマルチスレッド起動にアップグレードされ、授業中に多数が同時ログインしてもダウンしません。",overview:"プラットフォームがngrok/ローカルネットワークの単一入口で外部にサービスを提供する場合、すべてのリクエストはサーバーから見ると同じIPからのものになります。以前はレート制限をIP単位でカウントしていたため、クラス全体で同じ割り当てを共有していました。8人が順にログインし、30問連続で提出すると割り当てが使い切り、その後の操作はすべて拒否——管理者がユーザーを連続で削除するときも同じ「操作が多すぎます」に当たっていました。今回はレート制限をユーザー単位に変更：管理者はセッションID、受講者はログインセッションごとにそれぞれカウントし、各自が独立した割り当てを持ち、互いに影響しません。本番起動を開発サーバーからwaitress本番級サービス（マルチスレッド+高接続上限）に切り替え、授業中に多数が同時に押し寄せてもサーバーがボトルネックにならず、管理バックエンドの自動更新頻度も同時に下がり、リクエスト量は半分になります。",thinking:"レート制限はヒューズであって、電線ではありません。それは「誰かが悪意で爆発させる」のを防ぐもので、クラス全体の正常な授業を「挙動不審」として誤って傷つけるべきではありません。修正の方向性は割り当てを増やすことではなく、カウント単位をIP（単一入口デプロイでは事実上プラットフォーム全体）から「ユーザー」に戻すこと——各管理者、各受講者にそれぞれヒューズがあり、誰の回路が過負荷になってもその人のだけが切れ、互いに影響しません。同時に、処理能力自体（waitressマルチスレッド）を上げて、ヒューズが本当に切れるべきときだけ切れるようにします。",points:["<b>ユーザー単位</b>：管理者はセッションID、受講者はログインセッションごとに独立してレート制限し、クラス/グループ全体で入口を共有しても互いに影響しません。","<b>管理バックエンドはより緩やか</b>：削除、パスワードリセットなどの操作はユーザーごとに独立した割り当てで、バッチ処理でも「操作が多すぎます」を誤検知しません。","<b>本番級起動</b>：デフォルトでwaitressマルチスレッドサービス+高接続上限、多数の同時ログインでもダウンせず、ローカルネットワークから直接接続可能。"],stats:[["ユーザーごとに独立","レート制限をユーザー単位に","管理者・受講者互いに影響しない"],["waitress","本番級マルチスレッドサービス","授業中の同時ログインでもダウンしない"],["30秒","バックエンドの自動更新間隔","リクエスト量が半分に"]]},
{date:"2026-08-05",tag:"opt",tagText:"最適化",title:"管理画面のセキュリティ強化：一人一鍵、権限を明確に",desc:"管理画面の認証を全面的にアップグレードしました。各管理者はログイン後、専用のセッション認証情報を取得し、共通の「マスターキー」は廃止。鍵の交換、管理者の削除、紹介コードの管理などの機密操作は、メイン管理者本人のみが実行できます。",overview:"管理画面のセキュリティモデルは「共通鍵を全員で共有」から「一人一鍵」へアップグレードされました。従来は、全管理者が同じ共通鍵を取得し、誰でもその鍵で最上位の操作ができ、まるで社内の全員が同じ玄関の鍵を持っているような状態でした。現在は、ログインのたびに専用のセッション認証情報が発行され、本人の身元に紐づくため、他人のふりはできません。共通鍵の交換、管理者アカウントの削除、紹介コードの管理といった機密操作は、メイン管理者本人のみが実行でき、管理者のパスワードがリセットまたはロールバックされた場合、そのアカウントの既存セッションは直ちに無効になり、再ログインが必要です。",thinking:"セキュリティ強化の出発点は「最小権限」です。すべての管理者が最上位の権限を持つ必要はありません。セッションを身元に紐づけることで、管理画面での機密操作は必ず特定の人物に追跡できます。パスワード変更で即無効にすることで、アカウント漏えいの被害を最小限に抑えます。セキュリティは一度きりのパッチではなく、継続的に進化する基盤です。",points:["<b>一人一鍵</b>：ログインのたびに専用のセッション認証情報を発行し、身元に紐づけます。共通鍵は廃止され、他人のふりはできません。","<b>権限の明確化</b>：鍵の交換、管理者の削除、紹介コードの管理はメイン管理者本人のみが実行可能で、一般管理者には権限がありません。","<b>パスワード変更で即無効</b>：管理者のパスワードがリセットまたはロールバックされると、既存セッションは直ちに無効になり、再ログインが必要です。"],stats:[["1人1鍵","専用セッション認証","共通鍵を廃止"],["メイン管理者のみ","機密操作権限","鍵交換・管理者削除・紹介コード"],["即無効","パスワード変更後の旧セッション","再ログインが必要"]]},
{date:"2026-08-05",tag:"opt",tagText:"最適化",title:"誤答集のページめくり：1ページ5問、探す手間を大幅削減",desc:"誤答集でページめくりが可能に——各ページに誤答5問、下部の前へ/次へボタンで自由に移動。詳細ページから戻ると元のページを維持します。",overview:"誤答が増えて1画面に収まらず、特定の問題を探すのに最初からめくる必要がありました。今回、誤答集をページめくり式に変更：各ページに5問、下部に「前へ / x / y ページ / 次へ」コントロールで自由に移動でき、現在のページが一目瞭然。最初または最後のページではボタンが自動的に無効になり、ページ番号が範囲外になると自動修正。詳細ページからリストに戻ると元のページを維持——問題を確認した後も、元の位置に戻れます。",thinking:"誤答集は復習の主戦場。問題が増えると「探す」ことが負担になります。ページめくりは最もシンプルで馴染みのある方法：1ページ5問がちょうど1画面に収まり、ページ番号も明確で位置を把握しやすい。「戻ってもページ維持」という細部が、「問題を開いて解説を見て、閉じて続きをめくる」という復習の流れを途切れさせません。",points:["<b>1ページ5問</b>：誤答を解答時間順に分割、各5問ずつで画面がすっきり。","<b>ページめくりコントロール</b>：前へ/次へ + ページ番号表示。最初と最後のページではボタンが自動的に無効になり、範囲外ページ番号は自動修正。","<b>戻ってもページ維持</b>：詳細ページから戻ると元のページを維持し、再度探す必要がありません。"],stats:[["5","1ページの誤答数","解答時間順"],["x / y","ページ番号を即時表示","最初と最後のページではボタン自動無効"],["1箇所","戻ってもページ維持","詳細ページから戻っても位置を失わない"]]},
{date:"2026-08-05",tag:"new",tagText:"新機能",title:"適応型ステップアップ：ナレッジグラフ点灯システム",desc:"適応型問題演習が全面アップグレード——システムがカテゴリごとに葉単位で出題（各葉5問：選択3問＋穴埋め2問）、連続3問正解でその知識ポイントを点灯；29の知識ポイント＋7大カテゴリ＋ルートノードを順次点灯し、複数ラウンドの積み重ねでグラフ全体が点灯します。",overview:"適応型ステップアップはプラットフォームの中核機能で、今回「何が必要か推測する」を「見えるナレッジグラフ点灯」に変えました。システムは最初のカテゴリから始め、知識ポイントごとに出題——各知識ポイントで連続5問（選択3問＋穴埋め2問、選択を先に）；連続3問正解（各問の間隔2分以内）でその知識ポイントを点灯し残りの問題をスキップ、5問全問正解でも点灯；さらに同類問題を累計10問正解（自主練習や模擬テストも含む）でも点灯します。点灯した知識ポイントは恒久保存——29の知識ポイントが全て点灯すると、7大カテゴリが順に点灯し、最終的にグラフ全体が点灯します。1ラウンド最大145問、完了後グラフ画面に戻り再スタート。",thinking:"従来のレコメンドエンジンはブラックボックスで、なぜこの問題が出るか分かりませんでした。点灯グラフは「適応」を目に見える成長に変えました。各知識ポイントはグラフ上のランプで、3問連続正解で灯ります。点灯ルールは意図的に寛容に——連続正解（総合正解率ではなく）、間隔2分以内（放置防止）、累積正解もカウント（多様な練習方法を承認）し、異なる学習習慣を持つ人も自分のグラフを点灯できます。",points:["<b>二重ループ出題</b>：カテゴリ → 知識ポイントを順次進行、各知識ポイントで連続5問（選択3問＋穴埋め2問、選択を先に）。","<b>3つの点灯方法</b>：連続3問正解（間隔2分以内）で点灯＆問題スキップ / 5問全問正解で点灯 / 累計10問正解で点灯。","<b>進捗の可視化</b>：知識ポイント内でx/10の進捗表示、カテゴリでx/yの点灯数表示、ルートノードでx/7表示。","<b>1ラウンドのサイクル</b>：1ラウンド最大145問、完了後点灯状態を保持してグラフに戻り、新たなラウンドを開始。"],stats:[["29","知識ポイントグラフ","点灯後7大カテゴリを順次点灯"],["5","知識ポイントごとの連続出題","選択3問＋穴埋め2問"],["145","1ラウンド最大問題数","完了後新たなラウンドを開始"]]},
{date:"2026-08-04",tag:"new",tagText:"新機能",title:"サイト全体で 6 言語対応開始",desc:"右上の言語ボタンをドロップダウンにアップグレード。簡体中文、繁體中文、English、日本語、हिन्दी、Português の 6 言語をワンクリックで切り替え。全ページのテキストと更新情報をすべて翻訳。",overview:"プラットフォームは世界中のユーザーを対象に：右上に言語ドロップダウンを追加し、6 言語を自由に切り替え、設定は自動で記憶。すべてのページのテキスト、ボタン、ヒント、そして「私たちについて」の全更新情報を完全に翻訳しました——言語を切り替えると、対応する言語の完全な内容を確認できます。",thinking:"言語は製品の境界です。これまで日中バイリンガルでしたが、現在は 6 言語に拡張し、より広いユーザー層をカバーします——テキストを翻訳するだけでなく、製品全体（動的コンテンツを含む）を切り替え可能にします。",points:["<b>6 言語ドロップダウン</b>：右上の「言語」メニューで 6 言語をワンクリック切り替え、設定は自動で記憶。","<b>全サイト翻訳</b>：7 ページのすべてのテキスト、ボタン、ヒントを完全翻訳。","<b>更新情報も翻訳</b>：「私たちについて」の各更新情報に 6 言語バージョンを提供。"],stats:[["6","言語対応","簡体中文 · 繁體中文 · English · 日本語 · हिन्दी · Português"],["7","ページ全量翻訳"],["14","件の更新情報を 6 言語で"]]},
{date:"2026-08-04",tag:"opt",tagText:"最適化",title:"公式ナレッジグラフ分類体系が登場",desc:"問題ページの分類が公式設計に完全対応：7 大分類 × 29 サブタグ。問題文にサブタグ名を直接表示。全問の難易度を公式星評価で統一（1 星＝簡単 / 2 星＝普通 / 3 星＝難しい）。",overview:"分類は問題集の基盤です。今回、問題ページの分類フィルタと問題タグを、チームが設計した公式ナレッジグラフに合わせました：7 大分類（挿入・更新・削除、テーブル定義、関数、テーブル結合、制約、サブクエリ、クエリ）の下に 29 のサブタグがあります。問題文の分類タグは内部コードから公式サブタグ名（「内部結合」「ウィンドウ関数」など）に変更され、一目で何を問うているか分かります。同時に全問の難易度を公式星評価に統一し、フィルタと並べ替えに一貫した基準ができました。",thinking:"分類タグはユーザーが問題集を読む最初のインデックスです。以前は問題文に内部コードが表示され、ユーザーには認識できませんでした。今回、チーム設計の公式グラフに統一し、階層ドリルダウン、タグの可読性、難易度の基準を確立しました。分類体系の安定は、今後のパーソナライズ推薦や学習統計が「何を学んでいるか」を明確にする前提です。",points:["<b>公式 29 サブタグ</b>：7 大分類の下に 29 サブタグ（内部結合、ウィンドウ関数、スカラサブクエリなど）。フィルタは段階的にドリルダウンします。","<b>問題文にサブタグ表示</b>：各問題カードの分類タグに公式サブタグ名を表示し、技術コードは非表示。","<b>星評価の統一</b>：1 星＝簡単、2 星＝普通、3 星＝難しい。全 457+ 問の難易度をタグの星評価に合わせて再調整。"],stats:[["7","大分類","DML・DDL・関数・テーブル結合・制約・サブクエリ・SELECT"],["29","公式サブタグ"],["457+","星評価で難易度調整","1 星＝簡単 / 2 星＝普通 / 3 星＝難しい"]]},
{date:"2026-08-04",tag:"new",tagText:"新機能",title:"パスワードを忘れた？チームで再設定",desc:"パスワードを忘れても再登録は不要。チーム管理者に連絡すればリセットでき、新しいパスワードはすぐ有効。毎回のリセットは自動的に記録され、段階的なロールバックで誤操作を防止します。",overview:"以前はパスワードを忘れると再登録しかなく、アカウントと学習記録が失われていました。今回、プラットフォームはチームによる再設定をサポート：管理者に連絡して身元を確認すればパスワードをリセットでき、新しいパスワードはすぐ有効、アカウントと学習データはそのまま保持されます。毎回のリセットでは古いパスワードが自動的に記録され、段階的なロールバックが可能で、誤操作による損失を防ぎます。",thinking:"パスワードを忘れたときに最も怖いのは「アカウントを取り戻せない」ことです。パスワード再設定の本質は「あなたがあなたであることを誰かが証明できる」こと。私たちはこれをチーム管理者に委ねます：身元確認後に再設定を支援し、プロセスは記録され、ロールバック可能で、スムーズかつ可逆的です。",points:["<b>パスワードを忘れたら再設定可能</b>：チーム管理者に連絡すればリセット、新しいパスワードはすぐ有効、再登録やデータ損失は不要。","<b>記録とロールバック</b>：リセット前の古いパスワードは自動記録、最大 3 回までロールバックでき、誤操作も復元可能。","<b>管理者の二重認証</b>：再設定には管理者のアカウントパスワードと共通キーの二重認証が必要。パスワードは信頼できる人にのみ任せられます。"],stats:[["1 ステップ","管理者に連絡してリセット","身元確認後、新しいパスワードがすぐ有効"],["3 回","ロールバック保護の上限","毎回のリセットは自動記録され、段階的にロールバック可能"],["2 重","管理者操作の認証","アカウントパスワード + 共通キー"]]},
{date:"2026-08-04",tag:"new",tagText:"新機能",title:"本物の SQL 採点エンジンが登場",desc:"穴埋め問題はもはやテキスト比較ではありません。回答を実際のデータベースで実行し、標準回答の結果セットと行ごとに比較します。間違い時には「テーブルが存在しない」「構文エラー」などの具体的なヒントを表示します。",overview:"従来の穴埋め問題は文字列の類似度で採点していましたが、同じ文の異なる正しい書き方が誤判定される可能性がありました。新しいエンジンでは、インメモリデータベースに問題環境（テーブル構造とデータ）を実際に再構築し、ユーザーの SQL と標準回答をそれぞれ実行して結果セットを比較します。列順序、行順序、COUNT(*) と COUNT(非NULL列) などの意味的に等価な書き方を正確に正解と判定します。実行時エラーが発生した場合は「テーブルが存在しない」「列が存在しない」「構文エラー」などの具体的な理由を直接表示し、ユーザーがどこで間違えたかを知らせます。",thinking:"採点の最低ラインは「あなたの回答が実際にその結果を出せるか」です。テキスト比較はどれだけ賢くても近似に過ぎません。私たちは採点を実際の実行へと進めました—結果セットが一致して初めて正解です。この変更により、穴埋め問題は「答えを暗記する」から「実際に検証する」へと変わり、エラーメッセージも学習フィードバックの一部となりました。",points:["<b>結果セット比較</b>: 採点は「実際に実行された結果」に基づき、テキスト類似度ではありません—等価な書き方も誤判定されません。","<b>実際の実行環境</b>: 各問題は、問題に付属するテーブル構造とデータをインメモリデータベースに再構築し、実データベースと同じ動作をします。","<b>エラーはフィードバック</b>: 構文エラー、テーブル/列が存在しないなどの実行エラーをユーザーに直接表示し、間違いから学べます。","<b>読み取り専用で安全</b>: 単一の SELECT / WITH などの読み取り専用ステートメントのみ許可し、書き込み系ステートメントによる採点環境の破壊を防ぎます。"],stats:[["2ms","1問あたりの採点時間"],["3種類","一般的なエラーメッセージ","テーブルが存在しない · 列が存在しない · 構文エラー"],["多数","等価な書き方のテスト"]]},
{date:"2026-08-04",tag:"new",tagText:"新機能",title:"サイト全体で日中バイリンガル対応開始",desc:"ポータル、私たちについて、ログイン/登録、問題ページのすべてで日中切り替えが可能。右上のボタンでワンクリック切り替え、設定は自動で記憶されます。",overview:"プラットフォームはより広いユーザー層を対象とし、4つのページすべてがバイリンガル対応しました：ページのテキスト、入力欄のプレースホルダー、フォーム検証メッセージ、パスワード強度、操作フィードバックがすべて翻訳システムを通ります。右上の言語ボタンでワンクリック切り替え、設定は保存され次回自動適用。更新情報などの長いコンテンツも完全な英語版が提供されます。",thinking:"優れた製品は、より多くの人が障壁なく使えるべきです。言語は単にテキストを翻訳するだけでなく、インタラクションの流れ（ヒント、フィードバック、コンテンツ）全体を切り替え可能にすること。そのために、軽量な翻訳メカニズムを統一し、新しいページは自動的に組み込まれます。",points:["<b>全体的なカバレッジ</b>：ページテキスト、プレースホルダー、検証メッセージ、トースト通知がすべてバイリンガル。","<b>ワンクリック切り替え</b>：右上の言語ボタン、設定はローカルに記憶され、即時反映。","<b>コンテンツもバイリンガル</b>：更新情報や機能説明などの長文コンテンツにも英語版を提供。"],stats:[["4+","ページがバイリンガル対応","ポータル・私たちについて・ログイン/登録・問題ページ"],["300+","翻訳エントリ"],["1 クリック","即時切り替え"]]},
{date:"2026-08-04",tag:"new",tagText:"新機能",title:"チーム管理バックエンドをリリース",desc:"チームコラボレーション機能をリリース：管理バックエンド、管理者アカウント体系、同僚のオンラインステータス、ユーザーパスワード管理（リセット+ロールバック）。ログインと機密操作は二重認証で保護します。",overview:"プラットフォームはチーム運用に移行：管理者はチーム招待を通じて専用アカウントを登録できます。管理バックエンドへのログインにはアカウントパスワードと統一キーの二重認証が必要です。管理者パネルでは、同僚の最終ログイン時間の表示、プラットフォームのユーザーパスワードの管理（リセットと誤操作防止のための最大3回のロールバック）をサポートします。チーム招待方法やセキュリティキーなどの機密情報はここでは公開しません。",thinking:"チームコラボレーションの前提は、安全性と制御可能性です。ログインの二重認証、パスワードのロールバックなどの設計は、「誰かが管理できる」ということを安全で、可逆的で、誤操作を引き起こしにくくするためのものです。",points:["<b>二重認証</b>：管理バックエンドへのログインには、管理者のアカウントパスワード+統一キーの二重チェックが必要で、アカウント漏洩を防ぎます。","<b>同僚のオンライン</b>：管理者パネルに他の管理者の最終ログイン時間をリアルタイムに表示します。","<b>パスワード管理</b>：プラットフォームのユーザーパスワードのリセットをサポートし、誤操作を防ぐために最大3回のロールバックを保持します。","<b>記録の分離</b>：パスワード履歴はアカウントタイプごとに独立して管理され、相互に干渉しません。"],stats:[["2 重","ログイン認証","管理者アカウントパスワード + 統一キー"],["3 回","パスワードロールバック上限","リセットのたびに自動的に記録され、段階的にロールバック可能"],["リアルタイム","同僚のオンライン同期"]]},
{date:"2026-08-04",tag:"opt",tagText:"最適化",title:"セキュリティ強化：ログイン保護のアップグレード",desc:"未ログインユーザーは問題の内容と回答を閲覧できず、ログイン後に練習を開始できます。無効なセッションは自動的にクリーンアップされ、再ログインを促します。",overview:"プラットフォームのコンテンツ保護をアップグレード：問題リスト、問題詳細、回答と解説はすべてログイン後のアクセスが必要です。ゲストはポータル、私たちについて、ログイン/登録ページのみ閲覧できます。問題バンクと学習データの安全性を保証します。",thinking:"問題バンクはプラットフォームの中核資産であり、学習データはユーザー自身のものです。ログイン保護は基本的なハードルであり、今後も権限システムを継続的に改善していきます。",points:["<b>コンテンツ保護</b>：問題、回答、解説関連のAPIはすべてログインチェックが必要です。","<b>セッションガード</b>：セッションが無効になると、ローカル状態を自動的にクリーンアップし、再ログインを促して誤操作を防ぎます。"],stats:[["100%","問題APIのログイン保護"],["自動","無効セッションのクリーンアップ","セッション無効時にローカル状態を自動的にクリアし、再ログインを促します"]]},
{date:"2026-08-03",tag:"new",tagText:"新機能",title:"グラスモーフィズムポータルシステムをリリース",desc:"新しいポータルホームページとログイン/登録ページをリリース。サイト全体で統一されたライトなグラスモーフィズムスタイルを採用し、パスは「ポータル→ログイン→演習」の3段階フローに変更。",overview:"DeepSeek / Codex などの主要なフロントエンドスタイルを参考に、プラットフォーム向けの完全な外部ポータルを構築しました：ブランドポータルホームページ、私たちについての動的ページ、グラスモーフィズムのログイン/登録ページ、そして演習用フロントエンドも同じデザイン言語でリニューアルしました。",thinking:"製品には顔が必要です：ユーザーが最初に見るページが第一印象を決めます。私たちは外部ポータルの磨き上げに専用のラウンドを費やしました。統一されたビジュアル言語により、「ポータル、ログイン、演習」はバラバラなページではなく、一つの完全な製品のように見えます。同時に製品境界を明確にしました：基本的な評価テストは私たちの特徴ではないので、それを削除し、リソースをアダプティブエンジンという主要ラインに集中させます。",points:["<b>ポータルホームページ</b>：左右2カラムレイアウト、左側にブランドコピーとデータ、右側に「プラットフォームへ / 私たちについて」のデュアルエントリーカード。サイト全体で統一されたライトなグラスモーフィズム（すりガラスカード + 浮遊ライトボール + ブルーバイオレットグラデーション）。","<b>ログイン/登録ページ</b>：ログイン/登録タブ、ランダムユーザー名、ランダム安全パスワード、パスワード強度チェックなどのツールを統合。アイコンはすべて Lucide の線形 SVG に変更し、カートゥーン絵文字は使用しません。","<b>演習ページのリニューアル</b>：白背景のインターフェースをグラスモーフィズムにアップグレードし、ナビゲーション、カード、ボタンを完全に統一。基本的な評価テスト機能は正式に廃止し、アダプティブアドバンス、自主練習、過去問テスト、誤答集の4つの主要モジュールに焦点を当てます。","<b>ブランド化</b>：NIDUS ブランドロゴ（透明背景処理）を追加し、フッターテキストからテクノロジースタック情報を削除。"],stats:[["3","ページシステムレベル","ポータル→ログイン→演習の3段階フロー"],["4","ページリニューアル"],["0","CDN 依存"]]},
{date:"2026-08-03",tag:"new",tagText:"新機能",title:"カスタムカスケード分類フィルター",desc:"問題バンクの分類フィルターをホバーカスケードパネルにアップグレード。マウスを大分類の上に置くとサブ分類が表示され、自由に切り替えられ、選択後にワンクリックでクリアできます。",overview:"分類フィルターを従来のドロップダウンボックスから「ホバーカスケード」インタラクションにアップグレードしました。マウスを大分類の上に置くとすぐにその下のサブ分類をプレビューし、分類間を自由に切り替えることができ、旧版のように選択後に柔軟に変更できない問題がなくなりました。",thinking:"最初のドロップダウンボックスはフラットリストで、カテゴリを変更するには「すべて」に戻ってから再選択する必要があり、誤操作率が高く、パスも長かったです。私たちのコアアプローチは、「選択してから変更する」を「先に見てから決定する」に変えることです。フィルターをメニューを見るように簡単にし、ホバーで即プレビュー、離れてもロックされず、選択後にワンクリックで取り消すことができます。フィルターは負担ではなく、問題バンクを探索する入り口であるべきです。",points:["<b>インタラクション方式</b>：ホバーするとサブ分類パネルがポップアップし、マウスを離すとしばらくしてパネルが自動的に閉じます。選択したフィルターは「✕ タグ」としてフィルターバーの右側に表示され、クリックでワンクリッククリアできます。","<b>非ロックの原則</b>：パネルは「プレビューレイヤー」に過ぎず、選択から取り消しまでが連続したアクションです。どのレベルまで見ても、いつでも変更できます。「すべて」に戻る必要はありません。","<b>一貫性</b>：問題タイプ、難易度、カテゴリの3つのフィルターはスタイルと高さが統一され、視覚的に一つのコントロールセットです。"],stats:[["6","新しいスタイルルール"],["5","インタラクション状態","ホバー・展開・収納・選択・クリア"],["200ms","パネル収納遅延"]]},
{date:"2026-08-02",tag:"fix",tagText:"修正",title:"カテゴリ階層フィルタ + 難易度フィルタの修正",desc:"難易度フィルタを全問題に統一適用（静的選択問題を含む）。カテゴリフィルタは知識グラフの階層構造にアップグレードし、ドリルダウンをサポート。",overview:"2つのフィルタ問題を修正：難易度フィルタは以前は一部の問題にのみ適用され、他の問題には全く反応しなかった。カテゴリのドロップダウンはフラットなリストで、知識ポイント間の従属関係を表現できなかった。",thinking:"フィルタの本質は「ユーザーが問題集を薄く読むのを助ける」こと。フラットな29個のタグでは知識ポイント間の関係を伝えられない。知識グラフは既製の階層辞書であり、それを直接フィルタに駆使する：「多テーブル結合」を選ぶと、内部結合、左結合、自己結合も一緒に見る。難易度フィルタの修正は原則の問題：ルールはすべての問題に適用されるか、ルールと呼ばないかのどちらか。",points:["<b>難易度フィルタの統一適用</b>：難易度フィルタを「バックエンドの部分フィルタ」から「フロントエンドの全量統一フィルタ」に変更。問題がどの問題集から来ても、フィルタ結果は同等。","<b>カテゴリの階層化</b>：フィルタオプションは知識グラフの階層関係を直接再利用。大カテゴリを選ぶと自動的に全サブ知識ポイントをカバーし、特定の子ノードを選ぶとそのポイントのみに一致。","<b>静的問題のマッピング</b>：静的選択問題にも知識ノードへのマッピングを確立し、動的問題と同じように階層フィルタに参加。"],stats:[["29個","タグを階層に接続"],["58問","静的問題をフィルタに含める"],["2個","フィルタ問題を修正","難易度フィルタが無効・カテゴリのドリルダウン不可"]]},
{date:"2026-08-02",tag:"bank",tagText:"問題集拡充",title:"牛客 182 問の標準回答をすべて生成",desc:"大規模モデルで問題ごとに回答を生成し、実データベースで実行検証、自動リトライ修正。問題集の総数は507問に増加、筆記試験の過去問50問を公開。",overview:"牛客から収集した182問にはすべて標準回答がありませんでした。「生成-検証-修正」のパイプラインを構築：大規模モデルが問題ごとに回答を書き、データベースで実際に実行し、結果が正しくなければモデルにリトライさせ、最終的に182/182すべてが実行検証を通過。",thinking:"182問に参考回答がないということは、試験問題に回答がないのと同じ。人手で1問ずつ書くのは量が多く、間違いやすい。私たちの考え方は「機械を審判にする」こと：大規模モデルが生成、データベースが検証、不合格ならやり直し。踏んだ坑（型変更で列名も変更、方言の違い、パス互換性）自体が良い実践であり、問題集の質の下限は「各回答が実行可能で再現可能であること」であり、「誰かが見たこと」ではない。",points:["<b>機械で検証可能</b>：各回答はデータベースで実行成功し結果を生成する必要があり、「もっともらしい」だけではダメ。実行結果で人手の抜き取り検査を代替。","<b>自動修正のループ</b>：初回生成後、バッチごとに修正：型変換で列名を誤って変更、MySQL方言でキーワード不足、テーブル作成文が複数ファイルに分散などは、「答えたが実行できない」典型的なケース。","<b>分けて登録</b>：入門/必知必会/人気問題は自主練習（457問に増加）；大手企業の筆記試験過去問は別冊（50問）、練習とテストを分離。"],stats:[["182/182","回答検証通過"],["457","自主練習の総数"],["50","筆記試験の過去問"]]},
{date:"2026-07-31",tag:"opt",tagText:"最適化",title:"知識グラフの再構築をリリース",desc:"グラフを37ノードの3層構造（ルート→7大カテゴリ→29子ノード）にアップグレード。学習パスが一目瞭然、推薦ウェイトを再配置。",overview:"知識グラフを明確な3層構造に再構築：1つのルートノード、7大カテゴリ（追加・削除・更新、テーブル定義、関数、結合、制約、サブクエリ、クエリ）、29の子知識ポイント。グラフは同時にアンロックルールと推薦ウェイトを駆動し、学習パスは読みやすい地図に収束。",thinking:"旧グラフは問題との関連が緩く、ユーザーは「何を学ぶべきか、どこまで学んだか」が分からない。今回の再構築の核心は収束：学習パスを37ノードの地図に収め、7大カテゴリを基盤とし、知識ポイントをその下に配置。同時に推薦ロジックを地図に合わせる - 習得度でウェイトを配分、正答率で進捗を制御。過程で明らかになったアンロックの断絶が最大の収穫：アダプティブシステムで最も恐れるのは、リンクが繋がらず、ユーザーが次のステップに永遠に到達できないこと。",points:["<b>ウェイト再配置</b>：正解した問題のプッシュ優先度を大幅に下げる；未回答の問題を優先的にプッシュ；誤答した問題には×1.5のウェイトで強化練習。","<b>60% 定着ルール</b>：現在の知識ポイントの正答率が60%未満の場合は強制的にその場で練習し、基準に達したら次の知識ポイントをプッシュ。基礎をしっかり固める。","<b>アンロックチェーンの修正</b>：「選択問題に正解しても記述問題はアンロックされない」という旧ロジックの断絶問題を発見 - 初めて発展的な選択問題に正解すると全ての記述問題がアンロックされ、すぐに1問プッシュされるように変更。"],stats:[["37","ノード総数","ルート → 7大カテゴリ → 29子知識ポイント"],["29","知識タグ"],["60%","習得閾値","正答率が60%未満は強制練習"]]},
{date:"2026-07-30",tag:"fix",tagText:"修正",title:"LeetCode 310 問の標準回答を更新",desc:"標準回答を一括更新、295問が実際の実行で期待出力を生成；MySQL方言に翻訳レイヤーを追加、非互換の15問を削除。",overview:"310問に標準回答はあるが実行可能な期待出力がなく、判定機が動作しなかった。回答をデータベースで実際に実行して出力テーブルを生成し、MySQLとSQLiteの方言差を解決；回答自体が誤っていた3問は手動修正。",thinking:"判定機の最低条件は「あなたの回答が本当にその結果を出せるか」。310問の回答をすべてデータベースで実行し、動かなければ原因を調査：方言差は翻訳レイヤーを作成、回答が誤りなら手動修正、どうしても動かない15問は断固削除。問題数は後から補充できるが、「誤判定」はユーザーの信頼を直接損なう - データの品質は量より優先。",points:["<b>実際の実行で期待出力</b>：判定は「実際に実行した結果」と比較し、手書きの参照テーブルではない - 295問が成功。","<b>方言翻訳レイヤー</b>：MySQL固有の構文（enum型、日付フォーマット、フィールド型の違いなど）を移行時に項目ごとに適合。","<b>断固たる削除</b>：正規表現、関数定義などSQLiteで実行できない機能を含む15問は直接削除 - 判定の正確さは問題数より重要。"],stats:[["295","問検証通過"],["15","問断固削除","正規表現/独自関数などSQLiteで実行できない問題タイプ"],["3","問手動修正"]]},

    thinking: 'A rate limiter is a fuse, not a wire: it exists to stop deliberate abuse, and it should never mistake a whole class\'s normal lesson for suspicious behavior. The fix was not to enlarge the quotas but to change what they are counted by — from the IP (which, behind a single entry point, equals the whole platform) back to the person. Every admin and every learner gets their own fuse; when one circuit overloads, only its owner trips. And we also strengthened the carrying capacity itself (waitress multi-threading), so the fuse only blows when it truly should.',

const PER_PAGE = 4;   // 每页条数，功能更新多了可以调大
const TOTAL_PAGES = Math.ceil(UPDATES.length / PER_PAGE);
let page = 1;

function renderUpdates() {
  const start = (page - 1) * PER_PAGE;
  const items = UPDATES.slice(start, start + PER_PAGE);
  // 置顶条目：项目初心，永远在第一页首位（不参与分页）
  const vision = pickVision();
  const visionHtml = `
    <div class="update-item glass origin fade-up" style="animation-delay:0s" onclick="openDetail(-1)">
      <div class="u-date">${vision.date}</div>
      <div class="u-body">
        <div class="u-top"><span class="pin-badge">${t('pinned')}</span><span class="utag ${vision.tag}">${vision.tagText}</span><span class="u-title">${vision.title}</span></div>
        <div class="u-desc">${vision.desc}</div>
        <div class="u-more">${t('view_detail')} <span class="arr">›</span></div>
      </div>
    </div>`;
  const listHtml = items.map((u0, i) => {
    const idx = start + i;
    if (!u0 || !UPDATES_EN[idx]) return '';   // 防御：跳过空洞/缺英文条目，避免整页崩溃
    const u = pick(u0, UPDATES_EN[idx], idx);
    return `
    <div class="update-item glass fade-up" style="animation-delay:${i * 0.06}s" onclick="openDetail(${idx})">
      <div class="u-date">${u.date}</div>
      <div class="u-body">
        <div class="u-top"><span class="utag ${u.tag}">${u.tagText}</span><span class="u-title">${u.title}</span></div>
        <div class="u-desc">${u.desc}</div>
        <div class="u-more">${t('view_detail')} <span class="arr">›</span></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('updateList').innerHTML = visionHtml + listHtml;
  renderPager();
}

function renderPager() {
  const pager = document.getElementById('pager');
  let html = `<span class="pg-info">${tf('pg_info', UPDATES.length + 1, page, TOTAL_PAGES)}</span>`;
  html += `<button class="pg-btn" ${page === 1 ? 'disabled' : ''} onclick="gotoPage(${page - 1})"><span class="arr">‹</span>${t('pg_prev')}</button>`;
  for (let i = 1; i <= TOTAL_PAGES; i++) {
    html += `<button class="pg-btn ${i === page ? 'on' : ''}" onclick="gotoPage(${i})">${i}</button>`;
  }
  html += `<button class="pg-btn" ${page === TOTAL_PAGES ? 'disabled' : ''} onclick="gotoPage(${page + 1})">${t('pg_next')}<span class="arr">›</span></button>`;
  pager.innerHTML = html;
}

function gotoPage(p) {
  if (p < 1 || p > TOTAL_PAGES || p === page) return;
  page = p;
  renderUpdates();
  document.querySelector('.updates').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---- 详情弹窗 ---- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function openDetail(idx) {
  const u = idx === -1 ? pickVision()
                       : (UPDATES[idx] && UPDATES_EN[idx] ? pick(UPDATES[idx], UPDATES_EN[idx], idx) : null);
  if (!u) return;
  document.getElementById('detailBody').innerHTML = `
    <div class="modal-head">
      <div class="modal-title">${u.title}</div>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-meta">
      <span class="utag ${u.tag}">${u.tagText}</span>
      <span class="m-date">${u.date}</span>
    </div>
    <div class="m-section">
      <h4>${t('sec_what')}</h4>
      <div class="m-overview">${u.overview}</div>
    </div>
    <div class="m-section">
      <h4>${t('sec_points')}</h4>
      <ul class="m-points">${u.points.map(p => `<li>${p}</li>`).join('')}</ul>
    </div>
    <div class="m-section">
      <h4>${t('sec_thinking')}</h4>
      <div class="m-overview thinking">${u.thinking}</div>
    </div>
    ${u.stats ? `<div class="m-section"><h4>${t('sec_stats')}</h4><div class="m-stats">${u.stats.map(s =>
      `<div class="m-stat${s[2] ? ' has-tip' : ''}"${s[2] ? ' data-tip="' + esc(s[2]) + '"' : ''}><div class="v">${s[0]}</div><div class="l">${s[1]}</div></div>`
    ).join('')}</div></div>` : ''}
    <div class="modal-foot"><button class="btn-ok" onclick="closeDetail()">${t('got_it')}</button></div>`;
  document.getElementById('detailModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('show');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

renderUpdates();
</script>
