<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL 自适应训练 · 登录</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  :root { --bg: #f5f6f8; --card: #ffffff; --text: #2c3e50; --text2: #7a8599; --border: #e4e7ed; --accent: #5a7d9a; --accent-hover: #4a6a82; --tag-bg: #eef1f5; --err: #c0392b; --ok: #27ae60; --warn: #e67e22; }
  * { box-sizing: border-box; }
  body { background: var(--bg); font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--text); margin: 0; padding: 0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 38px; padding: 0 1rem; font-family: inherit; font-size: 0.8rem; font-weight: 600; border-radius: 0.375rem; border: 1px solid transparent; cursor: pointer; transition: all 0.12s; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-hover); }
  .btn-accent:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { background: var(--tag-bg); }
  .input-field { width:100%; height:38px; padding:0 2.25rem 0 0.75rem; font-family:inherit; font-size:0.8rem; color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:0.375rem; outline:none; transition:border-color 0.15s; }
  .input-field:focus { border-color:var(--accent); }
  .input-wrap { position: relative; }
  .input-wrap .input-field { width: 100%; }
  .input-wrap .input-icon { position: absolute; right: 0; top: 0; height: 38px; width: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); font-size: 0.85rem; border: none; background: none; transition: color 0.12s; }
  .input-wrap .input-icon:hover { color: var(--accent); }
  hr { border: 0; border-top: 2px solid var(--border); margin: 0.75rem 0; }
  .text-xs { font-size:0.65rem; }
  .text-sm { font-size:0.75rem; }
  .text-center { text-align:center; }
  .mb-1 { margin-bottom:0.25rem; }
  .mb-3 { margin-bottom:0.75rem; }
  .mb-4 { margin-bottom:1rem; }
  .mt-4 { margin-top:1rem; }
  .space-y-2 > * + * { margin-top:0.5rem; }
  .opacity-40 { opacity:0.4; }
  .opacity-50 { opacity:0.5; }
  .opacity-70 { opacity:0.7; }
  .block { display:block; }
  .w-full { width:100%; }
  .mr-1 { margin-right:0.25rem; }
  .font-bold { font-weight:600; }
  .flex { display: flex; }
  .gap-2 { gap: 0.5rem; }
  /* 密码强度条 */
  .strength-bar { height: 3px; border-radius: 2px; margin-top: 0.35rem; background: #e0e0e0; overflow: hidden; transition: all 0.25s; }
  .strength-bar .fill { height: 100%; width: 0; transition: width 0.3s, background 0.3s; }
  .strength-label { font-size: 0.6rem; margin-top: 0.15rem; }
  /* 规则检查列表 */
  .rule-list { margin-top: 0.4rem; }
  .rule-item { font-size: 0.6rem; color: var(--text2); display: flex; align-items: center; gap: 0.3rem; margin-bottom: 0.1rem; transition: color 0.2s; }
  .rule-item.pass { color: var(--ok); }
  .rule-item i { font-size: 0.55rem; width: 10px; text-align: center; }
  /* 确认密码匹配 */
  .confirm-match { font-size: 0.6rem; margin-top: 0.2rem; }
  .confirm-match.match { color: var(--ok); }
  .confirm-match.mismatch { color: var(--err); }
  .name-hint { font-size: 0.6rem; color: var(--err); margin-top: 0.15rem; display: none; }
</style>
</head>
<body class="p-4">
<div class="card p-6 md:p-8" style="max-width:400px;width:100%">

  <div class="text-center mb-1">
    <div><span style="font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:1.5rem;letter-spacing:0.02em;">SQL</span><span style="font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:1.5rem;letter-spacing:0.02em;color:var(--accent);"> 自适应训练</span></div>
    <div style="font-size:0.6rem;color:var(--text2);">DIAGNOSTIC · PRACTICE</div>
  </div>
  <hr>

  <!-- 登录 / 注册 选项卡 -->
  <div class="flex gap-2 mb-4" style="background:var(--tag-bg);border-radius:0.375rem;padding:3px">
    <button class="btn w-full" id="tabLogin" onclick="switchTab('login')" style="height:32px;font-size:0.75rem;font-weight:600;border-radius:0.25rem;background:var(--accent);color:#fff;border:none;cursor:pointer;">登录</button>
    <button class="btn w-full" id="tabRegister" onclick="switchTab('register')" style="height:32px;font-size:0.75rem;font-weight:600;border-radius:0.25rem;background:transparent;color:var(--text2);border:none;cursor:pointer;">注册</button>
  </div>

  <!-- 用户名 -->
  <div class="mb-3">
    <label class="text-xs font-bold opacity-60 block mb-1">用户名</label>
    <div class="input-wrap">
      <input class="input-field" id="username" placeholder="输入你的名字" autocomplete="off" oninput="onUsernameInput()" onblur="checkUsernameDuplicate()">
      <button class="input-icon" id="usernameDice" title="随机用户名" onclick="randomUsername()" style="display:none"><i class="fas fa-dice"></i></button>
    </div>
    <div class="name-hint" id="nameHint">该用户名已被占用，试试点击 🎲 生成</div>
  </div>

  <!-- 密码 -->
  <div class="mb-3">
    <label class="text-xs font-bold opacity-60 block mb-1">密码</label>
    <div class="input-wrap">
      <input class="input-field" id="password" type="password" maxlength="16" placeholder="8-16位，含大小写+数字" autocomplete="new-password" oninput="onPasswordInput()">
      <button class="input-icon" style="right:32px;" title="显示/隐藏密码" onclick="togglePwd()"><i class="fas fa-eye" id="pwdToggleIcon"></i></button>
      <button class="input-icon" id="passwordDice" title="随机安全密码" onclick="randomPassword()" style="display:none"><i class="fas fa-dice"></i></button>
    </div>
    <!-- 强度条 -->
    <div class="strength-bar" id="strengthBar"><div class="fill" id="strengthFill"></div></div>
    <div class="strength-label" id="strengthLabel"></div>
    <!-- 规则检查 -->
    <div class="rule-list" id="ruleList" style="display:none">
      <div class="rule-item" id="ruleLen"><i class="fas fa-circle"></i> 8-16 个字符</div>
      <div class="rule-item" id="ruleUpper"><i class="fas fa-circle"></i> 包含大写字母</div>
      <div class="rule-item" id="ruleLower"><i class="fas fa-circle"></i> 包含小写字母</div>
      <div class="rule-item" id="ruleDigit"><i class="fas fa-circle"></i> 包含数字</div>
      <div class="rule-item" id="ruleSpecial"><i class="fas fa-circle"></i> 包含特殊字符（推荐）</div>
    </div>
  </div>

  <!-- 注册专属：确认密码 -->
  <div class="mb-3" id="confirmGroup" style="display:none">
    <label class="text-xs font-bold opacity-60 block mb-1">确认密码</label>
    <div class="input-wrap">
      <input class="input-field" id="confirmPassword" type="password" maxlength="16" placeholder="再次输入密码" autocomplete="new-password" oninput="checkConfirmMatch();updateRegisterBtn()">
      <button class="input-icon" title="显示/隐藏密码" onclick="toggleConfirmPwd()"><i class="fas fa-eye" id="confirmToggleIcon"></i></button>
    </div>
    <div class="confirm-match" id="confirmHint"></div>
  </div>

  <!-- 登录按钮区 -->
  <div id="actionLogin" class="space-y-2" style="margin-top:1.5rem;">
    <button class="btn btn-accent w-full" id="loginBtn" onclick="doLogin()"><i class="fas fa-sign-in-alt mr-1"></i> 登录</button>
    <p class="text-xs text-center opacity-50">还没有账号？<a href="javascript:switchTab('register')" style="color:var(--accent);cursor:pointer;font-weight:600;">立即注册</a></p>
  </div>

  <!-- 注册按钮区 -->
  <div id="actionRegister" class="space-y-2" style="display:none;margin-top:1.5rem;">
    <button class="btn btn-accent w-full" id="registerBtn" onclick="doRegister()" disabled><i class="fas fa-user-plus mr-1"></i> 注册</button>
    <p class="text-xs text-center opacity-50">已有账号？<a href="javascript:switchTab('login')" style="color:var(--accent);cursor:pointer;font-weight:600;">去登录</a></p>
  </div>

</div>

<script>
const API_BASE = '/api';
var currentTab = 'login';
var pwdVisible = false;
var confirmPwdVisible = false;
var usernameDupChecked = false;
var usernameOk = true;

// ===== 选项卡切换 =====
function switchTab(tab) {
  currentTab = tab;
  var isLogin = (tab === 'login');
  document.getElementById('tabLogin').style.background = isLogin ? 'var(--accent)' : 'transparent';
  document.getElementById('tabLogin').style.color = isLogin ? '#fff' : 'var(--text2)';
  document.getElementById('tabRegister').style.background = isLogin ? 'transparent' : 'var(--accent)';
  document.getElementById('tabRegister').style.color = isLogin ? 'var(--text2)' : '#fff';
  document.getElementById('confirmGroup').style.display = isLogin ? 'none' : 'block';
  document.getElementById('actionLogin').style.display = isLogin ? '' : 'none';
  document.getElementById('actionRegister').style.display = isLogin ? 'none' : '';
  document.getElementById('ruleList').style.display = 'none';
  document.getElementById('strengthBar').style.display = isLogin ? 'none' : '';
  document.getElementById('strengthLabel').style.display = isLogin ? 'none' : '';
  document.getElementById('usernameDice').style.display = isLogin ? 'none' : '';
  document.getElementById('passwordDice').style.display = isLogin ? 'none' : '';
  document.getElementById('password').value = '';
  document.getElementById('confirmPassword').value = '';
  document.getElementById('confirmHint').textContent = '';
  document.getElementById('strengthLabel').textContent = '';
  document.getElementById('strengthFill').style.width = '0';
  document.getElementById('nameHint').style.display = 'none';
  usernameDupChecked = false;
  updateRegisterBtn();
}

// ===== 密码显隐切换 =====
function togglePwd() {
  pwdVisible = !pwdVisible;
  var inp = document.getElementById('password');
  var icon = document.getElementById('pwdToggleIcon');
  inp.type = pwdVisible ? 'text' : 'password';
  icon.className = pwdVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
}

function toggleConfirmPwd() {
  confirmPwdVisible = !confirmPwdVisible;
  var inp = document.getElementById('confirmPassword');
  var icon = document.getElementById('confirmToggleIcon');
  inp.type = confirmPwdVisible ? 'text' : 'password';
  icon.className = confirmPwdVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
}

// ===== 随机生成 =====
function randomUsername() {
  var prefixes = ['sql_dev', 'data_fan', 'query_master', 'db_coder', 'analyst'];
  var base = prefixes[Math.floor(Math.random() * prefixes.length)];
  var suffix = Math.floor(Math.random() * 9000 + 1000);
  document.getElementById('username').value = base + suffix;
  usernameDupChecked = false;
  document.getElementById('nameHint').style.display = 'none';
  checkUsernameDuplicate();
}

function randomPassword() {
  var upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  var lower = 'abcdefghjkmnpqrstuvwxyz';
  var digits = '23456789';
  var special = '!@#$%&*';
  var all = upper + lower + digits + special;
  var pwd = '';
  // 确保每类至少一个
  pwd += upper[Math.floor(Math.random() * upper.length)];
  pwd += lower[Math.floor(Math.random() * lower.length)];
  pwd += lower[Math.floor(Math.random() * lower.length)];
  pwd += digits[Math.floor(Math.random() * digits.length)];
  pwd += digits[Math.floor(Math.random() * digits.length)];
  pwd += special[Math.floor(Math.random() * special.length)];
  // 补到16位
  while (pwd.length < 16) {
    pwd += all[Math.floor(Math.random() * all.length)];
  }
  // 打乱顺序
  pwd = pwd.split('').sort(function() { return Math.random() - 0.5; }).join('');
  document.getElementById('password').value = pwd;
  document.getElementById('confirmPassword').value = pwd;
  onPasswordInput();
  checkConfirmMatch();
}

// ===== 用户名输入 & 重复检测 =====
function onUsernameInput() {
  usernameDupChecked = false;
  document.getElementById('nameHint').style.display = 'none';
  usernameOk = true;
  updateRegisterBtn();
}

var _nameCheckTimer = null;
function checkUsernameDuplicate() {
  clearTimeout(_nameCheckTimer);
  _nameCheckTimer = setTimeout(async function() {
    var name = document.getElementById('username').value.trim();
    if (!name || name.length < 2) { usernameOk = true; updateRegisterBtn(); return; }
    try {
      var r = await fetch(API_BASE + '/check-username?name=' + encodeURIComponent(name));
      var data = await r.json();
      usernameOk = !data.exists;
      if (data.exists && currentTab === 'register') {
        document.getElementById('nameHint').style.display = 'block';
      } else {
        document.getElementById('nameHint').style.display = 'none';
      }
    } catch(e) {
      usernameOk = true; // 网络失败不阻止
    }
    updateRegisterBtn();
  }, 500);
}

// ===== 密码强度检测 =====
var WEAK_PASSWORDS = ['password','12345678','123456789','qwerty123','abc12345','password123','admin123','letmein12','welcome01','monkey123','dragon123','master123','123123123','iloveyou1','trustno01','sunshine1','football1','baseball1','qwertyuiop','1q2w3e4r5t'];
function checkPasswordStrength(pwd) {
  if (!pwd) return { score: 0, label: '', color: '#e0e0e0', checks: [false,false,false,false,false] };
  var score = 0;
  var checks = [
    pwd.length >= 8 && pwd.length <= 16,
    /[A-Z]/.test(pwd),
    /[a-z]/.test(pwd),
    /\d/.test(pwd),
    /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(pwd)
  ];
  checks.forEach(function(c) { if (c) score++; });
  // 弱密码黑名单
  if (WEAK_PASSWORDS.indexOf(pwd.toLowerCase()) >= 0) score = Math.min(score, 1);
  // 长度加分
  if (pwd.length >= 12) score = Math.min(5, score + 1);
  var label = score <= 1 ? '弱' : score <= 2 ? '中' : score <= 3 ? '强' : '非常强';
  var color = score <= 1 ? '#c0392b' : score <= 2 ? '#e67e22' : score <= 3 ? '#27ae60' : '#1e8449';
  return { score: score, label: label, color: color, checks: checks };
}

function onPasswordInput() {
  var pwd = document.getElementById('password').value;
  var hasContent = pwd.trim().length > 0;
  var result = checkPasswordStrength(pwd);
  var fill = document.getElementById('strengthFill');
  var label = document.getElementById('strengthLabel');
  var ruleList = document.getElementById('ruleList');
  fill.style.width = (result.score / 5 * 100) + '%';
  fill.style.background = result.color;
  label.textContent = result.label ? '强度：' + result.label : '';
  label.style.color = result.color;
  // 仅注册Tab + 有内容时显示规则列表
  if (currentTab === 'register') {
    ruleList.style.display = hasContent ? '' : 'none';
    document.getElementById('strengthBar').style.display = '';
    document.getElementById('strengthLabel').style.display = '';
  }
  // 更新规则项（特殊字符单独处理）
  var names = ['ruleLen','ruleUpper','ruleLower','ruleDigit','ruleSpecial'];
  var isSpecial = result.checks[4]; // 特殊字符
  for (var i = 0; i < 4; i++) {
    var el = document.getElementById(names[i]);
    if (result.checks[i]) {
      el.classList.add('pass');
      el.querySelector('i').className = 'fas fa-check-circle';
    } else {
      el.classList.remove('pass');
      el.querySelector('i').className = 'fas fa-times-circle';
      el.style.color = '#c0392b';
    }
  }
  // 特殊字符：始终显示，检测到时打勾
  var specEl = document.getElementById('ruleSpecial');
  specEl.style.display = '';
  if (isSpecial) {
    specEl.classList.add('pass');
    specEl.querySelector('i').className = 'fas fa-check-circle';
  } else {
    specEl.classList.remove('pass');
    specEl.querySelector('i').className = 'fas fa-circle';
    specEl.style.color = '';
  }
  checkConfirmMatch();
  updateRegisterBtn();
}

function checkConfirmMatch() {
  var pwd = document.getElementById('password').value;
  var confirm = document.getElementById('confirmPassword').value;
  var hint = document.getElementById('confirmHint');
  if (!confirm) { hint.textContent = ''; hint.className = 'confirm-match'; return; }
  if (pwd === confirm) {
    hint.textContent = '✓ 密码匹配';
    hint.className = 'confirm-match match';
  } else {
    hint.textContent = '✗ 两次输入不一致';
    hint.className = 'confirm-match mismatch';
  }
}

function updateRegisterBtn() {
  var btn = document.getElementById('registerBtn');
  var pwd = document.getElementById('password').value;
  var confirm = document.getElementById('confirmPassword').value;
  var name = document.getElementById('username').value.trim();
  var result = checkPasswordStrength(pwd);
  // 注册条件：用户名≥2位 + 密码≥8位 + 含大小写+数字 + 确认一致 + 用户名不重复（特殊字符可选）
  var hasBasic = pwd.length >= 8 && pwd.length <= 16 && /[A-Z]/.test(pwd) && /[a-z]/.test(pwd) && /\d/.test(pwd);
  var canRegister = name.length >= 2 && hasBasic && pwd === confirm && usernameOk;
  btn.disabled = !canRegister;
}

// ===== 登录 =====
async function doLogin() {
  var name = document.getElementById('username').value.trim();
  var pwd = document.getElementById('password').value.trim();
  if (!name) { alert('请输入用户名'); return; }
  if (!pwd) { alert('请输入密码'); return; }
  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> 登录中...';
  try {
    var r = await fetch(API_BASE + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: name, password: pwd }) });
    var data = await r.json();
    if (data.error) { alert(data.error); btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt mr-1"></i> 登录'; return; }
    storeAndGo(data);
  } catch(e) {
    alert('无法连接后端，请确保后端已启动');
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt mr-1"></i> 登录';
  }
}

// ===== 注册 =====
async function doRegister() {
  var name = document.getElementById('username').value.trim();
  var pwd = document.getElementById('password').value.trim();
  var confirm = document.getElementById('confirmPassword').value.trim();
  if (!name) { alert('请输入用户名'); return; }
  if (pwd.length < 8 || pwd.length > 16) { alert('密码需为8-16个字符'); return; }
  if (pwd !== confirm) { alert('两次输入的密码不一致'); return; }
  var hasBasic = pwd.length >= 8 && pwd.length <= 16 && /[A-Z]/.test(pwd) && /[a-z]/.test(pwd) && /\d/.test(pwd);
  if (!hasBasic) { alert('密码需8-16位，且包含大写字母、小写字母和数字'); return; }
  var btn = document.getElementById('registerBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> 注册中...';
  try {
    var r = await fetch(API_BASE + '/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: name, password: pwd }) });
    var data = await r.json();
    if (data.error) { alert(data.error); btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus mr-1"></i> 注册'; return; }
    storeAndGo(data);
  } catch(e) {
    alert('无法连接后端，请确保后端已启动');
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus mr-1"></i> 注册';
  }
}

function storeAndGo(data) {
  sessionStorage.setItem('sql_user', JSON.stringify({ name: data.username, session_id: data.session_id, loggedIn: true, loginAt: Date.now() }));
  window.location.href = 'index.html?new=1';
}

// 初始化登录Tab（默认） — 隐藏注册专属元素
switchTab('login');
</script>
</body>
</html>
