<script>
const COLORS = [
  '#e94560','#0f3460','#1a8a5c','#f39c12','#8e44ad','#16a085',
  '#2980b9','#d35400','#27ae60','#c0392b','#2c3e50','#f1c40f'
]

let chart = null
let graphData = null
let expanded = {}

function loadGraph() {
  Promise.resolve(EMBEDDED_GRAPH).then(data => {
    graphData = data
        document.getElementById('stat-nodes').textContent = data.nodes.length
        document.getElementById('stat-edges').textContent = data.edges.length
        document.getElementById('stat-content').textContent = data.nodes.filter(n => n.level === 2).length
    renderChart()
  }).catch(e => {
    document.getElementById('loading').innerHTML = '<div style="color:#e94560">加载失败: ' + e.message + '</div>'
  })
}

function buildEChartsData(data, showAll) {
  const catIndex = {}
  const topIdByName = {}
  data.nodes.filter(n => n.level === 1).forEach((n, i) => { catIndex[n.id] = i; topIdByName[n.name] = n.id })

  const visible = new Set()
  visible.add('root')
  data.nodes.filter(n => n.level === 1).forEach(n => visible.add(n.id))

  data.nodes.forEach(n => {
    if (n.level === 2) {
      const parent = data.edges.find(e => e.target === n.id)?.source
      if (parent && (expanded[parent] || showAll)) visible.add(n.id)
    }
  })
  data.nodes.forEach(n => {
    if (n.level === 3) {
      const parent = data.edges.find(e => e.target === n.id)?.source
      if (parent && expanded[parent] && visible.has(parent)) visible.add(n.id)
    }
  })

  const echartsNodes = data.nodes
    .filter(n => visible.has(n.id))
    .map(n => {
      const catId = n.level === 1 ? n.id : (topIdByName[n.parent] ?? null)
      const ci = catId && catIndex[catId] != null ? catIndex[catId] : 0
      const size = n.level === 0 ? 60 : n.level === 1 ? 40 : n.level === 2 ? 22 : 8
      const item = {
        id: n.id,
        name: n.level === 1 ? (expanded[n.id] ? `${n.name} ▾` : `${n.name} ▸`) : (n.level <= 2 ? n.name : ''),
        value: n.name,
        category: ci,
        symbolSize: size,
        label: { show: n.level <= 2, fontSize: n.level === 0 ? 16 : 11, fontWeight: n.level <= 1 ? 'bold' : 'normal' },
        itemStyle: { color: n.level === 0 ? '#e94560' : COLORS[ci % COLORS.length] },
        _raw: n,
      }
      if (n.level === 3) {
        item.symbol = 'circle'
        item.label = { show: false }
      }
      return item
    })

  const echartsEdges = data.edges
    .filter(e => visible.has(e.source) && visible.has(e.target))
    .map(e => ({
      source: e.source,
      target: e.target,
      lineStyle: { width: 0.5, opacity: 0.3, curveness: 0.2 },
    }))

  const categories = data.nodes.filter(n => n.level === 1).map((n, i) => ({
    name: n.name,
    itemStyle: { color: COLORS[i % COLORS.length] },
  }))

  return { nodes: echartsNodes, edges: echartsEdges, categories }
}

function buildOption(showAll) {
  const { nodes, edges, categories } = buildEChartsData(graphData, showAll)

  return {
    title: { show: false },
    tooltip: {
      trigger: 'item',
      formatter: (params) => {
        const raw = params.data?._raw
        if (!raw) return params.name
        let html = `<b>${raw.name}</b>`
        if (raw.level === 0) {
          html += `<br/>${graphData.root.brief}`
          html += `<br/>浏览量: ${graphData.root.views}`
        }
        if (raw.level === 1) {
          const count = graphData.nodes.filter(n => n.level === 2 && n.parent === raw.name).length
          html += `<br/>子分类: ${count}`
          html += `<br/><span style="color:#64b5f6">点击展开/收起子分类</span>`
        }
        if (raw.level === 2) {
          html += `<br/>父分类: ${raw.parent || '-'}`
        }
        if (raw.level === 3) {
          html += `<br/>所属: ${raw.parent || '-'}`
          if (raw.url) html += `<br/><a href="${raw.url}" target="_blank">打开原文 →</a>`
        }
        return html
      },
    },
    series: [{
      type: 'graph',
      layout: 'force',
      animation: true,
      roam: true,
      draggable: true,
      data: nodes,
      edges: edges,
      categories: categories,
      focusNodeAdjacency: true,
      edgeSymbol: ['none', 'none'],
      force: {
        repulsion: 600,
        edgeLength: [80, 250],
        layoutAnimation: false,
        gravity: 0.1,
        friction: 0.1,
      },
      lineStyle: { color: 'source', opacity: 0.2, width: 0.5 },
      label: { position: 'top', color: '#333' },
      emphasis: {
        focus: 'adjacency',
        lineStyle: { width: 2, opacity: 0.8 },
      },
    }],
  }
}

function renderChart() {
  const dom = document.getElementById('chart')
  chart = echarts.init(dom)
  window.addEventListener('resize', () => chart.resize())

  chart.setOption(buildOption(false))
  chart.on('click', (params) => {
    const raw = params.data?._raw
    if (!raw) return
    if (raw.level === 1) {
      expanded[raw.id] = !expanded[raw.id]
      chart.setOption(buildOption(false), true)
    } else if (raw.level === 3 && raw.url) {
      window.open(raw.url, '_blank')
    }
  })

  // Build legend
  const legend = document.getElementById('legend')
  legend.innerHTML = '<div style="font-weight:600;font-size:13px;margin-bottom:6px;color:#333">图谱分类</div>'
  graphData.nodes.filter(n => n.level === 1).forEach((n, i) => {
    const count = graphData.nodes.filter(x => x.level === 2 && x.parent === n.name).length
    const div = document.createElement('div')
    div.className = 'l-item'
    div.innerHTML = `<span class="l-dot" style="background:${COLORS[i % COLORS.length]}"></span><span class="l-name">${n.name}</span><span class="l-count">${count} 子分类</span>`
    div.onclick = () => {
      expanded[n.id] = !expanded[n.id]
      chart.setOption(buildOption(false), true)
    }
    legend.appendChild(div)
  })

  document.getElementById('loading').style.display = 'none'
}

function toggleExpand(nodeId) {
  if (expanded.hasOwnProperty(nodeId) === false) expanded[nodeId] = false
  expanded[nodeId] = !expanded[nodeId]
  chart.setOption(buildOption(false), true)
}

function toggleCollapse() {
  const level1 = graphData.nodes.filter(n => n.level === 1)
  const allExpanded = level1.every(n => expanded[n.id])
  level1.forEach(n => { expanded[n.id] = !allExpanded })
  chart.setOption(buildOption(allExpanded), true)
}

function resetView() {
  expanded = {}
  chart.setOption(buildOption(false), true)
  chart.dispatchAction({ type: 'restore' })
}

loadGraph()
</script>
</body>
</html>
