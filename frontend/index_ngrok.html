<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 自适应练习</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  :root { --bg: #f5f6f8; --card: #ffffff; --text: #2c3e50; --text2: #7a8599; --border: #e4e7ed; --accent: #5a7d9a; --accent-hover: #4a6a82; --tag-bg: #eef1f5; --code-bg: #f0f2f5; --success: #6b9e7a; --error: #c97a7a; }
  * { box-sizing: border-box; }
  body { background: var(--bg); font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--text); margin: 0; padding: 0; line-height: 1.5; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; }
  .tag { display: inline-block; background: var(--tag-bg); color: var(--text2); font-size: 0.65rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 0.25rem; }
  .tag-easy { background: #eaf4ee; color: #5a8f6a; }
  .tag-medium { background: #f0eddf; color: #8a7a4a; }
  .tag-hard { background: #f0e4e4; color: #b06060; }
  .schema-box { background: var(--code-bg); color: var(--text); padding: 0.75rem 1rem; border-radius: 0.375rem; font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.75rem; line-height: 1.6; margin: 0.75rem 0; white-space: pre-wrap; overflow-x: auto; border: 1px solid var(--border); }
  .code-input { width: 100%; min-height: 72px; padding: 0.6rem 0.75rem; font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.8rem; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 0.375rem; outline: none; resize: vertical; transition: border-color 0.15s; }
  .code-input:focus { border-color: var(--accent); }
  .option-btn { display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--card); cursor: pointer; text-align: left; font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.75rem; color: var(--text); transition: all 0.12s; }
  .option-btn:hover { border-color: var(--accent); background: #f8fafc; }
  .option-btn.selected { border-color: var(--accent); background: #edf2f7; }
  .option-btn.correct { border-color: var(--success); background: #eaf4ee; }
  .option-btn.wrong { border-color: var(--error); background: #f5ebeb; }
  .result-box { margin-top: 0.75rem; padding: 0.75rem; border-radius: 0.375rem; font-size: 0.8rem; }
  .result-box.correct { background: #eaf4ee; border: 1px solid #c8dfce; color: #3d7a4d; }
  .result-box.wrong { background: #f5ebeb; border: 1px solid #e4c8c8; color: #8a4040; }
  .result-box .explanation { margin-top: 0.4rem; color: var(--text2); font-size: 0.75rem; }
  .progress-track { height: 3px; background: var(--border); margin: 0.75rem 0; overflow: hidden; border-radius: 2px; }
  .progress-track .fill { height: 100%; background: var(--accent); transition: width 0.4s; }
  .filter-bar select { height: 34px; padding: 0 0.5rem; font-family: inherit; font-size: 0.75rem; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 0.375rem; outline: none; }
  .filter-bar select:focus { border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 1rem; font-family: inherit; font-size: 0.75rem; font-weight: 600; border-radius: 0.375rem; border: 1px solid transparent; cursor: pointer; transition: all 0.12s; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-secondary:hover:not(:disabled) { background: var(--tag-bg); }
  .question-item { cursor: pointer; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.375rem; margin-bottom: 0.5rem; transition: border-color 0.12s; }
  .question-item:hover { border-color: var(--accent); }
  .question-item h3 { font-size: 0.85rem; margin: 0 0 0.2rem 0; font-weight: 600; }
  .question-item p { font-size: 0.7rem; color: var(--text2); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #questionDetail { display: none; }
  #questionDetail.visible { display: block; }
  .back-link { font-size: 0.7rem; color: var(--accent); cursor: pointer; margin-bottom: 0.75rem; display: inline-block; }
  .back-link:hover { text-decoration: underline; }
  .page { display: none; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.25s ease; }
  .nav-btn { padding: 0.5rem 0.75rem; font-family: inherit; font-size: 0.75rem; font-weight: 600; color: var(--text2); cursor: pointer; border: none; background: none; transition: all 0.12s; border-radius: 0.375rem; }
  .nav-btn:hover { color: var(--text); background: var(--tag-bg); }
  .nav-btn.active { color: var(--accent); background: #edf2f7; }
  .graph-node { display:inline-flex; align-items:center; gap:3px; padding:3px 7px; border-radius:4px; font-size:0.6rem; font-weight:600; border:1px solid var(--border); background:var(--card); color:var(--text2); transition:all 0.15s; font-family:'SF Mono','Consolas',monospace; }
  .graph-node i { font-size: 0.55rem; }
  .opt-explain { font-size: 0.7rem; padding: 0.4rem 0.6rem; border-radius: 0.375rem; margin-bottom: 2px; display: flex; align-items: flex-start; gap: 6px; }
  .opt-explain .mark { flex-shrink: 0; font-weight: 700; font-size: 0.85rem; }
  .graph-node.mastered { border-color:var(--success); background:#eaf4ee; color:var(--success); }
  .graph-node.current { border-color:var(--accent); background:#edf2f7; color:var(--accent); }
  .graph-node.locked { opacity:0.4; }
  .data-table { margin:0 0 0.5rem 0; border-collapse:collapse; font-size:0.7rem; font-family:'SF Mono','Consolas',monospace; }
  .data-table th { background:var(--text); color:#fff; padding:0.3rem 0.5rem; text-align:left; font-weight:600; }
  .data-table td { padding:0.25rem 0.5rem; border-bottom:1px solid var(--border); color:var(--text); }
  .data-table tr:nth-child(even) td { background:var(--tag-bg); }
  .expected-output-text { background:var(--tag-bg); padding:0.5rem; border-radius:4px; font-size:0.7rem; line-height:1.4; overflow-x:auto; white-space:pre; font-family:'SF Mono','Consolas',monospace; }
  .table-label { font-size:0.65rem; font-weight:600; color:var(--text2); margin:0.5rem 0 0.25rem 0; text-transform:uppercase; letter-spacing:0.04em; }
  .exp-label { font-size:0.65rem; font-weight:600; color:var(--text); margin:0.75rem 0 0.25rem 0; text-transform:uppercase; letter-spacing:0.04em; }
  .highlight-box { border-left: 3px solid var(--accent); background: var(--tag-bg); padding: 0.75rem 1rem; border-radius: 0 0.375rem 0.375rem 0; font-size:0.8rem; }
  .highlight-box strong { color: var(--accent); }
  .dark-bg { background: var(--text); color: #eef1f5; padding: 0.75rem 1rem; border-radius: 0.375rem; font-size:0.7rem; }
  .dark-bg a { color: var(--accent); }
  hr { border: 0; border-top: 2px solid var(--border); margin: 0.75rem 0; }
  .question-desc { white-space:pre-wrap; font-size:0.85rem; line-height:1.7; margin-bottom:0.75rem; padding:0.75rem 1rem; background:var(--tag-bg); border-left:3px solid var(--accent); border-radius:0 0.375rem 0.375rem 0; color:var(--text); font-weight:500; }
  .sql-toggle { display:inline-flex; align-items:center; gap:4px; font-size:0.65rem; color:var(--accent); cursor:pointer; font-weight:600; font-family:'SF Mono','Consolas',monospace; user-select:none; padding:2px 8px; border:1px solid var(--border); border-radius:0.25rem; background:var(--card); margin-bottom:0.5rem; }
  .sql-toggle:hover { background:var(--tag-bg); }
  .sql-panel { display:none; margin-bottom:0.75rem; }
  .sql-panel.open { display:block; }
  .sql-code { background:var(--text); color:#d4dce8; padding:0.75rem 1rem; border-radius:0.375rem; font-family:'SF Mono','Consolas',monospace; font-size:0.7rem; line-height:1.6; white-space:pre-wrap; overflow-x:auto; }
  .title-serif { font-weight:600; font-size:1rem; }
  .num-oswald { font-weight:600; }
  .accent { color: var(--accent); }
  .text-xs { font-size:0.65rem; }
  .text-sm { font-size:0.75rem; }
  .text-lg { font-size:1rem; }
  .text-xl { font-size:1.25rem; }
  .text-2xl { font-size:1.5rem; }
  .opacity-50 { opacity:0.5; }
  .opacity-60 { opacity:0.6; }
  .tracking-wider { letter-spacing:0.04em; }
  .tracking-widest { letter-spacing:0.06em; }
  .mb-1 { margin-bottom:0.25rem; }
  .mb-2 { margin-bottom:0.5rem; }
  .mb-3 { margin-bottom:0.75rem; }
  .mt-1 { margin-top:0.25rem; }
  .mt-2 { margin-top:0.5rem; }
  .mt-3 { margin-top:0.75rem; }
  .my-2 { margin-top:0.5rem; margin-bottom:0.5rem; }
  .my-3 { margin-top:0.75rem; margin-bottom:0.75rem; }
  .py-4 { padding-top:1rem; padding-bottom:1rem; }
  .py-6 { padding-top:1.5rem; padding-bottom:1.5rem; }
  .px-4 { padding-left:1rem; padding-right:1rem; }
  .p-2 { padding:0.5rem; }
  .p-3 { padding:0.75rem; }
  .p-4 { padding:1rem; }
  .p-5 { padding:1.25rem; }
  .p-6 { padding:1.5rem; }
  .p-8 { padding:2rem; }
  .flex { display:flex; }
  .gap-1 { gap:0.25rem; }
  .gap-2 { gap:0.5rem; }
  .gap-3 { gap:0.75rem; }
  .gap-6 { gap:1.5rem; }
  .justify-between { justify-content:space-between; }
  .justify-center { justify-content:center; }
  .items-center { align-items:center; }
  .items-start { align-items:flex-start; }
  .flex-col { flex-direction:column; }
  .flex-1 { flex:1; }
  .flex-wrap { flex-wrap:wrap; }
  .text-center { text-align:center; }
  .space-y-2 > * + * { margin-top:0.5rem; }
  .space-y-3 > * + * { margin-top:0.75rem; }
  .space-y-4 > * + * { margin-top:1rem; }
  .w-full { width:100%; }
  .leading-relaxed { line-height:1.6; }
  .rounded { border-radius:0.375rem; }
  .hidden { display:none; }
  .mr-1 { margin-right:0.25rem; }
  .ml-1 { margin-left:0.25rem; }
  .ml-auto { margin-left:auto; }
</style>
</head>
<body class="p-4">
<div class="max-w-[720px] mx-auto">

  <!-- HEADER -->
  <div class="card" style="padding:0.75rem 1rem;">
    <div class="flex justify-between items-center">
      <div><span style="font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:1.5rem;letter-spacing:0.02em;">SQL</span><span style="font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:1.5rem;letter-spacing:0.02em;color:var(--accent);"> 自适应训练</span><span style="font-size:0.6rem;color:var(--text2);margin-left:0.5rem;">DIAGNOSTIC · PRACTICE</span></div>
      <span style="font-size:0.65rem;color:var(--text2);" id="headerUserInfo">V1.0</span>
    </div>
  </div>

  <!-- NAV -->
  <div class="flex gap-1 mt-4 mb-3">
    <button class="nav-btn active" data-page="diagnostic" onclick="showPage('diagnostic')"><i class="fas fa-clipboard-list mr-1"></i> 摸底小测</button>
    <button class="nav-btn" data-page="journey" onclick="showPage('journey')"><i class="fas fa-route mr-1"></i> 自适应进阶</button>
    <button class="nav-btn" data-page="practice" onclick="showPage('practice')"><i class="fas fa-code mr-1"></i> 刷题练习</button>
    <button class="nav-btn" data-page="wrongset" onclick="showPage('wrongset')"><i class="fas fa-exclamation-triangle mr-1"></i> 错题集</button>
  </div>

  <!-- ============ 摸底小测 ============ -->
  <div id="page-diagnostic" class="page">
    <div id="diagnosticContent" class="card p-4 md:p-5">
      <div id="diagNoResult" class="highlight-box">
        <p class="text-sm leading-relaxed">摸底小测仅在新用户首次登录时自动进行。完成后的结果将在这里展示。</p>
      </div>
      <div id="diagResultView" style="display:none"></div>
    </div>
  </div>

  <!-- Diagnostic Overlay Modal (for new users) -->
  <div id="diagOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,36,27,0.7);z-index:100;overflow-y:auto">
    <div class="max-w-[640px] mx-auto p-4" style="margin-top:40px">
      <div class="card p-5">
        <div class="flex justify-between items-center mb-1">
          <h2 class="title-serif text-xl">水平摸底</h2>
          <span class="num-oswald text-sm accent" id="diagOverlayCounter">1 / 3</span>
        </div>
        <p class="text-xs opacity-60 mb-2">请完成 3 道摸底题，帮助我们了解你的 SQL 水平。可跳过不确定的题目。</p>
        <div class="progress-track"><div class="fill" id="diagOverlayProgress" style="width:0%"></div></div>
        <div id="diagOverlayQuestion" class="mt-3 fade-in"></div>
        <div class="flex gap-2 mt-3">
          <button class="btn btn-accent flex-1" id="diagOverlayNextBtn" onclick="nextDiagOverlay()" style="display:none"><i class="fas fa-arrow-right mr-1"></i> 下一题</button>
          <button class="btn btn-secondary" id="diagOverlaySkipBtn" onclick="skipDiagOverlay()"><i class="fas fa-forward mr-1"></i> 跳过此题</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 自适应进阶 Journey ============ -->
  <div id="page-journey" class="page">
    <div id="journeyStart" class="card p-4 md:p-5">
      <div class="highlight-box">
        <p class="text-sm leading-relaxed"><strong>自适应进阶模式</strong> 基于知识图谱动态追踪你的掌握程度。答对自动进阶到更高阶知识点，答错溯源至薄弱前置知识点精准巩固。</p>
      </div>
      <div class="flex gap-2 mt-3 text-xs text-[#2c241b] opacity-60">
        <span><i class="fas fa-check-circle accent mr-1"></i> 从 SELECT 基础出发</span>
        <span><i class="fas fa-arrow-right accent mr-1"></i> 图谱递进</span>
        <span><i class="fas fa-bolt accent mr-1"></i> 因错施教</span>
      </div>
      <div class="mt-3">
        <button class="btn btn-accent" onclick="startJourney()"><i class="fas fa-play mr-1"></i> 开始进阶之旅</button>
      </div>
    </div>

    <div id="journeyQuiz" style="display:none">
      <div class="card p-4 md:p-5">
        <div class="flex justify-between items-center mb-2">
          <div>
          <span class="num-oswald text-sm accent" id="journeyNodeLabel">SELECT 基础查询</span>
          <span class="tag ml-2" id="journeyActionTag" style="display:none"></span>
          <label class="text-xs ml-auto" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none">
            <span class="opacity-60">深度掌握</span>
            <input type="checkbox" id="deepModeToggle" checked onchange="toggleDeepMode()" style="accent-color:#c17c4a;width:14px;height:14px">
          </label>
          </div>
          <span class="text-xs text-[#2c241b] opacity-50"><i class="fas fa-chart-simple mr-1"></i> <span id="journeyStats">0/0</span></span>
        </div>
        <div class="progress-track mb-1"><div class="fill" id="journeyProgress" style="width:0%"></div></div>
        <div id="journeyQuestion" class="fade-in"></div>
        <div class="text-center mt-3">
          <button class="btn btn-accent" id="journeyNextBtn" onclick="nextJourney()" style="display:none"><i class="fas fa-arrow-right mr-1"></i> 继续进阶</button>
        </div>
      </div>
      <div class="card p-3 md:p-4" id="journeyGraphPanel">
        <div class="flex justify-between items-center mb-0" style="cursor:pointer;user-select:none" onclick="toggleJourneyMap()">
          <span class="num-oswald text-xs tracking-wider opacity-60">KNOWLEDGE MAP</span>
          <span><span id="unlockedCount">0</span>/27 <span id="journeyMapToggle"><i class="fas fa-chevron-down"></i></span></span>
        </div>
        <div id="journeyGraph" style="display:none;flex-wrap:wrap;gap:4px;margin-top:8px"></div>
      </div>
    </div>

    <div id="journeyResult" class="card p-4 md:p-5" style="display:none"></div>
  </div>

  <!-- ============ 刷题 ============ -->
  <div id="page-practice" class="page">
    <div class="card p-4 md:p-5">
      <div class="filter-bar flex gap-2 mb-3 flex-wrap">
        <select id="filterCategory" onchange="loadPracticeQuestions()">
          <option value="">全部类别</option>
        </select>
        <select id="filterDifficulty" onchange="loadPracticeQuestions()">
          <option value="">全部难度</option>
          <option value="easy">简单</option>
          <option value="medium">中等</option>
          <option value="hard">困难</option>
        </select>
      </div>

      <div id="practiceList" class="space-y-2"></div>

      <div id="questionDetail" class="fade-in">
        <a class="back-link" onclick="backToPracticeList()"><i class="fas fa-arrow-left mr-1"></i> 返回题目列表</a>
        <div id="practiceQuestion"></div>
      </div>

      <div id="deriveSection" style="display:none" class="fade-in">
        <a class="back-link" onclick="exitDerivedPractice()"><i class="fas fa-arrow-left mr-1"></i> 返回题目列表</a>
        <div id="deriveArea"></div>
      </div>
    </div>
  </div>

  <!-- ============ 错题集 ============ -->
  <div id="page-wrongset" class="page">
    <div class="card p-4 md:p-5">
      <div class="highlight-box">
        <p class="text-sm leading-relaxed">记录你在摸底小测和自适应进阶中答错的题目，方便集中复习巩固。</p>
      </div>
      <!-- 近期综合数据 (collapsible) -->
      <div id="wrongSummary" class="mt-3" style="cursor:pointer;user-select:none" onclick="toggleSummary()">
        <div class="flex justify-between items-center p-2 rounded" style="background:var(--tag-bg)">
          <span class="num-oswald text-xs tracking-wider">近期综合数据</span>
          <span id="summaryToggle"><i class="fas fa-chevron-down"></i></span>
        </div>
        <div id="summaryBody" class="mt-2 flex justify-center gap-6" style="display:none"></div>
      </div>
      <!-- 错题列表 -->
      <div id="wrongList" class="mt-3 space-y-2"></div>
    </div>
  </div>


</div>

<script>
// 使用相对路径，同时支持局域网和 ngrok 公网访问
const API_BASE = '/api';

// Check login state
var sqlUser = null;
try { var raw = localStorage.getItem('sql_user'); if (raw) sqlUser = JSON.parse(raw); } catch(e) {}
var sessionId = (sqlUser && sqlUser.session_id) ? sqlUser.session_id : 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
let diagQuestions = [];
let diagIndex = 0;
let diagAnswers = [];
let practiceQuestions = [];
let currentPracticeQ = null;
let currentDerivedQ = null;
let currentPrototypeQ = null;
let journeyQuestionStart = 0;

// ====== Schema/Data/Expected Output Table Renders ======
function parseSchemaToMap(schemaStr) {
  var map = {};
  if (!schemaStr) return map;
  var stmts = schemaStr.split(';');
  for (var s = 0; s < stmts.length; s++) {
    var m = stmts[s].match(/(?:CREATE\s+TABLE\s+)?(\w+)\s*\((.*)\)/i);
    if (!m) continue;
    var tbl = m[1], raw = m[2], depth = 0, cur = '', cols = [];
    for (var i = 0; i < raw.length; i++) {
      var ch = raw[i];
      if (ch === '(') { depth++; cur += ch; }
      else if (ch === ')') { depth--; cur += ch; }
      else if (ch === ',' && depth === 0) { var p = cur.trim().split(/\s+/); if (p[0]) cols.push(p[0]); cur = ''; }
      else { cur += ch; }
    }
    if (cur.trim()) { var p = cur.trim().split(/\s+/); if (p[0]) cols.push(p[0]); }
    map[tbl] = cols;
  }
  return map;
}

function renderDataTable(dataStr, schemaStr) {
  if (!dataStr) return '';
  var schemaMap = parseSchemaToMap(schemaStr);
  var tableRows = {};
  var stmts = dataStr.split(';');
  for (var s = 0; s < stmts.length; s++) {
    var stmt = stmts[s].trim();
    if (!stmt) continue;
    var m = stmt.match(/INSERT\s+INTO\s+(\w+)\s+VALUES\s*(.*)/i);
    if (!m) continue;
    var tbl = m[1], vp = m[2], depth = 0, cur = '', groups = [];
    for (var i = 0; i < vp.length; i++) {
      var ch = vp[i];
      if (ch === '(' && depth === 0) { cur = ''; depth = 1; }
      else if (ch === '(' && depth > 0) { cur += ch; depth++; }
      else if (ch === ')' && depth > 1) { cur += ch; depth--; }
      else if (ch === ')' && depth === 1) { depth = 0; groups.push(cur); cur = ''; }
      else if (depth > 0) { cur += ch; }
    }
    if (!tableRows[tbl]) tableRows[tbl] = [];
    for (var g = 0; g < groups.length; g++) {
      var vals = [], vcur = '', inQ = false, qch = null;
      for (var i = 0; i < groups[g].length; i++) {
        var ch = groups[g][i];
        if (inQ) { if (ch === qch) inQ = false; else vcur += ch; }
        else if (ch === "'" || ch === '"') { inQ = true; qch = ch; }
        else if (ch === ',') { vals.push(vcur.trim()); vcur = ''; }
        else { vcur += ch; }
      }
      if (vcur.trim()) vals.push(vcur.trim());
      if (vals.length) tableRows[tbl].push(vals);
    }
  }
  var html = '';
  var tblNames = Object.keys(tableRows);
  for (var t = 0; t < tblNames.length; t++) {
    var tbl = tblNames[t];
    var rows = tableRows[tbl];
    if (!rows.length) continue;
    var hdrs = (schemaMap[tbl] && schemaMap[tbl].length) ? schemaMap[tbl] : rows[0].map(function(_, i) { return 'col' + (i+1); });
    html += '<div class="table-label">' + tbl + '</div><table class="data-table"><thead><tr>';
    for (var h = 0; h < hdrs.length; h++) html += '<th>' + hdrs[h] + '</th>';
    html += '</tr></thead><tbody>';
    for (var r = 0; r < rows.length; r++) {
      html += '<tr>';
      for (var c = 0; c < rows[r].length; c++) html += '<td>' + rows[r][c] + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
  }
  return html;
}

function renderExpectedOutput(expStr) {
  if (!expStr) return '';
  // Try JSON format first
  try {
    var data = JSON.parse(expStr);
    if (data.rows && data.rows.length) {
      var html = '<div class="exp-label">预期输出</div><table class="data-table"><thead><tr>';
      for (var h = 0; h < data.headers.length; h++) html += '<th>' + data.headers[h] + '</th>';
      html += '</tr></thead><tbody>';
      for (var r = 0; r < data.rows.length; r++) {
        html += '<tr>';
        for (var c = 0; c < data.rows[r].length; c++) html += '<td>' + (data.rows[r][c] === null ? 'NULL' : data.rows[r][c]) + '</td>';
        html += '</tr>';
      }
      html += '</tbody></table>';
      return html;
    }
  } catch(e) { /* fall through to text format */ }
  // Text table format: lines with | separator, second line is -+-
  var lines = expStr.split('\n');
  if (lines.length < 2) return '<div class="exp-label">预期输出</div><pre class="expected-output-text">' + expStr + '</pre>';
  var headerLine = lines[0];
  var sepLine = lines[1] || '';
  var dataLines = [];
  for (var i = 2; i < lines.length; i++) {
    if (lines[i].trim()) dataLines.push(lines[i]);
  }
  // Check if separator line contains -+- (table format)
  if (sepLine.indexOf('-+-') >= 0) {
    var headers = headerLine.split('|').map(function(s) { return s.trim(); });
    var html = '<div class="exp-label">预期输出</div><table class="data-table"><thead><tr>';
    for (var h = 0; h < headers.length; h++) html += '<th>' + headers[h] + '</th>';
    html += '</tr></thead><tbody>';
    for (var r = 0; r < dataLines.length; r++) {
      var cells = dataLines[r].split('|').map(function(s) { return s.trim(); });
      html += '<tr>';
      for (var c = 0; c < cells.length; c++) html += '<td>' + cells[c] + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
  }
  return '<div class="exp-label">预期输出</div><pre class="expected-output-text">' + expStr + '</pre>';
}

function renderSqlPanel(q) {
  if (!q.table_schema && !q.initial_data) return '';
  var code = '';
  if (q.table_schema) code += q.table_schema.replace(/</g, '&lt;') + ';\n';
  if (q.initial_data) code += q.initial_data.replace(/</g, '&lt;') + '\n';
  var id = 'sql_panel_' + q.id;
  return '<div class="sql-toggle" onclick="var p=document.getElementById(\'' + id + '\');p.classList.toggle(\'open\');this.querySelector(\'span\').textContent=p.classList.contains(\'open\')?\'收起 SQL\':\'展开 SQL\'"><span>展开 SQL</span> <i class="fas fa-chevron-down" style="font-size:0.5rem"></i></div><div class="sql-panel" id="' + id + '"><div class="sql-code">' + code + '</div></div>';
}

function renderSchemaAndData(q) {
  var html = '';
  if (q.initial_data) html += renderDataTable(q.initial_data, q.table_schema);
  return html;
}

function showPage(name) {

  document.getElementById('page-' + name).classList.add('active');

async function apiGet(path) {
  const r = await fetch(API_BASE + path);
  if (!r.ok) throw new Error('API error');
  return r.json();
}

async function apiPost(path, data) {
  const r = await fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  if (!r.ok) throw new Error('API error');
  return r.json();
}

function parseOptions(str) {
  if (typeof str !== 'string') return str || [];
  return str.replace(/\|\|/g, '\x00').split('|').filter(function(o) { return o.trim() !== ''; }).map(function(o) { return o.replace(/\x00/g, '||'); });
}

function renderOverlayQuestion(q) {
  var diffMap = { easy: '简单', medium: '中等', hard: '困难' };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
  var hasOpts = q.options && (typeof q.options === 'string' ? q.options.trim() : q.options.length);
  var html = '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + q.category + '</span>';
  html += '<span class="tag ' + diffClass[q.difficulty] + '">' + diffMap[q.difficulty] + '</span>';
  html += '<span class="tag" style="background:' + (hasOpts ? 'rgba(52,119,191,0.15)' : 'rgba(193,124,74,0.20)') + ';color:' + (hasOpts ? '#3477bf' : '#a8683e') + '">' + (hasOpts ? '选择题' : '填空题') + '</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + q.title + '</h3>';
  html += '<p class="question-desc">' + q.description + '</p>';
  html += renderSchemaAndData(q);
  html += renderSqlPanel(q);
  if (q.expected_output) html += renderExpectedOutput(q.expected_output);
  if (hasOpts) {
    html += '<div class="flex flex-col gap-1.5 my-2" id="overlay_opts_' + q.id + '">';
    var opts = parseOptions(q.options);
    for (var i = 0; i < opts.length; i++) {
      html += '<button class="option-btn" onclick="selectOverlayOpt(' + q.id + ',' + i + ',this)">' + opts[i].replace(/</g, '&lt;') + '</button>';
    }
    html += '</div>';
  } else {
    html += '<textarea class="code-input" id="overlay_inp_' + q.id + '" placeholder="手动输入你的 SQL 语句..."></textarea>';
  }
  html += '<div id="overlay_res_' + q.id + '" class="result-box" style="display:none"></div>';
  html += '<div class="mt-2"><button class="btn btn-primary" onclick="submitOverlayAnswer(' + q.id + ')"><i class="fas fa-paper-plane mr-1"></i> 提交答案</button></div>';
  return html;
}

function selectOverlayOpt(qid, idx, btn) {
  var container = document.getElementById('overlay_opts_' + qid);

  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('selected');

}

function clearOverlayOpt(qid) {
  var container = document.getElementById('overlay_opts_' + qid);

function clearOpt(prefix, qid) {

function showOptionExplanations(prefix, qid, options, explanations, correctAnswer) {
  var container = document.getElementById(prefix + '_opts_' + qid);

    html += '<div class="opt-explain" style="background:' + (isCorrect ? 'rgba(34,139,34,0.08)' : 'rgba(220,20,20,0.06)') + '">';
    html += '<span class="mark" style="color:' + (isCorrect ? '#1a6b1a' : '#b22222') + '">' + mark + '</span>';
    html += '<span><code style="font-family:Oswald,Consolas,monospace;font-size:0.75rem">' + opts[i].replace(/</g, '&lt;') + '</code>';
    if (explain) html += '<br><span style="color:#666;font-size:0.75rem">' + explain + '</span>';
    html += '</span></div>';
  }
  container.innerHTML = html;
}

function renderQuestion(q, prefix) {
  var diffMap = { easy: '简单', medium: '中等', hard: '困难' };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };

  html += '<span class="tag ' + diffClass[q.difficulty] + '">' + diffMap[q.difficulty] + '</span>';
  html += '<span class="tag" style="background:' + (hasOpts ? 'rgba(52,119,191,0.15)' : 'rgba(193,124,74,0.20)') + ';color:' + (hasOpts ? '#3477bf' : '#a8683e') + '">' + (hasOpts ? '选择题' : '填空题') + '</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + q.title + '</h3>';
  html += '<p class="question-desc">' + q.description + '</p>';
  html += renderSchemaAndData(q);

  if (q.expected_output) html += renderExpectedOutput(q.expected_output);
  if (hasOpts) {
    html += '<div class="flex flex-col gap-1.5 my-2" id="' + prefix + '_opts_' + q.id + '">';

    for (var i = 0; i < opts.length; i++) {

    }

  } else {
    if (hint) html += '<div class="text-xs mb-2" style="color:#a8683e"><i class="fas fa-lightbulb mr-1"></i> ' + hint + '</div>';
    html += '<textarea class="code-input" id="' + prefix + '_inp_' + q.id + '" placeholder="手动输入你的 SQL 语句..." oninput="clearOpt(\'' + prefix + '\',' + q.id + ')"></textarea>';
  }
  html += '<div id="' + prefix + '_res_' + q.id + '" class="result-box" style="display:none"></div>';
  html += '<div class="mt-2"><button class="btn btn-primary" onclick="' + (prefix === 'diag' ? 'submitDiagAnswer' : prefix === 'journey' ? 'submitJourneyAnswer' : 'submitPracticeAnswer') + '(' + q.id + ')"><i class="fas fa-paper-plane mr-1"></i> 提交答案</button></div>';
  return html;
}

async function submitOverlayAnswer(qid) {
  var q = null;
  for (var i = 0; i < diagOverlayQuestions.length; i++) { if (diagOverlayQuestions[i].id === qid) { q = diagOverlayQuestions[i]; break; } }
  var input = '';
  var inp = document.getElementById('overlay_inp_' + qid);
  if (inp) { input = inp.value.trim(); } else {
    var sel = document.querySelector('#overlay_opts_' + qid + ' .option-btn.selected');
    if (sel) input = sel.textContent.trim();
  }
  if (!input) return alert('请先输入或选择答案');
  var elapsed = Math.round((Date.now() - diagOverlayStart) / 1000);
  var result = await apiPost('/submit', { session_id: sqlUser.session_id, question_id: qid, answer: input, duration: elapsed });
  var resultBox = document.getElementById('overlay_res_' + qid);
  resultBox.style.display = 'block';
  resultBox.className = 'result-box ' + (result.is_correct ? 'correct' : 'wrong');
  resultBox.innerHTML = result.is_correct ? '<strong>回答正确</strong>' : '<strong>回答错误</strong><br>正确答案：<strong>' + result.correct_answer + '</strong>';
  diagOverlayAnswers.push({ question_id: qid, title: q ? q.title : '', category: q ? q.category : '', node_id: q ? q.node_id : '', is_correct: result.is_correct, skipped: false, duration: elapsed });
  var btn = document.querySelector('#diagOverlayQuestion .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '已提交'; }
  document.getElementById('diagOverlayNextBtn').style.display = 'inline-flex';
  document.getElementById('diagOverlaySkipBtn').style.display = 'none';
}

function skipDiagOverlay() {
  var q = diagOverlayQuestions[diagOverlayIndex];
  diagOverlayAnswers.push({ question_id: q ? q.id : 0, title: q ? q.title : '', category: q ? q.category : '', node_id: q ? q.node_id : '', is_correct: false, skipped: true, duration: 0 });
  diagOverlayIndex++;
  showDiagOverlayQuestion();
}

function nextDiagOverlay() { diagOverlayIndex++; showDiagOverlayQuestion(); }

async function finishDiagOverlay() {
  document.getElementById('diagOverlay').style.display = 'none';

    window.history.replaceState({}, document.title, 'index.html');

}

function getNodeName(nodeId, graph) {
  if (!graph || !graph.nodes) return nodeId;
  for (var i = 0; i < graph.nodes.length; i++) {
    if (graph.nodes[i].id === nodeId) return graph.nodes[i].name;
  }
  return nodeId;
}

function renderJourneyBadges(graph, mastery, unlocked, current) {
  var el = document.getElementById('journeyGraph');
  if (!graph || !graph.nodes) { el.innerHTML = ''; return; }
  var html = '';
  var unlockedSet = {};
  var masteredSet = {};
  if (unlocked) for (var i = 0; i < unlocked.length; i++) unlockedSet[unlocked[i]] = true;
  if (mastery) for (var key in mastery) {
    if (mastery[key].total_count > 0 && mastery[key].correct_count / mastery[key].total_count >= 0.7) masteredSet[key] = true;
  }
  var unlockedCount = 0;
  for (var j = 0; j < graph.nodes.length; j++) {
    var n = graph.nodes[j];
    var cls = 'graph-node';
    if (n.id === current) { cls += ' current'; unlockedCount++; }
    else if (masteredSet[n.id]) { cls += ' mastered'; unlockedCount++; }
    else if (unlockedSet[n.id]) { cls += ''; unlockedCount++; }
    else cls += ' locked';
    html += '<span class="' + cls + '" title="' + (n.description || '') + '"><i class="fas ' + (n.icon || 'fa-code') + '"></i>' + n.name + '</span>';
  }
  el.innerHTML = html;
  document.getElementById('unlockedCount').textContent = unlockedCount;
}

async function submitJourneyAnswer(qid) {
  var q = journeyData && journeyData.question && journeyData.question.id === qid ? journeyData.question : null;
  var input = '';
  var inp = document.getElementById('journey_inp_' + qid);
  if (inp) { input = inp.value.trim(); } else {
    var sel = document.querySelector('#journey_opts_' + qid + ' .option-btn.selected');
    if (sel) input = sel.textContent.trim();
  }
  if (!input) return alert('请先输入或选择答案');
  var elapsed = Math.round((Date.now() - journeyQuestionStart) / 1000);
  try {
    var resp = await apiPost('/journey/next', { session_id: sessionId, question_id: qid, answer: input, duration: elapsed });
    var resultBox = document.getElementById('journey_res_' + qid);
    resultBox.style.display = 'block';
    resultBox.className = 'result-box ' + (resp.last_answer_correct ? 'correct' : 'wrong');
    if (resp.last_answer_correct === true) {
      resultBox.innerHTML = '<strong><i class="fas fa-check-circle mr-1"></i> 回答正确</strong>';
    } else if (resp.last_answer_correct === false) {
      resultBox.innerHTML = '<strong><i class="fas fa-times-circle mr-1"></i> 回答错误</strong>';
      if (q) resultBox.innerHTML += '<br>正确答案：<strong>' + q.correct_answer + '</strong>';
      if (q && q.options && q.option_explanations) {
        showOptionExplanations('journey', qid, q.options, q.option_explanations, q.correct_answer);
      }
    }
    if (resp.explanation) resultBox.innerHTML += '<div class="explanation"><i class="fas fa-lightbulb mr-1"></i> ' + resp.explanation + '</div>';
    var submitBtn = document.querySelector('#journeyQuestion .btn-primary');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '已提交'; }
    journeyData = resp;
    document.getElementById('journeyNextBtn').style.display = 'inline-flex';
  } catch (e) { alert('提交失败'); }
}

var journeyMapExpanded = false;
function toggleJourneyMap() {
  journeyMapExpanded = !journeyMapExpanded;
  document.getElementById('journeyGraph').style.display = journeyMapExpanded ? 'flex' : 'none';
  document.getElementById('journeyMapToggle').innerHTML = journeyMapExpanded ? '<i class="fas fa-chevron-up"></i>' : '<i class="fas fa-chevron-down"></i>';
}

function nextJourney() {
  showJourneyQuestion(journeyData);
}

// ==================== 刷题 ====================
async function loadPracticeQuestions() {
  var category = document.getElementById('filterCategory').value;
  var difficulty = document.getElementById('filterDifficulty').value;
  var params = [];
  if (category) params.push('category=' + encodeURIComponent(category));
  if (difficulty) params.push('difficulty=' + encodeURIComponent(difficulty));
  document.getElementById('practiceList').innerHTML = '<div class="text-center text-sm py-4 opacity-50"><i class="fas fa-spinner fa-spin mr-1"></i> 加载中...</div>';
  document.getElementById('questionDetail').classList.remove('visible');
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('practiceList').style.display = 'block';
  try {
    var data = await apiGet('/questions?' + params.join('&'));
    practiceQuestions = data.questions;
    renderPracticeList();
    var catSelect = document.getElementById('filterCategory');
    if (catSelect.options.length <= 1) {
      var cats = [];
      for (var i = 0; i < practiceQuestions.length; i++) {
        if (cats.indexOf(practiceQuestions[i].category) === -1) cats.push(practiceQuestions[i].category);
      }
      for (var j = 0; j < cats.length; j++) {
        var opt = document.createElement('option');
        opt.value = cats[j]; opt.textContent = cats[j];
        catSelect.appendChild(opt);
      }
    }
  } catch (e) {
    document.getElementById('practiceList').innerHTML = '<p style="color:#b04a4a;text-align:center">加载失败，请确保后端已启动</p>';
  }
}

function renderPracticeList() {
  var el = document.getElementById('practiceList');
  if (!practiceQuestions.length) {
    el.innerHTML = '<div class="text-center text-sm py-4 opacity-50">暂无符合条件的题目</div>';
    return;
  }
  var diffMap = { easy: '简单', medium: '中等', hard: '困难' };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
  var html = '';
  for (var i = 0; i < practiceQuestions.length; i++) {
    var q = practiceQuestions[i];
    var desc = q.description.replace(/\n/g, ' ').substring(0, 80);
    html += '<div class="card p-3 question-item" onclick="showPracticeDetail(' + q.id + ')">';
    html += '<div class="flex gap-2 flex-wrap mb-1">';
    html += '<span class="tag">' + q.category + '</span>';
    html += '<span class="tag ' + diffClass[q.difficulty] + '">' + diffMap[q.difficulty] + '</span>';
    html += '</div>';
    html += '<h3>' + q.title + '</h3>';
    html += '<p>' + desc + '...</p>';
    html += '</div>';
  }
  el.innerHTML = html;
}

function showPracticeDetail(qid) {
  var q = null;
  for (var i = 0; i < practiceQuestions.length; i++) { if (practiceQuestions[i].id === qid) { q = practiceQuestions[i]; break; } }
  if (!q) return;
  currentPracticeQ = q;
  document.getElementById('practiceList').style.display = 'none';
  var detail = document.getElementById('questionDetail');
  detail.style.display = 'block';
  detail.classList.add('visible');
  document.getElementById('practiceQuestion').innerHTML = renderPracticeQuestion(q);
  var ta = document.querySelector('#practiceQuestion textarea');
  if (ta) ta.focus();
}

function renderPracticeQuestion(q) {
  var diffMap = { easy: '简单', medium: '中等', hard: '困难' };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
  var hasOpts = q.options && (typeof q.options === 'string' ? q.options.trim() : q.options.length);
  var html = '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + q.category + '</span>';
  html += '<span class="tag ' + diffClass[q.difficulty] + '">' + diffMap[q.difficulty] + '</span>';
  html += '<span class="tag" style="background:' + (hasOpts ? 'rgba(52,119,191,0.15)' : 'rgba(193,124,74,0.20)') + ';color:' + (hasOpts ? '#3477bf' : '#a8683e') + '">' + (hasOpts ? '选择题' : '填空题') + '</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + q.title + '</h3>';
  html += '<p class="question-desc">' + q.description + '</p>';
  html += renderSchemaAndData(q);
  html += renderSqlPanel(q);
  if (q.expected_output) html += renderExpectedOutput(q.expected_output);
  if (hasOpts) {
    html += '<div class="flex flex-col gap-1.5 my-2" id="prac_opts_' + q.id + '">';
    var opts = parseOptions(q.options);
    for (var i = 0; i < opts.length; i++) {
      html += '<button class="option-btn" onclick="selectOpt(\'prac\',' + q.id + ',' + i + ',this)">' + opts[i].replace(/</g, '&lt;') + '</button>';
    }
    html += '</div>';
  } else {
    html += '<textarea class="code-input" id="prac_inp_' + q.id + '" placeholder="手动输入你的 SQL 语句..."></textarea>';
  }
  html += '<div id="prac_res_' + q.id + '" class="result-box" style="display:none"></div>';
  html += '<div class="mt-2"><button class="btn btn-primary" id="prac_btn_' + q.id + '" onclick="submitPracticeAnswer(' + q.id + ')"><i class="fas fa-paper-plane mr-1"></i> 提交答案</button></div>';
  return html;
}

async function submitPracticeAnswer(qid) {
  var q = null;
  for (var i = 0; i < practiceQuestions.length; i++) { if (practiceQuestions[i].id === qid) { q = practiceQuestions[i]; break; } }
  if (!q) q = currentPracticeQ;
  var input = '';
  var inp = document.getElementById('prac_inp_' + qid);
  if (inp) { input = inp.value.trim(); } else {
    var sel = document.querySelector('#prac_opts_' + qid + ' .option-btn.selected');
    if (sel) input = sel.textContent.trim();
  }
  if (!input) return alert('请先输入或选择答案');
  var result = await apiPost('/submit', { session_id: sessionId, question_id: qid, answer: input });
  var resultBox = document.getElementById('prac_res_' + qid);
  resultBox.style.display = 'block';
  resultBox.className = 'result-box ' + (result.is_correct ? 'correct' : 'wrong');
  resultBox.innerHTML = result.is_correct
    ? '<strong><i class="fas fa-check-circle mr-1"></i> 回答正确</strong>'
    : '<strong><i class="fas fa-times-circle mr-1"></i> 回答错误</strong><br>正确答案：<strong>' + result.correct_answer + '</strong>';
  resultBox.innerHTML += '<div class="explanation"><i class="fas fa-lightbulb mr-1"></i> ' + (result.explanation || '') + '</div>';
  if (!result.is_correct && q && q.options && q.option_explanations) {
    showOptionExplanations('prac', qid, q.options, q.option_explanations, q.correct_answer);
  }
  var btn = document.getElementById('prac_btn_' + qid);
  if (btn) { btn.disabled = true; btn.textContent = '已提交'; }
  var isMcq = q && q.options && (typeof q.options === 'string' ? q.options.trim() : q.options.length);
  var showDerivedNext = result.is_correct && isMcq;
  if (showDerivedNext) {
    currentPrototypeQ = q;
  } else {
    currentPrototypeQ = null;
  }
  var nextLabel = showDerivedNext ? '举一反三 →' : '下一题';
  var nextHint = showDerivedNext ? '已掌握该选择题，进入举一反三' : '';
  resultBox.innerHTML += '<div class="mt-3" style="border-top:1px solid var(--border);padding-top:0.75rem">' +
    (nextHint ? '<p class="text-sm mb-2"><i class="fas fa-lightbulb mr-1" style="color:var(--accent)"></i> ' + nextHint + '</p>' : '') +
    '<button class="btn btn-accent" onclick="onPracticeNext()"><i class="fas fa-arrow-right mr-1"></i> ' + nextLabel + '</button></div>';
}

function onPracticeNext() {
  if (currentPrototypeQ) {
    var pid = currentPrototypeQ.id;
    currentPrototypeQ = null;
    startDerivedPractice(pid);
  } else {
    backToPracticeList();
  }
}

async function startDerivedPractice(prototypeId) {
  document.getElementById('practiceList').style.display = 'none';
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('questionDetail').classList.remove('visible');
  var section = document.getElementById('deriveSection');
  section.style.display = 'block';
  var area = document.getElementById('deriveArea');
  area.innerHTML = '<div class="text-center text-sm py-4 opacity-50"><i class="fas fa-spinner fa-spin mr-1"></i> 生成举一反三题目...</div>';
  try {
    var resp = await apiPost('/practice/derive', { question_id: prototypeId });
    currentDerivedQ = resp.derived_question;
    renderDerivedQuestion(currentDerivedQ);
  } catch(e) {
    area.innerHTML = '<p style="color:#b04a4a">生成失败</p>';
  }
}

function renderDerivedQuestion(dq) {
  var area = document.getElementById('deriveArea');
  var html = '<div class="highlight-box mb-3"><p class="text-sm"><i class="fas fa-lightbulb mr-1 accent"></i><strong>举一反三</strong> — 这是根据你刚做对的选择题生成的填空题，请手动编写 SQL 语句。</p></div>';
  // Tags
  var diffMap = { easy: '简单', medium: '中等', hard: '困难' };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
  html += '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + dq.category + '</span>';
  html += '<span class="tag ' + diffClass[dq.difficulty] + '">' + diffMap[dq.difficulty] + '</span>';
  html += '<span class="tag" style="background:rgba(193,124,74,0.20);color:#a8683e">填空题</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + dq.title + '</h3>';
  html += '<p class="question-desc">' + dq.description + '</p>';
  // Schema and data
  if (dq.initial_data) {
    var schemaHtml = '';
    var schemaMap = {};
    try {
      if (dq.table_schema) {
        var stmts = dq.table_schema.split(';');
        for (var s = 0; s < stmts.length; s++) {
          var m = stmts[s].match(/(?:CREATE\s+TABLE\s+)?(\w+)\s*\((.*)\)/i);
          if (m) { schemaMap[m[1]] = m[2]; }
        }
      }
      // Use existing renderDataTable
      var dataHtml = renderDataTable(dq.initial_data, dq.table_schema);
      html += dataHtml;
    } catch(e) {}
  }
  // SQL panel
  html += '<div class="sql-toggle" onclick="var p=document.getElementById(\'derivedSqlPanel\');p.classList.toggle(\'open\');this.querySelector(\'span\').textContent=p.classList.contains(\'open\')?\'收起 SQL\':\'展开 SQL\'"><span>展开 SQL</span> <i class="fas fa-chevron-down" style="font-size:0.5rem"></i></div><div class="sql-panel" id="derivedSqlPanel"><div class="sql-code">';
  if (dq.table_schema) html += dq.table_schema.replace(/</g, '&lt;') + ';\n';
  if (dq.initial_data) html += dq.initial_data.replace(/</g, '&lt;') + '\n';
  html += '</div></div>';
  // Expected output
  if (dq.expected_output) html += renderExpectedOutput(dq.expected_output);
  // Input
  html += '<textarea class="code-input" id="derived_inp" placeholder="手动输入你的 SQL 语句..."></textarea>';
  html += '<div id="derived_res" class="result-box" style="display:none"></div>';
  html += '<div class="mt-2"><button class="btn btn-primary" id="derived_btn" onclick="submitDerivedAnswer()"><i class="fas fa-paper-plane mr-1"></i> 提交答案</button></div>';
  area.innerHTML = html;
  var ta = document.getElementById('derived_inp');
  if (ta) ta.focus();
}

async function submitDerivedAnswer() {
  if (!currentDerivedQ) return;
  var input = document.getElementById('derived_inp').value.trim();
  if (!input) return alert('请先输入 SQL 语句');
  var result = await apiPost('/submit', { session_id: sessionId, question_id: currentDerivedQ.id, answer: input });
  var resultBox = document.getElementById('derived_res');
  resultBox.style.display = 'block';
  resultBox.className = 'result-box ' + (result.is_correct ? 'correct' : 'wrong');
  resultBox.innerHTML = result.is_correct
    ? '<strong><i class="fas fa-check-circle mr-1"></i> 回答正确</strong>'
    : '<strong><i class="fas fa-times-circle mr-1"></i> 回答错误</strong><br>正确答案：<strong>' + result.correct_answer + '</strong>';
  resultBox.innerHTML += '<div class="explanation"><i class="fas fa-lightbulb mr-1"></i> ' + (result.explanation || '') + '</div>';
  var btn = document.getElementById('derived_btn');
  if (btn) { btn.disabled = true; btn.textContent = '已提交'; }
  // Get next recommendation
  var rec = await apiPost('/practice/recommend', {
    session_id: sessionId,
    derived_question_id: currentDerivedQ.id,
    was_correct: result.is_correct
  });
  resultBox.innerHTML += '<div class="mt-3" style="border-top:1px solid var(--border);padding-top:0.75rem">';
  if (rec.recommended && rec.question) {
    resultBox.innerHTML += '<p class="text-sm mb-2"><i class="fas fa-arrow-right mr-1" style="color:var(--accent)"></i> ' + rec.reason + '</p>';
    resultBox.innerHTML += '<button class="btn btn-accent" onclick="showRecommendedQuestion(' + rec.question.id + ')"><i class="fas fa-play mr-1"></i> 开始练习</button>';
    // Store the recommended question
    var found = false;
    for (var i = 0; i < practiceQuestions.length; i++) {
      if (practiceQuestions[i].id === rec.question.id) { found = true; break; }
    }
    if (!found) practiceQuestions.push(rec.question);
    currentPrototypeQ = null;
  } else {
    resultBox.innerHTML += '<p class="text-sm opacity-60"><i class="fas fa-check-circle mr-1" style="color:var(--success)"></i> 该知识点已全部掌握，可返回列表选择其他题目</p>';
  }
  resultBox.innerHTML += '</div>';
}

function showRecommendedQuestion(qid) {
  var q = null;
  for (var i = 0; i < practiceQuestions.length; i++) { if (practiceQuestions[i].id === qid) { q = practiceQuestions[i]; break; } }
  if (!q) return;
  // Show this question in the detail view
  document.getElementById('deriveSection').style.display = 'none';
  document.getElementById('questionDetail').style.display = 'block';
  document.getElementById('questionDetail').classList.add('visible');
  currentPracticeQ = q;
  document.getElementById('practiceQuestion').innerHTML = renderPracticeQuestion(q);
  var ta = document.querySelector('#practiceQuestion textarea');
  if (ta) ta.focus();
}

function exitDerivedPractice() {
  document.getElementById('deriveSection').style.display = 'none';
  document.getElementById('practiceList').style.display = 'block';
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('questionDetail').classList.remove('visible');
  currentDerivedQ = null;
  currentPrototypeQ = null;
}

function backToPracticeList() {
  document.getElementById('questionDetail').classList.remove('visible');
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('practiceList').style.display = 'block';
}

// ==================== 错题集 ====================
var wrongQuestions = [];
var summaryExpanded = false;

function toggleSummary() {
  summaryExpanded = !summaryExpanded;
  document.getElementById('summaryBody').style.display = summaryExpanded ? 'flex' : 'none';
  document.getElementById('summaryToggle').innerHTML = summaryExpanded ? '<i class="fas fa-chevron-up"></i>' : '<i class="fas fa-chevron-down"></i>';
}

async function loadWrongSet() {
  var el = document.getElementById('wrongList');
  el.innerHTML = '<div class="text-center text-sm py-4 opacity-50"><i class="fas fa-spinner fa-spin mr-1"></i> 加载中...</div>';
  try {
    var data = await apiGet('/progress/' + encodeURIComponent(sessionId));
    wrongQuestions = data.progress.filter(function(p) { return !p.is_correct; });
    renderWrongSummary(data);
    renderWrongList();
  } catch (e) {
    el.innerHTML = '<p style="color:#b04a4a;text-align:center">加载失败</p>';
  }
}

function renderWrongSummary(data) {
  var body = document.getElementById('summaryBody');
  var total = data.total || 0;
  var correct = data.correct || 0;
  var wrong = total - correct;
  var avgDuration = 0;
  var durationCount = 0;
  if (total > 0) {
    var sum = 0;
    for (var i = 0; i < data.progress.length; i++) {
      var d = data.progress[i].duration || 0;
      if (d > 0) { sum += d; durationCount++; }
    }
    if (durationCount > 0) avgDuration = Math.round(sum / durationCount);
  }
  body.innerHTML = '';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl">' + total + '</div><div class="text-xs opacity-50">总答题</div></div>';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl" style="color:#2c241b">' + correct + '</div><div class="text-xs opacity-50">正确</div></div>';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl" style="color:#b04a4a">' + wrong + '</div><div class="text-xs opacity-50">错误</div></div>';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl">' + (data.accuracy || 0) + '%</div><div class="text-xs opacity-50">正确率</div></div>';
}

function renderWrongList() {
  var el = document.getElementById('wrongList');
  if (!wrongQuestions.length) {
    el.innerHTML = '<div class="text-center text-sm py-6 opacity-50"><i class="fas fa-check-circle mr-1" style="color:#2c241b"></i> 暂无错题，继续保持！</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < wrongQuestions.length; i++) {
    var w = wrongQuestions[i];
    html += '<div class="card p-3" style="cursor:pointer" onclick="showWrongDetail(' + i + ')">';
    html += '<div class="flex gap-2 flex-wrap mb-1">';
    html += '<span class="tag">' + (w.category || '') + '</span>';
    html += '<span class="tag" style="background:rgba(176,74,74,0.12);color:#b04a4a">✗ 答错</span>';
    html += '</div>';
    html += '<h3>' + (w.title || '') + '</h3>';
    html += '<p style="font-size:0.75rem;color:#666">你的答案：<code style="font-family:Oswald,Consolas,monospace">' + (w.user_answer || '').replace(/</g, '&lt;') + '</code></p>';
    html += '</div>';
  }
  el.innerHTML = html;
}

function showWrongDetail(idx) {
  var w = wrongQuestions[idx];
  var diffLabel = { easy: '简单', medium: '中等', hard: '困难' };
  var html = '<div class="card p-4 fade-in">';
  html += '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + (w.category || '') + '</span>';
  html += '<span class="tag" style="background:rgba(176,74,74,0.12);color:#b04a4a">' + (diffLabel[w.difficulty] || w.difficulty) + '</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + (w.title || '') + '</h3>';
  html += '<p class="question-desc">' + (w.description || '') + '</p>';
  html += renderSchemaAndData(w);
  if (w.expected_output) html += renderExpectedOutput(w.expected_output);
  html += '<div style="margin-top:0.5rem;padding:0.5rem;border-left:4px solid #b04a4a;background:rgba(176,74,74,0.06);border-radius:0 0.4rem 0.4rem 0">';
  html += '<div class="text-xs opacity-50">你的答案</div>';
  html += '<code style="font-family:Oswald,Consolas,monospace;font-size:0.85rem">' + (w.user_answer || '').replace(/</g, '&lt;') + '</code>';
  html += '<div class="text-xs opacity-50 mt-2">正确答案</div>';
  html += '<code style="font-family:Oswald,Consolas,monospace;font-size:0.85rem;color:#1a6b1a">' + (w.correct_answer || '').replace(/</g, '&lt;') + '</code>';
  if (w.explanation) html += '<div class="text-xs mt-2" style="color:#666"><i class="fas fa-lightbulb mr-1"></i> ' + w.explanation + '</div>';
  html += '</div></div>';
  var el = document.getElementById('wrongList');
  el.innerHTML = '<a class="back-link" onclick="loadWrongSet()" style="cursor:pointer;margin-bottom:0.5rem;display:inline-block"><i class="fas fa-arrow-left mr-1"></i> 返回错题列表</a>' + html;
}

// update showPage to load wrong set
var origShowPage = showPage;
showPage = function(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });

};
