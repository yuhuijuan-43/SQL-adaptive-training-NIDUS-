<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL 自适应训练 · 登录</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  :root { --bg: #f5f6f8; --card: #ffffff; --text: #2c3e50; --text2: #7a8599; --border: #e4e7ed; --accent: #5a7d9a; --accent-hover: #4a6a82; --tag-bg: #eef1f5; }
  * { box-sizing: border-box; }
  body { background: var(--bg); font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--text); margin: 0; padding: 0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 38px; padding: 0 1.25rem; font-family: inherit; font-size: 0.8rem; font-weight: 600; border-radius: 0.375rem; border: 1px solid transparent; cursor: pointer; transition: all 0.12s; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-hover); }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { background: var(--tag-bg); }
  .input-field { width:100%; height:38px; padding:0 0.75rem; font-family:inherit; font-size:0.8rem; color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:0.375rem; outline:none; transition:border-color 0.15s; }
  .input-field:focus { border-color:var(--accent); }
  hr { border: 0; border-top: 2px solid var(--border); margin: 0.75rem 0; }
  .text-xs { font-size:0.65rem; }
  .text-sm { font-size:0.75rem; }
  .text-center { text-align:center; }
  .mb-1 { margin-bottom:0.25rem; }
  .mb-4 { margin-bottom:1rem; }
  .mt-4 { margin-top:1rem; }
  .space-y-2 > * + * { margin-top:0.5rem; }
  .space-y-3 > * + * { margin-top:0.75rem; }
  .opacity-40 { opacity:0.4; }
  .opacity-50 { opacity:0.5; }
  .opacity-70 { opacity:0.7; }
  .block { display:block; }
  .w-full { width:100%; }
  .mr-1 { margin-right:0.25rem; }
  .font-bold { font-weight:600; }
</style>
</head>
<body class="p-4">
<div class="card p-6 md:p-8" style="max-width:400px;width:100%">

  <div class="text-center mb-1">
    <div><span style="font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:1.5rem;letter-spacing:0.02em;">SQL</span><span style="font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:1.5rem;letter-spacing:0.02em;color:var(--accent);"> 自适应训练</span></div>
    <div style="font-size:0.6rem;color:var(--text2);">DIAGNOSTIC · PRACTICE</div>
  </div>
  <hr>

  <p class="text-sm opacity-70 mb-4 text-center">登录后可保存学习记录</p>

  <div class="space-y-3">
    <div>
      <label class="text-xs font-bold opacity-60 block mb-1">用户名</label>
      <input class="input-field" id="username" placeholder="输入你的名字" autocomplete="off">
    </div>
    <div>
      <label class="text-xs font-bold opacity-60 block mb-1">密码（可选）</label>
      <input class="input-field" id="password" type="password" placeholder="留空即可" autocomplete="off">
    </div>
  </div>

  <div class="space-y-2" style="margin-top:1.5rem;">
    <button class="btn btn-accent w-full" onclick="doLogin()"><i class="fas fa-sign-in-alt mr-1"></i> 登录并开始</button>
  </div>


</div>

<script>
// 使用相对路径，同时支持局域网和 ngrok 公网访问
const API_BASE = '/api';

async function doLogin() {
  var name = document.getElementById('username').value.trim();
  var pwd = document.getElementById('password').value.trim();
  if (!name) { alert('请输入用户名'); return; }
  try {
    var r = await fetch(API_BASE + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: name, password: pwd }) });
    var data = await r.json();
    if (data.error) { alert(data.error); return; }
    localStorage.setItem('sql_user', JSON.stringify({ name: data.username, session_id: data.session_id, loggedIn: true, loginAt: Date.now() }));
    window.location.href = 'index_ngrok.html?new=1';
  } catch(e) {
    alert('无法连接后端，请确保后端已启动');
  }
}

</script>
</body>
</html>
