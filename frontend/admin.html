<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL 自适应训练 · 管理后台</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  :root { --bg: #eef3fc; --card: rgba(255,255,255,0.72); --text: #1b2747; --text2: #48577c; --border: rgba(88,110,170,0.16); --accent: #4a7dff; --accent-hover: #6a90ff; --tag-bg: rgba(88,110,170,0.08); --code-bg: rgba(255,255,255,0.75); --success: #0ea678; --error: #e04a55; --accent-grad: linear-gradient(135deg, #4a7dff 0%, #8b5bff 100%); }
  * { box-sizing: border-box; }
  body {
    background:
      radial-gradient(1100px 700px at 88% -12%, rgba(140,120,255,0.16), transparent 60%),
      radial-gradient(900px 620px at -8% 18%, rgba(80,140,255,0.15), transparent 55%),
      radial-gradient(800px 560px at 50% 115%, rgba(70,190,210,0.12), transparent 55%),
      linear-gradient(180deg, #eef3fc 0%, #e3ecf9 100%);
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--text); margin: 0; padding: 0; line-height: 1.5; min-height: 100vh; overflow-x: hidden;
  }
  /* 背景光球（玻璃拟态氛围） */
  .orb { position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none; }
  .orb-1 { width: 460px; height: 460px; background: #b9a6ff; top: -140px; right: -100px; opacity: 0.30; animation: orbDrift 19s ease-in-out infinite; }
  .orb-2 { width: 400px; height: 400px; background: #9cc0ff; top: 40%; left: -180px; opacity: 0.26; animation: orbDrift 24s ease-in-out infinite reverse; }
  .orb-3 { width: 340px; height: 340px; background: #93e2ea; bottom: -120px; right: 20%; opacity: 0.22; animation: orbDrift 27s ease-in-out infinite; }
  @keyframes orbDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(42px, -28px) scale(1.07); }
    66% { transform: translate(-30px, 24px) scale(0.94); }
  }
  .card { background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 0.9rem; padding: 1rem; box-shadow: 0 8px 28px rgba(58,82,148,0.12), inset 0 1px 0 rgba(255,255,255,0.65); }
  .max-w-\[960px\] { max-width: 960px; }
  .mx-auto { margin-left: auto; margin-right: auto; }
  .stat-num { font-weight: 700; font-size: 1.4rem; line-height: 1; }
  .stat-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text2); }
  table { width:100%; border-collapse:collapse; }
  table thead th { text-align:left; font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--text2); background:var(--tag-bg); padding:8px 10px; border-bottom:1px solid var(--border); }
  table tbody td { padding:8px 10px; border-bottom:1px solid var(--border); font-size:0.75rem; color:var(--text); }
  table tbody tr:hover td { background:var(--tag-bg); }
  .mini-btn { padding:3px 10px; font-size:0.7rem; border:1px solid var(--border); border-radius:0.375rem; background:var(--card); color:var(--text2); cursor:pointer; transition:all 0.15s; }
  .mini-btn:hover { color:var(--accent); border-color:var(--accent); background:var(--tag-bg); }
  .accent { color: var(--accent); }
  .grad-text { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .num-oswald { font-weight:600; }
  .text-xs { font-size:0.65rem; }
  .text-sm { font-size:0.75rem; }
  .text-center { text-align:center; }
  .tracking-wider { letter-spacing:0.04em; }
  .tracking-widest { letter-spacing:0.06em; }
  .mb-0 { margin-bottom:0; }
  .mb-1 { margin-bottom:0.25rem; }
  .mb-2 { margin-bottom:0.5rem; }
  .mt-1 { margin-top:0.25rem; }
  .mt-2 { margin-top:0.5rem; }
  .mt-3 { margin-top:0.75rem; }
  .p-3 { padding:0.75rem; }
  .p-4 { padding:1rem; }
  .py-4 { padding-top:1rem; padding-bottom:1rem; }
  .gap-2 { gap:0.5rem; }
  .gap-3 { gap:0.75rem; }
  .flex { display:flex; }
  .grid { display:grid; }
  .grid-cols-1 { grid-template-columns:repeat(1,1fr); }
  .grid-cols-2 { grid-template-columns:repeat(2,1fr); }
  .justify-between { justify-content:space-between; }
  .items-center { align-items:center; }
  .items-start { align-items:flex-start; }
  .opacity-50 { opacity:0.5; }
  .opacity-60 { opacity:0.6; }
  .mr-1 { margin-right:0.25rem; }
</style>
</head>
<body class="p-4">

<!-- 背景光球（玻璃拟态氛围） -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="max-w-[960px] mx-auto" style="position:relative;z-index:1">

  <!-- HEADER -->
  <div class="card" style="padding:0.75rem 1rem;">
    <div class="flex justify-between items-center">
      <div><span style="font-weight:700;font-size:1.5rem;letter-spacing:0.02em;">SQL</span><span class="grad-text" style="font-weight:700;font-size:1.5rem;letter-spacing:0.02em;">管理后台</span><span style="font-size:0.6rem;color:var(--text2);margin-left:0.5rem;">ADMIN · DASHBOARD</span></div>
      <span style="font-size:0.65rem;color:var(--text2);" id="refreshTime">-</span>
    </div>
  </div>

  <!-- STAT CARDS -->
  <div class="grid grid-cols-2 gap-2 mt-3" id="statCards" style="display:grid;grid-template-columns:repeat(2,1fr);gap:0.5rem">
    <div class="card p-3 text-center"><div class="stat-num accent" id="statUsers">-</div><div class="stat-label">注册用户</div></div>
    <div class="card p-3 text-center"><div class="stat-num" id="statAnswers">-</div><div class="stat-label">总答题数</div></div>
    <div class="card p-3 text-center"><div class="stat-num" style="color:var(--success)" id="statCorrect">-</div><div class="stat-label">正确数</div></div>
    <div class="card p-3 text-center"><div class="stat-num" style="color:var(--accent)" id="statAccuracy">-</div><div class="stat-label">正确率</div></div>
  </div>

  <!-- CHARTS ROW -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">

    <!-- Donut chart: correct vs wrong -->
    <div class="card p-3">
      <div class="num-oswald text-xs tracking-wider opacity-60 mb-1">正确 / 错误 比例</div>
      <svg id="donutChart" viewBox="0 0 240 160" style="width:100%;height:auto"></svg>
    </div>

    <!-- Bar chart: difficulty distribution -->
    <div class="card p-3">
      <div class="num-oswald text-xs tracking-wider opacity-60 mb-1">难度分布</div>
      <svg id="diffChart" viewBox="0 0 240 160" style="width:100%;height:auto"></svg>
    </div>

    <!-- Bar chart: user performance -->
    <div class="card p-3 md:col-span-2">
      <div class="num-oswald text-xs tracking-wider opacity-60 mb-1"><span id="rankLabel">用户答题排行</span></div>
      <svg id="userChart" viewBox="0 0 460 140" style="width:100%;height:auto"></svg>
    </div>

  </div>

  <!-- USER TABLE -->
  <div class="card p-3 mt-3">
    <div class="num-oswald text-xs tracking-wider opacity-60 mb-2">用户明细</div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>用户名</th><th>答题数</th><th>正确数</th><th>正确率</th><th>最后活跃</th></tr></thead>
        <tbody id="userTableBody"><tr><td colspan="5" class="text-center opacity-50 py-4">加载中...</td></tr></tbody>
      </table>
    </div>
    <!-- 用户明细分页（每页 5 条） -->
    <div class="flex justify-between items-center mt-2" id="userPager" style="display:none">
      <span class="text-xs opacity-60" id="pagerInfo"></span>
      <span style="display:inline-flex;gap:6px">
        <button id="pagerPrev" class="mini-btn" onclick="userPage(-1)">上一页</button>
        <button id="pagerNext" class="mini-btn" onclick="userPage(1)">下一页</button>
      </span>
    </div>
  </div>

</div>

<!-- 用户答题记录弹窗（点击排行榜/明细行打开） -->
<div id="userDetailModal" style="display:none;position:fixed;inset:0;background:rgba(45,60,110,0.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:999;align-items:center;justify-content:center;padding:1rem;" onclick="if(event.target===this)closeUserDetail()">
  <div style="background:rgba(255,255,255,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:0.9rem;max-width:760px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(58,82,148,0.28);">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0.8rem 1rem;border-bottom:1px solid var(--border);">
      <span class="num-oswald text-sm" id="modalTitle">答题记录</span>
      <button onclick="closeUserDetail()" style="border:none;background:none;font-size:1.3rem;cursor:pointer;color:var(--text2);line-height:1;">&times;</button>
    </div>
    <div style="overflow:auto;padding:1rem;">
      <div id="modalBody">加载中...</div>
    </div>
  </div>
</div>

<script>
// 后台页支持 file:// 直接打开：必须用绝对地址（相对路径在 file:// 下会指向 file:///api）
// 若服务部署在其他机器/端口，改这里即可，例如 'http://10.86.168.226:5000/api'
const API_BASE = 'http://localhost:5000/api';
// 管理员 Token：首次输入后保存在 sessionStorage，请求时带 Authorization: Bearer 头
var ADMIN_TOKEN = sessionStorage.getItem('admin_token');
if (!ADMIN_TOKEN) {
  ADMIN_TOKEN = prompt('请输入管理员 Token（后端 ADMIN_TOKEN 配置）：') || '';
  if (ADMIN_TOKEN) sessionStorage.setItem('admin_token', ADMIN_TOKEN);
}
function adminFetch(path) {
  var headers = {};
  if (ADMIN_TOKEN) headers['Authorization'] = 'Bearer ' + ADMIN_TOKEN;
  return fetch(API_BASE + path, { headers: headers });
}

function drawDonut(correct, wrong) {
  var total = correct + wrong;
  if (total === 0) { document.getElementById('donutChart').innerHTML = '<text x="120" y="80" text-anchor="middle" fill="#87867f" font-size="12">暂无数据</text>'; return; }
  var pct = correct / total;
  var r = 50, cx = 80, cy = 80;
  var end = pct * 360;
  var rad = function(d) { return d * Math.PI / 180; };
  var desc = function(a1, a2) {
    var x1 = cx + r * Math.sin(rad(a1)), y1 = cy - r * Math.cos(rad(a1));
    var x2 = cx + r * Math.sin(rad(a2)), y2 = cy - r * Math.cos(rad(a2));
    var large = (a2 - a1) > 180 ? 1 : 0;
    return 'M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 + ' Z';
  };
  var html = '';
  if (end > 0) html += '<path d="' + desc(0, end) + '" fill="#788c5d" opacity="0.85"/>';
  if (end < 360) html += '<path d="' + desc(end, 360) + '" fill="#dcd6ce" opacity="0.6"/>';
  html += '<text x="80" y="75" text-anchor="middle" fill="#2c241b" font-family="Oswald" font-size="22" font-weight="700">' + Math.round(pct * 100) + '%</text>';
  html += '<text x="80" y="90" text-anchor="middle" fill="#87867f" font-size="9">正确率</text>';
  html += '<text x="155" y="65" fill="#788c5d" font-family="Oswald" font-size="13" font-weight="700">' + correct + '</text>';
  html += '<text x="155" y="78" fill="#87867f" font-size="8">正确</text>';
  html += '<text x="155" y="95" fill="#b04a4a" font-family="Oswald" font-size="13" font-weight="700">' + wrong + '</text>';
  html += '<text x="155" y="108" fill="#87867f" font-size="8">错误</text>';
  document.getElementById('donutChart').innerHTML = html;
}

function drawDiffBars(easy, medium, hard) {
  var max = Math.max(easy, medium, hard, 1);
  var html = '';
  var bars = [
    { label: '简单', val: easy, color: '#0ea678', x: 10 },
    { label: '中等', val: medium, color: '#d0a24a', x: 85 },
    { label: '困难', val: hard, color: '#e04a55', x: 160 }
  ];
  for (var i = 0; i < bars.length; i++) {
    var b = bars[i];
    var h = Math.max(3, (b.val / max) * 90);
    html += '<rect x="' + (b.x + 12) + '" y="' + (120 - h) + '" width="30" height="' + h + '" fill="' + b.color + '" rx="3" opacity="0.8"/>';
    html += '<text x="' + (b.x + 27) + '" y="115" text-anchor="middle" fill="#2c241b" font-family="Oswald" font-size="14" font-weight="700">' + b.val + '</text>';
    html += '<text x="' + (b.x + 27) + '" y="130" text-anchor="middle" fill="#87867f" font-size="8">' + b.label + '</text>';
  }
  document.getElementById('diffChart').innerHTML = html;
}

var _rankUsers = [];   // 排行榜当前用户列表（供点击柱子时取用户数据）

function drawUserBars(users) {
  _rankUsers = users;
  var html = '';
  if (users.length === 0) { document.getElementById('userChart').innerHTML = '<text x="230" y="70" text-anchor="middle" fill="#87867f" font-size="12">暂无用户数据</text>'; return; }
  var max = 1;
  for (var i = 0; i < users.length; i++) { if (users[i].answered > max) max = users[i].answered; }
  var barW = Math.min(50, 380 / users.length - 10);
  var gap = Math.min(20, 380 / users.length);
  var startX = 40;
  for (var i = 0; i < users.length; i++) {
    var u = users[i];
    var h = Math.max(3, (u.answered / max) * 90);
    var x = startX + i * (barW + gap);
    var accColor = u.accuracy >= 70 ? '#0ea678' : (u.accuracy >= 40 ? '#d0a24a' : '#e04a55');
    var tip = escapeHtml('查看 ' + u.username + ' 的答题记录');
    html += '<rect x="' + x + '" y="' + (115 - h) + '" width="' + barW + '" height="' + h + '" fill="' + accColor + '" rx="3" opacity="0.8" style="cursor:pointer" onclick="openUserDetail(_rankUsers[' + i + '])"><title>' + tip + '</title></rect>';
    html += '<text x="' + (x + barW / 2) + '" y="110" text-anchor="middle" fill="#2c241b" font-family="Oswald" font-size="11" font-weight="700">' + u.answered + '</text>';
    var name = u.username.length > 6 ? u.username.substring(0, 6) + '..' : u.username;
    html += '<text x="' + (x + barW / 2) + '" y="125" text-anchor="middle" fill="#87867f" font-size="7" style="cursor:pointer" onclick="openUserDetail(_rankUsers[' + i + '])">' + name + '</text>';
    html += '<text x="' + (x + barW / 2) + '" y="135" text-anchor="middle" fill="' + accColor + '" font-size="7">' + (u.answered > 0 ? u.accuracy + '%' : '-') + '</text>';
  }
  document.getElementById('userChart').innerHTML = html;
}

// ---- 用户答题记录弹窗 ----
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function openUserDetail(user) {
  if (!user || !user.session_id) return;
  var modal = document.getElementById('userDetailModal');
  modal.style.display = 'flex';
  document.getElementById('modalTitle').textContent = escapeHtml(user.username) + ' 的答题记录';
  document.getElementById('modalBody').innerHTML = '加载中...';
  adminFetch('/admin/user-progress?session_id=' + encodeURIComponent(user.session_id))
    .then(function(r) {
      if (r.status === 401) {
        sessionStorage.removeItem('admin_token');
        closeUserDetail();
        alert('管理员 Token 无效，请刷新页面重新输入');
        return null;
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d) {
      if (!d) return;
      var answers = d.answers || [];
      if (!answers.length) {
        document.getElementById('modalBody').innerHTML = '<p class="text-sm opacity-50">该用户暂无答题记录</p>';
        return;
      }
      var html = '<table><thead><tr><th>题目</th><th>用户答案</th><th>结果</th><th>用时</th><th>时间</th></tr></thead><tbody>';
      for (var i = 0; i < answers.length; i++) {
        var a = answers[i];
        var title = a.title || ('题目 #' + a.question_id);
        var ans = (a.user_answer || '').replace(/\s+/g, ' ').trim();
        if (ans.length > 40) ans = ans.substring(0, 40) + '…';
        var time = a.answered_at ? new Date(a.answered_at + ' UTC').toLocaleString() : '-';
        html += '<tr>' +
          '<td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(title) + '">' + escapeHtml(title) + '</td>' +
          '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(ans || '-') + '">' + escapeHtml(ans || '-') + '</td>' +
          '<td>' + (a.is_correct ? '<span style="color:#6b9e7a">对</span>' : '<span style="color:#c97a7a">错</span>') + '</td>' +
          '<td>' + (a.duration ? Math.round(a.duration) + 's' : '-') + '</td>' +
          '<td style="font-size:0.65rem;color:#87867f">' + escapeHtml(time) + '</td>' +
          '</tr>';
      }
      html += '</tbody></table>';
      document.getElementById('modalBody').innerHTML = html;
    })
    .catch(function(e) {
      console.error('[admin] 答题记录加载失败:', e);
      document.getElementById('modalBody').innerHTML =
        '<p class="text-sm" style="color:#b04a4a">加载失败：请确认后端已启动（更新后端后需重启服务）</p>';
    });
}

function closeUserDetail() {
  document.getElementById('userDetailModal').style.display = 'none';
}

function adminErrorMsg(e) {
  console.error('[admin] 加载失败:', e);
  // 无法连接（网络/CORS/后端未启动或未重启）
  return '<tr><td colspan="5" class="text-center" style="color:#b04a4a">无法连接后端：请确认服务已启动；' +
         '若刚更新过后端代码，请重启服务（CORS 配置需重启生效）</td></tr>';
}

// ---- 用户明细分页（每页 5 条） ----
var _allUsers = [];
var _userPage = 1;
var _PAGE_SIZE = 5;

function renderUserTable() {
  var total = _allUsers.length;
  var pages = Math.max(1, Math.ceil(total / _PAGE_SIZE));
  if (_userPage > pages) _userPage = pages;
  if (_userPage < 1) _userPage = 1;
  var start = (_userPage - 1) * _PAGE_SIZE;
  var pageUsers = _allUsers.slice(start, start + _PAGE_SIZE);

  var html = '';
  for (var i = 0; i < pageUsers.length; i++) {
    var u = pageUsers[i];
    var lastActive = u.last_active ? new Date(u.last_active + ' UTC').toLocaleString() : '从未作答';
    var accClass = u.accuracy >= 60 ? '' : (u.accuracy > 0 ? 'style="color:var(--accent)"' : 'style="color:var(--error)"');
    html += '<tr style="cursor:pointer" onclick="openUserDetail(_allUsers[' + (start + i) + '])" title="查看答题记录"><td><strong>' + u.username + '</strong></td>';
    html += '<td class="num-oswald">' + u.answered + '</td>';
    html += '<td style="color:var(--text)">' + u.correct + '</td>';
    html += '<td class="num-oswald" ' + accClass + '>' + (u.answered > 0 ? u.accuracy + '%' : '-') + '</td>';
    html += '<td style="font-size:0.65rem;color:#87867f">' + lastActive + '</td></tr>';
  }
  if (total === 0) html = '<tr><td colspan="5" class="text-center opacity-50 py-4">暂无用户数据</td></tr>';
  document.getElementById('userTableBody').innerHTML = html;

  // 分页控件
  var pager = document.getElementById('userPager');
  var info = document.getElementById('pagerInfo');
  var prevBtn = document.getElementById('pagerPrev');
  var nextBtn = document.getElementById('pagerNext');
  if (total > _PAGE_SIZE) {
    pager.style.display = 'flex';
    info.textContent = '第 ' + _userPage + ' / ' + pages + ' 页 · 共 ' + total + ' 人';
    prevBtn.style.opacity = _userPage <= 1 ? '0.4' : '1';
    prevBtn.style.pointerEvents = _userPage <= 1 ? 'none' : 'auto';
    nextBtn.style.opacity = _userPage >= pages ? '0.4' : '1';
    nextBtn.style.pointerEvents = _userPage >= pages ? 'none' : 'auto';
  } else {
    pager.style.display = 'none';
  }
}

function userPage(delta) {
  var pages = Math.max(1, Math.ceil(_allUsers.length / _PAGE_SIZE));
  _userPage = Math.min(pages, Math.max(1, _userPage + delta));
  renderUserTable();
}

async function loadAdmin() {
  document.getElementById('refreshTime').textContent = new Date().toLocaleTimeString();
  try {
    var statsRes = await adminFetch('/admin/stats');
    if (statsRes.status === 401) {
      sessionStorage.removeItem('admin_token');
      document.getElementById('userTableBody').innerHTML =
        '<tr><td colspan="5" class="text-center" style="color:#b04a4a">管理员 Token 无效，请刷新页面重新输入</td></tr>';
      document.getElementById('userPager').style.display = 'none';
      return;
    }
    if (!statsRes.ok) throw new Error('HTTP ' + statsRes.status);
    var stats = await statsRes.json();
    document.getElementById('statUsers').textContent = stats.total_users;
    document.getElementById('statAnswers').textContent = stats.total_answers;
    document.getElementById('statCorrect').textContent = stats.total_correct;
    document.getElementById('statAccuracy').textContent = stats.accuracy + '%';
    drawDonut(stats.total_correct, stats.total_answers - stats.total_correct);
    drawDiffBars(stats.by_difficulty.easy || 0, stats.by_difficulty.medium || 0, stats.by_difficulty.hard || 0);

    var usersRes = await adminFetch('/admin/users');
    if (!usersRes.ok) throw new Error('HTTP ' + usersRes.status);
    var users = await usersRes.json();
    // 用户答题排行：按答题数降序取前 5
    var rank = users.slice().sort(function(a, b) { return b.answered - a.answered; }).slice(0, 5);
    document.getElementById('rankLabel').textContent = '用户答题排行 · 前 ' + rank.length + ' 名';
    drawUserBars(rank);
    // 用户明细：分页渲染（每页 5 条）
    _allUsers = users;
    renderUserTable();
  } catch(e) {
    document.getElementById('userTableBody').innerHTML = adminErrorMsg(e);
    document.getElementById('userPager').style.display = 'none';
  }
}

loadAdmin();
setInterval(loadAdmin, 10000);
</script>
</body>
</html>
