<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 自适应练习</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" rel="stylesheet">
<style>
  :root { --bg: #eef3fc; --card: rgba(255,255,255,0.72); --text: #1b2747; --text2: #48577c; --border: rgba(88,110,170,0.16); --accent: #4a7dff; --accent-hover: #6a90ff; --tag-bg: rgba(88,110,170,0.08); --code-bg: rgba(255,255,255,0.75); --success: #0ea678; --error: #e04a55; --accent-grad: linear-gradient(135deg, #4a7dff 0%, #8b5bff 100%); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background:
    radial-gradient(1100px 700px at 88% -12%, rgba(140,120,255,0.16), transparent 60%),
    radial-gradient(900px 620px at -8% 18%, rgba(80,140,255,0.15), transparent 55%),
    radial-gradient(800px 560px at 50% 115%, rgba(70,190,210,0.12), transparent 55%),
    linear-gradient(180deg, #eef3fc 0%, #e3ecf9 100%);
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--text); margin: 0; padding: 0; line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
  /* 背景光球（玻璃拟态氛围） */
  .orb { position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none; }
  .orb-1 { width: 460px; height: 460px; background: #b9a6ff; top: -140px; right: -100px; opacity: 0.30; animation: orbDrift 19s ease-in-out infinite; }
  .orb-2 { width: 400px; height: 400px; background: #9cc0ff; top: 40%; left: -180px; opacity: 0.26; animation: orbDrift 24s ease-in-out infinite reverse; }
  .orb-3 { width: 340px; height: 340px; background: #93e2ea; bottom: -120px; right: 20%; opacity: 0.22; animation: orbDrift 27s ease-in-out infinite; }
  @keyframes orbDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(42px, -28px) scale(1.07); }
    66% { transform: translate(-30px, 24px) scale(0.94); }
  }
  .main-wrap { flex: 1 0 auto; position: relative; z-index: 1; }
  .page-footer { flex-shrink: 0; background: rgba(27, 39, 71, 0.85); color: #eef1f5; padding: 0.5rem 1rem; text-align: center; font-size: 0.65rem; opacity: 0.45; letter-spacing: 0.05em; position: relative; z-index: 1; }
  .card { background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 0.9rem; padding: 1rem; box-shadow: 0 8px 28px rgba(58,82,148,0.12), inset 0 1px 0 rgba(255,255,255,0.65); }
  .tag { display: inline-block; background: var(--tag-bg); color: var(--text2); font-size: 0.65rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 0.25rem; }
  .tag-easy { background: #EBF2FA; color: #1E5BA8; }
  .tag-medium { background: #f0eddf; color: #8a7a4a; }
  .tag-hard { background: #f0e4e4; color: #b06060; }
  .schema-box { background: var(--code-bg); color: var(--text); padding: 0.75rem 1rem; border-radius: 0.375rem; font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.75rem; line-height: 1.6; margin: 0.75rem 0; white-space: pre-wrap; overflow-x: auto; border: 1px solid var(--border); }
  .code-input { width: 100%; min-width: 200px; min-height: 72px; padding: 0.6rem 0.75rem; font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.8rem; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 0.375rem; outline: none; resize: both; overflow: auto; transition: border-color 0.15s; }
  .code-input:focus { border-color: var(--accent); }
  .CodeMirror { min-height: 72px; border: 1px solid var(--border); border-radius: 0.375rem; font-family: 'SF Mono','Consolas',monospace; font-size: 0.8rem; resize: both; background: var(--code-bg); }
  .CodeMirror-focused { border-color: var(--accent) !important; }
  .CodeMirror-scroll { min-height: 72px; }
  /* ============================================================
     SQL 高亮 — 普通模式
     Token: keyword(蓝) / function(橙) / string(灰+斜体) / number(紫) / comment(灰+斜体) / variable(青+下划线)
     色盲安全：蓝-橙-灰-紫 + 形状双编码（加粗/斜体/下划线）
     ============================================================ */
  .cm-s-default .cm-keyword   { color: #5a7d9a; font-weight: 700; }
  .cm-s-default .cm-builtin   { color: #5a7d9a; font-weight: 600; }
  .cm-s-default .cm-string    { color: #666666; font-style: italic; background: rgba(128,128,128,0.05); }
  .cm-s-default .cm-number    { color: #8B4BA8; }
  .cm-s-default .cm-comment   { color: #939393; font-style: italic; }
  .cm-s-default .cm-variable  { color: #1A7A7A; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
  .cm-s-default .cm-variable-2 { color: #1A7A7A; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
  .cm-s-default .cm-operator  { color: #3A3A3A; }
  .cm-s-default .cm-atom      { color: #8B4BA8; }
  .cm-sql-error { color: #C53030 !important; font-weight: 700; text-decoration: underline; text-decoration-color: #C53030; text-underline-offset: 2px; }
  .option-btn { display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--card); cursor: pointer; text-align: left; font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.75rem; color: var(--text); transition: all 0.12s; }
  .option-btn:hover { border-color: var(--accent); background: #f8fafc; }
  .option-btn.selected { border-color: var(--accent); background: #edf2f7; }
  .option-btn.correct { border-color: var(--success); background: #EBF2FA; }
  .option-btn.correct-answer { border-color: var(--success); background: #eaf4ee; font-weight: 700; }
  .option-btn.wrong { border-color: var(--error); background: #f5ebeb; }
  .result-box { margin-top: 0.75rem; padding: 0.75rem; border-radius: 0.375rem; font-size: 0.8rem; }
  .result-box.correct { background: #EBF2FA; border: 1px solid #C4D8F0; color: #1E5BA8; }
  .result-box.wrong { background: #f5ebeb; border: 1px solid #e4c8c8; color: #8a4040; }
  .result-box .explanation { margin-top: 0.4rem; color: var(--text2); font-size: 0.75rem; }
  .progress-track { height: 3px; background: var(--border); margin: 0.75rem 0; overflow: hidden; border-radius: 2px; }
  .progress-track .fill { height: 100%; background: var(--accent); transition: width 0.4s; }
  .filter-bar select { height: 34px; padding: 0 0.5rem; font-family: inherit; font-size: 0.75rem; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 0.375rem; outline: none; }
  .filter-bar select:focus { border-color: var(--accent); }
  .filter-bar input { height: 34px; padding: 0 0.75rem; font-family: inherit; font-size: 0.8rem; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 0.375rem; outline: none; }
  .filter-bar input:focus { border-color: var(--accent); }
  /* 级联分类 */
  .cat-parent-btn { display:inline-flex;align-items:center;height:34px;padding:0 0.55rem;font-size:0.75rem;font-weight:600;color:var(--text2);cursor:pointer;border:1px solid transparent;border-radius:0.25rem;transition:all 0.12s;white-space:nowrap;user-select:none; }
  .cat-parent-btn:hover { color:var(--accent);background:var(--tag-bg);border-color:var(--border); }
  .cat-parent-btn.active { color:var(--accent);background:#edf2f7; }
  .cat-sub-item { padding:0.35rem 1rem;font-size:0.72rem;color:var(--text);cursor:pointer;white-space:nowrap;transition:background 0.1s; }
  .cat-sub-item:hover { background:var(--tag-bg);color:var(--accent); }
  .cat-sub-all { font-weight:600;color:var(--accent);border-bottom:1px solid var(--border);margin-bottom:2px;padding-bottom:6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 1rem; font-family: inherit; font-size: 0.75rem; font-weight: 600; border-radius: 0.375rem; border: 1px solid transparent; cursor: pointer; transition: all 0.12s; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-accent { background: var(--accent-grad); color: #fff; box-shadow: 0 4px 18px rgba(90,100,255,0.35); }
  .btn-accent:hover:not(:disabled) { background: var(--accent-grad); box-shadow: 0 7px 26px rgba(90,100,255,0.5); transform: translateY(-1px); }
  .btn-primary { background: var(--accent-grad); color: #fff; box-shadow: 0 4px 18px rgba(90,100,255,0.35); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-grad); box-shadow: 0 7px 26px rgba(90,100,255,0.5); transform: translateY(-1px); }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-secondary:hover:not(:disabled) { background: var(--tag-bg); }
  .question-item { cursor: pointer; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.375rem; margin-bottom: 0.5rem; transition: border-color 0.12s; }
  .question-item:hover { border-color: var(--accent); }
  .question-item h3 { font-size: 0.85rem; margin: 0 0 0.2rem 0; font-weight: 600; }
  .question-item p { font-size: 0.7rem; color: var(--text2); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #questionDetail { display: none; }
  #questionDetail.visible { display: block; }
  .back-link { font-size: 0.7rem; color: var(--accent); cursor: pointer; margin-bottom: 0.75rem; display: inline-block; }
  .back-link:hover { text-decoration: underline; }
  .page { display: none; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.25s ease; }
  .nav-btn { padding: 0.5rem 1.1rem; font-family: inherit; font-size: 0.75rem; font-weight: 600; color: var(--text2); cursor: pointer; border: none; background: none; transition: all 0.18s; border-radius: 999px; }
  .nav-btn:hover { color: var(--text); background: var(--tag-bg); }
  .nav-btn.active { color: #fff; background: var(--accent-grad); box-shadow: 0 4px 14px rgba(90,100,255,0.35); }
  /* 导航按钮标签下移 0.75 字符高度（0.75em，按按钮自身字号计算） */
  .nav-btn { transform: translateY(0.75em); }
  /* 导航下方三个模块（自适应进阶/自主练习/真题/错题集页面）下移 0.5 字符高度 */
  #page-journey, #page-practice, #page-wrongset { transform: translateY(0.5em); }
  .graph-node { display:inline-flex; align-items:center; gap:3px; padding:3px 7px; border-radius:4px; font-size:0.6rem; font-weight:600; border:1px solid var(--border); background:var(--card); color:var(--text2); transition:all 0.15s; font-family:'SF Mono','Consolas',monospace; }
  .graph-node i { font-size: 0.55rem; }
  .opt-explain { font-size: 0.7rem; padding: 0.4rem 0.6rem; border-radius: 0.375rem; margin-bottom: 2px; display: flex; align-items: flex-start; gap: 6px; }
  .opt-explain .mark { flex-shrink: 0; font-weight: 700; font-size: 0.85rem; }
  .graph-node.mastered { border-color:var(--success); background:#EBF2FA; color:#1E5BA8; }
  .graph-node.current { border-color:var(--accent); background:#edf2f7; color:var(--accent); }
  .graph-node.locked { opacity:0.4; }
  .data-table { margin:0 0 0.5rem 0; border-collapse:collapse; font-size:0.7rem; font-family:'SF Mono','Consolas',monospace; }
  .data-table th { background:var(--text); color:#fff; padding:0.3rem 0.5rem; text-align:left; font-weight:600; }
  .data-table td { padding:0.25rem 0.5rem; border-bottom:1px solid var(--border); color:var(--text); }
  .data-table tr:nth-child(even) td { background:var(--tag-bg); }
  .expected-output-text { background:var(--tag-bg); padding:0.5rem; border-radius:4px; font-size:0.7rem; line-height:1.4; overflow-x:auto; white-space:pre; font-family:'SF Mono','Consolas',monospace; }
  .table-label { font-size:0.65rem; font-weight:600; color:var(--text2); margin:0.5rem 0 0.25rem 0; text-transform:uppercase; letter-spacing:0.04em; }
  .exp-label { font-size:0.65rem; font-weight:600; color:var(--text); margin:0.75rem 0 0.25rem 0; text-transform:uppercase; letter-spacing:0.04em; }
  /* 表格横排布局 */
  .tables-row { display:flex; gap:1rem; margin:0.75rem 0; }
  .tables-row .table-col { flex:1; min-width:0; overflow-x:auto; }
  .tables-row .table-col:only-child { flex:none; width:100%; }
  @media (max-width:640px) { .tables-row { flex-direction:column; } }
  .highlight-box { border-left: 3px solid var(--accent); background: var(--tag-bg); padding: 0.75rem 1rem; border-radius: 0 0.375rem 0.375rem 0; font-size:0.8rem; }
  .highlight-box strong { color: var(--accent); }
  .dark-bg { background: var(--text); color: #eef1f5; padding: 0.75rem 1rem; border-radius: 0.375rem; font-size:0.7rem; }
  .dark-bg a { color: var(--accent); }
  hr { border: 0; border-top: 2px solid var(--border); margin: 0.75rem 0; }
  .question-desc { white-space:pre-wrap; font-size:0.85rem; line-height:1.7; margin-bottom:0.75rem; padding:0.75rem 1rem; background:var(--tag-bg); border-left:3px solid var(--accent); border-radius:0 0.375rem 0.375rem 0; color:var(--text); font-weight:500; }
  .sql-toggle { display:inline-flex; align-items:center; gap:4px; font-size:0.65rem; color:var(--accent); cursor:pointer; font-weight:600; font-family:'SF Mono','Consolas',monospace; user-select:none; padding:2px 8px; border:1px solid var(--border); border-radius:0.25rem; background:var(--card); margin-bottom:0.5rem; }
  .sql-toggle:hover { background:var(--tag-bg); }
  .sql-panel { display:none; margin-bottom:0.75rem; }
  .sql-panel.open { display:block; }
  .sql-code { background:var(--text); color:#d4dce8; padding:0.75rem 1rem; border-radius:0.375rem; font-family:'SF Mono','Consolas',monospace; font-size:0.7rem; line-height:1.6; white-space:pre-wrap; overflow-x:auto; }
  .title-serif { font-weight:600; font-size:1rem; }
  .num-oswald { font-weight:600; }
  .accent { color: var(--accent); }
  .text-xs { font-size:0.65rem; }
  .text-sm { font-size:0.75rem; }
  .text-lg { font-size:1rem; }
  .text-xl { font-size:1.25rem; }
  .text-2xl { font-size:1.5rem; }
  .opacity-50 { opacity:0.5; }
  .opacity-60 { opacity:0.6; }
  .tracking-wider { letter-spacing:0.04em; }
  .tracking-widest { letter-spacing:0.06em; }
  .mb-1 { margin-bottom:0.25rem; }
  .mb-2 { margin-bottom:0.5rem; }
  .mb-3 { margin-bottom:0.75rem; }
  .mt-1 { margin-top:0.25rem; }
  .mt-2 { margin-top:0.5rem; }
  .mt-3 { margin-top:0.75rem; }
  .my-2 { margin-top:0.5rem; margin-bottom:0.5rem; }
  .my-3 { margin-top:0.75rem; margin-bottom:0.75rem; }
  .py-4 { padding-top:1rem; padding-bottom:1rem; }
  .py-6 { padding-top:1.5rem; padding-bottom:1.5rem; }
  .px-4 { padding-left:1rem; padding-right:1rem; }
  .p-2 { padding:0.5rem; }
  .p-3 { padding:0.75rem; }
  .p-4 { padding:1rem; }
  .p-5 { padding:1.25rem; }
  .p-6 { padding:1.5rem; }
  .p-8 { padding:2rem; }
  .flex { display:flex; }
  .gap-1 { gap:0.25rem; }
  .gap-2 { gap:0.5rem; }
  .gap-3 { gap:0.75rem; }
  .gap-6 { gap:1.5rem; }
  .justify-between { justify-content:space-between; }
  .justify-center { justify-content:center; }
  .items-center { align-items:center; }
  .items-start { align-items:flex-start; }
  .flex-col { flex-direction:column; }
  .flex-1 { flex:1; }
  .flex-wrap { flex-wrap:wrap; }
  .text-center { text-align:center; }
  .space-y-2 > * + * { margin-top:0.5rem; }
  .space-y-3 > * + * { margin-top:0.75rem; }
  .space-y-4 > * + * { margin-top:1rem; }
  .w-full { width:100%; }
  .leading-relaxed { line-height:1.6; }
  .rounded { border-radius:0.375rem; }
  .hidden { display:none; }
  .mr-1 { margin-right:0.25rem; }
  .ml-1 { margin-left:0.25rem; }
  .ml-auto { margin-left:auto; }
  /* ===== 色觉辅助模式 — 超高对比度 + 形状编码 (不依赖加粗) ===== */
  body.cb-mode {
    --bg: #FFFFFF; --card: #FFFFFF; --text: #000000; --text2: #333333;
    --border: #000000; --accent: #0044CC; --accent-hover: #003399;
    --tag-bg: #CCCCCC; --code-bg: #F5F5F5;
    --success: #1E5BA8; --error: #BF0000;
    filter: contrast(1.05);
  }
  body.cb-mode .card { border-width: 2px; }
  body.cb-mode .schema-box { background: #EEEEEE; border: 1px solid #000; }
  /* 难度标签 — 入门=蓝色 */
  body.cb-mode .tag-easy {
    background: #1E5BA8; color: #FFFFFF; border: 1px solid #000;
    text-decoration: underline; text-decoration-color: #FFD700; text-underline-offset: 2px;
  }
  body.cb-mode .tag-medium {
    background: #CC6600; color: #FFFFFF; border: 1px solid #000;
    text-decoration: underline; text-decoration-color: #FFD700; text-underline-offset: 2px;
  }
  body.cb-mode .tag-hard {
    background: #BF0000; color: #FFFFFF; border: 1px solid #000;
    text-decoration: underline; text-decoration-color: #FFD700; text-underline-offset: 2px;
  }
  /* 答题结果 — 正确=蓝底白字+左边框 */
  body.cb-mode .result-box.correct {
    background: #1E5BA8; color: #FFFFFF; border-left: 5px solid #000;
  }
  body.cb-mode .result-box.wrong {
    background: #BF0000; color: #FFFFFF; border-left: 5px solid #000;
  }
  /* 选项按钮 — 正确=蓝底白字+金色内框 */
  body.cb-mode .option-btn.correct {
    background: #1E5BA8; color: #FFFFFF; border: 2px solid #000;
    box-shadow: inset 0 0 0 2px #FFD700;
  }
  body.cb-mode .option-btn.wrong {
    background: #BF0000; color: #FFFFFF; border: 2px solid #000;
    box-shadow: inset 0 0 0 2px #FFD700;
  }
  body.cb-mode .option-btn.selected {
    background: #0044CC; color: #FFFFFF; border: 2px solid #000;
  }
  body.cb-mode .option-btn:hover { border-color: #000; border-width: 2px; }
  /* 导航 */
  body.cb-mode .nav-btn.active { background: #0044CC; color: #FFFFFF; border: 2px solid #000; }
  body.cb-mode .nav-btn { color: #333; }
  body.cb-mode .btn-primary { background: #0044CC; color: #FFF; border: 2px solid #000; }
  /* SQL 高亮 — 色盲辅助模式：对比度降低20%，形状编码保留 */
  body.cb-mode .cm-s-default .cm-keyword   { color: #1A5DB5; font-weight: 700; }
  body.cb-mode .cm-s-default .cm-builtin   { color: #B85A18; font-weight: 700; text-decoration: underline; text-decoration-style: solid; text-underline-offset: 2px; }
  body.cb-mode .cm-s-default .cm-string    { color: #4A4A4A; font-style: italic; background: rgba(150,150,150,0.14); }
  body.cb-mode .cm-s-default .cm-number    { color: #7D38A0; font-weight: 700; }
  body.cb-mode .cm-s-default .cm-comment   { color: #808080; font-style: italic; }
  body.cb-mode .cm-s-default .cm-variable  { color: #1A6E6E; font-weight: 600; text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 3px; }
  body.cb-mode .cm-s-default .cm-variable-2 { color: #1A6E6E; font-weight: 600; text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 3px; }
  body.cb-mode .cm-s-default .cm-operator  { color: #2A2A2A; }
  body.cb-mode .cm-s-default .cm-atom      { color: #7D38A0; font-weight: 700; }
  body.cb-mode .cm-sql-error { color: #FFFFFF !important; background: #C53030 !important; border: 1px solid #666; padding: 0 2px; font-weight: 700; }
  /* 眼睛图标 */
  #cbToggle:hover { opacity: 1 !important; }
  #cbToggle.cb-active { opacity: 1 !important; color: #0044CC !important; }
</style>
</head>
<body class="p-4">

<!-- 背景光球（玻璃拟态氛围） -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="max-w-[960px] mx-auto main-wrap">

  <!-- HEADER -->
  <div class="card" style="padding:0.75rem 1rem;">
    <div class="flex justify-between items-center">

// ===== CodeMirror SQL 语法高亮引擎 =====
const SQL_KEYWORDS = [
  'SELECT','FROM','WHERE','AND','OR','NOT','IN','EXISTS','BETWEEN','LIKE','IS','NULL',
  'JOIN','LEFT','RIGHT','INNER','OUTER','FULL','CROSS','ON','AS','USING',
  'INSERT','INTO','VALUES','UPDATE','SET','DELETE','DROP','CREATE','TABLE','ALTER','ADD',
  'COLUMN','INDEX','PRIMARY','KEY','FOREIGN','REFERENCES','CONSTRAINT','DEFAULT','CHECK',
  'UNIQUE','CASCADE','TRIGGER','VIEW','WITH','RECURSIVE','UNION','ALL','INTERSECT','EXCEPT',
  'GROUP','BY','HAVING','ORDER','ASC','DESC','LIMIT','OFFSET','DISTINCT','CASE','WHEN',
  'THEN','ELSE','END','COUNT','SUM','AVG','MAX','MIN','COALESCE','IFNULL','NULLIF',
  'CAST','CONVERT','ROUND','FLOOR','CEIL','ABS','LENGTH','SUBSTRING','REPLACE','CONCAT',
  'UPPER','LOWER','TRIM','DATE','YEAR','MONTH','DAY','HOUR','NOW','CURRENT_DATE',
  'OVER','PARTITION','ROW_NUMBER','RANK','DENSE_RANK','LAG','LEAD','FIRST_VALUE','LAST_VALUE',
  'IF','ELSE','WHILE','BEGIN','END','DECLARE','EXEC','EXECUTE','GO','USE',
  'INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL JOIN','CROSS JOIN','GROUP BY','ORDER BY',
  'CREATE TABLE','CREATE INDEX','CREATE VIEW','DROP TABLE','DROP INDEX','DROP VIEW',
  'INSERT INTO','DELETE FROM','UPDATE SET','PRIMARY KEY','FOREIGN KEY','NOT NULL',
  'DEFAULT VALUES','IF NOT EXISTS','IF EXISTS','CASCADE DELETE','SET NULL',
];
const SQL_FUNCTIONS = [
  'COUNT','SUM','AVG','MAX','MIN','COALESCE','IFNULL','NULLIF','CAST','CONVERT',
  'ROUND','FLOOR','CEIL','CEILING','ABS','POWER','SQRT','MOD','SIGN',
  'LENGTH','CHAR_LENGTH','SUBSTRING','SUBSTR','LEFT_STR','RIGHT_STR','REPLACE','CONCAT','CONCAT_WS',
  'UPPER','LOWER','TRIM','LTRIM','RTRIM','REVERSE','REPLICATE','SPACE','LPAD','RPAD',
  'NOW','CURRENT_DATE','CURRENT_TIMESTAMP','GETDATE','DATE','YEAR','MONTH','DAY','HOUR','MINUTE','SECOND',
  'DATEADD','DATEDIFF','DATE_FORMAT','DATEPART','STR_TO_DATE','TO_DATE',
  'ROW_NUMBER','RANK','DENSE_RANK','NTILE','LAG','LEAD','FIRST_VALUE','LAST_VALUE',
  'ISNULL','IS NULL','IS NOT NULL','IIF','CHOOSE',
];

function initCodeMirror(ta) {
  if (!ta || ta.classList.contains('cm-initialized')) return;
  if (typeof CodeMirror === 'undefined') return; // CDN 不可用时降级
  try {
    ta.classList.add('cm-initialized');
    ta.style.display = 'none';
    var wrapper = document.createElement('div');
    ta.parentNode.insertBefore(wrapper, ta);
    wrapper.appendChild(ta);

    var cm = CodeMirror.fromTextArea(ta, {
      mode: 'text/x-sql',
      theme: 'default',
      lineNumbers: false,
      matchBrackets: true,
      autoCloseBrackets: false,
      viewportMargin: Infinity,
      extraKeys: { 'Ctrl-Space': 'autocomplete' },
      hintOptions: { tables: {} }
    });

    cm.setSize('100%', Math.max(72, ta.offsetHeight || 72));
    cm.on('change', function() { validateSQL(cm); });
    cm.on('cursorActivity', function() { validateSQL(cm); });
    ta._cm = cm;

    // Initial validation
    setTimeout(function() { validateSQL(cm); }, 200);
    return cm;
  } catch(e) {
    console.error('CodeMirror init failed:', e);
    ta.classList.remove('cm-initialized');
    ta.style.display = ''; // 恢复原始 textarea
    return null;
  }
}

function initAllCodeMirrors() {
  var textareas = document.querySelectorAll('textarea.code-input:not(.cm-initialized)');
  textareas.forEach(function(ta) { initCodeMirror(ta); });
}

// 监听动态添加的 textarea
var cmObserver = new MutationObserver(function(mutations) {
  mutations.forEach(function(m) {
    m.addedNodes.forEach(function(node) {
      if (node.nodeType === 1) {
        if (node.classList && node.classList.contains('code-input') && !node.classList.contains('cm-initialized')) {
          initCodeMirror(node);
        }
        if (node.querySelectorAll) {
          node.querySelectorAll('textarea.code-input:not(.cm-initialized)').forEach(function(ta) { initCodeMirror(ta); });
        }
      }
    });
  });
});
cmObserver.observe(document.body, { childList: true, subtree: true });

function validateSQL(cm) {
  var text = cm.getValue();
  var marks = cm.getAllMarks();
  marks.forEach(function(m) { if (m.className === 'cm-sql-error') m.clear(); });

  if (!text.trim()) return;

  var lines = text.split('\n');

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/^\s*--/.test(line) || /^\s*$/.test(line)) continue;

    // 错误1: 未闭合单引号 — 从开头引号标到行尾
    var qPos = line.indexOf("'");
    if (qPos >= 0) {
      var afterFirst = line.substring(qPos + 1);
      if (afterFirst.indexOf("'") < 0) {
        cm.markText(
          { line: i, ch: qPos },
          { line: i, ch: line.length },
          { className: 'cm-sql-error', title: '单引号未闭合，字符串值需用一对引号包裹' }
        );
      }
    }

    // 错误2: 字符串值未加引号 — 只标红问题单词
    var valRegex = /=\s*([a-zA-Z_][a-zA-Z0-9_]*)(?=\s|;|$)/g;
    var m;
    while ((m = valRegex.exec(line)) !== null) {
      var val = m[1];
      if (val && !SQL_KEYWORDS.includes(val.toUpperCase()) && isNaN(val) &&
          val !== 'NULL' && val !== 'TRUE' && val !== 'FALSE') {
        var start = m.index + m[0].indexOf(val);
        cm.markText(
          { line: i, ch: start },
          { line: i, ch: start + val.length },
          { className: 'cm-sql-error', title: "字符串值需加引号: '" + val + "' → '" + val + "'" }
        );
      }
    }

    // 错误3: 字符串值缺单引号 (中文字符)
    var cnRegex = /=\s*([一-鿿㐀-䶿][一-鿿㐀-䶿\w]*)/g;
    var cn;
    while ((cn = cnRegex.exec(line)) !== null) {
      var cnVal = cn[1];
      // 排除引号内的内容
      var before = line.substring(0, cn.index);
      var singleBefore = (before.match(/'/g) || []).length;
      if (singleBefore % 2 === 0) {
        var start = cn.index + cn[0].indexOf(cnVal);
        cm.markText(
          { line: i, ch: start },
          { line: i, ch: start + cnVal.length },
          { className: 'cm-sql-error', title: "中文字符串需加引号: '" + cnVal + "'" }
        );
      }
    }
  }

  // 错误4: 括号不匹配 — 只标不匹配的括号
  var totalOpen = (text.match(/\(/g) || []).length;
  var totalClose = (text.match(/\)/g) || []).length;
  if (totalOpen !== totalClose) {
    var lastLine = lines.length - 1;
    var lastLineText = lines[lastLine];
    // 在最后一行找多余的括号
    var lastOpen = lastLineText.lastIndexOf('(');
    var lastClose = lastLineText.lastIndexOf(')');
    var ch = Math.max(lastOpen, lastClose);
    if (ch >= 0) {
      cm.markText(
        { line: lastLine, ch: ch },
        { line: lastLine, ch: ch + 1 },
        { className: 'cm-sql-error', title: '括号不匹配: ' + totalOpen + ' ( vs ' + totalClose + ' )' }
      );
    }
  }
}

// ====== 知识图谱层级分类 ======
// 层级树：key = 父节点ID, value = [子节点ID列表]
const KG_HIERARCHY = {
  'select_basic': ['alias','distinct','where_basic','order_by','aggregate_basic','join_inner','subquery_basic'],
  'where_basic':   ['where_andor','where_like','where_null','where_in','where_between'],
  'order_by':      ['limit_offset'],
  'aggregate_basic': ['group_by'],
  'group_by':      ['having','avg','count_distinct','case_when'],
  'join_inner':    ['join_left','join_self'],
  'join_left':     ['join_multi','join_full'],
  'subquery_basic':['subquery_exists','subquery_all','subquery_select'],
  'subquery_select': ['cte']
};
// 节点 → 中文显示名
const KG_LABELS = {
  'select_basic':'SELECT 基础', 'alias':'别名 AS', 'distinct':'DISTINCT 去重',
  'where_basic':'WHERE 条件', 'where_andor':'AND/OR 多条件', 'where_like':'LIKE 模糊',
  'where_null':'NULL 判断', 'where_in':'IN 运算符', 'where_between':'BETWEEN 范围',
  'order_by':'ORDER BY 排序', 'limit_offset':'LIMIT/OFFSET 分页',
  'aggregate_basic':'聚合函数基础', 'group_by':'GROUP BY 分组', 'having':'HAVING 过滤',
  'avg':'AVG 平均值', 'count_distinct':'COUNT DISTINCT', 'case_when':'CASE WHEN',
  'join_inner':'INNER JOIN 内连接', 'join_left':'LEFT JOIN 左连接', 'join_self':'自连接',
  'join_multi':'多表 JOIN', 'join_full':'FULL OUTER JOIN',
  'subquery_basic':'子查询基础', 'subquery_exists':'EXISTS 子查询',
  'subquery_all':'ALL/ANY 子查询', 'subquery_select':'SELECT 中子查询', 'cte':'CTE (WITH)',
  'window':'窗口函数', 'dml':'DML (增删改)', 'date':'日期处理', 'string':'字符串处理',
  'union':'UNION 合并'
};
// 大分类分组（第一个下拉框的选项）
const KG_GROUPS = [
  { label:'SELECT 基础', root:'select_basic', expand:true },
  { label:'条件筛选',   root:'where_basic', expand:true },
  { label:'排序与聚合', root:'aggregate_basic', expand:true, extraRoot:'order_by' },
  { label:'多表连接',   root:'join_inner', expand:true },
  { label:'子查询与CTE',root:'subquery_basic', expand:true },
];
// 无层级的叶节点（直接在第一框中作为独立选项）
const KG_LEAF = ['window','dml','date','string','union'];
// 预计算所有包含"全部子类"的根节点展开集合
const KG_ROOT_EXPAND = {};
function kgExpand(nodeId, collected) {
  collected = collected || new Set();
  collected.add(nodeId);
  var children = KG_HIERARCHY[nodeId];
  if (children) { for (var i=0;i<children.length;i++) kgExpand(children[i], collected); }
  return collected;
}
KG_GROUPS.forEach(function(g){
  var ids = new Set();
  kgExpand(g.root, ids);
  if (g.extraRoot) kgExpand(g.extraRoot, ids);
  KG_ROOT_EXPAND[g.root] = Array.from(ids);
});
KG_LEAF.forEach(function(k){ KG_ROOT_EXPAND[k] = [k]; });

// 静态选择题分类 → 知识图谱节点ID 映射
const STATIC_CAT_MAP = {
  'DML':  ['dml_select','dml_insert','dml_update','dml_delete'],
  'DDL':  ['ddl_create','ddl_alter','ddl_drop','ddl_truncate','ddl_rename','ddl_comment'],
  '函数':  ['string_func','numeric_func','aggregate_func','cast_func','window_func'],
  '表连接': ['join_inner','join_outer','join_self','join_cross'],
  '约束':  ['constraint_primary_key','constraint_foreign_key'],
  '子查询': ['subquery_scalar','subquery_column','subquery_table','subquery_in'],
  'SELECT':['select_basic','where_basic','group_by','having']
};
// ===== 自定义级联分类筛选 =====
var _catSelectedParent = null;  // 当前选中的父节点ID
var _catSelectedNode = null;    // 当前选中的子节点ID（null=全部子类）
var _catHideTimer = null;

function buildCategorySelect() {
  var parents = document.getElementById('catParents');
  // 大分类按钮
  for (var g = 0; g < KG_GROUPS.length; g++) {
    var grp = KG_GROUPS[g];
    var btn = document.createElement('div');
    btn.className = 'cat-parent-btn';
    btn.textContent = grp.label;
    btn.setAttribute('data-root', grp.root);
    btn.setAttribute('data-expand', grp.expand ? '1' : '0');
    if (grp.extraRoot) btn.setAttribute('data-extra', grp.extraRoot);
    btn.addEventListener('mouseenter', onCatParentHover);
    parents.appendChild(btn);
  }
  // 分隔
  var sep = document.createElement('div');
  sep.style.cssText = 'width:1px;height:18px;background:var(--border);margin:0 2px;align-self:center;';
  parents.appendChild(sep);
  // 独立叶节点
  for (var l = 0; l < KG_LEAF.length; l++) {
    var leaf = KG_LEAF[l];
    if (!KG_LABELS[leaf]) continue;
    var btn = document.createElement('div');
    btn.className = 'cat-parent-btn';
    btn.textContent = KG_LABELS[leaf];
    btn.setAttribute('data-leaf', leaf);
    btn.addEventListener('click', function(e){
      _catSelectedParent = null;
      _catSelectedNode = this.getAttribute('data-leaf');
      highlightCatSelection();
      onFilterChange();
    });
    parents.appendChild(btn);
  }
  // 子面板鼠标事件：保持显示
  var panel = document.getElementById('catSubPanel');
  panel.addEventListener('mouseenter', function(){ clearTimeout(_catHideTimer); });
  panel.addEventListener('mouseleave', function(){ _catHideTimer = setTimeout(hideSubPanel, 150); });
}

function onCatParentHover(e) {
  clearTimeout(_catHideTimer);
  var root = this.getAttribute('data-root');
  var extra = this.getAttribute('data-extra');
  var expand = this.getAttribute('data-expand') === '1';
  if (!expand) { hideSubPanel(); return; }

  var panel = document.getElementById('catSubPanel');
  panel.innerHTML = '';
  // "全部"选项
  var allItem = document.createElement('div');
  allItem.className = 'cat-sub-item cat-sub-all';
  allItem.textContent = '全部' + this.textContent;
  allItem.addEventListener('click', function(){
    _catSelectedParent = root;
    _catSelectedNode = null;
    highlightCatSelection();
    hideSubPanel();
    onFilterChange();
  });
  panel.appendChild(allItem);

  // 子节点
  buildSubItems(panel, root, 1);
  if (extra) buildSubItems(panel, extra, 1);

  // 定位面板
  var rect = this.getBoundingClientRect();
  var cascade = document.getElementById('catCascade');
  var cascadeRect = cascade.getBoundingClientRect();

function buildSubItems(panel, nodeId, depth) {
  if (KG_LABELS[nodeId]) {
    var item = document.createElement('div');
    item.className = 'cat-sub-item';
    item.style.paddingLeft = (8 + depth * 14) + 'px';
    item.textContent = KG_LABELS[nodeId];
    item.addEventListener('click', function(){
      _catSelectedParent = null;
      _catSelectedNode = nodeId;
      // 向上查找确认所属的父分类
      for (var key in KG_ROOT_EXPAND) {
        if (KG_ROOT_EXPAND[key] && KG_ROOT_EXPAND[key].indexOf(nodeId) !== -1) {
          _catSelectedParent = key;
          break;
        }
      }
      highlightCatSelection();
      hideSubPanel();
      onFilterChange();
    });
    panel.appendChild(item);
  }
  var children = KG_HIERARCHY[nodeId];
  if (children) {
    for (var i = 0; i < children.length; i++) {
      buildSubItems(panel, children[i], depth + 1);
    }
  }
}

// ====== Schema/Data/Expected Output Table Renders ======
function parseSchemaToMap(schemaStr) {
  var map = {};
  if (!schemaStr) return map;
  var stmts = schemaStr.split(';');
  for (var s = 0; s < stmts.length; s++) {
    var m = stmts[s].match(/(?:CREATE\s+TABLE\s+)?(\w+)\s*\((.*)\)/i);
    if (!m) continue;
    var tbl = m[1], raw = m[2], depth = 0, cur = '', cols = [];
    for (var i = 0; i < raw.length; i++) {
      var ch = raw[i];
      if (ch === '(') { depth++; cur += ch; }
      else if (ch === ')') { depth--; cur += ch; }
      else if (ch === ',' && depth === 0) { var p = cur.trim().split(/\s+/); if (p[0]) cols.push(p[0]); cur = ''; }
      else { cur += ch; }
    }
    if (cur.trim()) { var p = cur.trim().split(/\s+/); if (p[0]) cols.push(p[0]); }
    map[tbl] = cols;
  }
  return map;
}

function renderDataTable(dataStr, schemaStr) {
  if (!dataStr) return '';
  var schemaMap = parseSchemaToMap(schemaStr);
  var tableRows = {};
  var stmts = dataStr.split(';');
  for (var s = 0; s < stmts.length; s++) {
    var stmt = stmts[s].trim();
    if (!stmt) continue;
    var m = stmt.match(/INSERT\s+INTO\s+(\w+)\s*(\([^)]*\))?\s*VALUES\s*([\s\S]*)/i);
    if (!m) continue;
    var tbl = m[1], vp = m[3] || m[2], depth = 0, cur = '', groups = [];
    for (var i = 0; i < vp.length; i++) {
      var ch = vp[i];
      if (ch === '(' && depth === 0) { cur = ''; depth = 1; }
      else if (ch === '(' && depth > 0) { cur += ch; depth++; }
      else if (ch === ')' && depth > 1) { cur += ch; depth--; }
      else if (ch === ')' && depth === 1) { depth = 0; groups.push(cur); cur = ''; }
      else if (depth > 0) { cur += ch; }
    }
    if (!tableRows[tbl]) tableRows[tbl] = [];
    for (var g = 0; g < groups.length; g++) {
      var vals = [], vcur = '', inQ = false, qch = null;
      for (var i = 0; i < groups[g].length; i++) {
        var ch = groups[g][i];
        if (inQ) { if (ch === qch) inQ = false; else vcur += ch; }
        else if (ch === "'" || ch === '"') { inQ = true; qch = ch; }
        else if (ch === ',') { vals.push(vcur.trim()); vcur = ''; }
        else { vcur += ch; }
      }
      if (vcur.trim()) vals.push(vcur.trim());
      if (vals.length) tableRows[tbl].push(vals);
    }
  }
  var html = '';
  var tblNames = Object.keys(tableRows);
  for (var t = 0; t < tblNames.length; t++) {
    var tbl = tblNames[t];
    var rows = tableRows[tbl];
    if (!rows.length) continue;
    var hdrs = (schemaMap[tbl] && schemaMap[tbl].length) ? schemaMap[tbl] : rows[0].map(function(_, i) { return 'col' + (i+1); });
    html += '<div class="table-label">' + tbl + '</div><table class="data-table"><thead><tr>';
    for (var h = 0; h < hdrs.length; h++) html += '<th>' + hdrs[h] + '</th>';
    html += '</tr></thead><tbody>';
    var maxRows = 15;
    var showAll = rows.length <= maxRows;
    for (var r = 0; r < Math.min(rows.length, maxRows); r++) {
      html += '<tr>';
      for (var c = 0; c < rows[r].length; c++) html += '<td>' + rows[r][c] + '</td>';
      html += '</tr>';
    }
    if (!showAll) {
      html += '<tr><td colspan="' + hdrs.length + '" style="text-align:center;color:#999;font-style:italic;padding:0.5rem">... 共 ' + rows.length + ' 行，仅显示前 ' + maxRows + ' 行 ...</td></tr>';
    }
    html += '</tbody></table>';
  }
  return html;
}

function renderExpectedOutput(expStr) {
  if (!expStr) return '';
  // Try JSON format first
  try {
    var data = JSON.parse(expStr);
    if (data.rows && data.rows.length) {
      var html = '<div class="exp-label">预期输出</div><table class="data-table"><thead><tr>';
      for (var h = 0; h < data.headers.length; h++) html += '<th>' + data.headers[h] + '</th>';
      html += '</tr></thead><tbody>';
      for (var r = 0; r < data.rows.length; r++) {
        var isSep = data.rows[r][0] === '...' || data.rows[r][0] === '…';
        html += '<tr' + (isSep ? ' style="text-align:center;color:var(--text2);font-style:italic;background:var(--tag-bg)"' : '') + '>';
        if (isSep) {
          html += '<td colspan="' + data.headers.length + '" style="padding:0.35rem">' + (data.rows[r][1] || data.rows[r][0]) + '</td>';
        } else {
          for (var c = 0; c < data.rows[r].length; c++) html += '<td>' + (data.rows[r][c] === null ? 'NULL' : data.rows[r][c]) + '</td>';
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      return html;
    }
  } catch(e) { /* fall through to text format */ }
  // Text table format: lines with | separator, second line is -+-
  var lines = expStr.split('\n');
  if (lines.length < 2) return '<div class="exp-label">预期输出</div><pre class="expected-output-text">' + expStr + '</pre>';
  var headerLine = lines[0];
  var sepLine = lines[1] || '';
  var dataLines = [];
  for (var i = 2; i < lines.length; i++) {
    if (lines[i].trim()) dataLines.push(lines[i]);
  }
  // Check if separator line contains -+- (table format)
  if (sepLine.indexOf('-+-') >= 0) {
    var headers = headerLine.split('|').map(function(s) { return s.trim(); });
    var html = '<div class="exp-label">预期输出</div><table class="data-table"><thead><tr>';
    for (var h = 0; h < headers.length; h++) html += '<th>' + headers[h] + '</th>';
    html += '</tr></thead><tbody>';
    for (var r = 0; r < dataLines.length; r++) {
      var cells = dataLines[r].split('|').map(function(s) { return s.trim(); });
      html += '<tr>';
      for (var c = 0; c < cells.length; c++) html += '<td>' + cells[c] + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
  }
  return '<div class="exp-label">预期输出</div><pre class="expected-output-text">' + expStr + '</pre>';
}

function renderSqlPanel(q) {
  if (!q.table_schema && !q.initial_data) return '';
  var code = '';
  if (q.table_schema) code += q.table_schema.replace(/</g, '&lt;') + ';\n';
  if (q.initial_data) code += q.initial_data.replace(/</g, '&lt;') + '\n';
  var id = 'sql_panel_' + q.id;
  return '<div class="sql-toggle" onclick="var p=document.getElementById(\'' + id + '\');p.classList.toggle(\'open\');this.querySelector(\'span\').textContent=p.classList.contains(\'open\')?\'收起 SQL\':\'展开 SQL\'"><span>展开 SQL</span> <i class="fas fa-chevron-down" style="font-size:0.5rem"></i></div><div class="sql-panel" id="' + id + '"><div class="sql-code">' + code + '</div></div>';
}

function renderSchemaAndData(q) {
  var html = '';
  if (q.initial_data) html += renderDataTable(q.initial_data, q.table_schema);
  return html;
}

function renderTablesRow(q) {

    (dataHtml ? '<div class="table-col">' + dataHtml + '</div>' : '') +

}

// 登录态失效（401）→ 清会话并回登录页
function redirectIfUnauthorized(r) {
  if (r.status === 401) {
    sessionStorage.removeItem('sql_user');
    window.location.href = '/login';
    return true;
  }
  return false;
}

// 登录门槛：所有 API 需携带 session_id（GET 走查询参数，POST 走请求体）
function withSessionParam(path) {
  if (path.indexOf('session_id') !== -1) return path;
  return path + (path.indexOf('?') === -1 ? '?' : '&') + 'session_id=' + encodeURIComponent(sessionId);
}

async function apiGet(path) {
  var t0 = performance.now();
  const r = await fetch(API_BASE + withSessionParam(path));
  var ms = Math.round(performance.now() - t0);
  _showPerf(ms, path.split('?')[0]);
  if (redirectIfUnauthorized(r)) throw new Error('unauthorized');
  if (!r.ok) throw new Error('API error');
  return r.json();
}

async function apiPost(path, data) {
  saveAllCM();
  data = data || {};
  if (!data.session_id) data.session_id = sessionId;
  var t0 = performance.now();
  const r = await fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  var ms = Math.round(performance.now() - t0);
  _showPerf(ms, path.split('?')[0]);
  if (redirectIfUnauthorized(r)) throw new Error('unauthorized');
  if (!r.ok) throw new Error('API error');
  return r.json();
}

function parseOptions(str) {

}

function showOptionExplanations(prefix, qid, options, explanations, correctAnswer) {
  var container = document.getElementById(prefix + '_opts_' + qid);

    html += '<div class="opt-explain" style="background:' + (isCorrect ? 'rgba(34,139,34,0.08)' : 'rgba(220,20,20,0.06)') + '">';

    html += '<span><code style="font-family:Oswald,Consolas,monospace;font-size:0.75rem">' + opts[i].replace(/</g, '&lt;') + '</code>';
    if (explain) html += '<br><span style="color:#666;font-size:0.75rem">' + explain + '</span>';

  }

function renderQuestion(q, prefix) {
  var diffMap = { easy: '简单', medium: '中等', hard: '困难' };

  var hint = q.hint || '';
  var html = '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + q.category + '</span>';
  html += '<span class="tag ' + diffClass[q.difficulty] + '">' + diffMap[q.difficulty] + '</span>';
  html += '<span class="tag" style="background:' + (hasOpts ? 'rgba(52,119,191,0.15)' : 'rgba(193,124,74,0.20)') + ';color:' + (hasOpts ? '#3477bf' : '#a8683e') + '">' + (hasOpts ? '选择题' : '填空题') + '</span>';

    if (hint) html += '<div class="text-xs mb-2" style="color:#a8683e"><i class="fas fa-lightbulb mr-1"></i> ' + hint + '</div>';
    html += '<textarea class="code-input" id="' + prefix + '_inp_' + q.id + '" placeholder="手动输入你的 SQL 语句..." oninput="clearOpt(\'' + prefix + '\',' + q.id + ')"></textarea>';

  return html;
}

function getNodeName(nodeId, graph) {
  if (!graph || !graph.nodes) return nodeId;
  for (var i = 0; i < graph.nodes.length; i++) {
    if (graph.nodes[i].id === nodeId) return graph.nodes[i].name;
  }
  return nodeId;
}

function renderJourneyBadges(graph, mastery, unlocked, current) {
  var el = document.getElementById('journeyGraph');
  if (!graph || !graph.nodes) { el.innerHTML = ''; return; }
  var html = '';
  var unlockedSet = {};
  var masteredSet = {};
  if (unlocked) for (var i = 0; i < unlocked.length; i++) unlockedSet[unlocked[i]] = true;
  if (mastery) for (var key in mastery) {
    if (mastery[key].total_count > 0 && mastery[key].correct_count / mastery[key].total_count >= 0.7) masteredSet[key] = true;
  }
  var unlockedCount = 0;
  for (var j = 0; j < graph.nodes.length; j++) {
    var n = graph.nodes[j];
    var cls = 'graph-node';
    if (n.id === current) { cls += ' current'; unlockedCount++; }
    else if (masteredSet[n.id]) { cls += ' mastered'; unlockedCount++; }
    else if (unlockedSet[n.id]) { cls += ''; unlockedCount++; }
    else cls += ' locked';
    html += '<span class="' + cls + '" title="' + (n.description || '') + '"><i class="fas ' + (n.icon || 'fa-code') + '"></i>' + n.name + '</span>';
  }
  el.innerHTML = html;
  document.getElementById('unlockedCount').textContent = unlockedCount;
}

// ==================== 刷题 ====================
// ---- 筛选器事件 ----
function onFilterChange() {
  loadPracticeQuestions();
}

async function loadPracticeQuestions() {
  var difficulty = document.getElementById('filterDifficulty').value;
  var nodeIds = resolveCategoryFilter();
  var params = [];
  // 优先用知识图谱节点筛选；退化为category筛选
  if (nodeIds && nodeIds.length > 0) {
    // 后端支持 node=xxx 参数：筛选关联该知识节点的题目
    // 取第一个节点（选择父分类时，后端已通过 _expand 展开）
    params.push('node=' + encodeURIComponent(nodeIds[0]));
  }
  if (difficulty) params.push('difficulty=' + encodeURIComponent(difficulty));
  document.getElementById('practiceList').innerHTML = '<div class="text-center text-sm py-4 opacity-50"><i class="fas fa-spinner fa-spin mr-1"></i> 加载中...</div>';
  document.getElementById('questionDetail').classList.remove('visible');
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('practiceList').style.display = 'block';
  try {
    params.push('pool=' + currentPool);
    var data = await apiGet('/questions?' + params.join('&'));
    practiceQuestions = data.questions;
    // Merge static questions into practice pool
    if (currentPool === 'practice') {
      practiceQuestions = practiceQuestions.concat(STATIC_QUESTIONS);
    }
    renderPracticeList();
  } catch (e) {
    document.getElementById('practiceList').innerHTML = '<p style="color:#b04a4a;text-align:center">加载失败，请确保后端已启动</p>';
  }
}

function renderPracticeList() {
  var el = document.getElementById('practiceList');
  // Apply all filters client-side (search + type + difficulty + category)
  var searchText = (document.getElementById('filterSearch').value || '').toLowerCase();
  var filterType = document.getElementById('filterType').value;
  var filterDifficulty = document.getElementById('filterDifficulty').value;
  var nodeIds = resolveCategoryFilter();
  var filtered = practiceQuestions;
  if (searchText) {
    filtered = filtered.filter(function(q) {
      return (q.title && q.title.toLowerCase().indexOf(searchText) !== -1) ||
             (q.description && q.description.toLowerCase().indexOf(searchText) !== -1) ||
             (q.category && q.category.toLowerCase().indexOf(searchText) !== -1);
    });
  }
  if (filterType === 'mcq') {
    filtered = filtered.filter(function(q) { return q.options && q.options.toString().trim(); });
  } else if (filterType === 'fillin') {
    filtered = filtered.filter(function(q) { return !q.options || !q.options.toString().trim(); });
  }
  if (filterDifficulty) {
    filtered = filtered.filter(function(q) { return q.difficulty === filterDifficulty; });
  }
  // 分类筛选（对静态题+动态题统一生效）
  if (nodeIds && nodeIds.length > 0) {
    filtered = filtered.filter(function(q) {
      if (nodeIds.indexOf(q.category) !== -1) return true;
      // 静态选择题分类映射
      var mapped = STATIC_CAT_MAP[q.category];
      if (mapped) {
        for (var k = 0; k < mapped.length; k++) {
          if (nodeIds.indexOf(mapped[k]) !== -1) return true;
        }
      }
      return false;
    });
  }
  document.getElementById('poolCount').textContent = filtered.length + ' 题';

  if (!filtered.length) {
    el.innerHTML = '<div class="text-center text-sm py-4 opacity-50">暂无符合条件的题目</div>';
    return;
  }
  var diffMap = { easy: '简单', medium: '中等', hard: '困难' };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var q = filtered[i];
    var hasOpts = q.options && (typeof q.options === 'string' ? q.options.trim() : q.options.length);
    var desc = (q.description || '').replace(/\n/g, ' ').substring(0, 80);
    var qid = q.id != null ? q.id : ('static_' + practiceQuestions.indexOf(q));
    html += '<div class="card p-3 question-item" onclick="showPracticeDetail(\'' + qid + '\')">';
    html += '<div class="flex gap-2 flex-wrap mb-1">';
    html += '<span class="tag">' + q.category + '</span>';
    html += '<span class="tag ' + (diffClass[q.difficulty] || '') + '">' + (diffMap[q.difficulty] || q.difficulty) + '</span>';
    html += '<span class="tag" style="background:' + (hasOpts ? 'rgba(52,119,191,0.15)' : 'rgba(193,124,74,0.20)') + ';color:' + (hasOpts ? '#3477bf' : '#a8683e') + '">' + (hasOpts ? '选择' : '填空') + '</span>';
    html += '</div>';
    html += '<h3>' + q.title + '</h3>';
    html += '<p>' + desc + '...</p>';
    html += '</div>';
  }
  el.innerHTML = html;
}

function showPracticeDetail(qid) {
  var q = null;
  // Find question by id (number for API, string 'static_N' for static)
  for (var i = 0; i < practiceQuestions.length; i++) {
    var pq = practiceQuestions[i];
    var pqid = pq.id != null ? pq.id : ('static_' + i);
    if (pqid == qid) { q = pq; if (pq.id == null) q._isStatic = true; break; }
  }
  if (!q) return;
  currentPracticeQ = q;
  document.getElementById('practiceList').style.display = 'none';
  var detail = document.getElementById('questionDetail');
  detail.style.display = 'block';
  detail.classList.add('visible');
  document.getElementById('practiceQuestion').innerHTML = renderPracticeQuestion(q);
  setTimeout(initAllCodeMirrors, 100);
  setTimeout(function() { var ta = document.querySelector('#practiceQuestion textarea'); if (ta && ta._cm) ta._cm.focus(); else if (ta) ta.focus(); }, 150);
}

function renderPracticeQuestion(q) {
  var diffMap = { easy: '简单', medium: '中等', hard: '困难' };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
  var hasOpts = q.options && (typeof q.options === 'string' ? q.options.trim() : q.options.length);
  var html = '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + q.category + '</span>';
  html += '<span class="tag ' + (diffClass[q.difficulty] || '') + '">' + (diffMap[q.difficulty] || q.difficulty) + '</span>';
  html += '<span class="tag" style="background:' + (hasOpts ? 'rgba(52,119,191,0.15)' : 'rgba(193,124,74,0.20)') + ';color:' + (hasOpts ? '#3477bf' : '#a8683e') + '">' + (hasOpts ? '选择题' : '填空题') + '</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + q.title + '</h3>';
  html += '<p class="question-desc">' + q.description + '</p>';

  // Static questions: simple MCQ, no SQL execution
  if (q._isStatic) {
    if (hasOpts) {
      html += '<div class="flex flex-col gap-1.5 my-2" id="prac_opts_static">';
      var opts = Array.isArray(q.options) ? q.options : parseOptions(q.options);
      for (var i = 0; i < opts.length; i++) {
        var optText = typeof opts[i] === 'string' ? opts[i] : (opts[i].text || opts[i]);
        var optKey = typeof opts[i] === 'object' && opts[i].key ? opts[i].key : String.fromCharCode(65 + i);
        html += '<button class="option-btn" onclick="checkStaticAnswer(\'' + optKey + '\',this)">' + optKey + '. ' + optText.replace(/</g, '&lt;') + '</button>';
      }
      html += '</div>';
    }
    html += '<div id="prac_res_static" class="result-box" style="display:none"></div>';
    return html;
  }

  html += renderTablesRow(q);
  html += renderSqlPanel(q);
  if (hasOpts) {
    html += '<div class="flex flex-col gap-1.5 my-2" id="prac_opts_' + q.id + '">';
    var opts = parseOptions(q.options);
    for (var i = 0; i < opts.length; i++) {
      html += '<button class="option-btn" onclick="selectOpt(\'prac\',' + q.id + ',' + i + ',this)">' + opts[i].replace(/</g, '&lt;') + '</button>';
    }
    html += '</div>';
  } else {
    html += '<textarea class="code-input" id="prac_inp_' + q.id + '" placeholder="手动输入你的 SQL 语句..."></textarea>';
  }
  html += '<div id="prac_res_' + q.id + '" class="result-box" style="display:none"></div>';
  html += '<div class="mt-2"><button class="btn btn-primary" id="prac_btn_' + q.id + '" onclick="submitPracticeAnswer(' + q.id + ')"><i class="fas fa-paper-plane mr-1"></i> 提交答案</button></div>';
  return html;
}

function checkStaticAnswer(key, btn) {
  var q = currentPracticeQ;
  if (!q) return;
  var correct = q.answer || q.correct_answer;
  var isCorrect = (key === correct);
  // Disable all option buttons
  var allBtns = document.querySelectorAll('#prac_opts_static .option-btn');
  for (var i = 0; i < allBtns.length; i++) { allBtns[i].disabled = true; }
  // Highlight
  btn.classList.add(isCorrect ? 'selected' : 'wrong');
  // Find and highlight correct
  for (var i = 0; i < allBtns.length; i++) {
    var bkey = allBtns[i].textContent.charAt(0);
    if (bkey === correct) allBtns[i].classList.add('correct-answer');
  }
  var res = document.getElementById('prac_res_static');
  res.style.display = 'block';
  res.className = 'result-box ' + (isCorrect ? 'correct' : 'wrong');
  res.innerHTML = isCorrect
    ? '<strong><i class="fas fa-check-circle mr-1"></i> 回答正确！</strong>'
    : '<strong><i class="fas fa-times-circle mr-1"></i> 回答错误，正确答案：' + correct + '</strong>';
  if (q.explanation) {
    res.innerHTML += '<div class="explanation"><i class="fas fa-lightbulb mr-1"></i> ' + q.explanation + '</div>';
  }
}

async function submitPracticeAnswer(qid) { saveAllCM();
  var q = null;
  for (var i = 0; i < practiceQuestions.length; i++) { if (practiceQuestions[i].id === qid) { q = practiceQuestions[i]; break; } }
  if (!q) q = currentPracticeQ;
  var input = '';
  var inp = document.getElementById('prac_inp_' + qid);
  if (inp) { input = inp.value.trim(); } else {
    var sel = document.querySelector('#prac_opts_' + qid + ' .option-btn.selected');
    if (sel) input = sel.textContent.trim();
  }
  if (!input) return alert('请先输入或选择答案');
  var result = await apiPost('/submit', { session_id: sessionId, question_id: qid, answer: input });
  var resultBox = document.getElementById('prac_res_' + qid);
  resultBox.style.display = 'block';
  resultBox.className = 'result-box ' + (result.is_correct ? 'correct' : 'wrong');
  resultBox.innerHTML = result.is_correct
    ? '<strong><i class="fas fa-check-circle mr-1"></i> 回答正确</strong>'
    : '<strong><i class="fas fa-times-circle mr-1"></i> 回答错误</strong><br>正确答案：<strong>' + result.correct_answer + '</strong>';
  resultBox.innerHTML += '<div class="explanation"><i class="fas fa-lightbulb mr-1"></i> ' + (result.explanation || '') + '</div>';
  if (!result.is_correct && q && q.options && q.option_explanations) {
    showOptionExplanations('prac', qid, q.options, q.option_explanations, q.correct_answer);
  }
  var btn = document.getElementById('prac_btn_' + qid);
  if (btn) { btn.disabled = true; btn.textContent = '已提交'; }
  var isMcq = q && q.options && (typeof q.options === 'string' ? q.options.trim() : q.options.length);
  var showDerivedNext = result.is_correct && isMcq;
  if (showDerivedNext) {
    currentPrototypeQ = q;
  } else {
    currentPrototypeQ = null;
  }
  var nextLabel = showDerivedNext ? '举一反三 →' : '下一题';
  var nextHint = showDerivedNext ? '已掌握该选择题，进入举一反三' : '';
  resultBox.innerHTML += '<div class="mt-3" style="border-top:1px solid var(--border);padding-top:0.75rem">' +
    (nextHint ? '<p class="text-sm mb-2"><i class="fas fa-lightbulb mr-1" style="color:var(--accent)"></i> ' + nextHint + '</p>' : '') +
    '<button class="btn btn-accent" onclick="onPracticeNext()"><i class="fas fa-arrow-right mr-1"></i> ' + nextLabel + '</button></div>';
}

function onPracticeNext() {
  if (currentPrototypeQ) {
    var pid = currentPrototypeQ.id;
    currentPrototypeQ = null;
    startDerivedPractice(pid);
  } else {
    backToPracticeList();
  }
}

async function startDerivedPractice(prototypeId) {
  document.getElementById('practiceList').style.display = 'none';
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('questionDetail').classList.remove('visible');
  var section = document.getElementById('deriveSection');
  section.style.display = 'block';
  var area = document.getElementById('deriveArea');
  area.innerHTML = '<div class="text-center text-sm py-4 opacity-50"><i class="fas fa-spinner fa-spin mr-1"></i> 生成举一反三题目...</div>';

    var resp = await apiPost('/practice/derive', { question_id: prototypeId });
    currentDerivedQ = resp.derived_question;
    renderDerivedQuestion(currentDerivedQ);
  } catch(e) {
    area.innerHTML = '<p style="color:#b04a4a">生成失败</p>';

}

function renderDerivedQuestion(dq) {
  var area = document.getElementById('deriveArea');
  var html = '<div class="highlight-box mb-3"><p class="text-sm"><i class="fas fa-lightbulb mr-1 accent"></i><strong>举一反三</strong> — 这是根据你刚做对的选择题生成的填空题，请手动编写 SQL 语句。</p></div>';
  // Tags
  var diffMap = { easy: '简单', medium: '中等', hard: '困难' };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
  html += '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + dq.category + '</span>';
  html += '<span class="tag ' + diffClass[dq.difficulty] + '">' + diffMap[dq.difficulty] + '</span>';
  html += '<span class="tag" style="background:rgba(193,124,74,0.20);color:#a8683e">填空题</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + dq.title + '</h3>';
  html += '<p class="question-desc">' + dq.description + '</p>';
  // Schema and data
  if (dq.initial_data) {
    var schemaHtml = '';
    var schemaMap = {};
    try {
      if (dq.table_schema) {
        var stmts = dq.table_schema.split(';');
        for (var s = 0; s < stmts.length; s++) {
          var m = stmts[s].match(/(?:CREATE\s+TABLE\s+)?(\w+)\s*\((.*)\)/i);
          if (m) { schemaMap[m[1]] = m[2]; }
        }
      }
      // Use existing renderDataTable
      var dataHtml = renderDataTable(dq.initial_data, dq.table_schema);
      html += dataHtml;
    } catch(e) {}
  }
  // SQL panel
  html += '<div class="sql-toggle" onclick="var p=document.getElementById(\'derivedSqlPanel\');p.classList.toggle(\'open\');this.querySelector(\'span\').textContent=p.classList.contains(\'open\')?\'收起 SQL\':\'展开 SQL\'"><span>展开 SQL</span> <i class="fas fa-chevron-down" style="font-size:0.5rem"></i></div><div class="sql-panel" id="derivedSqlPanel"><div class="sql-code">';
  if (dq.table_schema) html += dq.table_schema.replace(/</g, '&lt;') + ';\n';
  if (dq.initial_data) html += dq.initial_data.replace(/</g, '&lt;') + '\n';
  html += '</div></div>';
  // Expected output
  if (dq.expected_output) html += renderExpectedOutput(dq.expected_output);
  // Input
  html += '<textarea class="code-input" id="derived_inp" placeholder="手动输入你的 SQL 语句..."></textarea>';
  html += '<div id="derived_res" class="result-box" style="display:none"></div>';
  html += '<div class="mt-2"><button class="btn btn-primary" id="derived_btn" onclick="submitDerivedAnswer()"><i class="fas fa-paper-plane mr-1"></i> 提交答案</button></div>';
  area.innerHTML = html;
  setTimeout(initAllCodeMirrors, 100);
  setTimeout(function() { var ta = document.getElementById('derived_inp'); if (ta && ta._cm) ta._cm.focus(); else if (ta) ta.focus(); }, 150);
}

async function submitDerivedAnswer() { saveAllCM();
  if (!currentDerivedQ) return;
  var input = document.getElementById('derived_inp').value.trim();
  if (!input) return alert('请先输入 SQL 语句');
  var result = await apiPost('/submit', { session_id: sessionId, question_id: currentDerivedQ.id, answer: input });
  var resultBox = document.getElementById('derived_res');
  resultBox.style.display = 'block';
  resultBox.className = 'result-box ' + (result.is_correct ? 'correct' : 'wrong');
  resultBox.innerHTML = result.is_correct
    ? '<strong><i class="fas fa-check-circle mr-1"></i> 回答正确</strong>'
    : '<strong><i class="fas fa-times-circle mr-1"></i> 回答错误</strong><br>正确答案：<strong>' + result.correct_answer + '</strong>';
  resultBox.innerHTML += '<div class="explanation"><i class="fas fa-lightbulb mr-1"></i> ' + (result.explanation || '') + '</div>';
  var btn = document.getElementById('derived_btn');
  if (btn) { btn.disabled = true; btn.textContent = '已提交'; }
  // Get next recommendation
  var rec = await apiPost('/practice/recommend', {
    session_id: sessionId,
    derived_question_id: currentDerivedQ.id,
    was_correct: result.is_correct
  });
  resultBox.innerHTML += '<div class="mt-3" style="border-top:1px solid var(--border);padding-top:0.75rem">';
  if (rec.recommended && rec.question) {
    resultBox.innerHTML += '<p class="text-sm mb-2"><i class="fas fa-arrow-right mr-1" style="color:var(--accent)"></i> ' + rec.reason + '</p>';
    resultBox.innerHTML += '<button class="btn btn-accent" onclick="showRecommendedQuestion(' + rec.question.id + ')"><i class="fas fa-play mr-1"></i> 开始练习</button>';
    // Store the recommended question
    var found = false;
    for (var i = 0; i < practiceQuestions.length; i++) {
      if (practiceQuestions[i].id === rec.question.id) { found = true; break; }
    }
    if (!found) practiceQuestions.push(rec.question);
    currentPrototypeQ = null;
  } else {
    resultBox.innerHTML += '<p class="text-sm opacity-60"><i class="fas fa-check-circle mr-1" style="color:var(--success)"></i> 该知识点已全部掌握，可返回列表选择其他题目</p>';
  }
  resultBox.innerHTML += '</div>';
}

function showRecommendedQuestion(qid) {
  var q = null;
  for (var i = 0; i < practiceQuestions.length; i++) { if (practiceQuestions[i].id === qid) { q = practiceQuestions[i]; break; } }
  if (!q) return;
  // Show this question in the detail view
  document.getElementById('deriveSection').style.display = 'none';

  setTimeout(initAllCodeMirrors, 100);
  setTimeout(function() { var ta = document.querySelector('#practiceQuestion textarea'); if (ta && ta._cm) ta._cm.focus(); else if (ta) ta.focus(); }, 150);
}

function exitDerivedPractice() {
  document.getElementById('deriveSection').style.display = 'none';
  document.getElementById('practiceList').style.display = 'block';
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('questionDetail').classList.remove('visible');

  currentPrototypeQ = null;
}

function backToPracticeList() {
  document.getElementById('questionDetail').classList.remove('visible');

  document.getElementById('practiceList').style.display = 'block';
}

// ==================== 错题集 ====================
var wrongQuestions = [];
var summaryExpanded = false;

function toggleSummary() {
  summaryExpanded = !summaryExpanded;
  document.getElementById('summaryBody').style.display = summaryExpanded ? 'flex' : 'none';
  document.getElementById('summaryToggle').innerHTML = summaryExpanded ? '<i class="fas fa-chevron-up"></i>' : '<i class="fas fa-chevron-down"></i>';
}

async function loadWrongSet() {
  var el = document.getElementById('wrongList');
  el.innerHTML = '<div class="text-center text-sm py-4 opacity-50"><i class="fas fa-spinner fa-spin mr-1"></i> 加载中...</div>';
  try {
    var data = await apiGet('/progress/' + encodeURIComponent(sessionId));
    wrongQuestions = data.progress.filter(function(p) { return !p.is_correct; });
    renderWrongSummary(data);
    renderWrongList();
  } catch (e) {
    el.innerHTML = '<p style="color:#b04a4a;text-align:center">加载失败</p>';
  }
}

function renderWrongSummary(data) {
  var body = document.getElementById('summaryBody');
  var total = data.total || 0;
  var correct = data.correct || 0;
  var wrong = total - correct;
  var avgDuration = 0;
  var durationCount = 0;
  if (total > 0) {
    var sum = 0;
    for (var i = 0; i < data.progress.length; i++) {
      var d = data.progress[i].duration || 0;
      if (d > 0) { sum += d; durationCount++; }
    }
    if (durationCount > 0) avgDuration = Math.round(sum / durationCount);
  }
  body.innerHTML = '';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl">' + total + '</div><div class="text-xs opacity-50">总答题</div></div>';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl" style="color:#2c241b">' + correct + '</div><div class="text-xs opacity-50">正确</div></div>';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl" style="color:#b04a4a">' + wrong + '</div><div class="text-xs opacity-50">错误</div></div>';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl">' + (data.accuracy || 0) + '%</div><div class="text-xs opacity-50">正确率</div></div>';
}

function renderWrongList() {
  var el = document.getElementById('wrongList');
  if (!wrongQuestions.length) {
    el.innerHTML = '<div class="text-center text-sm py-6 opacity-50"><i class="fas fa-check-circle mr-1" style="color:#2c241b"></i> 暂无错题，继续保持！</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < wrongQuestions.length; i++) {
    var w = wrongQuestions[i];
    html += '<div class="card p-3" style="cursor:pointer" onclick="showWrongDetail(' + i + ')">';
    html += '<div class="flex gap-2 flex-wrap mb-1">';
    html += '<span class="tag">' + (w.category || '') + '</span>';
    html += '<span class="tag" style="background:rgba(176,74,74,0.12);color:#b04a4a">✗ 答错</span>';
    html += '</div>';
    html += '<h3>' + (w.title || '') + '</h3>';
    html += '<p style="font-size:0.75rem;color:#666">你的答案：<code style="font-family:Oswald,Consolas,monospace">' + (w.user_answer || '').replace(/</g, '&lt;') + '</code></p>';
    html += '</div>';
  }
  el.innerHTML = html;
}

function showWrongDetail(idx) {
  var w = wrongQuestions[idx];
  var diffLabel = { easy: '简单', medium: '中等', hard: '困难' };
  var html = '<div class="card p-4 fade-in">';
  html += '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + (w.category || '') + '</span>';
  html += '<span class="tag" style="background:rgba(176,74,74,0.12);color:#b04a4a">' + (diffLabel[w.difficulty] || w.difficulty) + '</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + (w.title || '') + '</h3>';
  html += '<p class="question-desc">' + (w.description || '') + '</p>';
  html += renderSchemaAndData(w);
  if (w.expected_output) html += renderExpectedOutput(w.expected_output);
  html += '<div style="margin-top:0.5rem;padding:0.5rem;border-left:4px solid #b04a4a;background:rgba(176,74,74,0.06);border-radius:0 0.4rem 0.4rem 0">';
  html += '<div class="text-xs opacity-50">你的答案</div>';
  html += '<code style="font-family:Oswald,Consolas,monospace;font-size:0.85rem">' + (w.user_answer || '').replace(/</g, '&lt;') + '</code>';
  html += '<div class="text-xs opacity-50 mt-2">正确答案</div>';
  html += '<code style="font-family:Oswald,Consolas,monospace;font-size:0.85rem;color:#1a6b1a">' + (w.correct_answer || '').replace(/</g, '&lt;') + '</code>';
  if (w.explanation) html += '<div class="text-xs mt-2" style="color:#666"><i class="fas fa-lightbulb mr-1"></i> ' + w.explanation + '</div>';
  html += '</div></div>';
  var el = document.getElementById('wrongList');
  el.innerHTML = '<a class="back-link" onclick="loadWrongSet()" style="cursor:pointer;margin-bottom:0.5rem;display:inline-block"><i class="fas fa-arrow-left mr-1"></i> 返回错题列表</a>' + html;
}

// update showPage to load wrong set
var origShowPage = showPage;
showPage = function(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  var btns = document.querySelectorAll('.nav-btn[data-page="' + name + '"]');
  if (btns.length > 1 && currentPool === 'exam') btns[1].classList.add('active');
  else if (btns.length > 0) btns[0].classList.add('active');
  if (name === 'practice') { document.getElementById('poolLabel').textContent = currentPool === 'exam' ? '🎯 真题测试' : '📝 自主练习'; if (!_catSelectBuilt) { buildCategorySelect(); _catSelectBuilt = true; } loadPracticeQuestions(); }
  else if (name === 'wrongset') { summaryExpanded = false; document.getElementById('summaryBody').style.display = 'none'; document.getElementById('summaryToggle').innerHTML = '<i class="fas fa-chevron-down"></i>'; loadWrongSet(); }
};

// 确保默认页面可见
var defaultPage = document.querySelector('.nav-btn.active');
if (defaultPage) {
  showPage(defaultPage.getAttribute('data-page'));
} else {
  showPage('journey');
}

// Show user info in header/footer
updateUserUI();

// ===== 色觉辅助模式切换 =====
(function() {
  var saved = localStorage.getItem('cb_mode');
  if (saved === '1') { document.body.classList.add('cb-mode'); var t = document.getElementById('cbToggle'); if (t) t.classList.add('cb-active'); }
})();
function toggleColorblind() {
  var body = document.body;
  var on = body.classList.toggle('cb-mode');
  var t = document.getElementById('cbToggle');
  if (t) { if (on) t.classList.add('cb-active'); else t.classList.remove('cb-active'); }
  localStorage.setItem('cb_mode', on ? '1' : '0');
}
</script>
