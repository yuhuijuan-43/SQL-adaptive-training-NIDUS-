  /* ===== 色觉辅助模式 — 超高对比度 + 形状编码 (不依赖加粗) ===== */
  body.cb-mode {
    --bg: #FFFFFF; --card: #FFFFFF; --text: #000000; --text2: #333333;
    --border: #000000; --accent: #0044CC; --accent-hover: #003399;
    --tag-bg: #CCCCCC; --code-bg: #F5F5F5;
    --success: #1E5BA8; --error: #BF0000;
    filter: contrast(1.05);
  }
  body.cb-mode .card { border-width: 2px; }
  body.cb-mode .schema-box { background: #EEEEEE; border: 1px solid #000; }
  /* 难度标签 — 入门=蓝色 */
  body.cb-mode .tag-easy {
    background: #1E5BA8; color: #FFFFFF; border: 1px solid #000;
    text-decoration: underline; text-decoration-color: #FFD700; text-underline-offset: 2px;
  }
  body.cb-mode .tag-medium {
    background: #CC6600; color: #FFFFFF; border: 1px solid #000;
    text-decoration: underline; text-decoration-color: #FFD700; text-underline-offset: 2px;
  }
  body.cb-mode .tag-hard {
    background: #BF0000; color: #FFFFFF; border: 1px solid #000;
    text-decoration: underline; text-decoration-color: #FFD700; text-underline-offset: 2px;
  }
  /* 答题结果 — 正确=蓝底白字+左边框 */
  body.cb-mode .result-box.correct {
    background: #1E5BA8; color: #FFFFFF; border-left: 5px solid #000;
  }
  body.cb-mode .result-box.wrong {
    background: #BF0000; color: #FFFFFF; border-left: 5px solid #000;
  }
  /* 选项按钮 — 正确=蓝底白字+金色内框 */
  body.cb-mode .option-btn.correct {
    background: #1E5BA8; color: #FFFFFF; border: 2px solid #000;
    box-shadow: inset 0 0 0 2px #FFD700;

function initCodeMirror(ta) {
  if (!ta || ta.classList.contains('cm-initialized')) return;
  if (typeof CodeMirror === 'undefined') return; // CDN 不可用时降级
  try {
    ta.classList.add('cm-initialized');
    // 先读取原始高度（此时 textarea 仍可见），再隐藏，避免“隐藏后读取”造成的强制同步布局
    var initH = ta.offsetHeight || 72;
    ta.style.display = 'none';
    var wrapper = document.createElement('div');
    ta.parentNode.insertBefore(wrapper, ta);
    wrapper.appendChild(ta);

    var cm = CodeMirror.fromTextArea(ta, {
      mode: 'text/x-sql',
      theme: 'default',
      lineNumbers: false,
      matchBrackets: true,
      autoCloseBrackets: false,
      viewportMargin: Infinity,
      extraKeys: { 'Ctrl-Space': 'autocomplete' },
      hintOptions: { tables: {} }
    });

    cm.setSize('100%', Math.max(72, initH));
    cm.on('change', function() { validateSQL(cm); });
    cm.on('cursorActivity', function() { validateSQL(cm); });
    ta._cm = cm;

    // Initial validation
    setTimeout(function() { validateSQL(cm); }, 200);
    return cm;
  } catch(e) {
    console.error('CodeMirror init failed:', e);
    ta.classList.remove('cm-initialized');
    ta.style.display = ''; // 恢复原始 textarea
    return null;
  }
}

function initAllCodeMirrors() {
  var textareas = document.querySelectorAll('textarea.code-input:not(.cm-initialized)');
  textareas.forEach(function(ta) { initCodeMirror(ta); });
}

// 监听动态添加的 textarea
var cmObserver = new MutationObserver(function(mutations) {
  mutations.forEach(function(m) {
    m.addedNodes.forEach(function(node) {
      if (node.nodeType === 1) {
        if (node.classList && node.classList.contains('code-input') && !node.classList.contains('cm-initialized')) {
          initCodeMirror(node);
        }
        if (node.querySelectorAll) {
          node.querySelectorAll('textarea.code-input:not(.cm-initialized)').forEach(function(ta) { initCodeMirror(ta); });
        }
      }
    });
  });
});
cmObserver.observe(document.body, { childList: true, subtree: true });

function validateSQL(cm) {
  var text = cm.getValue();
  var marks = cm.getAllMarks();
  marks.forEach(function(m) { if (m.className === 'cm-sql-error') m.clear(); });

  if (!text.trim()) return;

  var lines = text.split('\n');

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/^\s*--/.test(line) || /^\s*$/.test(line)) continue;

    // 错误1: 未闭合单引号 — 从开头引号标到行尾
    var qPos = line.indexOf("'");
    if (qPos >= 0) {
      var afterFirst = line.substring(qPos + 1);
      if (afterFirst.indexOf("'") < 0) {
        cm.markText(
          { line: i, ch: qPos },
          { line: i, ch: line.length },
          { className: 'cm-sql-error', title: t('单引号未闭合，字符串值需用一对引号包裹') }
        );
      }
    }

    // 错误2: 字符串值未加引号 — 只标红问题单词
    var valRegex = /=\s*([a-zA-Z_][a-zA-Z0-9_]*)(?=\s|;|$)/g;
    var m;
    while ((m = valRegex.exec(line)) !== null) {
      var val = m[1];
      if (val && !SQL_KEYWORDS.includes(val.toUpperCase()) && isNaN(val) &&
          val !== 'NULL' && val !== 'TRUE' && val !== 'FALSE') {
        var start = m.index + m[0].indexOf(val);
        cm.markText(
          { line: i, ch: start },
          { line: i, ch: start + val.length },
          { className: 'cm-sql-error', title: t('字符串值需加引号') + ": '" + val + "'" }
        );
      }
    }

    // 错误3: 字符串值缺单引号 (中文字符)
    var cnRegex = /=\s*([一-鿿㐀-䶿][一-鿿㐀-䶿\w]*)/g;
    var cn;
    while ((cn = cnRegex.exec(line)) !== null) {
      var cnVal = cn[1];
      // 排除引号内的内容
      var before = line.substring(0, cn.index);
      var singleBefore = (before.match(/'/g) || []).length;
      if (singleBefore % 2 === 0) {
        var start = cn.index + cn[0].indexOf(cnVal);
        cm.markText(
          { line: i, ch: start },
          { line: i, ch: start + cnVal.length },
          { className: 'cm-sql-error', title: t('中文字符串需加引号') + ": '" + cnVal + "'" }
        );
      }
    }
  }

  // 错误4: 括号不匹配 — 只标不匹配的括号
  var totalOpen = (text.match(/\(/g) || []).length;
  var totalClose = (text.match(/\)/g) || []).length;
  if (totalOpen !== totalClose) {
    var lastLine = lines.length - 1;
    var lastLineText = lines[lastLine];
    // 在最后一行找多余的括号
    var lastOpen = lastLineText.lastIndexOf('(');
    var lastClose = lastLineText.lastIndexOf(')');
    var ch = Math.max(lastOpen, lastClose);
    if (ch >= 0) {
      cm.markText(
        { line: lastLine, ch: ch },
        { line: lastLine, ch: ch + 1 },
        { className: 'cm-sql-error', title: t('括号不匹配') + ': ' + totalOpen + ' ( vs ' + totalClose + ' )' }
      );
    }
  }
}

function catLabel(cat) {
  if (LANG === 'zh-TW' && KG_LABELS_TW[cat]) return KG_LABELS_TW[cat];
  if (LANG !== 'zh' && KG_LABELS_EN[cat]) return KG_LABELS_EN[cat];
  return (KG_LABELS[cat] || cat);
}
// 预计算所有包含"全部子类"的根节点展开集合
const KG_ROOT_EXPAND = {};
function kgExpand(nodeId, collected) {
  collected = collected || new Set();
  collected.add(nodeId);
  var children = KG_HIERARCHY[nodeId];
  if (children) { for (var i=0;i<children.length;i++) kgExpand(children[i], collected); }
  return collected;
}
KG_GROUPS.forEach(function(g){
  var ids = new Set();
  kgExpand(g.root, ids);
  if (g.extraRoot) kgExpand(g.extraRoot, ids);
  KG_ROOT_EXPAND[g.root] = Array.from(ids);
});
KG_LEAF.forEach(function(k){ KG_ROOT_EXPAND[k] = [k]; });

const STATIC_CAT_MAP = {

// ===== 自定义级联分类筛选 =====
var _catSelectedParent = null;  // 当前选中的父节点ID
var _catSelectedNode = null;    // 当前选中的子节点ID（null=全部子类）
var _catHideTimer = null;

function buildCategorySelect() {
  var parents = document.getElementById('catParents');
  // 大分类按钮
  for (var g = 0; g < KG_GROUPS.length; g++) {
    var grp = KG_GROUPS[g];
    var btn = document.createElement('div');
    btn.className = 'cat-parent-btn';
    btn.textContent = t(grp.label);
    btn.setAttribute('data-root', grp.root);
    btn.setAttribute('data-expand', grp.expand ? '1' : '0');
    if (grp.extraRoot) btn.setAttribute('data-extra', grp.extraRoot);
    btn.addEventListener('mouseenter', onCatParentHover);
    // 点击父分类：立即按「全部XXX」筛选（不再依赖 hover 后点子面板），并展开子面板供细分
    btn.addEventListener('click', function(e){
      _catSelectedParent = this.getAttribute('data-root');
      _catSelectedNode = null;
      highlightCatSelection();
      onFilterChange();
      onCatParentHover.call(this, e);   // 展开子面板，可继续选具体叶节点
    });
    parents.appendChild(btn);
  }
  // 分隔（仅当存在独立叶节点时才需要）
  if (KG_LEAF.length > 0) {
    var sep = document.createElement('div');
    sep.style.cssText = 'width:1px;height:18px;background:var(--border);margin:0 2px;align-self:center;';
    parents.appendChild(sep);
  }
  // 独立叶节点
  for (var l = 0; l < KG_LEAF.length; l++) {
    var leaf = KG_LEAF[l];
    if (!KG_LABELS[leaf]) continue;
    var btn = document.createElement('div');
    btn.className = 'cat-parent-btn';
    btn.textContent = KG_LABELS[leaf];
    btn.setAttribute('data-leaf', leaf);
    btn.addEventListener('click', function(e){
      _catSelectedParent = null;
      _catSelectedNode = this.getAttribute('data-leaf');
      highlightCatSelection();
      onFilterChange();
    });
    parents.appendChild(btn);
  }
  // 子面板鼠标事件：保持显示
  var panel = document.getElementById('catSubPanel');
  panel.addEventListener('mouseenter', function(){ clearTimeout(_catHideTimer); });
  panel.addEventListener('mouseleave', function(){ _catHideTimer = setTimeout(hideSubPanel, 150); });
}

function onCatParentHover(e) {
  clearTimeout(_catHideTimer);
  var root = this.getAttribute('data-root');
  var extra = this.getAttribute('data-extra');
  var expand = this.getAttribute('data-expand') === '1';
  if (!expand) { hideSubPanel(); return; }

  var panel = document.getElementById('catSubPanel');
  // 先读取定位所需尺寸（面板为 absolute，填充内容不影响父级位置），再写 DOM，避免强制同步布局
  var rect = this.getBoundingClientRect();
  var cascade = document.getElementById('catCascade');
  var cascadeRect = cascade.getBoundingClientRect();
  panel.innerHTML = '';
  // "全部"选项
  var allItem = document.createElement('div');
  allItem.className = 'cat-sub-item cat-sub-all';
  allItem.textContent = t('全部') + this.textContent;
  allItem.addEventListener('click', function(){
    _catSelectedParent = root;
    _catSelectedNode = null;
    highlightCatSelection();
    hideSubPanel();
    onFilterChange();
  });
  panel.appendChild(allItem);

  // 子节点
  buildSubItems(panel, root, 1);
  if (extra) buildSubItems(panel, extra, 1);

  panel.style.left = (rect.left - cascadeRect.left) + 'px';
  panel.style.top = (cascadeRect.height + 4) + 'px';
  panel.style.display = 'block';
}
function buildSubItems(panel, nodeId, depth) {
  // 顶层大分类（top_*）不渲染为子项："全部XX"已覆盖其语义

// ====== Schema/Data/Expected Output Table Renders ======
function parseSchemaToMap(schemaStr) {
  var map = {};
  if (!schemaStr) return map;
  var stmts = schemaStr.split(';');
  for (var s = 0; s < stmts.length; s++) {
    var m = stmts[s].match(/(?:CREATE\s+TABLE\s+)?\s*`?(\w+)`?\s*\(([\s\S]*)\)/i);
    if (!m) continue;
    var tbl = m[1], raw = m[2], depth = 0, cur = '', cols = [];
    for (var i = 0; i < raw.length; i++) {
      var ch = raw[i];
      if (ch === '(') { depth++; cur += ch; }
      else if (ch === ')') { depth--; cur += ch; }
      else if (ch === ',' && depth === 0) { var p = cur.trim().replace(/`/g,'').split(/\s+/); if (p[0]) cols.push(p[0]); cur = ''; }
      else { cur += ch; }
    }
    if (cur.trim()) { var p = cur.trim().replace(/`/g,'').split(/\s+/); if (p[0]) cols.push(p[0]); }
    map[tbl] = cols;
  }
  return map;
}

function renderDataTable(dataStr, schemaStr) {
  if (!dataStr) return '';
  var schemaMap = parseSchemaToMap(schemaStr);
  var tableRows = {};
  var stmts = dataStr.split(';');
  for (var s = 0; s < stmts.length; s++) {
    var stmt = stmts[s].trim();
    if (!stmt) continue;
    var m = stmt.match(/INSERT\s+INTO\s+(\w+)\s*(\([^)]*\))?\s*VALUES\s*([\s\S]*)/i);
    if (!m) continue;
    var tbl = m[1], vp = m[3] || m[2], depth = 0, cur = '', groups = [];
    for (var i = 0; i < vp.length; i++) {
      var ch = vp[i];
      if (ch === '(' && depth === 0) { cur = ''; depth = 1; }
      else if (ch === '(' && depth > 0) { cur += ch; depth++; }
      else if (ch === ')' && depth > 1) { cur += ch; depth--; }
      else if (ch === ')' && depth === 1) { depth = 0; groups.push(cur); cur = ''; }
      else if (depth > 0) { cur += ch; }
    }
    if (!tableRows[tbl]) tableRows[tbl] = [];
    for (var g = 0; g < groups.length; g++) {
      var vals = [], vcur = '', inQ = false, qch = null;
      for (var i = 0; i < groups[g].length; i++) {
        var ch = groups[g][i];
        if (inQ) { if (ch === qch) inQ = false; else vcur += ch; }
        else if (ch === "'" || ch === '"') { inQ = true; qch = ch; }
        else if (ch === ',') { vals.push(vcur.trim()); vcur = ''; }
        else { vcur += ch; }
      }
      if (vcur.trim()) vals.push(vcur.trim());
      if (vals.length) tableRows[tbl].push(vals);
    }
  }
  var html = '';
  var tblNames = Object.keys(tableRows);
  for (var t = 0; t < tblNames.length; t++) {
    var tbl = tblNames[t];
    var rows = tableRows[tbl];
    if (!rows.length) continue;
    var hdrs = (schemaMap[tbl] && schemaMap[tbl].length) ? schemaMap[tbl] : rows[0].map(function(_, i) { return 'col' + (i+1); });
    html += '<div class="table-label">' + tbl + '</div><table class="data-table"><thead><tr>';
    for (var h = 0; h < hdrs.length; h++) html += '<th>' + hdrs[h] + '</th>';
    html += '</tr></thead><tbody>';
    var maxRows = 15;
    var showAll = rows.length <= maxRows;
    for (var r = 0; r < Math.min(rows.length, maxRows); r++) {
      html += '<tr>';
      for (var c = 0; c < rows[r].length; c++) html += '<td>' + rows[r][c] + '</td>';
      html += '</tr>';
    }
    if (!showAll) {
      html += '<tr><td colspan="' + hdrs.length + '" style="text-align:center;color:#999;font-style:italic;padding:0.5rem">... ' + tf('共 {0} 行，仅显示前 {1} 行', rows.length, maxRows) + ' ...</td></tr>';
    }
    html += '</tbody></table>';
  }
  return html;
}

function renderExpectedOutput(expStr) {
  if (!expStr) return '';
  // Try JSON format first
  try {
    var data = JSON.parse(expStr);
    if (data.rows && data.rows.length) {
      var html = '<div class="exp-label">' + t('预期输出') + '</div><table class="data-table"><thead><tr>';
      for (var h = 0; h < data.headers.length; h++) html += '<th>' + data.headers[h] + '</th>';
      html += '</tr></thead><tbody>';
      for (var r = 0; r < data.rows.length; r++) {
        var isSep = data.rows[r][0] === '...' || data.rows[r][0] === '…';
        html += '<tr' + (isSep ? ' style="text-align:center;color:var(--text2);font-style:italic;background:var(--tag-bg)"' : '') + '>';
        if (isSep) {
          html += '<td colspan="' + data.headers.length + '" style="padding:0.35rem">' + (data.rows[r][1] || data.rows[r][0]) + '</td>';
        } else {
          for (var c = 0; c < data.rows[r].length; c++) html += '<td>' + (data.rows[r][c] === null ? 'NULL' : data.rows[r][c]) + '</td>';
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      return html;
    }
  } catch(e) { /* fall through to text format */ }
  // Text table format: lines with | separator, second line is -+-
  var lines = expStr.split('\n');
  if (lines.length < 2) return '<div class="exp-label">' + t('预期输出') + '</div><pre class="expected-output-text">' + expStr + '</pre>';
  var headerLine = lines[0];
  var sepLine = lines[1] || '';
  var dataLines = [];
  for (var i = 2; i < lines.length; i++) {
    if (lines[i].trim()) dataLines.push(lines[i]);
  }
  // Check if separator line contains -+- (table format)
  if (sepLine.indexOf('-+-') >= 0) {
    var headers = headerLine.split('|').map(function(s) { return s.trim(); });
    var html = '<div class="exp-label">' + t('预期输出') + '</div><table class="data-table"><thead><tr>';
    for (var h = 0; h < headers.length; h++) html += '<th>' + headers[h] + '</th>';
    html += '</tr></thead><tbody>';
    for (var r = 0; r < dataLines.length; r++) {
      var cells = dataLines[r].split('|').map(function(s) { return s.trim(); });
      html += '<tr>';
      for (var c = 0; c < cells.length; c++) html += '<td>' + cells[c] + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
  }
  return '<div class="exp-label">' + t('预期输出') + '</div><pre class="expected-output-text">' + expStr + '</pre>';
}

function renderSqlPanel(q) {
  if (!q.table_schema && !q.initial_data) return '';

// 登录态失效（401）→ 清会话并回登录页
function redirectIfUnauthorized(r) {
  if (r.status === 401) {
    sessionStorage.removeItem('sql_user');
    window.location.href = '/login';
    return true;
  }
  return false;
}

// 登录门槛：所有 API 需携带 session_id（GET 走查询参数，POST 走请求体）
function withSessionParam(path) {
  if (path.indexOf('session_id') !== -1) return path;
  return path + (path.indexOf('?') === -1 ? '?' : '&') + 'session_id=' + encodeURIComponent(sessionId);
}

// 非 2xx 响应 → 解析后端 {"error": "..."} 中文文案，供 catch 直接展示（2026-08-12 透传后端错误）
async function _extractApiError(r) {
  try {
    var b = await r.json();
    if (b && b.error) return String(b.error);
  } catch (e) {}
  return '请求失败（HTTP ' + r.status + '）';
}

// catch 展示助手：透传后端中文文案；'unauthorized' 已由 redirectIfUnauthorized 处理跳转，不再弹窗
function errMsg(e, fallback) {
  var m = (e && e.message) ? String(e.message) : '';
  return (m && m !== 'unauthorized') ? m : fallback;
}

async function apiGet(path) {
  var t0 = performance.now();
  const r = await fetch(API_BASE + withSessionParam(path));
  var ms = Math.round(performance.now() - t0);
  _showPerf(ms, path.split('?')[0]);
  if (redirectIfUnauthorized(r)) throw new Error('unauthorized');
  if (!r.ok) throw new Error(await _extractApiError(r));
  return r.json();
}

async function apiPost(path, data) {
  saveAllCM();
  data = data || {};
  if (!data.session_id) data.session_id = sessionId;
  var t0 = performance.now();
  const r = await fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  var ms = Math.round(performance.now() - t0);
  _showPerf(ms, path.split('?')[0]);
  if (redirectIfUnauthorized(r)) throw new Error('unauthorized');
  if (!r.ok) throw new Error(await _extractApiError(r));
  return r.json();
}

function parseOptions(str) {
  if (typeof str !== 'string') return str || [];
  return str.replace(/\|\|/g, '\x00').split('|').filter(function(o) { return o.trim() !== ''; }).map(function(o) { return o.replace(/\x00/g, '||'); });
}

function stripOptionLabel(text) {
  return text.replace(/^[A-D]\.\s*/, '');
}

function shuffleArray(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

/* 从标准答案里自动提炼「本题用到的关键语法点」 */
function deriveSqlPoints(sql, options) {
  var s = ' ' + String(sql || '').toUpperCase() + ' ';
  if (!s.trim()) return [];
  var pts = [];
  function has(kw) { return new RegExp('\\b' + kw + '\\b').test(s); }
  // 连接
  if (has('CROSS JOIN')) pts.push('交叉连接：返回两表笛卡尔积，行数 = 两表行数之积');
  else if (has('LEFT JOIN') || has('LEFT OUTER JOIN')) pts.push('左外连接：保留左表全部行，右表匹配不上补 NULL');
  else if (has('RIGHT JOIN') || has('RIGHT OUTER JOIN')) pts.push('右外连接：保留右表全部行，左表匹配不上补 NULL');
  else if (has('FULL JOIN') || has('FULL OUTER JOIN')) pts.push('全外连接：两侧未匹配行都保留');
  else if (has('JOIN')) pts.push('内连接：只保留连接条件成立的行');
  // 子查询 / 集合
  if (/\(\s*SELECT\b/.test(s)) pts.push('子查询：先执行内层，再把结果交给外层使用');
  if (has('EXISTS')) pts.push('EXISTS：只判断子查询是否返回行，命中即停');
  if (/\bNOT\s+IN\b/.test(s)) pts.push('NOT IN：取集合补集，注意子查询结果含 NULL 会返回空集');
  else if (has('IN')) pts.push('IN：判断值是否落在子查询或给定集合中');
  if (has('UNION ALL')) pts.push('UNION ALL：合并结果集且保留重复行');
  else if (has('UNION')) pts.push('UNION：合并结果集并去重');
  // 聚合 / 分组 / 排序
  if (has('GROUP BY')) pts.push('GROUP BY：按列分组，SELECT 中只能出现分组列或聚合结果');
  if (has('HAVING')) pts.push('HAVING：对分组聚合后的结果过滤（WHERE 里不能写聚合条件）');
  var aggs = ['COUNT', 'SUM', 'AVG', 'MAX', 'MIN'].filter(has);
  if (aggs.length) pts.push('聚合函数 ' + aggs.join(' / ') + '：把多行算成一个值');
  if (has('DISTINCT')) pts.push('DISTINCT：去除结果中的重复行');
  if (has('ORDER BY')) pts.push('ORDER BY：排序输出，默认升序，DESC 为降序');
  if (has('LIMIT')) pts.push('LIMIT：限制返回的行数');
  if (/\bOVER\s*\(/.test(s)) {
    var wf = ['ROW_NUMBER', 'RANK', 'DENSE_RANK', 'NTILE', 'LAG', 'LEAD', 'FIRST_VALUE', 'LAST_VALUE'].filter(has);
    pts.push(wf.length
      ? '窗口函数 ' + wf.join(' / ') + ' + OVER()：在分区内计算，不会把多行合并成一行'
      : '窗口函数 OVER()：在分区内计算，不会把多行合并成一行');
  }
  if (has('CASE')) pts.push('CASE WHEN：按条件分支返回不同值');
  if (has('COALESCE') || has('IFNULL') || has('NVL')) pts.push('空值处理：为 NULL 提供兜底默认值');
  if (has('CAST') || has('CONVERT')) pts.push('类型转换：改变值的类型表示');
  // DDL / DML
  if (has('CREATE TABLE')) pts.push('DDL 建表：定义列名、类型与约束');
  if (has('ALTER TABLE')) pts.push('DDL 改表：新增列 / 改名 / 改表名');
  if (has('DROP TABLE')) pts.push('DDL 删表：结构与数据一并移除');
  if (has('TRUNCATE')) pts.push('清空表：只清数据、保留结构');
  if (has('INSERT')) pts.push('DML 插入：新增数据行');
  if (has('UPDATE')) pts.push('DML 更新：修改已有数据（务必带 WHERE）');
  if (has('DELETE')) pts.push('DML 删除：移除数据行（务必带 WHERE）');
  if (has('PRIMARY KEY')) pts.push('主键约束：唯一且非空');
  if (has('FOREIGN KEY') || has('REFERENCES')) pts.push('外键约束：保证引用完整性');
  if (has('NOT NULL')) pts.push('非空约束：该列不允许为 NULL');
  if (has('DEFAULT')) pts.push('默认值：插入时未指定该列则取默认值');
  if (has('UNIQUE')) pts.push('唯一约束：该列取值不允许重复');
  if (has('CHECK')) pts.push('检查约束：取值必须满足给定条件');
  // 选择题里出现的是选项文本，去掉字母前缀噪声已经在别处处理；最多给 4 条避免过长
  return pts.slice(0, 4);
}

function renderExplanation(text, q) {
  var secs = [];
  var raw = String(text || '');
  raw.split(/(?=【[^】]{1,6}】)/).forEach(function(p) {
    if (!p || !p.trim()) return;
    var m = p.match(/^【([^】]{1,6})】/);
    if (m) secs.push({ key: m[1], body: p.slice(m[0].length).trim() });
    else secs.push({ key: '解析', body: p.trim() });
  });
  // 依据题目自动补充：考点 / 要点 / 易错点（已有同名分段时不覆盖，保留人工内容）
  if (q) {
    var keys = secs.map(function(x) { return x.key; });
    if (q.category && keys.indexOf('考点') < 0) secs.unshift({ key: '考点', body: catLabel(q.category) });
    var pts = deriveSqlPoints(q.correct_answer, q.options);
    if (pts.length && keys.indexOf('要点') < 0) secs.push({ key: '要点', body: pts.join('；') });
    var trap = q.category ? CATEGORY_TRAPS[q.category] : '';
    if (trap && keys.indexOf('易错点') < 0) secs.push({ key: '易错点', body: trap });
  }
  if (!secs.length) return '';
  var out = '<div class="explanation expl-structured">';
  secs.forEach(function(sec) {
    var icon = _EXPL_SECTION_ICON[sec.key] || 'fa-circle-dot';
    out += '<div class="expl-sec"><div class="expl-sec-h"><i class="fas ' + icon + '"></i>' + escapeHtml(sec.key) +
           '</div><div class="expl-sec-b">' + _explInline(sec.body) + '</div></div>';
  });
  return out + '</div>';
}

/* ---- 图谱入口视图：知识图谱树（iframe 点亮小灯）+ 点亮统计 + 开始适应 ---- */
var MAP_TOTAL_NODES = 36;   // 29 子标签 + 7 大分类

async function loadJourneyMap() {
  // 点亮统计：29 叶 + 7 枝（lights 为后端全量点亮状态，root 不计入）
  var litCount = 0;
  try {
    var resp = await apiPost('/journey/status', { session_id: sessionId });
    var lights = resp.lights || {};
    Object.keys(lights).forEach(function(nid) { if (nid !== 'root' && lights[nid].lit) litCount++; });

  document.getElementById('mapLitCount').textContent = litCount;
  document.getElementById('mapTotalCount').textContent = MAP_TOTAL_NODES;

  var frame = document.getElementById('journeyMapFrame');
  frame.src = '/knowledge-map?session_id=' + encodeURIComponent(sessionId) + '&t=' + Date.now();
}

function backToJourneyMap() {
  document.getElementById('journeyQuiz').style.display = 'none';
  document.getElementById('journeyMapView').style.display = 'block';
  loadJourneyMap();
}

async function startJourney() {
  document.getElementById('journeyMapView').style.display = 'none';
  document.getElementById('journeyQuiz').style.display = 'block';
  document.getElementById('journeyResult').style.display = 'none';
  try {
    var resp = await apiPost('/journey/start', { session_id: sessionId });

    journeyHistory = [];          // 新一轮开始，清空回看栈

    showJourneyQuestion(resp);

    document.getElementById('journeyQuestion').innerHTML = '<p style="color:#b04a4a">' + t('加载失败，请确保后端已启动') + '</p>';
  }
}

function updateJourneyHeader(data) {
  var actionMap = { advance: t('进阶'), consolidate: t('巩固'), easier: t('降难度'), start: t('开始'), fallback: t('练习'), skip: t('跳级'), review: t('复习'), fillin: t('填空题') };
  // 当前叶节点轮进度（已出题数/每叶题数）
  var posText = (data.round && data.round.leaf && data.round.leaf_total) ? ' ' + data.round.pos + '/' + data.round.leaf_total : '';
  document.getElementById('journeyNodeLabel').textContent = data.current_node
    ? getNodeName(data.current_node, data.graph) + posText
    : (data.round_complete ? t('本轮完成') : t('加载中...'));
  document.getElementById('journeyStats').textContent = (data.total_answered || 0) + t('题');
  var progress = data.total_answered > 0 ? Math.min(100, (data.total_correct || 0) / Math.max(1, data.total_answered) * 100) : 0;
  document.getElementById('journeyProgress').style.width = progress + '%';
  var tag = document.getElementById('journeyActionTag');
  if (data.action && actionMap[data.action]) {
    tag.style.display = 'inline-block'; tag.textContent = actionMap[data.action];
  } else { tag.style.display = 'none'; }
  // sync deep mode toggle
  if (data.deep_mode !== undefined) document.getElementById('deepModeToggle').checked = data.deep_mode;
}

function showJourneyQuestion(data) {
  journeyQuestionStart = Date.now();
  journeyNextVisible = false;
  updateJourneyHeader(data);
  // question
  currentJourneyQid = null;
  document.getElementById('journeyNextBtn').style.display = 'none';
  var el = document.getElementById('journeyQuestion');
  if (data.round_complete) {
    // 一轮完成：保留点亮节点，回到图谱界面重新开始新一轮
    var litRoundN = data.round && data.round.lit_round ? data.round.lit_round.length : 0;
    el.innerHTML = '<div class="text-center py-4">' +
      '<p class="text-base font-medium opacity-90 mb-2">🎉 ' + t('本轮刷题完成！') + '</p>' +
      '<p class="text-sm opacity-70 mb-4">' + t('本轮点亮节点：') + litRoundN + t(' 个，点亮状态已保留') + '</p>' +
      '<button class="btn btn-accent" onclick="backToJourneyMap()"><i class="fas fa-map mr-1"></i> ' + t('返回图谱') + '</button></div>';
    document.getElementById('journeyNextBtn').style.display = 'none';
  } else if (data.question) {
    currentJourneyQid = data.question.id;
    // attach fillin_mode and hint to question object so renderQuestion can use them
    data.question.fillin_mode = data.fillin_mode || false;
    if (!data.question.hint) data.question.hint = data.hint || '';
    el.innerHTML = renderQuestion(data.question, 'journey'); setTimeout(initAllCodeMirrors, 100);
    var ta = el.querySelector('textarea');
    if (ta) ta.focus();
  } else {
    el.innerHTML = '<p class="text-sm opacity-60 text-center py-4">' + t('所有知识点已掌握！🎉') + '</p>' +
      '<div class="text-center mt-2"><button class="btn btn-accent" onclick="backToJourneyMap()"><i class="fas fa-map mr-1"></i> ' + t('返回图谱') + '</button></div>';
    document.getElementById('journeyNextBtn').style.display = 'none';
  }
  refreshJourneyNav();
}

/* ---- 答题结果渲染（提交后 / 跳过 / 回看历史题共用） ---- */
function renderJourneyResult(q, qid, correct, userAnswer, explanation, litNow, graph) {
  var resultBox = document.getElementById('journey_res_' + qid);
  if (!resultBox) return;
  resultBox.style.display = 'block';
  // correct: true=答对 / false=答错 / null=跳过 / 'skipped'=跳过（兼容字符串）
  var status = (correct === true) ? 'correct' : (correct === false) ? 'wrong' : 'skipped';
  resultBox.className = 'result-box ' + status;
  if (correct === true) {
    resultBox.innerHTML = '<strong><i class="fas fa-check-circle mr-1"></i> ' + t('回答正确') + '</strong>';
  } else if (correct === false) {
    resultBox.innerHTML = '<strong><i class="fas fa-times-circle mr-1"></i> ' + t('回答错误') + '</strong>';
    if (q) resultBox.innerHTML += '<br>' + t('正确答案：') + '<strong>' + escapeHtml(q.correct_answer) + '</strong>';
  } else {
    // 跳过：展示正确答案与解析，但不显示"对/错"
    resultBox.innerHTML = '<strong><i class="fas fa-forward mr-1"></i> ' + t('已跳过本题（不计入答题）') + '</strong>';
    if (q) resultBox.innerHTML += '<br>' + t('参考答案：') + '<strong>' + escapeHtml(q.correct_answer) + '</strong>';
  }
  if (userAnswer && q && !q.options) {
    resultBox.innerHTML += '<div class="mt-1" style="font-size:0.75rem;opacity:0.75">' + t('你的答案：') +
      '<code class="expl-code">' + escapeHtml(userAnswer) + '</code></div>';
  }
  // 选择题：逐项解析始终展示（答对也展示），便于理解每个选项为什么对/错
  if (q && q.options && q.option_explanations) {
    showOptionExplanations('journey', qid, q.options, q.option_explanations, q.correct_answer);
  }
  if (explanation || q) resultBox.innerHTML += renderExplanation(explanation, q);
  if (litNow) resultBox.innerHTML += '<div class="mt-1" style="color:#1a8a5c;font-weight:600;">✨ ' + t('已点亮「') + getNodeName(litNow, graph) + t('」') + '</div>';
}

/* ---- 回看历史题目（只读） ---- */
function renderJourneyReview(snap) {
  var data = snap.data;
  if (!data) return;
  updateJourneyHeader(data);
  journeyNextVisible = true;
  var el = document.getElementById('journeyQuestion');
  var q = data.question;
  if (!q) {
    el.innerHTML = '<p class="text-sm opacity-60 text-center py-4">' + t('该题已不可用') + '</p>';
    refreshJourneyNav();
    return;
  }
  var qid = q.id;
  currentJourneyQid = qid;
  q.fillin_mode = data.fillin_mode || false;
  if (!q.hint) q.hint = data.hint || '';
  el.innerHTML = renderQuestion(q, 'journey');
  // 回填用户答案并置为只读
  var inp = document.getElementById('journey_inp_' + qid);
  if (inp) { inp.value = snap.answer || ''; }
  setTimeout(function () {
    initAllCodeMirrors();
    var ta = document.getElementById('journey_inp_' + qid);
    if (ta) {
      if (ta._cm && ta._cm.setOption) {
        try {
          if (snap.answer && !ta._cm.getValue()) ta._cm.setValue(snap.answer);
          ta._cm.setOption('readOnly', 'nocursor');
        } catch (e) {}
      } else { ta.disabled = true; }
    }
  }, 60);
  var optsBox = document.getElementById('journey_opts_' + qid);
  if (optsBox) {
    var btns = optsBox.querySelectorAll('.option-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].disabled = true;
      btns[i].style.cursor = 'default';
      if (btns[i].dataset.opt === snap.answer) btns[i].classList.add('selected');
    }
    optsBox.dataset.selected = snap.answer || '';
  }
  var submitBtn = document.querySelector('#journeyQuestion .btn-primary');
  if (submitBtn) { submitBtn.style.display = 'none'; }
  var skipBtnR = document.querySelector('#journeyQuestion .btn-secondary');
  if (skipBtnR) { skipBtnR.style.display = 'none'; }
  renderJourneyResult(q, qid, snap.correct, snap.answer, snap.explanation, snap.lit_now, snap.graph);
  refreshJourneyNav();
}

/* ---- 导航按钮状态 ---- */
function refreshJourneyNav() {
  var prevBtn = document.getElementById('journeyPrevBtn');
  var nextBtn = document.getElementById('journeyNextBtn');
  if (!prevBtn || !nextBtn) return;
  var n = journeyHistory.length;
  var reviewing = journeyViewIdx !== null;
  // 上一题：有历史即可用；回看中已在最早一题时禁用
  var canPrev = reviewing ? (journeyViewIdx > 0) : (n > 0);
  prevBtn.style.display = n > 0 ? 'inline-flex' : 'none';
  prevBtn.disabled = !canPrev;
  document.getElementById('journeyPrevLabel').textContent = t('上一题');
  // 前进按钮：回看中依次显示「下一题」→「返回当前题」，否则「继续进阶」
  var nextLabel = reviewing ? (journeyViewIdx < n - 1 ? t('下一题') : t('返回当前题')) : t('继续进阶');
  document.getElementById('journeyNextLabel').textContent = nextLabel;
  nextBtn.style.display = journeyNextVisible ? 'inline-flex' : 'none';
  var tip = document.getElementById('journeyReviewTip');
  if (tip) {
    if (reviewing) {
      tip.style.display = 'block';
      tip.innerHTML = '<i class="fas fa-book-open mr-1"></i> ' +
        tf('回看第 {0} / {1} 题（已作答，仅供查看）', journeyViewIdx + 1, n);
    } else { tip.style.display = 'none'; tip.innerHTML = ''; }
  }
}

async function skipJourneyQuestion(qid) {
  if (!qid) return;
  if (!confirm(t('确定跳过本题？本轮不再出现，且不计入答题。'))) return;
  saveAllCM();
  try {
    var resp = await apiPost('/journey/skip', { session_id: sessionId, question_id: qid });
    // 记录快照：未作答，仅供回看解析
    journeyHistory.push({
      data: JSON.parse(JSON.stringify(journeyData)),
      qid: qid, answer: '', correct: null,
      explanation: resp.explanation, lit_now: resp.lit_now, graph: resp.graph
    });
    var q = journeyData && journeyData.question && journeyData.question.id === qid ? journeyData.question : null;
    renderJourneyResult(q, qid, null, '', resp.explanation, resp.lit_now, resp.graph);
    var submitBtn = document.querySelector('#journeyQuestion .btn-primary');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('已跳过'); }
    var skipBtn = document.querySelector('#journeyQuestion .btn-secondary');
    if (skipBtn) { skipBtn.disabled = true; }
    journeyData = resp;
    journeyViewIdx = null;
    journeyNextVisible = true;
    refreshJourneyNav();
  } catch (e) { alert(errMsg(e, t('跳过失败'))); }
}

function prevJourney() {
  if (!journeyHistory.length) return;
  saveAllCM();
  journeyViewIdx = (journeyViewIdx === null) ? journeyHistory.length - 1 : Math.max(0, journeyViewIdx - 1);
  renderJourneyReview(journeyHistory[journeyViewIdx]);
}

async function toggleDeepMode() {
  var enabled = document.getElementById('deepModeToggle').checked;
  await apiPost('/journey/toggle_deep', { session_id: sessionId, enabled: enabled });
}

function getNodeName(nodeId, graph) {
  if (!graph || !graph.nodes) return nodeId;
  for (var i = 0; i < graph.nodes.length; i++) {
    if (graph.nodes[i].id === nodeId) return graph.nodes[i].name;
  }
  return nodeId;
}

async function submitJourneyAnswer(qid) { saveAllCM();
  var q = journeyData && journeyData.question && journeyData.question.id === qid ? journeyData.question : null;
  var input = '';
  var inp = document.getElementById('journey_inp_' + qid);
  if (inp) { input = inp.value.trim(); } else {
    var optsContainer = document.getElementById('journey_opts_' + qid);
    if (optsContainer) input = (optsContainer.dataset.selected || '').trim();
  }
  if (!input) return alert(t('请先输入或选择答案'));
  var elapsed = Math.round((Date.now() - journeyQuestionStart) / 1000);
  try {
    var resp = await apiPost('/journey/next', { session_id: sessionId, question_id: qid, answer: input, duration: elapsed });
    // 记住本题快照（题面 + 我的答案 + 判题结果），供「上一题」回看
    journeyHistory.push({
      data: JSON.parse(JSON.stringify(journeyData)),
      qid: qid, answer: input, correct: resp.last_answer_correct,
      explanation: resp.explanation, lit_now: resp.lit_now, graph: resp.graph
    });
    renderJourneyResult(q, qid, resp.last_answer_correct, input, resp.explanation, resp.lit_now, resp.graph);
    var submitBtn = document.querySelector('#journeyQuestion .btn-primary');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('已提交'); }
    var skipBtn2 = document.querySelector('#journeyQuestion .btn-secondary');
    if (skipBtn2) { skipBtn2.disabled = true; }
    journeyData = resp;
    journeyViewIdx = null;
    journeyNextVisible = true;
    refreshJourneyNav();
  } catch (e) { alert(errMsg(e, t('提交失败'))); }
}


function nextJourney() {
  saveAllCM();
  // 正在回看历史：先依次前进到更新的历史题，最后才回到当前（未作答）题目
  if (journeyViewIdx !== null && journeyViewIdx < journeyHistory.length - 1) {
    journeyViewIdx++;
    renderJourneyReview(journeyHistory[journeyViewIdx]);
    return;
  }
  journeyViewIdx = null;
  showJourneyQuestion(journeyData);
}

// ==================== 刷题 ====================
// ---- 筛选器事件 ----
function onFilterChange() {
  loadPracticeQuestions();
}

async function loadPracticeQuestions() {
  var difficulty = document.getElementById('filterDifficulty').value;
  var nodeIds = resolveCategoryFilter();
  var params = [];
  // 优先用知识图谱节点筛选；退化为category筛选
  if (nodeIds && nodeIds.length > 0) {
    // 后端支持 node=xxx 参数：筛选关联该知识节点的题目
    // 取第一个节点（选择父分类时，后端已通过 _expand 展开）
    params.push('node=' + encodeURIComponent(nodeIds[0]));
  }
  if (difficulty) params.push('difficulty=' + encodeURIComponent(difficulty));
  document.getElementById('practiceList').innerHTML = '<div class="text-center text-sm py-4 opacity-50"><i class="fas fa-spinner fa-spin mr-1"></i> ' + t('加载中...') + '</div>';
  document.getElementById('questionDetail').classList.remove('visible');
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('practiceList').style.display = 'block';
  try {
    params.push('pool=' + currentPool);
    // 并行拉取题目列表与答题状态（列表着色：对=绿 / 错=红 / 未做=白）
    var results = await Promise.all([
      apiGet('/questions?' + params.join('&')),
      apiGet('/progress/' + sessionId + '?pool=' + currentPool).catch(function() { return null; })
    ]);
    var data = results[0];
    var prog = results[1];
    // 58 道静态选择题已导入后端题库（515 题），不再前端合并，避免重复
    practiceQuestions = data.questions;
    _progressMap = {};
    if (prog && prog.progress) {
      prog.progress.forEach(function(p) { _progressMap[p.question_id] = p.is_correct ? 1 : 0; });
    }
    renderPracticeList();
  } catch (e) {
    document.getElementById('practiceList').innerHTML = '<p style="color:#b04a4a;text-align:center">' + t('加载失败，请确保后端已启动') + (errMsg(e, '') ? '：' + errMsg(e, '') : '') + '</p>';
  }
}

function renderPracticeList() {
  var el = document.getElementById('practiceList');
  // Apply all filters client-side (search + type + difficulty + category)
  var searchText = (document.getElementById('filterSearch').value || '').toLowerCase();
  var filterType = document.getElementById('filterType').value;
  var filterDifficulty = document.getElementById('filterDifficulty').value;
  var nodeIds = resolveCategoryFilter();
  var filtered = practiceQuestions;
  if (searchText) {
    filtered = filtered.filter(function(q) {
      return (q.title && q.title.toLowerCase().indexOf(searchText) !== -1) ||
             (q.description && q.description.toLowerCase().indexOf(searchText) !== -1) ||
             (q.category && (q.category.toLowerCase().indexOf(searchText) !== -1 ||
                             catLabel(q.category).toLowerCase().indexOf(searchText) !== -1));
    });
  }
  if (filterType === 'mcq') {
    filtered = filtered.filter(function(q) { return q.options && q.options.toString().trim(); });
  } else if (filterType === 'fillin') {
    filtered = filtered.filter(function(q) { return !q.options || !q.options.toString().trim(); });
  }
  if (filterDifficulty) {
    filtered = filtered.filter(function(q) { return q.difficulty === filterDifficulty; });
  }
  // 分类筛选（对静态题+动态题统一生效）
  if (nodeIds && nodeIds.length > 0) {
    filtered = filtered.filter(function(q) {
      if (nodeIds.indexOf(q.category) !== -1) return true;
      // 静态选择题分类映射
      var mapped = STATIC_CAT_MAP[q.category];
      if (mapped) {
        for (var k = 0; k < mapped.length; k++) {
          if (nodeIds.indexOf(mapped[k]) !== -1) return true;
        }
      }
      return false;
    });
  }
  document.getElementById('poolCount').textContent = filtered.length + t('题');
  // 记录当前筛选后的题目顺序（详情页「下一题」按此顺序跳转）
  _filteredOrder = filtered.map(function(q) {
    return q.id != null ? q.id : ('static_' + practiceQuestions.indexOf(q));
  });

  if (!filtered.length) {
    el.innerHTML = '<div class="text-center text-sm py-4 opacity-50">' + t('暂无符合条件的题目') + '</div>';
    return;
  }
  var diffMap = { easy: t('简单'), medium: t('中等'), hard: t('困难') };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var q = filtered[i];
    var hasOpts = q.options && (typeof q.options === 'string' ? q.options.trim() : q.options.length);
    var desc = (q.description || '').replace(/\n/g, ' ').substring(0, 80);
    var qid = q.id != null ? q.id : ('static_' + practiceQuestions.indexOf(q));
    // 答题状态着色：1 对=绿 / 0 错=红 / 未做=白
    var st = q.id != null ? _progressMap[q.id] : _staticStatus[qid];
    var cardCls = 'card p-3 question-item';
    var stIcon = '';
    if (st === 1) { cardCls += ' q-done'; stIcon = '<span class="q-status q-ok" title="' + t('回答正确') + '"><i class="fas fa-check"></i></span>'; }
    else if (st === 0) { cardCls += ' q-wrong'; stIcon = '<span class="q-status q-bad" title="' + t('回答错误') + '"><i class="fas fa-times"></i></span>'; }
    html += '<div class="' + cardCls + '" onclick="showPracticeDetail(\'' + qid + '\')">' + stIcon;
    html += '<div class="flex gap-2 flex-wrap mb-1">';
    html += '<span class="tag">' + catLabel(q.category) + '</span>';
    html += '<span class="tag ' + (diffClass[q.difficulty] || '') + '">' + (diffMap[q.difficulty] || q.difficulty) + '</span>';
    html += '<span class="tag" style="background:' + (hasOpts ? 'rgba(52,119,191,0.15)' : 'rgba(193,124,74,0.20)') + ';color:' + (hasOpts ? '#3477bf' : '#a8683e') + '">' + (hasOpts ? '选择' : '填空') + '</span>';
    html += '</div>';
    html += '<h3>' + q.title + '</h3>';
    html += '<p>' + desc + '...</p>';
    html += '</div>';
  }
  el.innerHTML = html;
}

async function showPracticeDetail(qid) {
  var q = null;
  // Find question by id (number for API, string 'static_N' for static)
  for (var i = 0; i < practiceQuestions.length; i++) {
    var pq = practiceQuestions[i];
    var pqid = pq.id != null ? pq.id : ('static_' + i);
    if (pqid == qid) { q = pq; if (pq.id == null) q._isStatic = true; break; }
  }
  if (!q) return;
  currentPracticeQ = q;
  document.getElementById('practiceList').style.display = 'none';
  var detail = document.getElementById('questionDetail');
  detail.style.display = 'block';
  detail.classList.add('visible');
  document.getElementById('practiceQuestion').innerHTML = '<div class="text-center text-sm py-4 opacity-50"><i class="fas fa-spinner fa-spin mr-1"></i> ' + t('加载中...') + '</div>';
  // 列表接口是轻量字段 → 拉详情补齐建表数据/预期输出/答案/解析（真题在 exam 表，须带 pool）
  if (q.id != null) {
    try {
      var dq = await apiGet('/questions/' + q.id + '?pool=' + currentPool);
      for (var k in dq) q[k] = dq[k];
    } catch (e) { /* 详情拉取失败时按列表字段渲染 */ }
  }
  document.getElementById('practiceQuestion').innerHTML = renderPracticeQuestion(q);
  setTimeout(initAllCodeMirrors, 100);
  setTimeout(function() { var ta = document.querySelector('#practiceQuestion textarea'); if (ta && ta._cm) ta._cm.focus(); else if (ta) ta.focus(); }, 150);
}

var _filteredOrder = [];   // 当前筛选后的题目顺序（详情页「下一题」按此顺序跳转）

// 按当前分类筛选顺序跳转到下一道题（自主练习/真题测试详情页）
function nextPracticeQuestion() {
  if (!currentPracticeQ) return;
  var qid = currentPracticeQ.id != null ? currentPracticeQ.id : ('static_' + practiceQuestions.indexOf(currentPracticeQ));
  var idx = _filteredOrder.indexOf(qid);
  if (idx === -1) { backToPracticeList(); return; }   // 不在当前筛选结果中（如筛选变化）→ 回列表
  var nextQid = _filteredOrder[idx + 1];
  if (nextQid === undefined) { alert(t('已经是最后一题')); return; }
  showPracticeDetail(nextQid);
}

function renderPracticeQuestion(q) {
  var diffMap = { easy: t('简单'), medium: t('中等'), hard: t('困难') };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
  var hasOpts = q.options && (typeof q.options === 'string' ? q.options.trim() : q.options.length);
  var html = '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + catLabel(q.category) + '</span>';
  html += '<span class="tag ' + (diffClass[q.difficulty] || '') + '">' + (diffMap[q.difficulty] || q.difficulty) + '</span>';
  html += '<span class="tag" style="background:' + (hasOpts ? 'rgba(52,119,191,0.15)' : 'rgba(193,124,74,0.20)') + ';color:' + (hasOpts ? '#3477bf' : '#a8683e') + '">' + (hasOpts ? t('选择题') : t('填空题')) + '</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + q.title + '</h3>';
  html += '<p class="question-desc">' + q.description + '</p>';

  // Static questions: simple MCQ, no SQL execution
  if (q._isStatic) {
    if (hasOpts) {
      html += '<div class="flex flex-col gap-1.5 my-2" id="prac_opts_static">';
      var opts = Array.isArray(q.options) ? q.options : parseOptions(q.options);
      for (var i = 0; i < opts.length; i++) {
        var optText = typeof opts[i] === 'string' ? opts[i] : (opts[i].text || opts[i]);
        var optKey = typeof opts[i] === 'object' && opts[i].key ? opts[i].key : String.fromCharCode(65 + i);
        html += '<button class="option-btn" onclick="checkStaticAnswer(\'' + optKey + '\',this)">' + optKey + '. ' + optText.replace(/</g, '&lt;') + '</button>';
      }
      html += '</div>';
    }
    html += '<div id="prac_res_static" class="result-box" style="display:none"></div>';
    html += '<div class="mt-3 text-center"><button class="btn btn-accent" onclick="nextPracticeQuestion()">' + t('下一题') + ' <i class="fas fa-arrow-right mr-1"></i></button></div>';
    return html;
  }

  html += renderTablesRow(q);
  html += renderSqlPanel(q);
  if (hasOpts) {
    html += '<div class="flex flex-col gap-1.5 my-2" id="prac_opts_' + q.id + '">';
    var opts = parseOptions(q.options);
    var optLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    for (var i = 0; i < opts.length; i++) {
      var optLetter = i < optLetters.length ? optLetters[i] : String.fromCharCode(65 + i);
      var optAttr = opts[i].replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
      html += '<button class="option-btn" data-opt="' + optAttr + '" onclick="selectOpt(\'prac\',' + q.id + ',' + i + ',this)"><span class="opt-letter">' + optLetter + '</span> ' + stripOptionLabel(opts[i]).replace(/</g, '&lt;') + '</button>';
    }
    html += '</div>';
  } else {
    html += '<textarea class="code-input" id="prac_inp_' + q.id + '" placeholder="' + t('手动输入你的 SQL 语句...') + '"></textarea>';
  }
  html += '<div id="prac_res_' + q.id + '" class="result-box" style="display:none"></div>';
  // 按钮组：提交答案在上、下一题在下（上下紧邻）
  html += '<div class="mt-3" style="display:flex;flex-direction:column;align-items:center;gap:calc(10px + 0.75em)">';
  html += '<button class="btn btn-primary" id="prac_btn_' + q.id + '" style="margin-top:0.5em" onclick="submitPracticeAnswer(' + q.id + ')"><i class="fas fa-paper-plane mr-1"></i> ' + t('提交答案') + '</button>';
  html += '<button class="btn btn-accent" id="pracNextBtn" onclick="nextPracticeQuestion()">' + t('下一题') + ' <i class="fas fa-arrow-right mr-1"></i></button>';
  html += '</div>';
  return html;
}

function checkStaticAnswer(key, btn) {
  var q = currentPracticeQ;
  if (!q) return;
  var correct = q.answer || q.correct_answer;
  var isCorrect = (key === correct);
  // 记录静态题答题状态（列表着色用）
  var staticIdx = practiceQuestions.indexOf(q);
  if (staticIdx >= 0) _staticStatus['static_' + staticIdx] = isCorrect ? 1 : 0;
  // Disable all option buttons
  var allBtns = document.querySelectorAll('#prac_opts_static .option-btn');
  for (var i = 0; i < allBtns.length; i++) { allBtns[i].disabled = true; }
  // Highlight
  btn.classList.add(isCorrect ? 'selected' : 'wrong');
  // Find and highlight correct
  for (var i = 0; i < allBtns.length; i++) {
    var bkey = allBtns[i].textContent.charAt(0);
    if (bkey === correct) allBtns[i].classList.add('correct-answer');
  }
  var res = document.getElementById('prac_res_static');
  res.style.display = 'block';
  res.className = 'result-box ' + (isCorrect ? 'correct' : 'wrong');
  res.innerHTML = isCorrect
    ? '<strong><i class="fas fa-check-circle mr-1"></i> ' + t('回答正确！') + '</strong>'
    : '<strong><i class="fas fa-times-circle mr-1"></i> ' + t('回答错误') + '，' + t('正确答案：') + correct + '</strong>';
  if (q && q.options && q.option_explanations) {
    showOptionExplanations('prac', qid, q.options, q.option_explanations, q.correct_answer);
  }
  if (q.explanation || q) {
    res.innerHTML += renderExplanation(q.explanation, q);
  }
}

async function submitPracticeAnswer(qid) { saveAllCM();
  var q = null;
  for (var i = 0; i < practiceQuestions.length; i++) { if (practiceQuestions[i].id === qid) { q = practiceQuestions[i]; break; } }
  if (!q) q = currentPracticeQ;
  var input = '';
  var inp = document.getElementById('prac_inp_' + qid);
  if (inp) { input = inp.value.trim(); } else {
    var optsContainer = document.getElementById('prac_opts_' + qid);
    if (optsContainer) input = (optsContainer.dataset.selected || '').trim();
  }
  if (!input) return alert(t('请先输入或选择答案'));
  var result = await apiPost('/submit', { session_id: sessionId, question_id: qid, answer: input, pool: currentPool });
  // 更新答题状态（列表着色：返回列表立即生效）
  if (typeof qid === 'number') _progressMap[qid] = result.is_correct ? 1 : 0;
  var resultBox = document.getElementById('prac_res_' + qid);
  resultBox.style.display = 'block';
  resultBox.className = 'result-box ' + (result.is_correct ? 'correct' : 'wrong');
  resultBox.innerHTML = result.is_correct
    ? '<strong><i class="fas fa-check-circle mr-1"></i> ' + t('回答正确') + '</strong>'
    : '<strong><i class="fas fa-times-circle mr-1"></i> ' + t('回答错误') + '</strong><br>' + t('正确答案：') + '<strong>' + result.correct_answer + '</strong>';
  resultBox.innerHTML += renderExplanation(result.explanation, q);
  // 选择题：逐项解析始终展示（答对也展示），便于理解每个选项为什么对/错
  if (q && q.options && q.option_explanations) {
    showOptionExplanations('prac', qid, q.options, q.option_explanations, q.correct_answer);
  }
  var btn = document.getElementById('prac_btn_' + qid);
  if (btn) { btn.disabled = true; btn.textContent = t('已提交'); }
  // 答完后隐藏常驻「下一题」按钮，由结果框内的动作按钮接管（避免重复）
  var pracNextBtn = document.getElementById('pracNextBtn');
  if (pracNextBtn) pracNextBtn.style.display = 'none';
  var isMcq = q && q.options && (typeof q.options === 'string' ? q.options.trim() : q.options.length);
  // 静态概念题（source=static_*）无表结构，不触发衍生题
  var showDerivedNext = result.is_correct && isMcq && !(q && q.source && q.source.indexOf('static_') === 0);
  if (showDerivedNext) {
    currentPrototypeQ = q;
  } else {
    currentPrototypeQ = null;
  }
  var nextLabel = showDerivedNext ? t('举一反三 →') : t('下一题');
  var nextHint = showDerivedNext ? t('已掌握该选择题，进入举一反三') : '';
  resultBox.innerHTML += '<div class="mt-3" style="border-top:1px solid var(--border);padding-top:0.75rem">' +
    (nextHint ? '<p class="text-sm mb-2"><i class="fas fa-lightbulb mr-1" style="color:var(--accent)"></i> ' + nextHint + '</p>' : '') +
    '<button class="btn btn-accent" onclick="onPracticeNext()"><i class="fas fa-arrow-right mr-1"></i> ' + nextLabel + '</button></div>';
}

function onPracticeNext() {
  if (currentPrototypeQ) {
    var pid = currentPrototypeQ.id;
    currentPrototypeQ = null;
    startDerivedPractice(pid);
  } else {
    nextPracticeQuestion();   // 答完后「下一题」：按当前筛选顺序跳下一道
  }
}

async function startDerivedPractice(prototypeId) {
  document.getElementById('practiceList').style.display = 'none';
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('questionDetail').classList.remove('visible');
  var section = document.getElementById('deriveSection');
  section.style.display = 'block';
  var area = document.getElementById('deriveArea');
  area.innerHTML = '<div class="text-center text-sm py-4 opacity-50"><i class="fas fa-spinner fa-spin mr-1"></i> 生成举一反三题目...</div>';

    var resp = await apiPost('/practice/derive', { question_id: prototypeId });
    currentDerivedQ = resp.derived_question;
    renderDerivedQuestion(currentDerivedQ);
  } catch(e) {
    area.innerHTML = '<p style="color:#b04a4a">' + t('生成失败') + (errMsg(e, '') ? '：' + errMsg(e, '') : '') + '</p>';
  }
}

function renderDerivedQuestion(dq) {
  var area = document.getElementById('deriveArea');
  var html = '<div class="highlight-box mb-3"><p class="text-sm"><i class="fas fa-lightbulb mr-1 accent"></i><strong>' + t('举一反三') + '</strong> — ' + t('这是根据你刚做对的选择题生成的填空题，请手动编写 SQL 语句。') + '</p></div>';
  // Tags
  var diffMap = { easy: t('简单'), medium: t('中等'), hard: t('困难') };
  var diffClass = { easy: 'tag-easy', medium: 'tag-medium', hard: 'tag-hard' };
  html += '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + catLabel(dq.category) + '</span>';
  html += '<span class="tag ' + diffClass[dq.difficulty] + '">' + diffMap[dq.difficulty] + '</span>';
  html += '<span class="tag" style="background:rgba(193,124,74,0.20);color:#a8683e">' + t('填空题') + '</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + dq.title + '</h3>';
  html += '<p class="question-desc">' + dq.description + '</p>';
  // Schema and data
  if (dq.initial_data) {
    var schemaHtml = '';
    var schemaMap = {};
    try {
      if (dq.table_schema) {
        var stmts = dq.table_schema.split(';');
        for (var s = 0; s < stmts.length; s++) {
          var m = stmts[s].match(/(?:CREATE\s+TABLE\s+)?(\w+)\s*\((.*)\)/i);
          if (m) { schemaMap[m[1]] = m[2]; }
        }
      }
      // Use existing renderDataTable
      var dataHtml = renderDataTable(dq.initial_data, dq.table_schema);
      html += dataHtml;
    } catch(e) {}
  }
  // SQL panel
  html += '<div class="sql-toggle" onclick="var p=document.getElementById(\'derivedSqlPanel\');p.classList.toggle(\'open\');this.querySelector(\'span\').textContent=p.classList.contains(\'open\')?t(\'收起 SQL\'):t(\'展开 SQL\')"><span>' + t('展开 SQL') + '</span> <i class="fas fa-chevron-down" style="font-size:0.5rem"></i></div><div class="sql-panel" id="derivedSqlPanel"><div class="sql-code">';
  if (dq.table_schema) html += dq.table_schema.replace(/</g, '&lt;') + ';\n';
  if (dq.initial_data) html += dq.initial_data.replace(/</g, '&lt;') + '\n';
  html += '</div></div>';
  // Expected output
  if (dq.expected_output) html += renderExpectedOutput(dq.expected_output);
  // Input
  html += '<textarea class="code-input" id="derived_inp" placeholder="' + t('手动输入你的 SQL 语句...') + '"></textarea>';
  html += '<div id="derived_res" class="result-box" style="display:none"></div>';
  html += '<div class="mt-2 text-center"><button class="btn btn-primary" id="derived_btn" onclick="submitDerivedAnswer()"><i class="fas fa-paper-plane mr-1"></i> ' + t('提交答案') + '</button></div>';
  area.innerHTML = html;
  setTimeout(initAllCodeMirrors, 100);
  setTimeout(function() { var ta = document.getElementById('derived_inp'); if (ta && ta._cm) ta._cm.focus(); else if (ta) ta.focus(); }, 150);
}

async function submitDerivedAnswer() { saveAllCM();
  if (!currentDerivedQ) return;
  var input = document.getElementById('derived_inp').value.trim();
  if (!input) return alert(t('请先输入 SQL 语句'));
  var result = await apiPost('/submit', { session_id: sessionId, question_id: currentDerivedQ.id, answer: input });
  var resultBox = document.getElementById('derived_res');
  resultBox.style.display = 'block';
  resultBox.className = 'result-box ' + (result.is_correct ? 'correct' : 'wrong');
  resultBox.innerHTML = result.is_correct
    ? '<strong><i class="fas fa-check-circle mr-1"></i> ' + t('回答正确') + '</strong>'
    : '<strong><i class="fas fa-times-circle mr-1"></i> ' + t('回答错误') + '</strong><br>' + t('正确答案：') + '<strong>' + result.correct_answer + '</strong>';
  resultBox.innerHTML += renderExplanation(result.explanation, currentDerivedQ);
  var btn = document.getElementById('derived_btn');
  if (btn) { btn.disabled = true; btn.textContent = t('已提交'); }
  // Get next recommendation
  var rec = await apiPost('/practice/recommend', {
    session_id: sessionId,
    derived_question_id: currentDerivedQ.id,
    was_correct: result.is_correct
  });
  resultBox.innerHTML += '<div class="mt-3" style="border-top:1px solid var(--border);padding-top:0.75rem">';
  if (rec.recommended && rec.question) {
    resultBox.innerHTML += '<p class="text-sm mb-2"><i class="fas fa-arrow-right mr-1" style="color:var(--accent)"></i> ' + rec.reason + '</p>';
    resultBox.innerHTML += '<button class="btn btn-accent" onclick="showRecommendedQuestion(' + rec.question.id + ')"><i class="fas fa-play mr-1"></i> ' + t('开始练习') + '</button>';
    // Store the recommended question
    var found = false;
    for (var i = 0; i < practiceQuestions.length; i++) {
      if (practiceQuestions[i].id === rec.question.id) { found = true; break; }
    }
    if (!found) practiceQuestions.push(rec.question);
    currentPrototypeQ = null;
  } else {
    resultBox.innerHTML += '<p class="text-sm opacity-60"><i class="fas fa-check-circle mr-1" style="color:var(--success)"></i> ' + t('该知识点已全部掌握，可返回列表选择其他题目') + '</p>';
  }
  resultBox.innerHTML += '</div>';
}

function showRecommendedQuestion(qid) {
  var q = null;
  for (var i = 0; i < practiceQuestions.length; i++) { if (practiceQuestions[i].id === qid) { q = practiceQuestions[i]; break; } }
  if (!q) return;
  // Show this question in the detail view
  document.getElementById('deriveSection').style.display = 'none';
  document.getElementById('questionDetail').style.display = 'block';
  document.getElementById('questionDetail').classList.add('visible');
  currentPracticeQ = q;
  document.getElementById('practiceQuestion').innerHTML = renderPracticeQuestion(q);
  setTimeout(initAllCodeMirrors, 100);
  setTimeout(function() { var ta = document.querySelector('#practiceQuestion textarea'); if (ta && ta._cm) ta._cm.focus(); else if (ta) ta.focus(); }, 150);
}

function exitDerivedPractice() {
  document.getElementById('deriveSection').style.display = 'none';
  document.getElementById('practiceList').style.display = 'block';
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('questionDetail').classList.remove('visible');
  currentDerivedQ = null;
  currentPrototypeQ = null;
}

function backToPracticeList() {
  document.getElementById('questionDetail').classList.remove('visible');
  document.getElementById('questionDetail').style.display = 'none';
  document.getElementById('practiceList').style.display = 'block';
  renderPracticeList();   // 重渲染，答题状态着色即时生效
}

// ==================== 错题集 ====================
var wrongQuestions = [];
var summaryExpanded = false;
var wrongPage = 1;              // 错题集翻页：当前页码
var WRONG_PAGE_SIZE = 5;        // 每页 5 个错题

function toggleSummary() {
  summaryExpanded = !summaryExpanded;
  document.getElementById('summaryBody').style.display = summaryExpanded ? 'flex' : 'none';
  document.getElementById('summaryToggle').innerHTML = summaryExpanded ? '<i class="fas fa-chevron-up"></i>' : '<i class="fas fa-chevron-down"></i>';
}

async function loadWrongSet() {
  var el = document.getElementById('wrongList');
  el.innerHTML = '<div class="text-center text-sm py-4 opacity-50"><i class="fas fa-spinner fa-spin mr-1"></i> ' + t('加载中...') + '</div>';
  try {
    var data = await apiGet('/progress/' + encodeURIComponent(sessionId));
    wrongQuestions = data.progress.filter(function(p) { return !p.is_correct; });
    wrongPage = 1;              // 重新进入错题集从第 1 页开始
    renderWrongSummary(data);
    renderWrongList();
  } catch (e) {
    el.innerHTML = '<p style="color:#b04a4a;text-align:center">' + t('加载失败') + (errMsg(e, '') ? '：' + errMsg(e, '') : '') + '</p>';
  }
}

function renderWrongSummary(data) {
  var body = document.getElementById('summaryBody');
  var total = data.total || 0;
  var correct = data.correct || 0;
  var wrong = total - correct;
  var avgDuration = 0;
  var durationCount = 0;
  if (total > 0) {
    var sum = 0;
    for (var i = 0; i < data.progress.length; i++) {
      var d = data.progress[i].duration || 0;
      if (d > 0) { sum += d; durationCount++; }
    }
    if (durationCount > 0) avgDuration = Math.round(sum / durationCount);
  }
  body.innerHTML = '';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl">' + total + '</div><div class="text-xs opacity-50">' + t('总答题') + '</div></div>';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl" style="color:#2c241b">' + correct + '</div><div class="text-xs opacity-50">' + t('正确') + '</div></div>';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl" style="color:#b04a4a">' + wrong + '</div><div class="text-xs opacity-50">' + t('错误') + '</div></div>';
  body.innerHTML += '<div class="text-center"><div class="num-oswald text-xl">' + (data.accuracy || 0) + '%</div><div class="text-xs opacity-50">' + t('正确率') + '</div></div>';
}

function renderWrongList() {
  var el = document.getElementById('wrongList');
  if (!wrongQuestions.length) {
    el.innerHTML = '<div class="text-center text-sm py-6 opacity-50"><i class="fas fa-check-circle mr-1" style="color:#2c241b"></i> ' + t('暂无错题，继续保持！') + '</div>';
    return;
  }
  // 翻页：每页 5 个，页码钳制到有效范围
  var totalPages = Math.ceil(wrongQuestions.length / WRONG_PAGE_SIZE);
  if (wrongPage < 1) wrongPage = 1;
  if (wrongPage > totalPages) wrongPage = totalPages;
  var start = (wrongPage - 1) * WRONG_PAGE_SIZE;
  var pageItems = wrongQuestions.slice(start, start + WRONG_PAGE_SIZE);
  var html = '';
  for (var i = 0; i < pageItems.length; i++) {
    var w = pageItems[i];
    var idx = start + i;   // 全局下标（详情/返回不受翻页影响）
    html += '<div class="card p-3" style="cursor:pointer" onclick="showWrongDetail(' + idx + ')">';
    html += '<div class="flex gap-2 flex-wrap mb-1">';
    html += '<span class="tag">' + catLabel(w.category) + '</span>';
    html += '<span class="tag" style="background:rgba(176,74,74,0.12);color:#b04a4a">' + t('✗ 答错') + '</span>';
    html += '</div>';
    html += '<h3>' + (w.title || '') + '</h3>';
    html += '<p style="font-size:0.75rem;color:#666">' + t('你的答案：') + '<code style="font-family:Oswald,Consolas,monospace">' + (w.user_answer || '').replace(/</g, '&lt;') + '</code></p>';
    html += '</div>';
  }
  // 分页控件：上一页 / 第 x / y 页 / 下一页
  html += '<div class="flex justify-center items-center gap-3 pt-3">';
  html += '<button class="btn btn-primary" style="padding:0.3rem 0.8rem;font-size:0.8rem" onclick="wrongPage--;renderWrongList()"' + (wrongPage <= 1 ? ' disabled' : '') + '><i class="fas fa-chevron-left mr-1"></i>' + t('上一页') + '</button>';
  html += '<span class="text-sm opacity-60">' + tf('第 {0} / {1} 页', wrongPage, totalPages) + '</span>';
  html += '<button class="btn btn-primary" style="padding:0.3rem 0.8rem;font-size:0.8rem" onclick="wrongPage++;renderWrongList()"' + (wrongPage >= totalPages ? ' disabled' : '') + '>' + t('下一页') + '<i class="fas fa-chevron-right ml-1"></i></button>';
  html += '</div>';
  el.innerHTML = html;
}

function showWrongDetail(idx) {
  var w = wrongQuestions[idx];
  var diffLabel = { easy: t('简单'), medium: t('中等'), hard: t('困难') };
  var html = '<div class="card p-4 fade-in">';
  html += '<div class="flex gap-2 flex-wrap mb-2">';
  html += '<span class="tag">' + catLabel(w.category) + '</span>';
  html += '<span class="tag" style="background:rgba(176,74,74,0.12);color:#b04a4a">' + (diffLabel[w.difficulty] || w.difficulty) + '</span>';
  html += '</div>';
  html += '<h3 class="title-serif text-lg mb-2">' + (w.title || '') + '</h3>';
  html += '<p class="question-desc">' + (w.description || '') + '</p>';
  html += renderSchemaAndData(w);
  if (w.expected_output) html += renderExpectedOutput(w.expected_output);
  html += '<div style="margin-top:0.5rem;padding:0.5rem;border-left:4px solid #b04a4a;background:rgba(176,74,74,0.06);border-radius:0 0.4rem 0.4rem 0">';
  html += '<div class="text-xs opacity-50">' + t('你的答案') + '</div>';
  html += '<code style="font-family:Oswald,Consolas,monospace;font-size:0.85rem">' + (w.user_answer || '').replace(/</g, '&lt;') + '</code>';
  html += '<div class="text-xs opacity-50 mt-2">' + t('正确答案') + '</div>';
  html += '<code style="font-family:Oswald,Consolas,monospace;font-size:0.85rem;color:#1a6b1a">' + (w.correct_answer || '').replace(/</g, '&lt;') + '</code>';
  if (w.explanation) html += '<div class="text-xs mt-2" style="color:#666"><i class="fas fa-lightbulb mr-1"></i> ' + w.explanation + '</div>';
  html += '</div></div>';
  var el = document.getElementById('wrongList');
  el.innerHTML = '<a class="back-link" onclick="renderWrongList()" style="cursor:pointer;margin-bottom:0.5rem;display:inline-block"><i class="fas fa-arrow-left mr-1"></i> ' + t('返回错题列表') + '</a>' + html;
}

// update showPage to load wrong set
var origShowPage = showPage;
showPage = function(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  var btns = document.querySelectorAll('.nav-btn[data-page="' + name + '"]');
  if (btns.length > 1 && currentPool === 'exam') btns[1].classList.add('active');
  else if (btns.length > 0) btns[0].classList.add('active');
  if (name === 'journey') { loadJourneyMap(); }
  else if (name === 'practice') { document.getElementById('poolLabel').textContent = currentPool === 'exam' ? t('🎯 面试真题') : t('📝 自主练习'); if (!_catSelectBuilt) { buildCategorySelect(); _catSelectBuilt = true; } loadPracticeQuestions(); }
  else if (name === 'wrongset') { summaryExpanded = false; document.getElementById('summaryBody').style.display = 'none'; document.getElementById('summaryToggle').innerHTML = '<i class="fas fa-chevron-down"></i>'; loadWrongSet(); }
};

// 应用语言偏好（data-i18n 元素 + 语言按钮 + 标题）
applyI18n();

// 确保默认页面可见
var defaultPage = document.querySelector('.nav-btn.active');
if (defaultPage) {
  showPage(defaultPage.getAttribute('data-page'));
} else {
  showPage('journey');
}

// Show user info in header/footer
updateUserUI();

// ===== 色觉辅助模式切换 =====
(function() {
  var saved = localStorage.getItem('cb_mode');
  if (saved === '1') { document.body.classList.add('cb-mode'); var t = document.getElementById('cbToggle'); if (t) t.classList.add('cb-active'); }
})();
function toggleColorblind() {
  var body = document.body;
  var on = body.classList.toggle('cb-mode');
  var t = document.getElementById('cbToggle');
  if (t) { if (on) t.classList.add('cb-active'); else t.classList.remove('cb-active'); }
  localStorage.setItem('cb_mode', on ? '1' : '0');
}
</script>
</body>
